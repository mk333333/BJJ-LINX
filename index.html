  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Montada técnica (technical mount)",en:"Technical mount",val:"Muntada tècnica (technical mount)",pt:"Montada técnica (technical mount)"}, desc:{es:"Variante de la montada en la que giras el cuerpo hacia un lado controlando un brazo y una pierna del rival, dejándolo sin espacio para reaccionar mientras preparas la toma de espalda o un ataque de brazo.",en:"A mount variant where you rotate the body to one side controlling one of the opponent's arms and legs, leaving them no room to react while you set up the back take or an arm attack.",val:"Variant de la muntada en què gires el cos cap a un costat controlant un braç i una cama de l'adversari, deixant-lo sense espai per a reaccionar mentre prepares la presa d'esquena o un atac de braç.",pt:"Variante da montada em que você gira o corpo para um lado controlando um braço e uma perna do adversário, deixando-o sem espaço para reagir enquanto prepara a pegada das costas ou um ataque de braço."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de rodilla en el estómago",en:"Knee-on-belly escape",val:"Escapada de genoll a l'estómac",pt:"Fuga de joelho na barriga"}, desc:{es:"Contra la rodilla en el estómago, se empuja con ambas manos la rodilla y la cadera del rival, se recoge una pierna como cuña y se gira hacia ese lado para meter la rodilla entre ambos y volver a guardia.",en:"Against knee on belly, you push the opponent's knee and hip with both hands, pull one leg in as a wedge and turn toward that side to insert your knee between you and recover guard.",val:"Contra el genoll a l'estómac, s'empenyen amb les dues mans el genoll i el maluc de l'adversari, es recull una cama com a cunya i es gira cap a eixe costat per a ficar el genoll entre tots dos i tornar a guàrdia.",pt:"Contra o joelho na barriga, empurram-se com as duas mãos o joelho e o quadril do adversário, recolhe-se uma perna como cunha e gira-se para esse lado para colocar o joelho entre os dois e voltar à guarda."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Low single (entrada baja a una pierna)",en:"Low single",val:"Low single (entrada baixa a una cama)",pt:"Low single (entrada baixa em uma perna)"}, desc:{es:"Variante del ataque a una pierna en la que se agarra el tobillo o la parte baja de la pierna del rival desde un nivel muy bajo, evitando el riesgo de exponer la cabeza cerca de sus brazos.",en:"A single leg variant where the opponent's ankle or lower leg is grabbed from a very low level, avoiding the risk of exposing the head near their arms.",val:"Variant de l'atac a una cama en què s'agarra el turmell o la part baixa de la cama de l'adversari des d'un nivell molt baix, evitant el risc d'exposar el cap prop dels seus braços.",pt:"Variante do ataque a uma perna em que se agarra o tornozelo ou a parte baixa da perna do adversário a partir de um nível muito baixo, evitando o risco de expor a cabeça perto dos braços dele."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Knee tap",en:"Knee tap",val:"Knee tap",pt:"Knee tap"}, desc:{es:"Derribo rápido en el que se empuja la rodilla del rival hacia dentro mientras se tira de su brazo o cabeza en dirección contraria, haciéndolo perder el equilibrio sin necesidad de una entrada profunda a la pierna.",en:"A quick takedown where the opponent's knee is pushed inward while their arm or head is pulled the opposite way, taking away their balance without needing a deep leg entry.",val:"Derrocament ràpid en què s'empeny el genoll de l'adversari cap a dins mentre es tira del seu braç o cap en direcció contrària, fent-li perdre l'equilibri sense necessitat d'una entrada profunda a la cama.",pt:"Queda rápida em que se empurra o joelho do adversário para dentro enquanto se puxa seu braço ou cabeça na direção contrária, tirando seu equilíbrio sem precisar de uma entrada profunda na perna."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Ouchi makikomi",en:"Ouchi makikomi",val:"Ouchi makikomi",pt:"Ouchi makikomi"}, desc:{es:"Variante del Ouchi gari en la que, en vez de solo empujar, te enrollas junto al rival envolviendo su brazo mientras caes, arrastrándolo contigo al suelo con más control.",en:"A variant of Ouchi gari where, instead of just pushing, you wrap around the opponent's arm and roll down together with them, dragging them to the ground with more control.",val:"Variant de l'Ouchi gari en què, en lloc de només empényer, t'enrolles junt a l'adversari envoltant el seu braç mentre caus, arrossegant-lo amb tu al terra en més control.",pt:"Variante do Ouchi gari em que, em vez de apenas empurrar, você se enrola junto ao adversário envolvendo seu braço enquanto cai, arrastando-o com você ao chão com mais controle."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Drop seoi nage",en:"Drop seoi nage",val:"Drop seoi nage",pt:"Drop seoi nage"}, desc:{es:"Variante del Seoi nage en la que dejas caer una rodilla al suelo al entrar, permitiendo proyectar a rivales más altos o pesados sin necesidad de levantarlos por completo.",en:"A variant of Seoi nage where you drop one knee to the ground on entry, allowing you to throw taller or heavier opponents without needing to lift them fully.",val:"Variant del Seoi nage en què deixes caure un genoll al terra en entrar, permetent projectar adversaris més alts o pesats sense necessitat d'alçar-los per complet.",pt:"Variante do Seoi nage em que você deixa cair um joelho no chão ao entrar, permitindo projetar adversários mais altos ou pesados sem precisar erguê-los por completo."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Knee staple",en:"Knee staple",val:"Knee staple",pt:"Knee staple"}, desc:{es:"Control que clava la propia rodilla contra la pierna del rival durante un pase, grapándola al suelo para anular su movilidad mientras se avanza hacia una posición dominante.",en:"A control that pins your own knee against the opponent's leg during a pass, stapling it to the ground to remove its mobility while advancing to a dominant position.",val:"Control que clava el propi genoll contra la cama de l'adversari durant una passada, grapant-la al terra per a anul·lar la seua mobilitat mentre s'avança cap a una posició dominant.",pt:"Controle que crava o próprio joelho contra a perna do adversário durante uma passagem, grampeando-a ao chão para anular sua mobilidade enquanto se avança para uma posição dominante."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pase headquarters (headquarters pass)",en:"Headquarters pass",val:"Passada headquarters (headquarters pass)",pt:"Passagem headquarters (headquarters pass)"}, desc:{es:"Control moderno en el que se sujeta con fuerza el tobillo y la rodilla de una pierna del rival estirada, bloqueando por completo su capacidad de recomponer la guardia antes de avanzar hacia el pase.",en:"A modern control where the opponent's extended leg is firmly gripped at the ankle and knee, fully blocking their ability to recompose guard before advancing to the pass.",val:"Control modern en què se subjecta en força el turmell i el genoll d'una cama de l'adversari estirada, bloquejant per complet la seua capacitat de recompondre la guàrdia abans d'avançar cap a la passada.",pt:"Controle moderno em que se segura firmemente o tornozelo e o joelho de uma perna estendida do adversário, bloqueando completamente sua capacidade de recompor a guarda antes de avançar para a passagem."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Backstep de media guardia (half guard backstep)",en:"Half guard backstep",val:"Backstep de mitja guàrdia (half guard backstep)",pt:"Backstep de meia guarda (half guard backstep)"}, desc:{es:"Pase en el que se retrocede un paso para liberar el brazo atrapado por el underhook del rival, girando la cadera hacia atrás para pasar a su espalda en vez de simplemente avanzar.",en:"A pass where you step backward to free the arm trapped by the opponent's underhook, rotating the hip backward to take their back instead of simply advancing forward.",val:"Passada en què es retrocedix un pas per a alliberar el braç atrapat per l'underhook de l'adversari, girant el maluc cap arrere per a passar a la seua esquena en lloc de simplement avançar.",pt:"Passagem em que se recua um passo para liberar o braço preso pelo underhook do adversário, girando o quadril para trás para passar às suas costas em vez de simplesmente avançar."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pase de voltereta lateral (cartwheel pass)",en:"Cartwheel pass",val:"Passada de tombarella lateral (cartwheel pass)",pt:"Passagem de estrela (cartwheel pass)"}, desc:{es:"Pase espectacular en el que se gira todo el cuerpo por encima de las piernas del rival apoyando las manos en el suelo, como una voltereta lateral, para aterrizar directamente en el lateral.",en:"A spectacular pass where the whole body cartwheels over the opponent's legs with the hands planted on the mat, landing directly in side control.",val:"Passada espectacular en què es gira tot el cos per damunt de les cames de l'adversari recolzant les mans al terra, com una tombarella lateral, per a aterrar directament al lateral.",pt:"Passagem espetacular em que todo o corpo gira por cima das pernas do adversário apoiando as mãos no chão, como uma estrela, para aterrissar diretamente no lateral."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Raspado leñador (lumberjack sweep)",en:"Lumberjack sweep",val:"Raspat llenyataire (lumberjack sweep)",pt:"Raspagem lenhador (lumberjack sweep)"}, desc:{es:"Raspado —no un derribo de pie— en el que, estando tú abajo en guardia, te incorporas para cargar la pierna del rival sobre tu hombro como si fuera un tronco, dejándolo caer de espaldas mientras tú acabas arriba.",en:"A sweep — not a standing takedown — where, starting from guard on your back, you rise up to load the opponent's leg onto your shoulder like a log, dropping them onto their back while you end up on top.",val:"Raspat —no un derrocament dret— en què, estant tu baix en guàrdia, t'incorpores per a carregar la cama de l'adversari sobre la teua espatla com si fóra un tronc, deixant-lo caure d'esquena mentre tu acabes a dalt.",pt:"Raspagem — não uma queda em pé — em que, começando de baixo na guarda, você se levanta para carregar a perna do adversário sobre seu ombro como se fosse um tronco, deixando-o cair de costas enquanto você termina por cima."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Kiss of the dragon",en:"Kiss of the dragon",val:"Kiss of the dragon",pt:"Kiss of the dragon"}, desc:{es:"Raspado avanzado desde De la Riva en el que se invierte el cuerpo entrelazando ambas piernas del rival, generando el giro necesario para acabar arriba en un solo movimiento fluido.",en:"An advanced sweep from De la Riva guard where the body inverts while entangling both of the opponent's legs, generating the rotation needed to land on top in one fluid motion.",val:"Raspat avançat des de De la Riva en què s'invertix el cos entrellaçant ambdues cames de l'adversari, generant el gir necessari per a acabar a dalt en un sol moviment fluid.",pt:"Raspagem avançada a partir da guarda De la Riva em que o corpo se inverte entrelaçando as duas pernas do adversário, gerando o giro necessário para terminar por cima em um único movimento fluido."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado old-school (old-school sweep)",en:"Old-school sweep",val:"Raspat old-school (old-school sweep)",pt:"Raspagem old-school (old-school sweep)"}, desc:{es:"Desde media guardia, se agarra con las dos manos la pierna trasera del rival y se gira la cadera para quitarle ese apoyo, de modo que cae hacia atrás antes de poder aplastar la guardia.",en:"From half guard, you grab the opponent's back leg with both hands and turn the hips to take away that support, so they fall backward before they can flatten your guard.",val:"Des de mitja guàrdia, s'agafa amb les dues mans la cama posterior de l'adversari i es gira el maluc per a llevar-li eixe suport, de manera que cau cap arrere abans de poder aixafar la guàrdia.",pt:"Da meia guarda, agarra-se com as duas mãos a perna de trás do adversário e gira-se o quadril para tirar esse apoio, de modo que ele cai para trás antes de conseguir esmagar a guarda."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Raspado dogfight (dogfight sweep)",en:"Dogfight sweep",val:"Raspat dogfight (dogfight sweep)",pt:"Raspagem dogfight (dogfight sweep)"}, desc:{es:"Raspado desde una posición de media guardia enredada en la que ambos luchadores quedan de costado, aprovechando el underhook para invertir la posición y quedar arriba.",en:"A sweep from a tangled half guard position where both fighters end up on their sides, using the underhook to invert the position and land on top.",val:"Raspat des d'una posició de mitja guàrdia enredada en què ambdós lluitadors queden de costat, aprofitant l'underhook per a invertir la posició i quedar a dalt.",pt:"Raspagem a partir de uma posição de meia guarda emaranhada em que os dois lutadores ficam de lado, aproveitando o underhook para inverter a posição e ficar por cima."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado del camarero (waiter sweep)",en:"Waiter sweep",val:"Raspat del cambrer (waiter sweep)",pt:"Raspagem do garçom (waiter sweep)"}, desc:{es:"Raspado en el que se levanta la pierna del rival apoyada sobre el propio antebrazo como si se sostuviera una bandeja, generando el desequilibrio necesario para volcarlo hacia un lado.",en:"A sweep where the opponent's leg is lifted resting on your own forearm as if holding a tray, creating the off-balance needed to roll them to one side.",val:"Raspat en què s'alça la cama de l'adversari recolzada sobre el propi avantbraç com si es sostinguera una safata, generant el desequilibri necessari per a bolcar-lo cap a un costat.",pt:"Raspagem em que a perna do adversário é erguida apoiada sobre o próprio antebraço como se segurasse uma bandeja, gerando o desequilíbrio necessário para virá-lo para um lado."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Homer Simpson sweep",en:"Homer Simpson sweep",val:"Homer Simpson sweep",pt:"Homer Simpson sweep"}, desc:{es:"El agarre característico une un brazo del rival y el cuello del lado contrario en una sola cruz; al tirar de ambos a la vez y empujar con los pies, cae hacia atrás y se acaba arriba.",en:"The signature grip joins one of the opponent's arms and the opposite side of their neck into a single cross; pulling both at once and pushing with the feet sends them backward and you end on top.",val:"L'agafada característic uneix un braç de l'adversari i el coll del costat contrari en una sola creu; en estirar d'ambdós alhora i empényer amb els peus, cau cap arrere i s'acaba a dalt.",pt:"A pegada característica une um braço do adversário e o lado oposto do pescoço em uma única cruz; ao puxar os dois ao mesmo tempo e empurrar com os pés, ele cai para trás e você termina por cima."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"John Wayne sweep",en:"John Wayne sweep",val:"John Wayne sweep",pt:"John Wayne sweep"}, desc:{es:"Una mano controla la manga y la otra la pierna contraria, como quien sujeta las riendas de un caballo; al tirar de ambas en direcciones opuestas el rival pierde el equilibrio hacia un lado y se acaba arriba.",en:"One hand controls the sleeve and the other the opposite leg, like holding a horse's reins; pulling them in opposite directions makes the opponent lose balance to one side and you end on top.",val:"Una mà controla la mànega i l'altra la cama contrària, com qui subjecta les regnes d'un cavall; en estirar-les en direccions oposades l'adversari perd l'equilibri cap a un costat i s'acaba a dalt.",pt:"Uma mão controla a manga e a outra a perna oposta, como quem segura as rédeas de um cavalo; ao puxá-las em direções opostas o adversário perde o equilíbrio para um lado e você termina por cima."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Armbar volador (flying armbar)",en:"Flying armbar",val:"Armbar volador (flying armbar)",pt:"Armlock voador (flying armbar)"}, desc:{es:"Entrada al armbar desde una posición de pie: se salta hacia el rival, las piernas envuelven su brazo en el aire y se cae de espaldas arrastrándolo con la palanca ya puesta.",en:"An armbar entry from standing: you jump toward the opponent, your legs wrap their arm in mid-air and you fall onto your back pulling them along with the lock already set.",val:"Entrada a l'armbar des d'una posició dreta: es salta cap a l'adversari, les cames envolten el seu braç en l'aire i es cau d'esquena arrossegant-lo amb la palanca ja posada.",pt:"Entrada no armlock a partir da posição em pé: salta-se em direção ao adversário, as pernas envolvem o braço dele no ar e cai-se de costas arrastando-o com a chave já colocada."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Marcelotine",en:"Marcelotine",val:"Marcelotine",pt:"Marcelotine"}, desc:{es:"Guillotina de alto nivel en la que se combina el control de una manga del rival con el agarre clásico de la estrangulación, quitándole el brazo que normalmente usaría para defenderse.",en:"A high-level guillotine that combines control of the opponent's sleeve with the classic choke grip, taking away the arm they would normally use to defend.",val:"Guillotina d'alt nivell en què es combina el control d'una mànega de l'adversari amb l'agafada clàssica de l'estrangulació, llevant-li el braç que normalment usaria per a defendre's.",pt:"Guilhotina de alto nível que combina o controle de uma manga do adversário com a pegada clássica do estrangulamento, retirando o braço que ele normalmente usaria para se defender."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Triángulo de brazo (arm-triangle)",en:"Arm-triangle",val:"Triangle de braç (arm-triangle)",pt:"Triângulo de braço (arm-triangle)"}, desc:{es:"Estrangulación en la que se atrapa uno de los brazos del rival contra su propio cuello usando el peso del pecho para cerrar la presión, sin necesidad de usar las piernas como en el triángulo clásico.",en:"A choke that traps one of the opponent's arms against their own neck using chest weight to close the pressure, without needing the legs like the classic triangle.",val:"Estrangulació en què s'atrapa un dels braços de l'adversari contra el seu propi coll usant el pes del pit per a tancar la pressió, sense necessitat d'usar les cames com en el triangle clàssic.",pt:"Estrangulamento que prende um dos braços do adversário contra seu próprio pescoço usando o peso do peito para fechar a pressão, sem precisar usar as pernas como no triângulo clássico."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Texas cloverleaf",en:"Texas cloverleaf",val:"Texas cloverleaf",pt:"Texas cloverleaf"}, desc:{es:"Sumisión de pierna que combina el control de tobillo con una torsión de cadera aplicada mientras se sujeta la pierna contraria del rival, generando presión simultánea en varias articulaciones.",en:"A leg submission that combines ankle control with a hip twist applied while holding the opponent's opposite leg, generating simultaneous pressure on several joints.",val:"Submissió de cama que combina el control de turmell amb una torsió de maluc aplicada mentre se subjecta la cama contrària de l'adversari, generant pressió simultània en diverses articulacions.",pt:"Finalização de perna que combina o controle de tornozelo com uma torção de quadril aplicada enquanto se segura a perna contrária do adversário, gerando pressão simultânea em várias articulações."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Seatbelt (control de cinturón)",en:"Seatbelt grip",val:"Seatbelt (control de cinturó)",pt:"Seatbelt (controle de cinto)"}, desc:{es:"Agarre fundamental del control de espalda en el que un brazo pasa por encima del hombro del rival y el otro por debajo de su axila contraria, cruzándose como un cinturón de seguridad.",en:"The fundamental back control grip where one arm goes over the opponent's shoulder and the other under their opposite armpit, crossing like a seatbelt.",val:"Agafada fonamental del control d'esquena en què un braç passa per damunt de l'espatla de l'adversari i l'altre per baix de la seua aixella contrària, creuant-se com un cinturó de seguretat.",pt:"Pegada fundamental do controle das costas em que um braço passa por cima do ombro do adversário e o outro por baixo de sua axila contrária, cruzando-se como um cinto de segurança."}},
  {cat:"sumisiones", level:"intermedio", tags:["no-gi"], name:{es:"Cow catcher choke",en:"Cow catcher choke",val:"Cow catcher choke",pt:"Cow catcher choke"}, desc:{es:"Estrangulación desde el cabezal de lucha en la que se cruzan las manos alrededor del cuello del rival de una forma distinta a la guillotina clásica, comprimiendo la garganta directamente en vez de los laterales.",en:"A choke from the front headlock where the hands are crossed around the opponent's neck differently from the classic guillotine, compressing the throat directly instead of the sides.",val:"Estrangulació des del capçal de lluita en què es creuen les mans al voltant del coll de l'adversari d'una forma distinta a la guillotina clàssica, comprimint la gola directament en lloc dels laterals.",pt:"Estrangulamento a partir do cabeçal de luta em que as mãos se cruzam ao redor do pescoço do adversário de forma diferente da guilhotina clássica, comprimindo a garganta diretamente em vez das laterais."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Go-behind",en:"Go-behind",val:"Go-behind",pt:"Go-behind"}, desc:{es:"Transición de lucha en la que se rodea rápidamente al rival desde un control de cabeza o brazo hasta quedar directamente detrás de él, sentando la base para el control de espalda.",en:"A wrestling transition where you quickly circle around the opponent from a head or arm control to end up directly behind them, setting up back control.",val:"Transició de lluita en què es rodeja ràpidament l'adversari des d'un control de cap o braç fins a quedar directament darrere d'ell, assentant la base per al control d'esquena.",pt:"Transição de luta em que se contorna rapidamente o adversário a partir de um controle de cabeça ou braço até ficar diretamente atrás dele, preparando a base para o controle das costas."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Sasae tsurikomi ashi",en:"Sasae tsurikomi ashi",val:"Sasae tsurikomi ashi",pt:"Sasae tsurikomi ashi"}, desc:{es:"Derribo de judo de bloqueo bajo: la punta del pie detiene el paso del rival justo cuando apoya el tobillo o el empeine, y se le tira hacia abajo y adelante para que tropiece, sin llegar a hacerlo girar.",en:"A low-blocking judo throw: the foot stops the opponent's step just as they plant the ankle or instep, and they are pulled down and forward so they trip, without being rotated.",val:"Derrocament de judo de bloqueig baix: el peu deté el pas de l'adversari just quan recolza el turmell o l'empenya, i se l'estira cap avall i cap avant perquè entropesse, sense arribar a fer-lo girar.",pt:"Queda de judô de bloqueio baixo: o pé detém o passo do adversário justo quando ele apoia o tornozelo ou o peito do pé, e ele é puxado para baixo e para frente para tropeçar, sem chegar a girá-lo."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Kosoto gake",en:"Kosoto gake",val:"Kosoto gake",pt:"Kosoto gake"}, desc:{es:"Derribo de judo por fuera: el pie engancha el talón o la pantorrilla del rival desde el lado exterior y lo sujeta en vez de barrerlo, mientras el torso se empuja hacia atrás sobre esa pierna bloqueada.",en:"An outside judo throw: your foot hooks the opponent's heel or calf from the outer side and holds it rather than sweeping it, while the torso is pushed backward over that blocked leg.",val:"Derrocament de judo per fora: el peu enganxa el taló o la panxeta de l'adversari des del costat exterior i el subjecta en lloc d'escombrar-lo, mentre el tors s'empeny cap arrere sobre eixa cama bloquejada.",pt:"Queda de judô por fora: o pé engancha o calcanhar ou a panturrilha do adversário pelo lado externo e o segura em vez de varrê-lo, enquanto o tronco é empurrado para trás sobre essa perna bloqueada."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Cross ashi garami",en:"Cross ashi garami",val:"Cross ashi garami",pt:"Cross ashi garami"}, desc:{es:"Entrada cruzada al control de pierna: en vez de entrar por el lado habitual del ashi garami, te colocas por el lado opuesto y cruzas tus piernas sobre la pierna del rival, de modo que su rodilla apunta hacia el otro lado y cambia el ángulo de los ataques de tobillo y rodilla.",en:"A crossed entry to leg control: instead of entering from the usual side of ashi garami, you set up on the opposite side and cross your legs over the opponent's leg, so their knee points the other way and the angle of the ankle and knee attacks changes.",val:"Entrada creuada al control de cama: en lloc d'entrar pel costat habitual de l'ashi garami, et col·loques pel costat oposat i creues les cames sobre la cama de l'adversari, de manera que el seu genoll apunta cap a l'altre costat i canvia l'angle dels atacs de turmell i genoll.",pt:"Entrada cruzada no controle de perna: em vez de entrar pelo lado habitual do ashi garami, você se posiciona pelo lado oposto e cruza as pernas sobre a perna do adversário, de modo que o joelho dele aponta para o outro lado e muda o ângulo dos ataques de tornozelo e joelho."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de kneebar",en:"Kneebar escape",val:"Escapada de kneebar",pt:"Fuga de kneebar"}, desc:{es:"Con la pierna atrapada por el kneebar, se gira la rodilla hacia dentro y se dobla la pierna antes de que el rival estire el cuerpo, colocando la rodilla lejos de su cadera para que la palanca no encuentre la articulación.",en:"With the leg trapped in the kneebar, you turn the knee inward and bend the leg before the opponent stretches out, placing the knee away from their hip so the lever cannot find the joint.",val:"Amb la cama atrapada pel kneebar, es gira el genoll cap a dins i es doblega la cama abans que l'adversari estire el cos, col·locant el genoll lluny del seu maluc perquè la palanca no trobe l'articulació.",pt:"Com a perna presa no kneebar, gira-se o joelho para dentro e dobra-se a perna antes que o adversário estique o corpo, afastando o joelho do quadril dele para que a alavanca não encontre a articulação."}},
  {cat:"control", level:"intermedio", tags:["gi"], name:{es:"Kesa gatame modificado (kuzure kesa gatame)",en:"Modified scarf hold (kuzure kesa gatame)",val:"Kesa gatame modificat (kuzure kesa gatame)",pt:"Kesa gatame modificado (kuzure kesa gatame)"}, desc:{es:"Variante del control de bufanda en la que se sujeta el brazo del rival por debajo del hombro en vez de abrazar toda la cabeza, ganando movilidad para pasar a montada con más facilidad.",en:"A variant of the scarf hold where the opponent's arm is gripped below the shoulder instead of hugging the whole head, gaining mobility to transition to mount more easily.",val:"Variant del control de bufanda en què se subjecta el braç de l'adversari per baix de l'espatla en lloc d'abraçar tot el cap, guanyant mobilitat per a passar a muntada en més facilitat.",pt:"Variante do controle de cachecol em que se segura o braço do adversário abaixo do ombro em vez de abraçar toda a cabeça, ganhando mobilidade para passar à montada com mais facilidade."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Kimura rodante (rolling kimura)",en:"Rolling kimura",val:"Kimura rodant (rolling kimura)",pt:"Kimura rolante (rolling kimura)"}, desc:{es:"Aplicación de la kimura en la que, en vez de mantenerte estático, ruedas hacia un lado sin soltar el agarre, arrastrando al rival contigo para completar la palanca desde una posición nueva.",en:"An application of the kimura where, instead of staying static, you roll to one side without releasing the grip, dragging the opponent with you to complete the lock from a new position.",val:"Aplicació de la kimura en què, en lloc de mantindre't estàtic, rodes cap a un costat sense soltar l'agafada, arrossegant l'adversari amb tu per a completar la palanca des d'una posició nova.",pt:"Aplicação da kimura em que, em vez de ficar estático, você rola para um lado sem soltar a pegada, arrastando o adversário com você para completar a chave a partir de uma nova posição."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Triángulo invertido (reverse triangle)",en:"Reverse triangle",val:"Triangle invertit (reverse triangle)",pt:"Triângulo invertido (reverse triangle)"}, desc:{es:"Variante del triángulo aplicada desde un control de espalda o lateral en vez de desde guardia, entrelazando las piernas alrededor del cuello del rival desde un ángulo poco habitual.",en:"A triangle variant applied from back or side control instead of guard, lacing the legs around the opponent's neck from an unusual angle.",val:"Variant del triangle aplicada des d'un control d'esquena o lateral en lloc de des de guàrdia, entrellaçant les cames al voltant del coll de l'adversari des d'un angle poc habitual.",pt:"Variante do triângulo aplicada a partir de um controle das costas ou lateral em vez da guarda, entrelaçando as pernas ao redor do pescoço do adversário a partir de um ângulo pouco habitual."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado sentado (sit-up sweep)",en:"Sit-up sweep",val:"Raspat assegut (sit-up sweep)",pt:"Raspagem sentada (sit-up sweep)"}, desc:{es:"El impulso del propio tronco es lo que barre: desde guardia abierta te incorporas de golpe y empujas el pecho del rival con las manos hasta llevarlo hacia atrás y acabar arriba.",en:"Your own torso momentum does the sweeping: from open guard you sit up suddenly and push the opponent's chest with your hands until they go backward and you end on top.",val:"L'impuls del propi tors és el que raspa: des de guàrdia oberta t'incorpores de colp i empenys el pit de l'adversari amb les mans fins que va cap arrere i acabes a dalt.",pt:"O impulso do próprio tronco é o que raspa: da guarda aberta você se senta de repente e empurra o peito do adversário com as mãos até ele ir para trás e você terminar por cima."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Contra de whizzer (whizzer counter)",en:"Whizzer counter",val:"Contra de whizzer (whizzer counter)",pt:"Contra de whizzer (whizzer counter)"}, desc:{es:"Respuesta al sobregancho del rival en la que se gira la cadera hacia el brazo enganchado y se completa un derribo o un giro hacia su espalda, aprovechando que ese brazo queda temporalmente inmovilizado.",en:"A response to the opponent's overhook where the hips rotate toward the trapped arm to complete a takedown or spin to their back, capitalizing on that arm being momentarily immobilized.",val:"Resposta al sobreganxo de l'adversari en què es gira el maluc cap al braç enganxat i es completa un derrocament o un gir cap a la seua esquena, aprofitant que eixe braç queda temporalment immobilisat.",pt:"Resposta ao sobregancho do adversário em que o quadril gira em direção ao braço preso e se completa uma queda ou um giro para suas costas, aproveitando que esse braço fica temporariamente imobilizado."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Bolo (reverse berimbolo)",en:"Bolo (reverse berimbolo)",val:"Bolo (reverse berimbolo)",pt:"Bolo (reverse berimbolo)"}, desc:{es:"Variante del berimbolo en la que la inversión se realiza girando hacia el lado contrario al habitual, sorprendiendo a rivales acostumbrados a defender la dirección clásica.",en:"A berimbolo variant where the inversion is performed rotating toward the opposite side of the usual direction, surprising opponents used to defending the classic direction.",val:"Variant del berimbolo en què la inversió es realisa girant cap al costat contrari a l'habitual, sorprenent adversaris acostumats a defendre la direcció clàssica.",pt:"Variante do berimbolo em que a inversão é realizada girando para o lado contrário ao habitual, surpreendendo adversários acostumados a defender a direção clássica."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Sit-through",en:"Sit-through",val:"Sit-through",pt:"Sit-through"}, desc:{es:"Movimiento de lucha en el que se pasa de estar en cuadrupedia hacia una posición sentada girando la cadera, cambiando de frente hacia el rival para escapar de un control desde atrás o preparar un derribo.",en:"A wrestling movement where you go from all-fours into a seated position by rotating the hip, turning to face the opponent to escape a control from behind or set up a takedown.",val:"Moviment de lluita en què es passa d'estar en quadrupedia cap a una posició asseguda girant el maluc, canviant de front cap a l'adversari per a escapar d'un control des de darrere o preparar un derrocament.",pt:"Movimento de luta em que se passa de estar de quatro para uma posição sentada girando o quadril, virando de frente para o adversário para escapar de um controle por trás ou preparar uma queda."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Uki goshi (cadera flotante)",en:"Uki goshi (floating hip throw)",val:"Uki goshi (maluc flotant)",pt:"Uki goshi (quadril flutuante)"}, desc:{es:"Cadera flotante de judo: el brazo rodea la cintura y la cadera se gira solo lo justo, sin cargar al rival sobre ella, de modo que cae con un giro fluido, más por su propio desequilibrio que por un levantamiento.",en:"The floating judo hip throw: your arm wraps the waist and the hip turns only as much as needed, without loading the opponent onto it, so they fall in a fluid spin caused more by their own off-balance than by a lift.",val:"Maluc flotant de judo: el braç rodeja la cintura i el maluc es gira només el just, sense carregar l'adversari damunt, de manera que cau amb un gir fluid, més pel seu propi desequilibri que per un alçament.",pt:"Quadril flutuante do judô: o braço envolve a cintura e o quadril gira só o necessário, sem carregar o adversário sobre ele, de modo que ele cai em um giro fluido, causado mais pelo próprio desequilíbrio do que por um levantamento."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Estrangulación de manga cruzada (cross sleeve choke)",en:"Cross sleeve choke",val:"Estrangulació de mànega creuada (cross sleeve choke)",pt:"Estrangulamento de manga cruzada (cross sleeve choke)"}, desc:{es:"Ahogo con kimono en el que se usa la propia manga del rival cruzada contra su cuello, en vez de la solapa, cerrando la presión desde un ángulo poco habitual.",en:"A gi choke that uses the opponent's own sleeve crossed against their neck instead of the lapel, closing the pressure from an unusual angle.",val:"Ofegament amb quimono en què s'usa la propia mànega de l'adversari creuada contra el seu coll, en lloc de la solapa, tancant la pressió des d'un angle poc habitual.",pt:"Estrangulamento com quimono que usa a própria manga do adversário cruzada contra seu pescoço, em vez da lapela, fechando a pressão a partir de um ângulo pouco habitual."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Zombie choke",en:"Zombie choke",val:"Zombie choke",pt:"Zombie choke"}, desc:{es:"Estrangulación moderna aplicada desde el control de espalda en la que ambos antebrazos rodean el cuello del rival con las palmas hacia arriba, cerrando la presión sin necesidad de cruzar los brazos como en la mata león.",en:"A modern choke applied from back control where both forearms wrap around the opponent's neck palms-up, closing the pressure without needing to cross the arms like in the rear naked choke.",val:"Estrangulació moderna aplicada des del control d'esquena en què ambdós avantbraços rodegen el coll de l'adversari amb les palmes cap amunt, tancant la pressió sense necessitat de creuar els braços com en la mata lleó.",pt:"Estrangulamento moderno aplicado a partir do controle das costas em que os dois antebraços envolvem o pescoço do adversário com as palmas para cima, fechando a pressão sem precisar cruzar os braços como no mata-leão."}},
  {cat:"escapes", level:"avanzado", tags:["gi","no-gi"], name:{es:"Escape de darce/anaconda",en:"Darce/anaconda escape",val:"Escapada de darce/anaconda",pt:"Fuga de darce/anaconda"}, desc:{es:"Contra el Darce o la Anaconda, se pega la barbilla al pecho, se agarra la muñeca del brazo que rodea el cuello y se gira hacia el lado del brazo atrapado antes de que el rival complete el giro, para que la presión no llegue a cerrarse.",en:"Against the D'Arce or the Anaconda, you tuck the chin to the chest, grab the wrist of the arm around your neck and turn toward the trapped-arm side before the opponent completes the roll, so the pressure never closes.",val:"Contra el Darce o l'Anaconda, es pega la barbeta al pit, s'agafa el canell del braç que rodeja el coll i es gira cap al costat del braç atrapat abans que l'adversari complete el gir, perquè la pressió no arribe a tancar-se.",pt:"Contra o Darce ou a Anaconda, encolhe-se o queixo no peito, agarra-se o pulso do braço que envolve o pescoço e gira-se para o lado do braço preso antes que o adversário complete o giro, para que a pressão não chegue a se fechar."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Estrangulación desde kesa gatame",en:"Kesa gatame choke",val:"Estrangulació des de kesa gatame",pt:"Estrangulamento a partir do kesa gatame"}, desc:{es:"Sumisión aplicada directamente desde el control de bufanda, usando la propia manga o solapa del rival para cerrar el ahogo sin necesidad de cambiar de posición.",en:"A submission applied directly from the scarf hold, using the opponent's own sleeve or lapel to close the choke without needing to change position.",val:"Submissió aplicada directament des del control de bufanda, usant la propia mànega o solapa de l'adversari per a tancar l'ofegament sense necessitat de canviar de posició.",pt:"Finalização aplicada diretamente a partir do controle de cachecol, usando a própria manga ou lapela do adversário para fechar o estrangulamento sem precisar mudar de posição."}},
  {cat:"pases", level:"avanzado", tags:["gi"], name:{es:"Pase de la araña (spider guard pass)",en:"Spider guard pass",val:"Passada de l'aranya (spider guard pass)",pt:"Passagem da aranha (spider guard pass)"}, desc:{es:"Pase específico contra la guardia de araña en el que se juntan ambos pies del rival y se libera una manga antes de avanzar, neutralizando el control de piernas característico de esa guardia.",en:"A pass specific to spider guard where both of the opponent's feet are brought together and one sleeve is freed before advancing, neutralizing that guard's characteristic leg control.",val:"Passada específica contra la guàrdia d'aranya en què es junten ambdós peus de l'adversari i s'allibera una mànega abans d'avançar, neutralisant el control de cames característic d'eixa guàrdia.",pt:"Passagem específica contra a guarda aranha em que os dois pés do adversário são juntados e uma manga é liberada antes de avançar, neutralizando o controle de pernas característico dessa guarda."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"O goshi (cadera mayor)",en:"O goshi (major hip throw)",val:"O goshi (maluc major)",pt:"O goshi (quadril maior)"}, desc:{es:"El derribo de cadera clásico del judo: la cadera se mete profunda bajo el vientre del rival, con un brazo en su cintura y el otro tirando de su manga, y se le carga sobre ella para proyectarlo con un levantamiento firme.",en:"The classic judo hip throw: the hip goes deep under the opponent's belly, one arm around their waist and the other pulling their sleeve, and they are loaded onto the hip to be thrown with a firm lift.",val:"El derrocament de maluc clàssic del judo: el maluc es fica a fons davall del ventre de l'adversari, amb un braç en la seua cintura i l'altre estirant de la mànega, i se'l carrega damunt per a projectar-lo amb un alçament ferm.",pt:"A queda de quadril clássica do judô: o quadril entra fundo sob a barriga do adversário, com um braço na cintura e o outro puxando a manga, e ele é carregado sobre o quadril para ser projetado com um levantamento firme."}},
  {cat:"derribos", level:"intermedio", tags:["gi"], name:{es:"Tsurikomi goshi (cadera con tirón)",en:"Tsurikomi goshi (lift-pull hip throw)",val:"Tsurikomi goshi (maluc amb estirada)",pt:"Tsurikomi goshi (quadril com puxão)"}, desc:{es:"Variante del o goshi en la que, antes de girar la cadera, se levanta al rival ligeramente sobre las puntas de los pies tirando de su solapa y manga hacia arriba, rompiendo su base antes de completar la proyección.",en:"A variant of o goshi where, before rotating the hip, the opponent is lifted slightly onto their toes by pulling their lapel and sleeve upward, breaking their base before completing the throw.",val:"Variant de l'o goshi en què, abans de girar el maluc, s'alça l'adversari lleugerament sobre les puntes dels peus tirant de la seua solapa i mànega cap amunt, trencant la seua base abans de completar la projecció.",pt:"Variante do o goshi em que, antes de girar o quadril, o adversário é erguido levemente na ponta dos pés puxando sua lapela e manga para cima, quebrando sua base antes de completar a projeção."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Yoko tomoe nage (sacrificio lateral)",en:"Yoko tomoe nage (side sacrifice throw)",val:"Yoko tomoe nage (sacrifici lateral)",pt:"Yoko tomoe nage (sacrifício lateral)"}, desc:{es:"Variante lateral del tomoe nage en la que, en vez de caer de espaldas hacia atrás, te dejas caer hacia un lado colocando el pie en la cadera del rival, proyectándolo por encima con un ángulo distinto al clásico.",en:"A sideways variant of tomoe nage where, instead of falling straight backward, you drop to one side placing your foot on the opponent's hip, throwing them over at a different angle from the classic version.",val:"Variant lateral del tomoe nage en què, en lloc de caure d'esquena cap arrere, et deixes caure cap a un costat col·locant el peu en el maluc de l'adversari, projectant-lo per damunt amb un angle distint al clàssic.",pt:"Variante lateral do tomoe nage em que, em vez de cair de costas para trás, você se deixa cair para um lado colocando o pé no quadril do adversário, projetando-o por cima em um ângulo diferente do clássico."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Control canilla-canilla (shin-to-shin)",en:"Shin-to-shin control",val:"Control canella-canella (shin-to-shin)",pt:"Controle canela-canela (shin-to-shin)"}, desc:{es:"Control de guardia moderno en el que ambas canillas quedan presionadas entre sí frente a las del rival, creando una distancia y un ángulo desde el que resulta fácil entrar a raspados o ataques de pierna.",en:"A modern guard control where both shins press against the opponent's, creating a distance and angle from which it's easy to enter sweeps or leg attacks.",val:"Control de guàrdia modern en què ambdues canelles queden pressionades entre si enfront de les de l'adversari, creant una distància i un angle des del qual resulta fàcil entrar a raspats o atacs de cama.",pt:"Controle de guarda moderno em que as duas canelas ficam pressionadas entre si diante das do adversário, criando uma distância e um ângulo de onde é fácil entrar em raspagens ou ataques de perna."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de corbata peruana",en:"Peruvian necktie escape",val:"Escapada de corbata peruana",pt:"Fuga de gravata peruana"}, desc:{es:"Con la pierna del rival ya cruzada sobre el cuello, se incorpora el tronco y se empuja su rodilla hacia fuera con la mano libre para deshacer el cruce de piernas, sacando la cabeza por el lado contrario antes de que apriete.",en:"With the opponent's leg already across the neck, you sit the torso up and push their knee outward with the free hand to undo the leg cross, pulling the head out the opposite side before they squeeze.",val:"Amb la cama de l'adversari ja creuada sobre el coll, s'incorpora el tors i s'empeny el seu genoll cap a fora amb la mà lliure per a desfer la creu de cames, traient el cap pel costat contrari abans que estrenga.",pt:"Com a perna do adversário já cruzada sobre o pescoço, levanta-se o tronco e empurra-se o joelho dele para fora com a mão livre para desfazer o cruzamento de pernas, tirando a cabeça pelo lado oposto antes que ele aperte."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de triángulo de brazo",en:"Arm-triangle escape",val:"Escapada de triangle de braç",pt:"Fuga de triângulo de braço"}, desc:{es:"Con el arm-triangle ya encajado, se mete la barbilla y se empuja la cadera del rival con la pierna libre para girar hacia el brazo atrapado; al abrirse espacio en el cuello se saca la cabeza y se vuelve a la guardia.",en:"With the arm-triangle already set, you tuck the chin and push the opponent's hip with the free leg to turn toward the trapped arm; once space opens at the neck the head comes out and guard is recovered.",val:"Amb l'arm-triangle ja encaixat, es fica la barbeta i s'empeny el maluc de l'adversari amb la cama lliure per a girar cap al braç atrapat; quan s'obri espai al coll es trau el cap i es torna a la guàrdia.",pt:"Com o arm-triangle já encaixado, encolhe-se o queixo e empurra-se o quadril do adversário com a perna livre para girar em direção ao braço preso; quando o espaço se abre no pescoço, a cabeça sai e a guarda é recuperada."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Kimura desde tortuga (turtle kimura)",en:"Turtle kimura",val:"Kimura des de tortuga (turtle kimura)",pt:"Kimura da tartaruga (turtle kimura)"}, desc:{es:"Ataque a un rival en tortuga en el que se aísla uno de sus brazos por debajo, aplicando la palanca de kimura antes de que pueda recolocar el brazo bajo su propio cuerpo para defenderse.",en:"An attack on an opponent in turtle where one of their arms is isolated underneath, applying the kimura lock before they can tuck the arm back under their own body to defend.",val:"Atac a un adversari en tortuga en què s'aïlla un dels seus braços per baix, aplicant la palanca de kimura abans que puga recol·locar el braç baix el seu propi cos per a defendre's.",pt:"Ataque a um adversário na tartaruga em que se isola um de seus braços por baixo, aplicando a chave de kimura antes que ele possa recolocar o braço sob o próprio corpo para se defender."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de corte de gemelo",en:"Calf slicer escape",val:"Escapada de tall de bessó",pt:"Fuga de corte de panturrilha"}, desc:{es:"Con la pantorrilla ya presionada, se empuja el muslo o la rodilla del rival con la mano libre para abrir espacio detrás de la rodilla y se saca el pie hacia atrás, liberando el músculo antes de que se cierre la compresión.",en:"With the calf already pressed, you push the opponent's thigh or knee with the free hand to open space behind the knee and pull the foot back out, freeing the muscle before the compression closes.",val:"Amb la panxeta ja pressionada, s'empeny la cuixa o el genoll de l'adversari amb la mà lliure per a obrir espai darrere del genoll i es trau el peu cap arrere, alliberant el múscul abans que es tanque la compressió.",pt:"Com a panturrilha já pressionada, empurra-se a coxa ou o joelho do adversário com a mão livre para abrir espaço atrás do joelho e puxa-se o pé para trás, liberando o músculo antes que a compressão se feche."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Sode tsurikomi goshi (cadera de manga)",en:"Sode tsurikomi goshi (sleeve hip throw)",val:"Sode tsurikomi goshi (maluc de mànega)",pt:"Sode tsurikomi goshi (quadril de manga)"}, desc:{es:"Variante del tsurikomi goshi en la que, en vez de agarrar la solapa, se tira hacia arriba de la manga del rival con ambas manos, generando el mismo desequilibrio con un agarre distinto más habitual en el no-gi adaptado.",en:"A variant of tsurikomi goshi where, instead of gripping the lapel, the opponent's sleeve is pulled upward with both hands, creating the same off-balance with a different grip more common in adapted no-gi.",val:"Variant del tsurikomi goshi en què, en lloc d'agarrar la solapa, es tira cap amunt de la mànega de l'adversari amb ambdues mans, generant el mateix desequilibri amb una agafada distinta més habitual en el no-gi adaptat.",pt:"Variante do tsurikomi goshi em que, em vez de agarrar a lapela, a manga do adversário é puxada para cima com as duas mãos, gerando o mesmo desequilíbrio com uma pegada diferente mais comum no no-gi adaptado."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Yoko guruma (rueda lateral)",en:"Yoko guruma (side wheel)",val:"Yoko guruma (roda lateral)",pt:"Yoko guruma (roda lateral)"}, desc:{es:"Derribo de sacrificio en el que te dejas caer de costado mientras rodeas el cuello del rival con un brazo, girando su cuerpo por encima del tuyo como si fuera el eje de una rueda tumbada de lado.",en:"A sacrifice throw where you drop to the side while wrapping the opponent's neck with one arm, rotating their body over yours as if it were the axis of a sideways-lying wheel.",val:"Derrocament de sacrifici en què et deixes caure de costat mentre rodeges el coll de l'adversari amb un braç, girant el seu cos per damunt del teu com si fóra l'eix d'una roda tombada de costat.",pt:"Queda de sacrifício em que você se deixa cair de lado enquanto envolve o pescoço do adversário com um braço, girando o corpo dele por cima do seu como se fosse o eixo de uma roda deitada de lado."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de americana",en:"Americana escape",val:"Escapada d'americana",pt:"Fuga de americana"}, desc:{es:"Con la muñeca clavada contra el suelo, se mantiene el codo pegado al costado y se gira la mano hacia el propio cuerpo mientras se empuja con la otra, para que el brazo no quede en ángulo recto y la palanca no llegue al hombro.",en:"With the wrist pinned to the mat, you keep the elbow tight to your side and turn the hand toward your own body while pushing with the other, so the arm never sits at a right angle and the lever cannot reach the shoulder.",val:"Amb el canell clavat contra el terra, es manté el colze apegat al costat i es gira la mà cap al propi cos mentre s'empeny amb l'altra, perquè el braç no quede en angle recte i la palanca no arribe a l'espatla.",pt:"Com o pulso preso ao chão, mantém-se o cotovelo colado ao corpo e gira-se a mão em direção ao próprio corpo enquanto se empurra com a outra, para que o braço não fique em ângulo reto e a alavanca não chegue ao ombro."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de kata gatame",en:"Kata gatame escape",val:"Escapada de kata gatame",pt:"Fuga de kata gatame"}, desc:{es:"Sujetar la muñeca del brazo que rodea tu cuello mientras giras hacia el rival, buscando el ángulo necesario para liberar la cabeza antes de que junte las manos y cierre del todo el control.",en:"Gripping the wrist of the arm wrapped around your neck while turning toward the opponent, looking for the angle needed to free your head before they clasp their hands and fully close the control.",val:"Subjectar el canell del braç que rodeja el teu coll mentre gires cap a l'adversari, buscant l'angle necessari per a alliberar el cap abans que junte les mans i tanque del tot el control.",pt:"Segurar o pulso do braço que envolve seu pescoço enquanto você gira em direção ao adversário, buscando o ângulo necessário para liberar a cabeça antes que ele junte as mãos e feche completamente o controle."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Agarre ruso (Russian tie)",en:"Russian tie",val:"Agafada russa (Russian tie)",pt:"Pegada russa (Russian tie)"}, desc:{es:"Control de lucha en el que se rodea un brazo del rival por dentro sujetando su propia muñeca contraria, atrapando el brazo cerca del cuerpo para arrastrarlo y sacar el ángulo hacia un derribo o la espalda.",en:"A wrestling control where one of the opponent's arms is wrapped from the inside, gripping your own opposite wrist, trapping the arm close to the body to drag them and create an angle toward a takedown or the back.",val:"Control de lluita en què es rodeja un braç de l'adversari per dins subjectant el propi canell contrari, atrapant el braç prop del cos per a arrossegar-lo i traure l'angle cap a un derrocament o l'esquena.",pt:"Controle de luta em que um braço do adversário é envolvido por dentro, segurando o próprio pulso contrário, prendendo o braço perto do corpo para arrastá-lo e criar o ângulo para uma queda ou as costas."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Control de pierna trenzada (leg lace)",en:"Leg lace",val:"Control de cama trenada (leg lace)",pt:"Controle de perna trançada (leg lace)"}, desc:{es:"Control desde la espalda o la tortuga en el que se entrelaza una pierna del rival hacia atrás por dentro de su propia rodilla, bloqueando su capacidad de defenderse mientras se busca una sumisión de pierna o de cuello.",en:"A control from the back or turtle where one of the opponent's legs is laced backward through their own knee, blocking their ability to defend while looking for a leg or neck submission.",val:"Control des de l'esquena o la tortuga en què s'entrellaça una cama de l'adversari cap arrere per dins del seu propi genoll, bloquejant la seua capacitat de defendre's mentre es busca una submissió de cama o de coll.",pt:"Controle das costas ou da tartaruga em que uma perna do adversário é entrelaçada para trás por dentro do próprio joelho, bloqueando sua capacidade de se defender enquanto se busca uma finalização de perna ou pescoço."}},
  {cat:"escapes", level:"intermedio", tags:["gi"], name:{es:"Escape de Ezequiel",en:"Ezekiel choke escape",val:"Escapada d'Ezequiel",pt:"Fuga de Ezequiel"}, desc:{es:"Contra el Ezequiel, los dedos se cuelan bajo la manga o el antebrazo que presiona el cuello y se empuja hacia arriba para aflojar; al ganar espacio se saca la cabeza y se vuelve a guardia.",en:"Against the Ezekiel, the fingers slip under the sleeve or forearm pressing the neck and push upward to loosen it; once space opens the head comes out and guard is recovered.",val:"Contra l'Ezequiel, els dits es colen baix de la mànega o l'avantbraç que pressiona el coll i s'empeny cap amunt per a afluixar; en guanyar espai es trau el cap i es torna a guàrdia.",pt:"Contra o Ezequiel, os dedos se encaixam sob a manga ou o antebraço que pressiona o pescoço e empurra-se para cima para afrouxar; ao ganhar espaço a cabeça sai e volta-se à guarda."}},
  {cat:"escapes", level:"intermedio", tags:["gi"], name:{es:"Escape de estrangulación cruzada",en:"Cross-collar choke escape",val:"Escapada d'estrangulació creuada",pt:"Fuga de estrangulamento cruzado"}, desc:{es:"Contra la cruzada de solapas, se mete una mano bajo la solapa que cruza el cuello para aflojarla y se gira el hombro hacia el lado de la mano cruzada, abriendo hueco para sacar la cabeza o barrer antes de que los codos se junten.",en:"Against the cross-collar choke, you slip a hand under the lapel crossing the neck to loosen it and turn the shoulder toward the crossed hand, opening a gap to pull the head out or sweep before the elbows come together.",val:"Contra la creuada de solapes, es fica una mà baix de la solapa que creua el coll per a afluixar-la i es gira l'espatla cap al costat de la mà creuada, obrint buit per a traure el cap o raspar abans que els colzes s'ajunten.",pt:"Contra o estrangulamento cruzado de lapelas, coloca-se uma mão sob a lapela que cruza o pescoço para afrouxá-la e gira-se o ombro para o lado da mão cruzada, abrindo espaço para tirar a cabeça ou raspar antes que os cotovelos se juntem."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Gyaku juji jime (cruzada palmas arriba)",en:"Gyaku juji jime (palms-up cross choke)",val:"Gyaku juji jime (creuada palmells amunt)",pt:"Gyaku juji jime (cruzado palmas para cima)"}, desc:{es:"Variante de la estrangulación cruzada en la que ambas manos agarran las solapas con las palmas hacia arriba, cruzando los antebrazos sobre el cuello y cerrando la presión al abrir los codos.",en:"A variant of the cross choke where both hands grip the lapels palms up, crossing the forearms over the neck and closing the pressure by spreading the elbows.",val:"Variant de l'estrangulació creuada en què ambdues mans agarren les solapes amb els palmells cap amunt, creuant els avantbraços sobre el coll i tancant la pressió en obrir els colzes.",pt:"Variante do estrangulamento cruzado em que as duas mãos agarram as lapelas com as palmas para cima, cruzando os antebraços sobre o pescoço e fechando a pressão ao abrir os cotovelos."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Kata ha jime (ala simple)",en:"Kata ha jime (single wing choke)",val:"Kata ha jime (ala simple)",pt:"Kata ha jime (asa simples)"}, desc:{es:"Estrangulación en la que un brazo pasa bajo la axila del rival y sube por detrás de su cuello mientras el otro empuja su cabeza, formando un ala que comprime el cuello contra su propio brazo atrapado.",en:"A choke where one arm passes under the opponent's armpit and rises behind their neck while the other pushes their head, forming a wing that compresses the neck against their own trapped arm.",val:"Estrangulació en què un braç passa davall l'aixella de l'adversari i puja per darrere del seu coll mentre l'altre empeny el seu cap, formant una ala que comprimeix el coll contra el seu propi braç atrapat.",pt:"Estrangulamento em que um braço passa sob a axila do adversário e sobe por trás do pescoço enquanto o outro empurra sua cabeça, formando uma asa que comprime o pescoço contra o próprio braço preso."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Ura nage (proyección de arco)",en:"Ura nage (back arch throw)",val:"Ura nage (projecció d'arc)",pt:"Ura nage (projeção em arco)"}, desc:{es:"Derribo en el que se abraza el torso del rival por detrás o de frente y se arquea la espalda hacia atrás, levantándolo y lanzándolo por encima de la cabeza para que caiga de espaldas.",en:"A throw where the opponent's torso is hugged from behind or in front and the back is arched backward, lifting them and throwing them over the head so they land on their back.",val:"Derrocament en què s'abraça el tors de l'adversari per darrere o de front i s'arqueja l'esquena cap arrere, alçant-lo i llançant-lo per damunt del cap perquè caiga d'esquena.",pt:"Queda em que o tronco do adversário é abraçado por trás ou de frente e as costas são arqueadas para trás, erguendo-o e lançando-o por cima da cabeça para que caia de costas."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Hane goshi (cadera de resorte)",en:"Hane goshi (spring hip throw)",val:"Hane goshi (maluc de ressort)",pt:"Hane goshi (quadril de mola)"}, desc:{es:"Derribo de judo en el que se pega la cadera al rival y se recoge su muslo hacia arriba y atrás con la pierna propia flexionada, como un resorte —en vez de barrerlo con la pierna extendida como en el harai goshi—, proyectándolo por encima de la cadera.",en:"A judo throw where the hip is pressed against the opponent and their thigh is scooped up and back with your own bent leg, like a spring — instead of sweeping it with an extended leg as in harai goshi — throwing them over the hip.",val:"Derrocament de judo en què s'apega el maluc a l'adversari i es arreplega la seua cuixa cap amunt i cap arrere amb la pròpia cama flexionada, com un ressort —en lloc d'escombrar-la amb la cama estirada com en l'harai goshi—, projectant-lo per damunt del maluc.",pt:"Queda de judô em que o quadril é colado ao adversário e sua coxa é recolhida para cima e para trás com a própria perna flexionada, como uma mola — em vez de varrê-la com a perna estendida como no harai goshi —, projetando-o por cima do quadril."}},
  {cat:"derribos", level:"intermedio", tags:["gi"], name:{es:"Okuri ashi harai (barrido de pies)",en:"Okuri ashi harai (sliding foot sweep)",val:"Okuri ashi harai (escombrada de peus)",pt:"Okuri ashi harai (varredura de pés)"}, desc:{es:"Barrido de judo en el que se empuja el pie del rival en la dirección en que ya se desplaza, justo cuando va a apoyarlo, para juntarle los pies y hacerlo caer de lado.",en:"A judo sweep where the opponent's foot is pushed in the direction it is already moving, just as they are about to plant it, bringing their feet together and making them fall sideways.",val:"Escombrada de judo en què s'empeny el peu de l'adversari en la direcció en què ja es desplaça, just quan anava a recolzar-lo, per a ajuntar-li els peus i fer-lo caure de costat.",pt:"Varredura de judô em que o pé do adversário é empurrado na direção em que já se desloca, justo quando ele ia apoiá-lo, juntando seus pés e fazendo-o cair de lado."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Hiza guruma (rueda de rodilla)",en:"Hiza guruma (knee wheel)",val:"Hiza guruma (roda de genoll)",pt:"Hiza guruma (roda de joelho)"}, desc:{es:"Derribo de judo de rotación: el pie contra su rodilla hace de eje fijo mientras las manos dibujan un círculo amplio con manga y solapa, de modo que el rival gira sobre esa rodilla como sobre una rueda.",en:"A rotational judo throw: your foot against their knee acts as a fixed axis while your hands draw a wide circle with sleeve and lapel, so the opponent spins over that knee like a wheel.",val:"Derrocament de judo de rotació: el peu contra el seu genoll fa d'eix fix mentre les mans dibuixen un cercle ampli amb mànega i solapa, de manera que l'adversari gira sobre eixe genoll com sobre una roda.",pt:"Queda de judô de rotação: o pé contra o joelho dele faz de eixo fixo enquanto as mãos desenham um círculo amplo com manga e lapela, de modo que o adversário gira sobre esse joelho como sobre uma roda."}},
  {cat:"pases", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Apertura de guardia cerrada (guard break)",en:"Guard break",val:"Obertura de guàrdia tancada (guard break)",pt:"Abertura de guarda fechada (guard break)"}, desc:{es:"Estando dentro de la guardia cerrada del rival, se mantiene la postura erguida y se empuja hacia abajo con los codos sobre sus muslos o cadera para forzar la apertura de sus piernas y poder empezar el pase.",en:"From inside the opponent's closed guard, you keep an upright posture and drive down with the elbows into their thighs or hips to force their legs open so the pass can begin.",val:"Des de dins de la guàrdia tancada de l'adversari, es manté la postura recta i s'empeny cap avall amb els colzes sobre les seues cuixes o el seu maluc per a forçar l'obertura de les cames i poder començar la passada.",pt:"De dentro da guarda fechada do adversário, mantém-se a postura ereta e empurra-se para baixo com os cotovelos sobre suas coxas ou quadril para forçar a abertura das pernas e poder iniciar a passagem."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Crossface (control cruzado de cara)",en:"Crossface",val:"Crossface (control creuat de cara)",pt:"Crossface (controle cruzado de rosto)"}, desc:{es:"Presión con el antebrazo o el hombro sobre la mandíbula del rival, girando su cabeza hacia el lado contrario; en el control lateral le impide girarse hacia ti y abre el camino hacia la montada o un ataque de brazo.",en:"Pressure with the forearm or shoulder across the opponent's jaw, turning their head away from you; in side control it stops them from turning toward you and opens the way to mount or an arm attack.",val:"Pressió amb l'avantbraç o l'espatla sobre la mandíbula de l'adversari, girant el seu cap cap al costat contrari; en el control lateral l'impedix girar-se cap a tu i obri el camí cap a la muntada o un atac de braç.",pt:"Pressão com o antebraço ou o ombro sobre a mandíbula do adversário, virando sua cabeça para o lado oposto; no controle lateral impede que ele se vire para você e abre caminho para a montada ou um ataque de braço."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Underhook (gancho por debajo del brazo)",en:"Underhook",val:"Underhook (ganxo per baix del braç)",pt:"Underhook (gancho por baixo do braço)"}, desc:{es:"Se pasa el brazo por debajo de la axila del rival hasta llegar a su espalda, ganando control de su tronco; es una posición clave tanto de pie, para derribar, como en media guardia, para levantarse o pasar.",en:"Threading your arm under the opponent's armpit to reach their back and control their torso; a key position both standing, to take them down, and in half guard, to get up or pass.",val:"Es passa el braç per baix de l'aixella de l'adversari fins a arribar a la seua esquena, guanyant control del seu tors; és una posició clau tant dret, per a derrocar, com en mitja guàrdia, per a alçar-se o passar.",pt:"Passa-se o braço por baixo da axila do adversário até chegar às suas costas, ganhando controle do tronco; é uma posição-chave tanto em pé, para derrubar, quanto na meia guarda, para levantar ou passar."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], name:{es:"Rotura de agarres (grip break)",en:"Grip break",val:"Trencament d'agafades (grip break)",pt:"Quebra de pegadas (grip break)"}, desc:{es:"Forma de soltar un agarre del rival en muñeca, manga o solapa girando el antebrazo contra su pulgar o usando las dos manos contra una sola de las suyas, antes de que pueda usarlo para controlarte.",en:"A way of stripping the opponent's grip from your wrist, sleeve or lapel by rotating your forearm against their thumb or using both hands against one of theirs, before they can use it to control you.",val:"Manera de soltar una agafada de l'adversari en canell, mànega o solapa, girant l'avantbraç contra el seu polze o usant les dues mans contra una sola de les seues, abans que puga usar-lo per a controlar-te.",pt:"Maneira de soltar uma pegada do adversário no pulso, na manga ou na lapela, girando o antebraço contra o polegar dele ou usando as duas mãos contra uma só das dele, antes que ele possa usá-la para controlar você."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Trampa de kimura (kimura trap)",en:"Kimura trap",val:"Trampa de kimura (kimura trap)",pt:"Armadilha de kimura (kimura trap)"}, desc:{es:"Sistema de control en el que se sujeta la muñeca del rival con el agarre de kimura sin cerrar la palanca, usando ese brazo atrapado para barrer, tomar la espalda o pasar a la sumisión según cómo reaccione.",en:"A control system where you hold the opponent's wrist in the kimura grip without finishing the lock, using the trapped arm to sweep, take the back or move into the submission depending on how they react.",val:"Sistema de control en què se subjecta el canell de l'adversari amb l'agafada de kimura sense tancar la palanca, usant eixe braç atrapat per a raspar, prendre l'esquena o passar a la submissió segons com reaccione.",pt:"Sistema de controle em que se segura o pulso do adversário com a pegada de kimura sem fechar a chave, usando esse braço preso para raspar, pegar as costas ou passar à finalização conforme ele reaja."}},
  {cat:"escapes", level:"avanzado", tags:["gi","no-gi"], name:{es:"Escape de triángulo corporal (body triangle)",en:"Body triangle escape",val:"Escapada de triangle corporal (body triangle)",pt:"Fuga do triângulo corporal (body triangle)"}, desc:{es:"Con las piernas del rival cerradas en triángulo alrededor de tu torso, se protege el cuello y se trabaja para soltar el pie que cierra el triángulo, girando la cadera hacia ese lado para abrir espacio y salir por debajo.",en:"With the opponent's legs locked in a triangle around your torso, you protect the neck and work to free the foot closing the triangle, rotating the hips toward that side to create space and slide out below.",val:"Amb les cames de l'adversari tancades en triangle al voltant del teu tors, es protegix el coll i es treballa per a soltar el peu que tanca el triangle, girant el maluc cap a eixe costat per a obrir espai i eixir per baix.",pt:"Com as pernas do adversário fechadas em triângulo ao redor do seu tronco, protege-se o pescoço e trabalha-se para soltar o pé que fecha o triângulo, girando o quadril para esse lado para abrir espaço e sair por baixo."}},
  {cat:"derribos", level:"principiante", tags:["gi","no-gi"], name:{es:"Pummeling (pelea de agarres)",en:"Pummeling",val:"Pummeling (baralla d'agafades)",pt:"Pummeling (disputa de pegadas)"}, desc:{es:"Forcejeo de lucha en el que ambos intentan colar un brazo por debajo del otro para ganar el underhook, alternando agarres continuamente; es la base para dominar el cuerpo a cuerpo antes del derribo.",en:"A wrestling scramble where both fighters try to thread an arm under the other's to win the underhook, constantly swapping grips; it is the foundation for winning the clinch before a takedown.",val:"Forcejament de lluita en què ambdós intenten colar un braç per baix de l'altre per a guanyar l'underhook, alternant agafades contínuament; és la base per a dominar el cos a cos abans del derrocament.",pt:"Disputa de luta em que ambos tentam passar um braço por baixo do outro para ganhar o underhook, trocando pegadas continuamente; é a base para dominar o clinch antes da queda."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Guillotina de pie (standing guillotine)",en:"Standing guillotine",val:"Guillotina de peu (standing guillotine)",pt:"Guilhotina em pé (standing guillotine)"}, desc:{es:"Estrangulación aplicada de pie cuando el rival baja la cabeza para entrar a un derribo: se rodea su cuello con un brazo, se cierra el agarre y se tira hacia arriba mientras se retrocede o se salta a guardia para acabar el ahogo.",en:"A choke applied standing when the opponent lowers their head to shoot a takedown: you wrap their neck with one arm, lock the grip and pull upward while stepping back or jumping to guard to finish the choke.",val:"Estrangulació aplicada dret quan l'adversari abaixa el cap per a entrar a un derrocament: es rodeja el seu coll amb un braç, es tanca l'agafada i s'estira cap amunt mentre es retrocedix o es salta a guàrdia per a acabar l'ofegament.",pt:"Estrangulamento aplicado em pé quando o adversário abaixa a cabeça para entrar em uma queda: envolve-se o pescoço dele com um braço, fecha-se a pegada e puxa-se para cima enquanto se recua ou se salta para a guarda para finalizar o estrangulamento."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Lockdown (control de media guardia)",en:"Lockdown",val:"Lockdown (control de mitja guàrdia)",pt:"Lockdown (controle de meia guarda)"}, desc:{es:"Control de piernas desde media guardia en el que se entrelazan los pies en una llave de cuatro, apretando el gemelo del rival contra su propio muslo para impedirle recuperar la pierna y pasar; desde aquí se puede barrer, ir a la espalda o entrar a un ataque de pierna.",en:"A leg control from half guard where the feet interlock in a figure-four, squeezing the opponent's calf against their own thigh to stop them freeing the leg and passing; from here you can sweep, take the back or enter a leg attack.",val:"Control de cames des de mitja guàrdia en què s'entrellacen els peus en una clau de quatre, apretant el bessó de l'adversari contra la seua pròpia cuixa per a impedir-li recuperar la cama i passar; des d'ací es pot raspar, anar a l'esquena o entrar a un atac de cama.",pt:"Controle de pernas a partir da meia guarda em que os pés se entrelaçam em uma chave de quatro, apertando a panturrilha do adversário contra a própria coxa para impedi-lo de liberar a perna e passar; a partir daqui dá para raspar, pegar as costas ou entrar em um ataque de perna."}},
  {cat:"guardias", level:"avanzado", tags:["no-gi"], name:{es:"Guardia pulpo (octopus guard)",en:"Octopus guard",val:"Guàrdia pop (octopus guard)",pt:"Guarda polvo (octopus guard)"}, desc:{es:"Guardia de piernas en la que se controla el tobillo contrario del rival por debajo mientras la otra pierna se enrosca alrededor de su cadera, creando un ángulo incómodo para barrer o entrar a un ataque de pierna sin exponer la propia rodilla.",en:"A leg guard where the opponent's far ankle is controlled from underneath while the other leg wraps around their hip, creating an awkward angle to sweep or enter a leg attack without exposing your own knee.",val:"Guàrdia de cames en què es controla el turmell contrari de l'adversari per baix mentre l'altra cama s'enrosca al voltant del seu maluc, creant un angle incòmode per a raspar o entrar a un atac de cama sense exposar el propi genoll.",pt:"Guarda de pernas em que o tornozelo distante do adversário é controlado por baixo enquanto a outra perna se enrosca ao redor do quadril dele, criando um ângulo incômodo para raspar ou entrar em um ataque de perna sem expor o próprio joelho."}},
  {cat:"guardias", level:"avanzado", tags:["gi"], name:{es:"Guardia de solapa propia (mangle)",en:"Mangle (own-lapel leg guard)",val:"Guàrdia de solapa pròpia (mangle)",pt:"Guarda de lapela própria (mangle)"}, desc:{es:"Guardia moderna en la que se envuelve la propia solapa alrededor de la pierna del rival en vez de la suya, fijándola al suelo para inmovilizar esa pierna y abrir el camino a raspados y ataques de tobillo con las manos libres.",en:"A modern guard where your own lapel is wrapped around the opponent's leg instead of theirs, pinning it to the mat to immobilize that leg and open the way to sweeps and ankle attacks with both hands free.",val:"Guàrdia moderna en què s'envolta la pròpia solapa al voltant de la cama de l'adversari en lloc de la seua, fixant-la al terra per a immobilitzar eixa cama i obrir el camí a raspats i atacs de turmell amb les mans lliures.",pt:"Guarda moderna em que sua própria lapela é enrolada ao redor da perna do adversário em vez da dele, prendendo-a no chão para imobilizar essa perna e abrir caminho para raspagens e ataques de tornozelo com as duas mãos livres."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Derribo de tijera (scissor takedown)",en:"Scissor takedown",val:"Derrocament de tisora (scissor takedown)",pt:"Queda de tesoura (scissor takedown)"}, desc:{es:"Derribo de lucha en el que, agarrado al cuerpo del rival, se lanzan las piernas en forma de tijera contra las suyas mientras se gira el tronco, cortándole el apoyo y llevándolo al suelo con el propio peso del cuerpo.",en:"A wrestling takedown where, gripped around the opponent's body, the legs scissor against theirs while the torso turns, cutting their base and bringing them down with your own bodyweight.",val:"Derrocament de lluita en què, agarrat al cos de l'adversari, es llancen les cames en forma de tisora contra les seues mentre es gira el tronc, tallant-li el suport i portant-lo al terra amb el propi pes del cos.",pt:"Queda de luta em que, agarrado ao corpo do adversário, as pernas se lançam em forma de tesoura contra as dele enquanto o tronco gira, cortando sua base e levando-o ao chão com o próprio peso do corpo."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de lockdown",en:"Lockdown escape",val:"Escapada de lockdown",pt:"Fuga de lockdown"}, desc:{es:"Contra el lockdown, se empuja la rodilla libre contra la cadera del rival mientras se gira la pierna atrapada hacia dentro, buscando el ángulo exacto en el que sus pies pierden el enganche de la llave de cuatro.",en:"Against the lockdown, the free knee pushes into the opponent's hip while the trapped leg turns inward, hunting for the exact angle where their feet lose the figure-four grip.",val:"Contra el lockdown, s'empeny el genoll lliure contra el maluc de l'adversari mentre es gira la cama atrapada cap a dins, buscant l'angle exacte en què els seus peus perden l'enganxada de la clau de quatre.",pt:"Contra o lockdown, o joelho livre empurra o quadril do adversário enquanto a perna presa gira para dentro, buscando o ângulo exato em que os pés dele perdem o encaixe da chave de quatro."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Overhook (control por encima del brazo)",en:"Overhook",val:"Overhook (control per damunt del braç)",pt:"Overhook (controle por cima do braço)"}, desc:{es:"Se pasa el brazo por encima del brazo o el hombro del rival, en vez de por debajo como en el underhook; es la base de controles como el whizzer y de ciertos derribos y pases que buscan aplastar ese brazo contra su cuerpo.",en:"The arm is passed over the opponent's arm or shoulder, instead of underneath as in the underhook; it is the base of controls like the whizzer and of certain takedowns and passes that look to pin that arm against their body.",val:"Es passa el braç per damunt del braç o l'espatla de l'adversari, en lloc de per baix com en l'underhook; és la base de controls com el whizzer i de certs derrocaments i passades que busquen aixafar eixe braç contra el seu cos.",pt:"Passa-se o braço por cima do braço ou do ombro do adversário, em vez de por baixo como no underhook; é a base de controles como o whizzer e de certas quedas e passagens que buscam prensar esse braço contra o corpo dele."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Collar drag",en:"Collar drag",val:"Collar drag",pt:"Collar drag"}, desc:{es:"Técnica de lucha en la que se agarra la nuca o la solapa trasera del rival y se tira con fuerza hacia el lado contrario al que empuja, rompiendo su equilibrio hacia delante para pasar a su espalda o completar un derribo.",en:"A wrestling technique where the opponent's nape or back collar is gripped and pulled hard toward the opposite side of their push, breaking their balance forward to get to their back or complete a takedown.",val:"Tècnica de lluita en què s'agafa la nuca o la solapa posterior de l'adversari i es tira amb força cap al costat contrari al que empeny, trencant el seu equilibri cap avant per a passar a la seua esquena o completar un derrocament.",pt:"Técnica de luta em que se agarra a nuca ou a lapela traseira do adversário e puxa-se com força para o lado contrário ao que ele empurra, quebrando seu equilíbrio para frente para passar às costas dele ou completar uma queda."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Telaraña (spiderweb control)",en:"Spiderweb control",val:"Teranyina (spiderweb control)",pt:"Teia de aranha (spiderweb control)"}, desc:{es:"Control de pierna moderno en el que el tobillo del rival queda envuelto entre las propias piernas mientras las manos controlan su brazo contrario, inmovilizando su tronco para atacar con calma la pierna libre.",en:"A modern leg control where the opponent's ankle is wrapped between your own legs while the hands control their opposite arm, immobilizing their torso to calmly attack the free leg.",val:"Control de cama modern en què el turmell de l'adversari queda embolicat entre les pròpies cames mentre les mans controlen el seu braç contrari, immobilitzant el seu tronc per a atacar amb calma la cama lliure.",pt:"Controle de perna moderno em que o tornozelo do adversário fica envolvido entre as próprias pernas enquanto as mãos controlam o braço oposto dele, imobilizando o tronco para atacar com calma a perna livre."}},
