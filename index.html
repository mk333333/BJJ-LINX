  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Ala de pollo doble (double chicken wing)",en:"Double chicken wing",val:"Ala de pollastre doble (double chicken wing)",pt:"Asa de frango dupla (double chicken wing)"}, desc:{es:"Los dos brazos del rival quedan doblados y atrapados por detrás de su espalda con los brazos propios, lo que lo inmoviliza casi por completo y permite pasar a controles o sumisiones sin que pueda defenderse con las manos.",en:"Both of the opponent's arms are bent and trapped behind their back with your own arms, immobilizing them almost completely and allowing a move to controls or submissions without them defending with their hands.",val:"Els dos braços de l'adversari queden doblegats i atrapats per darrere de la seua esquena amb els braços propis, cosa que l'immobilitza quasi per complet i permet passar a controls o submissions sense que puga defendre's amb les mans.",pt:"Os dois braços do adversário ficam dobrados e presos atrás das costas com os seus próprios braços, o que o imobiliza quase por completo e permite passar a controles ou finalizações sem que ele possa se defender com as mãos."}},
  {cat:"sumisiones", level:"intermedio", tags:["no-gi"], name:{es:"Abrelatas (can opener)",en:"Can opener",val:"Obrelletes (can opener)",pt:"Abridor de latas (can opener)"}, desc:{es:"Desde dentro de la guardia cerrada, se entrelazan las manos tras la nuca del rival y se tira de su cabeza hacia el pecho para forzar la apertura de sus piernas; es una torsión de cuello prohibida en la mayoría de reglamentos.",en:"From inside the closed guard, the hands lock behind the opponent's neck and pull their head toward the chest to force their legs open; it is a neck crank banned in most rulesets.",val:"Des de dins de la guàrdia tancada, s'entrellacen les mans darrere de la nuca de l'adversari i es tira del seu cap cap al pit per a forçar l'obertura de les seues cames; és una torsió de coll prohibida en la majoria de reglaments.",pt:"De dentro da guarda fechada, as mãos se entrelaçam atrás da nuca do adversário e puxa-se a cabeça dele em direção ao peito para forçar a abertura das pernas; é uma torção de pescoço proibida na maioria dos regulamentos."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Control de misión (mission control)",en:"Mission control",val:"Control de missió (mission control)",pt:"Controle de missão (mission control)"}, desc:{es:"Posición clave de la guardia de goma: el brazo del rival queda atrapado contra tu pierna, que cruza sobre su espalda, mientras la otra mano controla su muñeca, abriendo la vía a la omoplata o al triángulo.",en:"A key position of the rubber guard: the opponent's arm is trapped against your leg, which crosses over their back, while the other hand controls their wrist, opening the way to the omoplata or the triangle.",val:"Posició clau de la guàrdia de goma: el braç de l'adversari queda atrapat contra la teua cama, que creua per damunt de la seua esquena, mentre l'altra mà controla el seu canell, obrint la via a l'omoplata o al triangle.",pt:"Posição-chave da guarda de borracha: o braço do adversário fica preso contra a sua perna, que cruza sobre as costas dele, enquanto a outra mão controla o pulso, abrindo caminho para a omoplata ou o triângulo."}},
  {cat:"control", level:"principiante", tags:["no-gi"], name:{es:"Cintura apretada (tight waist)",en:"Tight waist",val:"Cintura apretada (tight waist)",pt:"Cintura apertada (tight waist)"}, desc:{es:"Control desde arriba sobre un rival en tortuga: un brazo rodea su cintura apretando el tronco contra tu pecho mientras el otro controla su brazo; impide que se siente o se escape y prepara la rotación hacia la espalda.",en:"A top control over an opponent in turtle: one arm wraps their waist, squeezing the trunk against your chest while the other controls their arm; it stops them from sitting out or escaping and sets up the turn to the back.",val:"Control des de dalt sobre un adversari en tortuga: un braç rodeja la seua cintura apretant el tronc contra el teu pit mentre l'altre controla el seu braç; impedix que s'assegue o escape i prepara la rotació cap a l'esquena.",pt:"Controle por cima sobre um adversário na tartaruga: um braço envolve a cintura dele apertando o tronco contra o seu peito enquanto o outro controla o braço; impede que ele sente ou escape e prepara a rotação para as costas."}},
  {cat:"control", level:"principiante", tags:["no-gi"], name:{es:"Control de muñeca (wrist ride)",en:"Wrist ride",val:"Control de canell (wrist ride)",pt:"Controle de pulso (wrist ride)"}, desc:{es:"Desde arriba sobre un rival en tortuga, se agarra su muñeca y se tira de ella hacia atrás o a un lado, anulando ese brazo como apoyo y manteniéndolo desequilibrado para seguir controlando o girar.",en:"From the top over an opponent in turtle, their wrist is grabbed and pulled back or to the side, removing that arm as a base and keeping them off balance to keep controlling or turn them.",val:"Des de dalt sobre un adversari en tortuga, s'agafa el seu canell i es tira d'ell cap arrere o cap a un costat, anul·lant eixe braç com a suport i mantenint-lo desequilibrat per a continuar controlant o girar.",pt:"Por cima de um adversário na tartaruga, agarra-se o pulso dele e puxa-se para trás ou para o lado, anulando esse braço como apoio e mantendo-o desequilibrado para seguir controlando ou girar."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de saddle",en:"Saddle escape",val:"Escapada de saddle",pt:"Fuga de saddle"}, desc:{es:"Contra el saddle, se evita que el rival cierre el ajuste de caderas girando hacia el lado de la pierna atrapada y liberando el talón antes de que quede cerrado bajo su axila; se prioriza proteger la rodilla antes que ganar posición.",en:"Against the saddle, you stop the opponent from closing the hip fit by turning toward the trapped-leg side and freeing the heel before it gets locked under their armpit; protecting the knee takes priority over gaining position.",val:"Contra el saddle, s'evita que l'adversari tanque l'ajust de malucs girant cap al costat de la cama atrapada i alliberant el taló abans que quede tancat baix la seua aixella; es prioritza protegir el genoll abans que guanyar posició.",pt:"Contra o saddle, evita-se que o adversário feche o encaixe dos quadris girando para o lado da perna presa e liberando o calcanhar antes que fique travado sob a axila dele; prioriza-se proteger o joelho antes de ganhar posição."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de twister",en:"Twister escape",val:"Escapada de twister",pt:"Fuga de twister"}, desc:{es:"Contra el twister, se protege el cuello llevando la barbilla al pecho y se gira el tronco hacia el lado de la presión para aliviar la torsión de la columna, rodando hacia fuera antes de que se cierre la hélice de piernas y brazos.",en:"Against the twister, the neck is protected by tucking the chin to the chest and the trunk turns toward the pressure side to relieve the spinal twist, rolling out before the helix of legs and arms closes.",val:"Contra el twister, es protegix el coll portant la barbeta al pit i es gira el tronc cap al costat de la pressió per a alleujar la torsió de la columna, rodolant cap a fora abans que es tanque l'hèlix de cames i braços.",pt:"Contra o twister, protege-se o pescoço levando o queixo ao peito e gira-se o tronco para o lado da pressão para aliviar a torção da coluna, rolando para fora antes que a hélice de pernas e braços se feche."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de clock choke",en:"Clock choke escape",val:"Escapada de clock choke",pt:"Fuga de clock choke"}, desc:{es:"Contra el clock choke, se mantiene la barbilla baja y se agarra el brazo que sujeta el cuello o la solapa, girando hacia el lado del agarre para aliviar la presión y sacar la cabeza antes de que el rival cierre el círculo.",en:"Against the clock choke, the chin stays down and the arm gripping the neck or lapel is grabbed, turning toward the grip side to relieve the pressure and pull the head out before the opponent closes the circle.",val:"Contra el clock choke, es manté la barbeta baixa i s'agafa el braç que subjecta el coll o la solapa, girant cap al costat de l'agafada per a alleujar la pressió i traure el cap abans que l'adversari tanque el cercle.",pt:"Contra o clock choke, mantém-se o queixo baixo e agarra-se o braço que segura o pescoço ou a lapela, girando para o lado da pegada para aliviar a pressão e tirar a cabeça antes que o adversário feche o círculo."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape de truck",en:"Truck escape",val:"Escapada de truck",pt:"Fuga de truck"}, desc:{es:"Contra el truck, se evita que el rival cruce del todo la pierna sobre la tuya girando hacia el lado de la pierna bloqueada para recuperar la cadera y salir de la posición antes de que se cierre un twister o un calf slicer.",en:"Against the truck, you stop the opponent from fully crossing their leg over yours by turning toward the blocked-leg side to recover the hips and leave the position before a twister or a calf slicer closes.",val:"Contra el truck, s'evita que l'adversari creue del tot la cama sobre la teua girant cap al costat de la cama bloquejada per a recuperar el maluc i eixir de la posició abans que es tanque un twister o un calf slicer.",pt:"Contra o truck, evita-se que o adversário cruze por completo a perna sobre a sua girando para o lado da perna bloqueada para recuperar o quadril e sair da posição antes que um twister ou um calf slicer se feche."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Throw-by (paso por el brazo)",en:"Throw-by",val:"Throw-by (pas pel braç)",pt:"Throw-by (passada pelo braço)"}, desc:{es:"Con el brazo del rival agarrado por la muñeca o el codo, se lanza ese brazo hacia un lado y se pasa por delante hasta su costado o su espalda, aprovechando el desequilibrio que provoca.",en:"With the opponent's arm held by the wrist or elbow, that arm is thrown to one side and you step past in front of it to their side or back, taking advantage of the off-balance it causes.",val:"Amb el braç de l'adversari agafat pel canell o el colze, es llança eixe braç cap a un costat i es passa per davant fins al seu costat o la seua esquena, aprofitant el desequilibri que provoca.",pt:"Com o braço do adversário seguro pelo pulso ou cotovelo, esse braço é lançado para um lado e passa-se pela frente até o lado ou as costas dele, aproveitando o desequilíbrio que isso causa."}},
  {cat:"derribos", level:"avanzado", tags:["no-gi"], name:{es:"Giro de brazo (arm spin)",en:"Arm spin",val:"Gir de braç (arm spin)",pt:"Giro de braço (arm spin)"}, desc:{es:"Desde un agarre de brazo y cuello, se gira por debajo del brazo del rival y se tira de él en un movimiento circular que lo proyecta por encima de la cadera o lo lleva a su espalda.",en:"From an arm-and-neck grip, you spin underneath the opponent's arm and pull them in a circular motion that throws them over the hip or takes you to their back.",val:"Des d'una agafada de braç i coll, es gira per baix del braç de l'adversari i es tira d'ell en un moviment circular que el projecta per damunt del maluc o el porta a la seua esquena.",pt:"A partir de uma pegada de braço e pescoço, gira-se por baixo do braço do adversário e puxa-se num movimento circular que o projeta por cima do quadril ou leva você às costas dele."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase flotante (float pass)",en:"Float pass",val:"Passada flotant (float pass)",pt:"Passagem flutuante (float pass)"}, desc:{es:"Se controlan las rodillas o los tobillos del rival y se avanza flotando sobre sus piernas sin apoyar el peso, cambiando de lado con rapidez antes de que pueda cerrar la guardia.",en:"The opponent's knees or ankles are controlled and you advance floating over their legs without putting weight on them, changing sides quickly before they can close the guard.",val:"Es controlen els genolls o els turmells de l'adversari i s'avança flotant damunt de les seues cames sense recolzar el pes, canviant de costat amb rapidesa abans que puga tancar la guàrdia.",pt:"Controlam-se os joelhos ou tornozelos do adversário e avança-se flutuando sobre as pernas dele sem apoiar o peso, trocando de lado rapidamente antes que ele consiga fechar a guarda."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado limpiaparabrisas (windshield wiper sweep)",en:"Windshield wiper sweep",val:"Raspat eixugaparabrisa (windshield wiper sweep)",pt:"Raspagem limpador de para-brisa (windshield wiper sweep)"}, desc:{es:"Desde la guardia abierta con control del tobillo, el pie libre se mueve en arco como un limpiaparabrisas para barrer la pierna de base del rival y derribarlo hacia ese lado.",en:"From open guard with ankle control, the free foot moves in an arc like a windshield wiper to sweep the opponent's base leg and take them down to that side.",val:"Des de la guàrdia oberta amb control del turmell, el peu lliure es mou en arc com un eixugaparabrisa per a raspar la cama de base de l'adversari i derrocar-lo cap a eixe costat.",pt:"A partir da guarda aberta com controle do tornozelo, o pé livre se move em arco como um limpador de para-brisa para raspar a perna de base do adversário e derrubá-lo para esse lado."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Tawara gaeshi (saco de arroz)",en:"Tawara gaeshi",val:"Tawara gaeshi (sac d'arròs)",pt:"Tawara gaeshi (saco de arroz)"}, desc:{es:"Derribo de sacrificio en el que se abraza al rival por la cintura, se deja caer hacia atrás y se le lanza por encima, como un saco de arroz; exige asegurar bien el control de su cintura antes de caer.",en:"A sacrifice throw where the opponent is hugged around the waist, you fall backward and throw them over you like a sack of rice; it requires securing the waist control well before falling.",val:"Derrocament de sacrifici en què s'abraça l'adversari per la cintura, es deixa caure cap arrere i se'l llança per damunt, com un sac d'arròs; exigeix assegurar bé el control de la seua cintura abans de caure.",pt:"Queda de sacrifício em que se abraça o adversário pela cintura, deixa-se cair para trás e lança-se ele por cima, como um saco de arroz; exige garantir bem o controle da cintura dele antes de cair."}},
  {cat:"control", level:"principiante", tags:["no-gi"], name:{es:"Brazo de palanca (bar arm)",en:"Bar arm",val:"Braç de palanca (bar arm)",pt:"Braço de alavanca (bar arm)"}, desc:{es:"Desde arriba sobre un rival en tortuga o de costado, se pasa el brazo bajo su codo y se levanta, aprovechando la palanca de su propio brazo para girarlo hacia la espalda.",en:"From the top over an opponent in turtle or on their side, the arm passes under their elbow and lifts, using the leverage of their own arm to turn them toward their back.",val:"Des de dalt sobre un adversari en tortuga o de costat, es passa el braç per baix del seu colze i s'alça, aprofitant la palanca del seu propi braç per a girar-lo cap a l'esquena.",pt:"Por cima de um adversário na tartaruga ou de lado, passa-se o braço por baixo do cotovelo dele e levanta-se, aproveitando a alavanca do próprio braço dele para girá-lo em direção às costas."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Control en espiral (spiral ride)",en:"Spiral ride",val:"Control en espiral (spiral ride)",pt:"Controle em espiral (spiral ride)"}, desc:{es:"Control desde arriba contra un rival en tortuga, enroscando una pierna en espiral alrededor de su cadera para impedir que se levante o gire, mientras los brazos controlan su tronco.",en:"A top control against an opponent in turtle, coiling one leg in a spiral around their hip to stop them from standing or turning, while the arms control their trunk.",val:"Control des de dalt contra un adversari en tortuga, enroscant una cama en espiral al voltant del seu maluc per a impedir que s'alce o gire, mentre els braços controlen el seu tronc.",pt:"Controle por cima contra um adversário na tartaruga, enroscando uma perna em espiral ao redor do quadril dele para impedir que se levante ou gire, enquanto os braços controlam o tronco."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Uki waza (técnica flotante)",en:"Uki waza",val:"Uki waza (tècnica flotant)",pt:"Uki waza (técnica flutuante)"}, desc:{es:"Derribo de sacrificio lateral del judo: se tira del rival hacia delante y se cae de costado apoyando el pie contra su pierna, de modo que su cuerpo flota y cae por encima de la línea de tu caída.",en:"A judo side-sacrifice throw: the opponent is pulled forward and you fall sideways with the foot planted against their leg, so their body floats and lands across the line of your fall.",val:"Derrocament de sacrifici lateral del judo: es tira de l'adversari cap avant i es cau de costat recolzant el peu contra la seua cama, de manera que el seu cos flota i cau per damunt de la línia de la teua caiguda.",pt:"Queda de sacrifício lateral do judô: puxa-se o adversário para frente e cai-se de lado apoiando o pé contra a perna dele, de modo que o corpo dele flutua e cai por cima da linha da sua queda."}},
  {cat:"derribos", level:"intermedio", tags:["gi"], name:{es:"Tsuri goshi (cadera de elevación)",en:"Tsuri goshi",val:"Tsuri goshi (maluc d'elevació)",pt:"Tsuri goshi (quadril de elevação)"}, desc:{es:"Derribo de cadera del judo en el que se agarra el cinturón del rival y se levanta su cuerpo sobre la cadera con un movimiento hacia arriba antes de girar para proyectarlo; exige fuerza de tren inferior.",en:"A judo hip throw where the opponent's belt is gripped and their body is lifted onto the hip with an upward motion before turning to throw them; it requires lower-body strength.",val:"Derrocament de maluc del judo en què s'agafa el cinturó de l'adversari i s'alça el seu cos sobre el maluc amb un moviment cap amunt abans de girar per a projectar-lo; exigeix força de tren inferior.",pt:"Queda de quadril do judô em que se agarra o cinturão do adversário e levanta-se o corpo dele sobre o quadril com um movimento para cima antes de girar para projetá-lo; exige força de membros inferiores."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Puente (bridge)",en:"Bridge",val:"Pont (bridge)",pt:"Ponte (bridge)"}, desc:{es:"Movimiento fundamental en el que se eleva la cadera apoyando pies y hombros para desplazar el peso del rival y crear espacio; es la base de escapes como el upa y de muchos raspados.",en:"A fundamental movement where the hips lift off the mat on the feet and shoulders to shift the opponent's weight and create space; it is the base of escapes like the upa and of many sweeps.",val:"Moviment fonamental en què s'eleva el maluc recolzant peus i espatlles per a desplaçar el pes de l'adversari i crear espai; és la base d'escapades com la upa i de molts raspats.",pt:"Movimento fundamental em que o quadril se eleva apoiado nos pés e nos ombros para deslocar o peso do adversário e criar espaço; é a base de fugas como a upa e de muitas raspagens."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], name:{es:"Voltereta hacia atrás (backward roll)",en:"Backward roll",val:"Voltereta cap arrere (backward roll)",pt:"Rolamento para trás (backward roll)"}, desc:{es:"Se lleva la barbilla al pecho y se rueda hacia atrás pasando por un hombro, lanzando las piernas por encima de la cabeza; sirve para soltarse cuando un rival te empuja de espaldas y recuperar la guardia o ponerse de pie.",en:"With the chin tucked, you roll backward over one shoulder, kicking the legs over the head; it helps break free when an opponent drives you onto your back, recovering guard or getting to your feet.",val:"Es porta la barbeta al pit i es rodola cap arrere passant per una espatla, llançant les cames per damunt del cap; serveix per a soltar-se quan un adversari t'empeny d'esquena i recuperar la guàrdia o posar-se dret.",pt:"Leva-se o queixo ao peito e rola-se para trás passando por um ombro, lançando as pernas por cima da cabeça; serve para se soltar quando um adversário te empurra de costas e recuperar a guarda ou ficar de pé."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], name:{es:"Voltereta hacia delante (forward roll)",en:"Forward roll",val:"Voltereta cap avant (forward roll)",pt:"Rolamento para frente (forward roll)"}, desc:{es:"Se mete un hombro, se pega la cabeza a un lado y se rueda hacia delante en diagonal sobre la espalda, saliendo del pase del rival o de un barrido; además de escapar, enseña a cuidar el cuello al caer.",en:"A shoulder goes in, the head tucks to the side and you roll forward diagonally across the back, leaving a guard pass or a sweep; besides escaping, it teaches how to protect the neck when landing.",val:"Es fica una espatla, s'apega el cap a un costat i es rodola cap avant en diagonal sobre l'esquena, eixint de la passada de l'adversari o d'un raspat; a més d'escapar, ensenya a cuidar el coll en caure.",pt:"Entra-se com um ombro, cola-se a cabeça para o lado e rola-se para frente na diagonal sobre as costas, saindo da passagem do adversário ou de uma raspagem; além de escapar, ensina a proteger o pescoço ao cair."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Rotura de postura (posture break)",en:"Posture break",val:"Trencament de postura (posture break)",pt:"Quebra de postura (posture break)"}, desc:{es:"Desde la guardia cerrada, se tira de la cabeza, el cuello o las mangas del rival hacia abajo y se sujeta con las piernas, rompiendo su postura erguida para impedir que ataque y preparar triángulos o armbars.",en:"From closed guard, the opponent's head, neck or sleeves are pulled down and held with the legs, breaking their upright posture to stop them attacking and set up triangles or armbars.",val:"Des de la guàrdia tancada, es tira del cap, el coll o les mànegues de l'adversari cap avall i es subjecta amb les cames, trencant la seua postura erecta per a impedir que ataque i preparar triangles o armbars.",pt:"Da guarda fechada, puxa-se a cabeça, o pescoço ou as mangas do adversário para baixo e segura-se com as pernas, quebrando a postura ereta dele para impedir que ataque e preparar triângulos ou armbars."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Marcos defensivos (frames)",en:"Frames",val:"Marcs defensius (frames)",pt:"Quadros defensivos (frames)"}, desc:{es:"Se colocan antebrazos y manos como una estructura rígida contra el pecho, la cadera o el cuello del rival para mantener distancia y evitar que su peso avance, ganando tiempo para escapar o recuperar guardia.",en:"Forearms and hands are placed as a rigid structure against the opponent's chest, hip or neck to keep distance and stop their weight from advancing, buying time to escape or recover guard.",val:"Es col·loquen avantbraços i mans com una estructura rígida contra el pit, el maluc o el coll de l'adversari per a mantindre distància i evitar que el seu pes avance, guanyant temps per a escapar o recuperar guàrdia.",pt:"Antebraços e mãos são colocados como uma estrutura rígida contra o peito, o quadril ou o pescoço do adversário para manter distância e impedir que o peso dele avance, ganhando tempo para escapar ou recuperar a guarda."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Collar tie (agarre de nuca)",en:"Collar tie",val:"Collar tie (agafada de nuca)",pt:"Collar tie (pegada de nuca)"}, desc:{es:"Una mano rodea la nuca del rival mientras la otra controla su brazo, tirando de su cabeza hacia abajo para romper su postura y preparar derribos o snap downs; es la base del clinch de pie.",en:"One hand wraps the back of the opponent's neck while the other controls their arm, pulling their head down to break their posture and set up takedowns or snap downs; it is the base of the standing clinch.",val:"Una mà rodeja la nuca de l'adversari mentre l'altra controla el seu braç, tirant del seu cap cap avall per a trencar la seua postura i preparar derrocaments o snap downs; és la base del clinch dret.",pt:"Uma mão envolve a nuca do adversário enquanto a outra controla o braço, puxando a cabeça dele para baixo para quebrar a postura e preparar quedas ou snap downs; é a base do clinch em pé."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Inside tie (agarre interior)",en:"Inside tie",val:"Inside tie (agafada interior)",pt:"Inside tie (pegada interna)"}, desc:{es:"Ambas manos se colocan por dentro de los brazos del rival, sobre sus bíceps o su pecho, para controlar su movimiento, empujar su cuerpo y ganar la posición de underhook en el clinch.",en:"Both hands are placed inside the opponent's arms, on their biceps or chest, to control their movement, push their body and win the underhook position in the clinch.",val:"Ambdues mans es col·loquen per dins dels braços de l'adversari, sobre els seus bíceps o el seu pit, per a controlar el seu moviment, empényer el seu cos i guanyar la posició d'underhook en el clinch.",pt:"As duas mãos são colocadas por dentro dos braços do adversário, sobre os bíceps ou o peito, para controlar o movimento dele, empurrar o corpo e ganhar a posição de underhook no clinch."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Clinch",en:"Clinch",val:"Clinch",pt:"Clinch"}, desc:{es:"Posición de contacto cercano de pie en la que ambos luchadores se sujetan con collar ties, underhooks o agarres de cuerpo, buscando derribar, controlar o pasar a la espalda sin separarse.",en:"A close standing contact position where both fighters hold each other with collar ties, underhooks or body grips, looking to take down, control or get to the back without separating.",val:"Posició de contacte proper dret en què ambdós lluitadors se subjecten amb collar ties, underhooks o agafades de cos, buscant derrocar, controlar o passar a l'esquena sense separar-se.",pt:"Posição de contato próximo em pé em que os dois lutadores se seguram com collar ties, underhooks ou pegadas de corpo, buscando derrubar, controlar ou passar às costas sem se separar."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Derribo de cabeza y brazo (head-and-arm throw)",en:"Head-and-arm throw",val:"Derrocament de cap i braç (head-and-arm throw)",pt:"Queda de cabeça e braço (head-and-arm throw)"}, desc:{es:"Se atrapa la cabeza y un brazo del rival con un mismo abrazo y se proyecta girando la cadera, de modo que cae de espaldas sobre su propio brazo atrapado.",en:"The opponent's head and one arm are caught in the same hug and thrown by turning the hips, so they land on their back over their own trapped arm.",val:"S'atrapen el cap i un braç de l'adversari amb la mateixa abraçada i es projecta girant el maluc, de manera que cau d'esquena sobre el seu propi braç atrapat.",pt:"A cabeça e um braço do adversário são presos no mesmo abraço e projetados girando o quadril, de modo que ele cai de costas sobre o próprio braço preso."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Body fold (plegado de cuerpo)",en:"Body fold",val:"Body fold (plegat de cos)",pt:"Body fold (dobra de corpo)"}, desc:{es:"Desde detrás, se rodea la cintura del rival y se tira hacia atrás doblándolo por la cintura, haciéndolo caer sentado o de espaldas sobre las propias piernas.",en:"From behind, the opponent's waist is wrapped and pulled backward, folding them at the waist so they fall sitting or onto their back over your legs.",val:"Des de darrere, es rodeja la cintura de l'adversari i es tira cap arrere doblegant-lo per la cintura, fent-lo caure assegut o d'esquena sobre les pròpies cames.",pt:"Por trás, a cintura do adversário é envolvida e puxada para trás dobrando-o na cintura, fazendo-o cair sentado ou de costas sobre as suas pernas."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Armbar desde la espalda (back armbar)",en:"Back armbar",val:"Armbar des de l'esquena (back armbar)",pt:"Armbar das costas (back armbar)"}, desc:{es:"Desde el control de espalda, se atrapa un brazo del rival, se gira sobre su hombro y se cruzan las piernas sobre su cabeza y su pecho para aplicar la palanca de codo sin soltar el control.",en:"From back control, one of the opponent's arms is trapped, you turn over their shoulder and cross the legs over their head and chest to apply the elbow lever without releasing control.",val:"Des del control d'esquena, s'atrapa un braç de l'adversari, es gira sobre la seua espatla i es creuen les cames sobre el seu cap i el seu pit per a aplicar la palanca de colze sense soltar el control.",pt:"A partir do controle das costas, prende-se um braço do adversário, gira-se sobre o ombro dele e cruzam-se as pernas sobre a cabeça e o peito para aplicar a alavanca de cotovelo sem soltar o controle."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guillotina desde montada (mounted guillotine)",en:"Mounted guillotine",val:"Guillotina des de muntada (mounted guillotine)",pt:"Guilhotina da montada (mounted guillotine)"}, desc:{es:"Con el rival intentando incorporarse bajo la montada, se rodea su cuello con un brazo y se tira hacia arriba mientras se sienta el peso, cerrando la guillotina sin soltar la posición.",en:"With the opponent trying to sit up under the mount, their neck is wrapped with one arm and pulled upward while the weight settles, closing the guillotine without giving up the position.",val:"Amb l'adversari intentant incorporar-se davall de la muntada, es rodeja el seu coll amb un braç i es tira cap amunt mentre s'assenta el pes, tancant la guillotina sense soltar la posició.",pt:"Com o adversário tentando se sentar sob a montada, o pescoço dele é envolvido com um braço e puxado para cima enquanto o peso assenta, fechando a guilhotina sem abrir mão da posição."}}
];

  {cls:"morado", nextEstHours:225, name:{es:"Morado",en:"Purple",val:"Morat",pt:"Roxa"}, time:{es:"Aprox. 2-4 años de azul",en:"Approx. 2-4 years from blue",val:"Aprox. 2-4 anys des de blau",pt:"Aprox. 2-4 anos de azul"}, desc:{es:"Empieza a formarse un juego propio (estilo). Mayor profundidad táctica y capacidad de encadenar técnicas.",en:"A personal game (style) starts to take shape. Greater tactical depth and ability to chain techniques together.",val:"Comença a formar-se un joc propi (estil). Major profunditat tàctica i capacitat d'encadenar tècniques.",pt:"Começa a se formar um jogo próprio (estilo). Maior profundidade tática e capacidade de encadear técnicas."}, perStripe:{es:"Cada franja: 4-8 meses de media",en:"Each stripe: 4-8 months on average",val:"Cada franja: 4-8 mesos de mitjana",pt:"Cada grau: 4-8 meses em média"}, rights:{es:"🔓 Edad mínima IBJJF: 16 años (mínimo oficial 1,5 años en adulto, 2 años en juvenil). Empiezas a poder ayudar activamente a compañeros de nivel inferior.",en:"🔓 IBJJF minimum age: 16 (official minimum 1.5 years as adult, 2 years as juvenile). You can start actively helping lower-level training partners.",val:"🔓 Edat mínima IBJJF: 16 anys (mínim oficial 1,5 anys en adult, 2 anys en juvenil). Comences a poder ajudar activament companys de nivell inferior.",pt:"🔓 Idade mínima IBJJF: 16 anos (mínimo oficial 1,5 anos como adulto, 2 anos como juvenil). Você começa a poder ajudar ativamente companheiros de nível inferior."}},
  {cls:"marron", nextEstHours:225, name:{es:"Marrón",en:"Brown",val:"Marró",pt:"Marrom"}, time:{es:"Aprox. 1-2 años de morado",en:"Approx. 1-2 years from purple",val:"Aprox. 1-2 anys des de morat",pt:"Aprox. 1-2 anos de roxa"}, desc:{es:"Refinamiento técnico y de detalle. Suele ser la etapa previa a empezar a ayudar en la enseñanza.",en:"Technical and detail refinement. Usually the stage just before starting to help with teaching.",val:"Refinament tècnic i de detall. Sol ser l'etapa prèvia a començar a ajudar en l'ensenyament.",pt:"Refinamento técnico e de detalhe. Costuma ser a etapa anterior a começar a ajudar no ensino."}, perStripe:{es:"Cada franja: 3-6 meses de media",en:"Each stripe: 3-6 months on average",val:"Cada franja: 3-6 mesos de mitjana",pt:"Cada grau: 3-6 meses em média"}, rights:{es:"🔓 Edad mínima IBJJF: 18 años (mínimo oficial 1 año desde morado). Se te considera una autoridad en la academia; puedes empezar a impartir clases con supervisión.",en:"🔓 IBJJF minimum age: 18 (official minimum 1 year from purple). You're seen as an authority in the academy and can start teaching classes under supervision.",val:"🔓 Edat mínima IBJJF: 18 anys (mínim oficial 1 any des de morat). Se't considera una autoritat en l'acadèmia; pots começar a impartir classes en supervisió.",pt:"🔓 Idade mínima IBJJF: 18 anos (mínimo oficial 1 ano desde a roxa). Você é visto como uma autoridade na academia; pode começar a dar aulas sob supervisão."}},
  {cls:"negro", name:{es:"Negro",en:"Black",val:"Negre",pt:"Preta"}, time:{es:"Mínimo ~10 años desde blanco",en:"Minimum ~10 years from white",val:"Mínim ~10 anys des de blanc",pt:"Mínimo ~10 anos desde a branca"}, desc:{es:"Dominio consolidado de los fundamentos y capacidad de enseñar. Los grados posteriores (dan) se marcan con la barra roja del cinturón.",en:"Consolidated mastery of the fundamentals and ability to teach. Later degrees (dan) are marked with the belt's red bar.",val:"Domini consolidat dels fonaments i capacitat d'ensenyar. Els graus posteriors (dan) es marquen en la barra roja del cinturó.",pt:"Domínio consolidado dos fundamentos e capacidade de ensinar. Os graus posteriores (dan) são marcados com a barra vermelha da faixa."}, perStripe:{es:"Cada grado (Dan) se marca con una franja en la barra roja:\n1º Dan: 3 años con el cinturón negro\n2º Dan: 3 años después del 1º\n3º Dan: 3 años después del 2º\n4º Dan: 5 años después del 3º\n5º Dan: 5 años después del 4º\n6º Dan: 5 años después del 5º\nDel 7º al 10º Dan: ver el cinturón Rojo",en:"Each degree (Dan) is marked with a stripe on the red bar:\n1st Dan: 3 years as a black belt\n2nd Dan: 3 years after the 1st\n3rd Dan: 3 years after the 2nd\n4th Dan: 5 years after the 3rd\n5th Dan: 5 years after the 4th\n6th Dan: 5 years after the 5th\n7th to 10th Dan: see the Red belt",val:"Cada grau (Dan) es marca amb una franja a la barra roja:\n1r Dan: 3 anys amb el cinturó negre\n2n Dan: 3 anys després de l'1r\n3r Dan: 3 anys després del 2n\n4t Dan: 5 anys després del 3r\n5é Dan: 5 anys després del 4t\n6é Dan: 5 anys després del 5é\nDel 7é al 10é Dan: vegeu el cinturó Roig",pt:"Cada grau (Dan) é marcado com uma listra na barra vermelha:\n1º Dan: 3 anos como faixa preta\n2º Dan: 3 anos depois do 1º\n3º Dan: 3 anos depois do 2º\n4º Dan: 5 anos depois do 3º\n5º Dan: 5 anos depois do 4º\n6º Dan: 5 anos depois do 5º\nDo 7º ao 10º Dan: veja a faixa vermelha"}, rights:{es:"🔓 Edad mínima IBJJF: 19 años (8-12 años desde blanco en la práctica). Puedes enseñar de forma independiente, abrir tu propia academia y otorgar cinturones y grados a tus alumnos.",en:"🔓 IBJJF minimum age: 19 (8-12 years from white in practice). You can teach independently, open your own academy and award belts and stripes to your students.",val:"🔓 Edat mínima IBJJF: 19 anys (8-12 anys des de blanc en la pràctica). Pots ensenyar de forma independent, obrir la teua pròpia acadèmia i otorgar cinturons i graus als teus alumnes.",pt:"🔓 Idade mínima IBJJF: 19 anos (8-12 anos desde a branca na prática). Você pode ensinar de forma independente, abrir sua própria academia e conceder faixas e graus aos seus alunos."}},
  {cls:"rojo", name:{es:"Rojo",en:"Red",val:"Roig",pt:"Vermelha"}, time:{es:"Grado honorífico, décadas desde negro",en:"Honorary rank, decades from black",val:"Grau honorífic, dècades des de negre",pt:"Grau honorífico, décadas desde a preta"}, desc:{es:"Máximo rango del BJJ. Tras el negro llegan el rojo y negro (7º Dan), el rojo y blanco (8º Dan) y el rojo (9º y 10º Dan; el 10º es puramente honorífico). Se conceden por trayectoria, no se examinan.",en:"The highest rank in BJJ. After black come red and black (7th Dan), red and white (8th Dan) and red (9th and 10th Dan; the 10th is purely honorary). They are awarded for a lifetime of contribution, not tested for.",val:"Rang màxim del BJJ. Després del negre arriben el roig i negre (7é Dan), el roig i blanc (8é Dan) i el roig (9é i 10é Dan; el 10é és purament honorífic). Es concedixen per trajectòria, no s'examinen.",pt:"Posto máximo do BJJ. Depois da preta vêm a vermelha e preta (7º Dan), a vermelha e branca (8º Dan) e a vermelha (9º e 10º Dan; o 10º é puramente honorífico). São concedidos por trajetória, não são avaliados."}, perStripe:{es:"Escalera de grados (Dan), del 1º al 10º:",en:"Degree (Dan) ladder, 1st to 10th:",val:"Escala de graus (Dan), de l'1r al 10é:",pt:"Escada de graus (Dan), do 1º ao 10º:"}, rights:{es:"🔓 Son grados de reconocimiento: se conceden por trayectoria y aportación al arte, sin examen. Tiempos y edades orientativos según la IBJJF.",en:"🔓 These are recognition degrees: awarded for a lifetime of contribution, without an exam. Times and ages are indicative (IBJJF).",val:"🔓 Són graus de reconeixement: es concedixen per trajectòria i aportació a l'art, sense examen. Temps i edats orientatius segons la IBJJF.",pt:"🔓 São graus de reconhecimento: concedidos por trajetória e contribuição à arte, sem exame. Tempos e idades orientativos segundo a IBJJF."}},

const FEDERATIONS = [
  {name:"IBJJF", belts:{es:"Sí",en:"Yes",val:"Sí",pt:"Sim"}, heelHookGi:{es:"No",en:"No",val:"No",pt:"Não"}, format:{es:"Puntos",en:"Points",val:"Punts",pt:"Pontos"}, notes:{es:"La más extendida a nivel mundial",en:"The most widespread worldwide",val:"La més estesa a nivell mundial",pt:"A mais difundida em nível mundial"}, rules:{es:["Puntos: derribo 2, raspado 2, rodilla en el estómago 2, pase de guardia 3, montada y control de espalda 4.","Si hay empate en puntos decide quién tiene más ventajas (casi-puntos); si también empatan, decide el árbitro.","Qué técnicas se permiten depende del cinturón — por ejemplo, el heel hook solo se permite desde marrón, y solo en no-gi.","La federación más tradicional y extendida; organiza tanto con kimono como sin él."],en:["Points: takedown 2, sweep 2, knee-on-belly 2, guard pass 3, mount and back control 4.","A points tie is broken by advantages (near-points); if still tied, the referee decides.","Which techniques are legal depends on belt — for example, the heel hook is only allowed from brown belt, and only in no-gi.","The most traditional and widespread federation; runs both gi and no-gi divisions."],val:["Punts: derrocament 2, raspat 2, genoll a l'estómac 2, passada de guàrdia 3, muntada i control d'esquena 4.","Si hi ha empat en punts decideix qui té més avantatges (quasi-punts); si també empaten, decideix l'àrbitre.","Quines tècniques es permeten depén del cinturó — per exemple, el heel hook només es permet des de marró, i només en no-gi.","La federació més tradicional i estesa; organitza tant amb quimono com sense."],pt:["Pontos: queda 2, raspagem 2, joelho na barriga 2, passagem de guarda 3, montada e controle de costas 4.","Empate em pontos é decidido pelas vantagens (quase-pontos); se também empatar, decide o árbitro.","Quais técnicas são permitidas depende da faixa — por exemplo, o heel hook só é permitido a partir da faixa marrom, e só no no-gi.","A federação mais tradicional e difundida; organiza competições com e sem kimono."]}},
  {name:"ADCC", belts:{es:"No (peso/nivel)",en:"No (weight/skill)",val:"No (pes/nivell)",pt:"Não (peso/nível)"}, heelHookGi:{es:"No aplica (no-gi)",en:"N/A (no-gi)",val:"No aplica (no-gi)",pt:"Não se aplica (no-gi)"}, format:{es:"Puntos + submission",en:"Points + submission",val:"Punts + submission",pt:"Pontos + submission"}, notes:{es:"El torneo de referencia en no-gi",en:"The reference no-gi tournament",val:"El torneig de referència en no-gi",pt:"O torneio de referência no no-gi"}, rules:{es:["Solo no-gi. Filosofía «primero la sumisión»: en la primera mitad del combate no se puntúa, solo se puede ganar por sumisión.","Los puntos entran en juego en la segunda mitad; si se llega empatado hay prórroga y, si sigue igual, muerte súbita: gana la primera sumisión.","El heel hook y la mayoría de ataques de pierna están permitidos en categoría adulta, sin las restricciones por cinturón de IBJJF — no hay cinturones, se compite por peso.","El evento principal es cada dos años y por invitación; muchas academias usan «reglas ADCC» para sus propios torneos locales de no-gi."],en:["No-gi only. “Submission first” philosophy: no points are scored in the first half of the match — the only way to win is by submission.","Points become active in the second half; a tie goes to overtime, and if still tied it's sudden death: first submission wins.","Heel hooks and most leg attacks are allowed at adult level, without IBJJF's belt-based restrictions — there are no belts, competitors are grouped by weight.","The main event happens every two years and is invite-only; many gyms use “ADCC rules” as the format for their own local no-gi tournaments."],val:["Només no-gi. Filosofia «primer la submissió»: en la primera mitat del combat no es puntua, només es pot guanyar per submissió.","Els punts entren en joc en la segona mitat; si s'arriba empatat hi ha pròrroga i, si continua igual, mort sobtada: guanya la primera submissió.","El heel hook i la majoria d'atacs de cama estan permesos en categoria adulta, sense les restriccions per cinturó d'IBJJF — no hi ha cinturons, es competeix per pes.","L'esdeveniment principal és cada dos anys i per invitació; moltes acadèmies usen «regles ADCC» per als seus propis torneigs locals de no-gi."],pt:["Somente no-gi. Filosofia “finalização primeiro”: na primeira metade da luta não há pontuação — a única forma de vencer é por finalização.","Os pontos entram em jogo na segunda metade; um empate vai para prorrogação e, se persistir, é morte súbita: vence a primeira finalização.","O heel hook e a maioria dos ataques de perna são permitidos na categoria adulta, sem as restrições por faixa da IBJJF — não há faixas, compete-se por peso.","O evento principal acontece a cada dois anos e é só por convite; muitas academias usam “regras ADCC” para seus próprios torneios locais de no-gi."]}},
  {name:"SJJIF", belts:{es:"Sí",en:"Yes",val:"Sí",pt:"Sim"}, heelHookGi:{es:"No",en:"No",val:"No",pt:"Não"}, format:{es:"Puntos",en:"Points",val:"Punts",pt:"Pontos"}, notes:{es:"Criterio similar a IBJJF, federación olímpica",en:"Similar criteria to IBJJF, Olympic-recognized federation",val:"Criteri paregut a IBJJF, federació olímpica",pt:"Critério parecido ao da IBJJF, federação olímpica"}, rules:{es:["Fundada por practicantes vinculados a la familia Gracie, con el objetivo declarado de llevar el BJJ a los Juegos Olímpicos.","Su sistema de puntuación es prácticamente el mismo que el de IBJJF: mismos valores de puntos y las ventajas como criterio de desempate.","Usa cinturones y categorías de peso similares a las de IBJJF, y organiza competiciones con kimono y sin él.","En la práctica se la considera una alternativa a IBJJF con un reglamento casi idéntico."],en:["Founded by practitioners linked to the Gracie family, with the stated goal of bringing BJJ to the Olympic Games.","Its scoring system is practically the same as IBJJF's: the same point values, with advantages used as the tiebreaker.","Uses belts and weight categories similar to IBJJF's, and runs both gi and no-gi competitions.","In practice it's seen as an alternative to IBJJF with an almost identical rulebook."],val:["Fundada per practicants vinculats a la família Gracie, amb l'objectiu declarat de portar el BJJ als Jocs Olímpics.","El seu sistema de puntuació és pràcticament el mateix que el d'IBJJF: mateixos valors de punts i els avantatges com a criteri de desempat.","Usa cinturons i categories de pes semblants a les d'IBJJF, i organitza competicions amb quimono i sense.","A la pràctica es considera una alternativa a IBJJF amb un reglament quasi idèntic."],pt:["Fundada por praticantes ligados à família Gracie, com o objetivo declarado de levar o BJJ aos Jogos Olímpicos.","Seu sistema de pontuação é praticamente o mesmo da IBJJF: os mesmos valores de pontos, com as vantagens como critério de desempate.","Usa faixas e categorias de peso parecidas com as da IBJJF, e organiza competições com e sem kimono.","Na prática é vista como uma alternativa à IBJJF com um regulamento quase idêntico."]}},
  {name:"UAEJJF", belts:{es:"Sí",en:"Yes",val:"Sí",pt:"Sim"}, heelHookGi:{es:"No",en:"No",val:"No",pt:"Não"}, format:{es:"Puntos",en:"Points",val:"Punts",pt:"Pontos"}, notes:{es:"Organiza el Abu Dhabi World Pro",en:"Runs the Abu Dhabi World Pro",val:"Organisa l'Abu Dhabi World Pro",pt:"Organiza o Abu Dhabi World Pro"}, rules:{es:["También conocida como AJP (Abu Dhabi Jiu-Jitsu Pro), su nombre más reciente.","No usa ventajas: si hay empate en puntos al acabar el tiempo, decide directamente el árbitro, sin el desempate intermedio de IBJJF.","El derribo vale más que en IBJJF (4 puntos en vez de 2), lo que premia más la lucha de pie.","Permite los ataques de pierna un cinturón antes que IBJJF (desde morado en vez de desde marrón) y reparte premios en metálico incluso en blanco y azul."],en:["Also known as AJP (Abu Dhabi Jiu-Jitsu Pro), its more recent name.","Doesn't use advantages: a points tie at the final buzzer is decided directly by the referee, without IBJJF's intermediate tiebreaker.","A takedown is worth more than in IBJJF (4 points instead of 2), rewarding standing exchanges more heavily.","Allows leg attacks one belt earlier than IBJJF (from purple instead of brown) and pays prize money even at white and blue belt."],val:["També coneguda com a AJP (Abu Dhabi Jiu-Jitsu Pro), el seu nom més recent.","No usa avantatges: si hi ha empat en punts en acabar el temps, decideix directament l'àrbitre, sense el desempat intermedi d'IBJJF.","El derrocament val més que en IBJJF (4 punts en compte de 2), la qual cosa premia més la lluita dreta.","Permet els atacs de cama un cinturó abans que IBJJF (des de morat en compte de des de marró) i reparteix premis en metàl·lic fins i tot en blanc i blau."],pt:["Também conhecida como AJP (Abu Dhabi Jiu-Jitsu Pro), seu nome mais recente.","Não usa vantagens: um empate em pontos ao fim do tempo é decidido diretamente pelo árbitro, sem o desempate intermediário da IBJJF.","A queda vale mais do que na IBJJF (4 pontos em vez de 2), o que premia mais a luta em pé.","Permite ataques de perna uma faixa antes da IBJJF (a partir da roxa em vez da marrom) e distribui premiação em dinheiro até para faixa branca e azul."]}},
];

  {es:"Royce Gracie, uno de los hermanos Gracie de complexión más pequeña, fue elegido a propósito para competir en los primeros UFC y demostrar que la técnica podía vencer al tamaño.",en:"Royce Gracie, one of the smaller-framed Gracie brothers, was deliberately chosen to compete in the early UFC events to prove that technique could overcome size.",val:"Royce Gracie, un dels germans Gracie de complexió més menuda, va ser triat a propòsit per a competir en els primers UFC i demostrar que la tècnica podia vèncer la grandària.",pt:"Royce Gracie, um dos irmãos Gracie de compleição mais franzina, foi escolhido de propósito para competir nos primeiros UFCs e demonstrar que a técnica podia vencer o tamanho."},
  {es:"Rickson Gracie está considerado por muchos como uno de los competidores más dominantes en la historia del arte, con una reputación legendaria de invicto en combates de sumisión.",en:"Rickson Gracie is considered by many to be one of the most dominant competitors in the art's history, with a legendary unbeaten reputation in submission matches.",val:"Rickson Gracie està considerat per molts com un dels competidors més dominants en la història de l'art, en una reputació legendària d'invicte en combats de submissió.",pt:"Rickson Gracie é considerado por muitos um dos competidores mais dominantes da história da arte, com uma reputação lendária de invicto em combates de finalização."},
  {es:"El no-gi (sin kimono) despegó como disciplina propia sobre todo a partir de los años 2000, impulsado por torneos como el ADCC.",en:"No-gi grappling took off as its own discipline mainly from the 2000s onward, driven by tournaments like ADCC.",val:"El no-gi (sense quimono) va despegar com a disciplina pròpia sobretot a partir dels anys 2000, impulsat per torneigs com l'ADCC.",pt:"O no-gi (sem quimono) decolou como disciplina própria principalmente a partir dos anos 2000, impulsionado por torneios como o ADCC."},
  {es:"Muchos de los intercambios de guardia y sumisiones que se ven hoy en la MMA moderna tienen su origen directo en el BJJ.",en:"Many of the guard exchanges and submissions seen in modern MMA today have their direct origin in BJJ.",val:"Molts dels intercanvis de guàrdia i submissions que es veuen hui en la MMA moderna tenen el seu orige directe en el BJJ.",pt:"Muitas das trocas de guarda e finalizações vistas hoje no MMA moderno têm origem direta no BJJ."},
  {es:"El término «jiu-jitsu brasileño» no se popularizó hasta después del éxito de Royce Gracie en el UFC; antes se le solía llamar simplemente «Gracie jiu-jitsu».",en:"The term \"Brazilian jiu-jitsu\" didn't become popular until after Royce Gracie's success in the UFC; before that it was usually just called \"Gracie jiu-jitsu\".",val:"El terme «jiu-jitsu brasiler» no es va popularisar fins després de l'èxit de Royce Gracie en l'UFC; abans se solia dir simplement «Gracie jiu-jitsu».",pt:"O termo «jiu-jitsu brasileiro» não se popularizou até depois do sucesso de Royce Gracie no UFC; antes costumava-se chamar simplesmente de «Gracie jiu-jitsu»."},
  {es:"En los campeonatos de la IBJJF con kimono, el pesaje se hace con el kimono puesto, así que su peso cuenta a la hora de elegir categoría.",en:"At IBJJF gi championships the weigh-in is done with the gi on, so its weight counts when choosing a division.",val:"En els campionats de la IBJJF amb quimono, el pesatge es fa amb el quimono posat, així que el seu pes compta a l'hora de triar categoria.",pt:"Nos campeonatos da IBJJF com kimono, a pesagem é feita com o kimono vestido, então o peso dele conta na hora de escolher a categoria."},
  {es:"El origen del saludo «oss», tan común en muchas academias, sigue siendo debatido: algunos lo relacionan con el japonés «onegaishimasu» y otros con expresiones militares o de respeto distintas.",en:"The origin of the \"oss\" greeting, so common in many academies, is still debated: some link it to the Japanese \"onegaishimasu\" while others trace it to different military or respect-related expressions.",val:"L'orige de la salutació «oss», tan comuna en moltes acadèmies, seguix sent debatut: alguns el relacionen amb el japonés «onegaishimasu» i altres amb expressions militars o de respecte distintes.",pt:"A origem da saudação «oss», tão comum em muitas academias, ainda é debatida: alguns a relacionam com o japonês «onegaishimasu» e outros com expressões militares ou de respeito diferentes."},
  {es:"En los campeonatos de la IBJJF el kimono solo puede ser blanco, azul o negro.",en:"At IBJJF championships the gi may only be white, blue or black.",val:"En els campionats de la IBJJF el quimono només pot ser blanc, blau o negre.",pt:"Nos campeonatos da IBJJF o kimono só pode ser branco, azul ou preto."},
  {es:"Algunas federaciones permiten competir con el cinturón anterior durante un breve periodo tras un ascenso, como transición antes de estrenar el nuevo color.",en:"Some federations allow competing with the previous belt for a short period after a promotion, as a transition before debuting the new color.",val:"Algunes federacions permeten competir amb el cinturó anterior durant un breu període després d'un ascens, com a transició abans d'estrenar el nou color.",pt:"Algumas federações permitem competir com a faixa anterior por um breve período após uma graduação, como transição antes de estrear a nova cor."},
  {es:"En sus primeros años, algunas academias brasileñas enseñaban BJJ y boxeo en la misma clase, como preparación directa para los combates de vale-tudo sin apenas reglas.",en:"In its early years, some Brazilian academies taught BJJ and boxing in the same class, as direct preparation for nearly rule-free vale-tudo fights.",val:"En els seus primers anys, algunes acadèmies brasileres ensenyaven BJJ i boxa en la mateixa classe, com a preparació directa per als combats de vale-tudo quasi sense regles.",pt:"Em seus primeiros anos, algumas academias brasileiras ensinavam BJJ e boxe na mesma aula, como preparação direta para as lutas de vale-tudo quase sem regras."},
  {es:"La palabra «gi» viene del japonés (keikogi o dōgi) y significa simplemente «ropa de entrenamiento».",en:"The word \"gi\" comes from Japanese (keikogi or dōgi) and simply means \"training clothes\".",val:"La paraula «gi» ve del japonés (keikogi o dōgi) i significa simplement «roba d'entrenament».",pt:"A palavra «gi» vem do japonês (keikogi ou dōgi) e significa simplesmente «roupa de treino»."},
  {es:"La kimura se llama así por Masahiko Kimura, el judoka que la usó para vencer a Hélio Gracie en 1951. En judo esta llave se conoce como gyaku ude garami.",en:"The kimura is named after Masahiko Kimura, the judoka who used it to beat Hélio Gracie in 1951. In judo this lock is known as gyaku ude garami.",val:"La kimura es diu així per Masahiko Kimura, el judoka que la va usar per a véncer Hélio Gracie el 1951. En judo esta clau es coneix com a gyaku ude garami.",pt:"A kimura tem esse nome por causa de Masahiko Kimura, o judoca que a usou para vencer Hélio Gracie em 1951. No judô essa chave é conhecida como gyaku ude garami."},
  {es:"El triángulo no nació en el BJJ: ya existía en el judo como sankaku jime («estrangulación triangular»). Fue en el BJJ donde se perfeccionó hasta convertirse en un clásico.",en:"The triangle was not born in BJJ: it already existed in judo as sankaku jime (\"triangular choke\"). It was in BJJ that it was refined and became a classic.",val:"El triangle no va nàixer en el BJJ: ja existia en el judo com a sankaku jime («estrangulació triangular»). Va ser en el BJJ on es va perfeccionar fins a convertir-se en un clàssic.",pt:"O triângulo não nasceu no BJJ: já existia no judô como sankaku jime («estrangulamento triangular»). Foi no BJJ que ele foi aperfeiçoado e se tornou um clássico."},
  {es:"«Kesa» es el nombre de la estola que los monjes budistas llevan cruzada sobre el hombro: el kesa gatame se llama «control de bufanda» porque el cuerpo cruza al rival en diagonal como esa prenda.",en:"\"Kesa\" is the name of the stole Buddhist monks wear across the shoulder: kesa gatame is called the \"scarf hold\" because your body lies diagonally across the opponent like that garment.",val:"«Kesa» és el nom de l'estola que els monjos budistes porten creuada sobre l'espatla: el kesa gatame es diu «control de bufanda» perquè el cos creua l'adversari en diagonal com eixa peça.",pt:"«Kesa» é o nome da estola que os monges budistas usam cruzada sobre o ombro: o kesa gatame é chamado de «controle de cachecol» porque o corpo cruza o adversário na diagonal como essa peça."},
  {es:"Los nombres de los derribos de judo son descriptivos: «o» es grande, «ko» pequeño, «uchi» dentro, «soto» fuera y «gari» siega. Así, osoto gari es la «gran siega exterior» y kouchi gari la «pequeña siega interior».",en:"Judo throw names are descriptive: \"o\" means major, \"ko\" minor, \"uchi\" inner, \"soto\" outer and \"gari\" reap. So osoto gari is the \"major outer reap\" and kouchi gari the \"minor inner reap\".",val:"Els noms dels derrocaments de judo són descriptius: «o» és gran, «ko» xicotet, «uchi» dins, «soto» fora i «gari» sega. Així, osoto gari és la «gran sega exterior» i kouchi gari la «xicoteta sega interior».",pt:"Os nomes das quedas do judô são descritivos: «o» é grande, «ko» pequeno, «uchi» dentro, «soto» fora e «gari» ceifada. Assim, osoto gari é a «grande ceifada externa» e kouchi gari a «pequena ceifada interna»."},
  {es:"El cinturón negro lleva una barra roja en un extremo, donde se colocan las franjas que marcan los grados.",en:"The black belt has a red bar at one end, where the stripes marking degrees are placed.",val:"El cinturó negre porta una barra roja en un extrem, on es col·loquen les franges que marquen els graus.",pt:"A faixa-preta tem uma barra vermelha em uma das pontas, onde ficam as listras que marcam os graus."},
  {es:"Rendirse se hace golpeando repetidamente con la mano o el pie sobre el rival o el suelo; si no puedes hacerlo, basta con avisar en voz alta.",en:"You submit by tapping repeatedly with a hand or foot on the opponent or the mat; if you can't, calling out loud is enough.",val:"Rendir-se es fa colpejant repetidament amb la mà o el peu sobre l'adversari o el terra; si no pots, n'hi ha prou amb avisar en veu alta.",pt:"Para se render, bate-se repetidamente com a mão ou o pé no adversário ou no chão; se não for possível, basta avisar em voz alta."},
  {es:"Los entrenamientos libres de BJJ se llaman «rolar» en portugués y «rolling» en inglés, porque los dos practicantes literalmente ruedan por el tatami.",en:"Free sparring in BJJ is called \"rolar\" in Portuguese and \"rolling\" in English, because the two practitioners literally roll across the mat.",val:"Els entrenaments lliures de BJJ es diuen «rolar» en portugués i «rolling» en anglés, perquè els dos practicants literalment rodolen pel tatami.",pt:"O treino livre de BJJ é chamado de «rolar» em português e de «rolling» em inglês, porque os dois praticantes literalmente rolam pelo tatame."},
  {es:"En la comunidad es famoso el «blue belt blues»: la etapa en la que muchos practicantes se estancan o abandonan tras conseguir el cinturón azul.",en:"The \"blue belt blues\" is famous in the community: the stage when many practitioners stall or quit after earning the blue belt.",val:"A la comunitat és famós el «blue belt blues»: l'etapa en què molts practicants s'estanquen o abandonen després de guanyar el cinturó blau.",pt:"Na comunidade é famoso o «blue belt blues»: a fase em que muitos praticantes estagnam ou desistem depois de conquistar a faixa azul."},
  {es:"Carlos Gracie ideó la llamada «dieta Gracie», un sistema de alimentación que combina los alimentos por grupos y que todavía se menciona en muchas academias.",en:"Carlos Gracie devised the so-called \"Gracie diet\", an eating system that combines foods by groups and is still mentioned in many academies.",val:"Carlos Gracie va idear l'anomenada «dieta Gracie», un sistema d'alimentació que combina els aliments per grups i que encara es menciona en moltes acadèmies.",pt:"Carlos Gracie idealizou a chamada «dieta Gracie», um sistema de alimentação que combina os alimentos por grupos e que ainda é mencionado em muitas academias."},
  {es:"El pase «toreando» debe su nombre a la tauromaquia: quien pasa esquiva las piernas del rival como un torero esquiva al toro.",en:"The \"bullfighter\" pass gets its name from bullfighting: the passer sidesteps the opponent's legs the way a matador sidesteps the bull.",val:"La passada «torejant» deu el nom a la tauromàquia: qui passa esquiva les cames de l'adversari com un torero esquiva el toro.",pt:"A passagem «toreando» deve o nome à tauromaquia: quem passa esquiva as pernas do adversário como um toureiro esquiva o touro."},
  {es:"Un principio clásico del BJJ es «posición antes que sumisión»: primero se asegura un control estable y solo después se busca la finalización.",en:"A classic BJJ principle is \"position before submission\": first secure a stable control, and only then look for the finish.",val:"Un principi clàssic del BJJ és «posició abans que submissió»: primer s'assegura un control estable i només després es busca la finalització.",pt:"Um princípio clássico do BJJ é «posição antes da finalização»: primeiro garante-se um controle estável e só depois se busca a finalização."},
  {es:"Las llaves de talón (heel hook) son especialmente delicadas: pueden dañar los ligamentos de la rodilla con poco dolor previo, por eso es clave rendirse a tiempo.",en:"Heel hooks are especially delicate: they can damage the knee ligaments with little warning pain, which is why tapping early is key.",val:"Les claus de taló (heel hook) són especialment delicades: poden danyar els lligaments del genoll amb poc dolor previ, per això és clau rendir-se a temps.",pt:"As chaves de calcanhar (heel hook) são especialmente delicadas: podem lesionar os ligamentos do joelho com pouca dor prévia, por isso é fundamental bater a tempo."},
];
