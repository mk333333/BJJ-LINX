  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Seoi nage",en:"Seoi nage",val:"Seoi nage",pt:"Seoi nage"}, desc:{es:"Derribo de judo en el que se carga al rival sobre la espalda tras meterse debajo de su centro de gravedad, agarrando manga y solapa, para proyectarlo por encima del hombro.",en:"A judo throw where the opponent is loaded onto the back after dropping beneath their center of gravity, gripping sleeve and lapel, to throw them over the shoulder.",val:"Derrocament de judo en què es carrega l'adversari sobre l'esquena després de ficar-se per baix del seu centre de gravetat, agarrant mànega i solapa, per a projectar-lo per damunt de l'espatla.",pt:"Queda de judô em que se carrega o adversário nas costas após se posicionar abaixo do seu centro de gravidade, agarrando manga e lapela, para projetá-lo por cima do ombro."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guardia de goma (rubber guard)",en:"Rubber guard",val:"Guàrdia de goma (rubber guard)",pt:"Guarda de borracha (rubber guard)"}, desc:{es:"Guardia muy flexible en la que se lleva la propia pierna detrás de la cabeza del rival para controlar su postura y buscar sumisiones sin depender del agarre de las manos.",en:"A highly flexible guard where your own leg is brought behind the opponent's head to control their posture and hunt for submissions without relying on hand grips.",val:"Guàrdia molt flexible en què es porta la propia cama darrere del cap de l'adversari per a controlar la seua postura i buscar submissions sense dependre de l'agafada de les mans.",pt:"Guarda muito flexível em que a própria perna é levada atrás da cabeça do adversário para controlar sua postura e buscar finalizações sem depender das pegadas das mãos."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Buggy choke",en:"Buggy choke",val:"Buggy choke",pt:"Buggy choke"}, desc:{es:"Ahogo moderno en el que una pierna del rival queda enredada entre las tuyas mientras tu brazo rodea y cierra su cuello, aplicado desde una posición invertida muy vista en el no-gi de alto nivel.",en:"A modern choke where one of the opponent's legs gets tangled between yours while your arm wraps and closes around their neck, applied from an inverted position common in high-level no-gi.",val:"Ofegament modern en què una cama de l'adversari queda enredada entre les teues mentre el teu braç rodeja i tanca el seu coll, aplicat des d'una posició invertida molt vista en el no-gi d'alt nivell.",pt:"Estrangulamento moderno em que uma perna do adversário fica enredada entre as suas enquanto seu braço envolve e fecha o pescoço dele, aplicado a partir de uma posição invertida muito vista no no-gi de alto nível."}},
  {cat:"guardias", level:"avanzado", tags:["gi"], name:{es:"Guardia lazo (lasso guard)",en:"Lasso guard",val:"Guàrdia llaç (lasso guard)",pt:"Guarda laço (lasso guard)"}, desc:{es:"Variante de la guardia de araña en la que se envuelve el brazo del rival por completo con la propia pierna, atrapándolo mientras se ataca desde ángulos poco accesibles.",en:"A spider guard variant where the opponent's arm is fully wrapped with your own leg, trapping it while attacking from angles that are hard to reach.",val:"Variant de la guàrdia aranya en què s'envolta el braç de l'adversari per complet en la propia cama, atrapant-lo mentre s'ataca des d'angles poc accessibles.",pt:"Variante da guarda aranha em que o braço do adversário é totalmente envolvido pela própria perna, prendendo-o enquanto se ataca a partir de ângulos pouco acessíveis."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Duck under",en:"Duck under",val:"Duck under",pt:"Duck under"}, desc:{es:"Entrada de lucha por el hueco del brazo: se agacha bajo el brazo del rival, se cambia de lado y se sale por detrás de él o hacia un control de cuerpo, sin agarrar sus piernas; muy usada como transición desde el clinch.",en:"A wrestling entry through the gap under the arm: you duck beneath the opponent's arm, change sides and come out behind them or into a body control, without grabbing their legs; widely used as a transition from the clinch.",val:"Entrada de lluita pel buit del braç: t'agaixes baix del braç de l'adversari, canvies de costat i eixes per darrere d'ell o cap a un control de cos, sense agafar-li les cames; molt usada com a transició des del clinch.",pt:"Entrada de luta pelo vão do braço: você se agacha sob o braço do adversário, troca de lado e sai por trás dele ou para um controle de corpo, sem agarrar suas pernas; muito usada como transição a partir do clinch."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Corte de bíceps (bicep slicer)",en:"Bicep slicer",val:"Tall de bíceps (bicep slicer)",pt:"Corte de bíceps (bicep slicer)"}, desc:{es:"Compresión del bíceps del rival contra su propio antebrazo o hueso, doblando el codo al máximo para generar dolor sin atacar directamente la articulación.",en:"A compression of the opponent's bicep against their own forearm or bone, bending the elbow to its limit to generate pain without directly attacking the joint.",val:"Compressió del bíceps de l'adversari contra el seu propi avantbraç o os, doblegant el colze al màxim per a generar dolor sense atacar directament l'articulació.",pt:"Compressão do bíceps do adversário contra seu próprio antebraço ou osso, dobrando o cotovelo ao máximo para gerar dor sem atacar diretamente a articulação."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de leglock (heel hook)",en:"Leglock escape (heel hook)",val:"Escapada de leglock (heel hook)",pt:"Fuga de leglock (heel hook)"}, desc:{es:"Al notar el agarre del talón, se gira la cadera hacia el mismo lado que la pierna atrapada mientras se libera el pie con la mano libre, protegiendo la rodilla antes de que la presión aumente.",en:"As soon as the heel grip is felt, the hips rotate toward the same side as the trapped leg while the free hand frees the foot, protecting the knee before pressure builds up.",val:"En notar l'agafada del taló, es gira el maluc cap al mateix costat que la cama atrapada mentre s'allibera el peu amb la mà lliure, protegint el genoll abans que la pressió augmente.",pt:"Ao sentir a pegada do calcanhar, o quadril gira para o mesmo lado da perna presa enquanto a mão livre libera o pé, protegendo o joelho antes que a pressão aumente."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Estrangulación japonesa (Japanese necktie)",en:"Japanese necktie",val:"Estrangulació japonesa (Japanese necktie)",pt:"Gravata japonesa (Japanese necktie)"}, desc:{es:"Tras un sprawl exitoso, un brazo rodea el cuello del rival y atrapa también uno de sus brazos; al caer con el peso encima y cerrar el agarre, el propio brazo del rival forma parte de la presión sobre el cuello.",en:"After a successful sprawl, one arm wraps the opponent's neck and also traps one of their arms; falling with your weight on them and closing the grip, their own arm becomes part of the pressure on the neck.",val:"Després d'un sprawl reeixit, un braç rodeja el coll de l'adversari i atrapa també un dels seus braços; en caure amb el pes damunt i tancar l'agafada, el seu propi braç forma part de la pressió sobre el coll.",pt:"Depois de um sprawl bem-sucedido, um braço envolve o pescoço do adversário e prende também um dos braços dele; ao cair com o peso por cima e fechar a pegada, o próprio braço dele passa a fazer parte da pressão sobre o pescoço."}},
  {cat:"guardias", level:"avanzado", tags:["gi"], name:{es:"Guardia gusano (worm guard)",en:"Worm guard",val:"Guàrdia cuc (worm guard)",pt:"Guarda minhoca (worm guard)"}, desc:{es:"Guardia moderna con kimono en la que se pasa la propia solapa por detrás de la pierna del rival y se sujeta desde el otro lado, creando una correa que limita su movilidad para facilitar raspados.",en:"A modern gi guard where your own lapel is threaded behind the opponent's leg and held from the other side, creating a strap that limits their mobility to set up sweeps.",val:"Guàrdia moderna en quimono en què es passa la propia solapa per darrere de la cama de l'adversari i se subjecta des de l'altre costat, creant una corretja que limita la seua mobilitat per a facilitar raspats.",pt:"Guarda moderna com quimono em que a própria lapela é passada por trás da perna do adversário e segurada do outro lado, criando uma tira que limita sua mobilidade para facilitar raspagens."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Uchi mata",en:"Uchi mata",val:"Uchi mata",pt:"Uchi mata"}, desc:{es:"Derribo de judo en el que se lanza la pierna entre las del rival, girando la cadera para elevarlo del suelo y proyectarlo hacia un lado con un barrido interno de muslo.",en:"A judo throw where the leg is swung between the opponent's legs, rotating the hip to lift them off the ground and throw them to the side with an inner thigh sweep.",val:"Derrocament de judo en què es llança la cama entre les de l'adversari, girant el maluc per a elevar-lo del terra i projectar-lo cap a un costat en un raspat intern de cuixa.",pt:"Queda de judô em que a perna é lançada entre as pernas do adversário, girando o quadril para elevá-lo do chão e projetá-lo para o lado com uma raspagem interna de coxa."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Ouchi gari",en:"Ouchi gari",val:"Ouchi gari",pt:"Ouchi gari"}, desc:{es:"Derribo de judo por dentro y de gran recorrido: la pierna se mete entre las del rival y barre toda su pierna interior hacia atrás, mientras las manos empujan el torso en sentido contrario para que caiga de espaldas.",en:"A wide inside judo throw: your leg goes between the opponent's and sweeps their whole inner leg backward, while your hands push the torso the other way so they fall onto their back.",val:"Derrocament de judo per dins i de gran recorregut: la cama es fica entre les de l'adversari i escombra tota la seua cama interior cap arrere, mentre les mans empenyen el tors en sentit contrari perquè caiga d'esquena.",pt:"Queda de judô por dentro e de grande alcance: sua perna entra entre as do adversário e varre toda a perna interna dele para trás, enquanto as mãos empurram o tronco no sentido contrário para que ele caia de costas."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Loop choke",en:"Loop choke",val:"Loop choke",pt:"Loop choke"}, desc:{es:"Estrangulación con la solapa que rodea el cuello del rival por delante, típica al pasar la guardia o desde la tortuga, cerrando con un giro de muñeca.",en:"A lapel choke that wraps around the front of the opponent's neck, typical when passing the guard or from turtle, finishing with a wrist rotation.",val:"Estrangulació en solapa que rodeja el coll de l'adversari per davant, típica en passar la guàrdia o des de la tortuga, tancant en un gir de canell.",pt:"Estrangulamento com a lapela que envolve o pescoço do adversário pela frente, típico ao passar a guarda ou a partir da tartaruga, fechando com uma rotação de pulso."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de norte-sur",en:"North-south escape",val:"Escapada de nord-sud",pt:"Fuga de norte-sul"}, desc:{es:"Se coloca un brazo bajo la axila del rival y el otro protege el cuello mientras se gira de lado, creando espacio con la cadera para recuperar la guardia antes de que asiente su peso.",en:"One arm is placed under the opponent's armpit while the other protects the neck as you turn onto your side, creating space with the hip to recover guard before they settle their weight.",val:"Es col·loca un braç baix l'aixella de l'adversari i l'altre protegix el coll mentre es gira de costat, creant espai en el maluc per a recuperar la guàrdia abans que assente el seu pes.",pt:"Coloca-se um braço sob a axila do adversário e o outro protege o pescoço enquanto se gira de lado, criando espaço com o quadril para recuperar a guarda antes que ele assente seu peso."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de kesa gatame",en:"Kesa gatame escape",val:"Escapada de kesa gatame",pt:"Fuga de kesa gatame"}, desc:{es:"Se rodea la cabeza del rival con el brazo libre mientras se empuja su cadera con la mano contraria, girando el cuerpo hacia él para recomponer la guardia.",en:"The opponent's head is wrapped with the free arm while their hip is pushed away with the other hand, rotating the body toward them to recompose guard.",val:"Es rodeja el cap de l'adversari en el braç lliure mentre s'empeny el seu maluc en la mà contrària, girant el cos cap a ell per a recompondre la guàrdia.",pt:"A cabeça do adversário é envolvida com o braço livre enquanto seu quadril é empurrado com a mão contrária, girando o corpo em direção a ele para recompor a guarda."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Estima lock",en:"Estima lock",val:"Estima lock",pt:"Estima lock"}, desc:{es:"Ataque de pierna que combina control de tobillo con presión sobre la rodilla desde un ángulo inusual, popularizado en competición de alto nivel por su dificultad para detectarlo a tiempo.",en:"A leg attack that combines ankle control with pressure on the knee from an unusual angle, popularized in high-level competition for how hard it is to detect in time.",val:"Atac de cama que combina control de turmell en pressió sobre el genoll des d'un angle inusual, popularisat en competició d'alt nivell per la seua dificultat per a detectar-lo a temps.",pt:"Ataque de perna que combina controle de tornozelo com pressão sobre o joelho a partir de um ângulo incomum, popularizado na competição de alto nível pela dificuldade de detectá-lo a tempo."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guardia X sencilla (single leg X-guard)",en:"Single leg X-guard",val:"Guàrdia X senzilla (single leg X-guard)",pt:"Guarda X simples (single leg X-guard)"}, desc:{es:"Variante de la guardia X que solo usa una pierna en forma de gancho bajo el muslo del rival mientras la otra controla su tobillo, más rápida de entrar que la X-guard completa.",en:"A variant of X-guard using only one leg as a hook under the opponent's thigh while the other controls their ankle, quicker to enter than the full X-guard.",val:"Variant de la guàrdia X que només usa una cama en forma de ganxo baix la cuixa de l'adversari mentre l'altra controla el seu turmell, més ràpida d'entrar que la X-guard completa.",pt:"Variante da guarda X que usa apenas uma perna como gancho sob a coxa do adversário enquanto a outra controla seu tornozelo, mais rápida de entrar que a X-guard completa."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Sumi gaeshi",en:"Sumi gaeshi",val:"Sumi gaeshi",pt:"Sumi gaeshi"}, desc:{es:"Contraataque de sacrificio —no una entrada propia como el tomoe nage— aplicado cuando el rival ya te empuja hacia adelante: te dejas caer de espaldas colocando un pie en su cadera y aprovechas ese empuje que él mismo trae para volcarlo por encima de ti.",en:"A sacrifice counter — not a self-initiated entry like tomoe nage — applied when the opponent is already pushing you forward: you drop onto your back placing a foot on their hip and use the momentum they themselves brought to roll them over you.",val:"Contraatac de sacrifici —no una entrada propia com el tomoe nage— aplicat quan l'adversari ja t'empeny cap avant: et deixes caure d'esquena col·locant un peu en el seu maluc i aprofites eixe empenta que ell mateix porta per a bolcar-lo per damunt de tu.",pt:"Contra-ataque de sacrifício — não uma entrada própria como o tomoe nage — aplicado quando o adversário já está empurrando você para frente: você se deixa cair de costas colocando um pé no quadril dele e aproveita esse impulso que ele mesmo traz para virá-lo por cima de você."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de mata león",en:"Rear naked choke escape",val:"Escapada de mata leó",pt:"Fuga de mata leão"}, desc:{es:"Antes de que el brazo cierre por completo, se sujeta la manga que rodea el cuello con ambas manos y se gira la barbilla hacia el bíceps del rival para crear espacio de respiración mientras se baja la cadera.",en:"Before the arm fully closes, the sleeve wrapping the neck is gripped with both hands and the chin turns toward the opponent's bicep to create breathing space while dropping the hips.",val:"Abans que el braç tanque per complet, se subjecta la mànega que rodeja el coll amb ambdues mans i es gira la barbeta cap al bíceps de l'adversari per a crear espai de respiració mentre es baixa el maluc.",pt:"Antes que o braço feche completamente, a manga que envolve o pescoço é segurada com as duas mãos e o queixo gira em direção ao bíceps do adversário para criar espaço de respiração enquanto se baixa o quadril."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Electric chair",en:"Electric chair",val:"Electric chair",pt:"Electric chair"}, desc:{es:"Combinación moderna de control de piernas que obliga al rival a elegir entre defender una sumisión de tobillo o ser volteado, ya que ambas amenazas se activan desde la misma posición.",en:"A modern leg-control combination that forces the opponent to choose between defending an ankle submission or being swept, since both threats are activated from the same position.",val:"Combinació moderna de control de cames que obliga l'adversari a triar entre defendre una submissió de turmell o ser bolcat, ja que ambdues amenaces s'activen des de la mateixa posició.",pt:"Combinação moderna de controle de pernas que obriga o adversário a escolher entre defender uma finalização de tornozelo ou ser virado, já que ambas as ameaças se ativam a partir da mesma posição."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Saddle (411 / honey hole)",en:"Saddle (411 / honey hole)",val:"Saddle (411 / honey hole)",pt:"Saddle (411 / honey hole)"}, desc:{es:"Control de pierna moderno en el que se monta sobre una pierna del rival como si fuera una silla, inmovilizándola por completo para atacar tobillo y rodilla con gran ventaja mecánica.",en:"A modern leg control where you sit astride one of the opponent's legs as if riding a saddle, fully immobilizing it to attack the ankle and knee with great mechanical advantage.",val:"Control de cama modern en què es munta sobre una cama de l'adversari com si fóra una cadira, immobilisant-la per complet per a atacar turmell i genoll en gran avantatge mecànica.",pt:"Controle de perna moderno em que você senta sobre uma perna do adversário como se fosse uma sela, imobilizando-a completamente para atacar tornozelo e joelho com grande vantagem mecânica."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Kouchi gari",en:"Kouchi gari",val:"Kouchi gari",pt:"Kouchi gari"}, desc:{es:"Derribo de judo corto y seco por dentro: la planta del pie golpea el talón del pie adelantado del rival para quitarle el apoyo justo cuando lo carga, y un empujón del torso lo hace caer.",en:"A short, sharp inside judo throw: the sole of your foot taps the heel of the opponent's advanced foot to remove their support just as they load it, and a push on the torso finishes the fall.",val:"Derrocament de judo curt i sec per dins: la planta del peu colpeja el taló del peu avançat de l'adversari per a llevar-li el suport just quan hi carrega el pes, i un empentó del tors el fa caure.",pt:"Queda de judô curta e seca por dentro: a sola do pé bate no calcanhar do pé avançado do adversário para tirar seu apoio no instante em que ele o carrega, e um empurrão no tronco completa a queda."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Blast double leg",en:"Blast double leg",val:"Blast double leg",pt:"Blast double leg"}, desc:{es:"Variante explosiva del doble ataque a piernas en la que se dispara hacia adelante sin bajar demasiado el nivel, usando la velocidad del impacto para llevar al rival al suelo antes de que reaccione.",en:"An explosive variant of the double leg takedown where you shoot forward without dropping levels too much, using the speed of impact to take the opponent down before they can react.",val:"Variant explosiva del doble atac a cames en què es dispara cap avant sense baixar massa el nivell, usant la velocitat de l'impacte per a portar l'adversari al terra abans que reaccione.",pt:"Variante explosiva do ataque duplo às pernas em que você dispara para frente sem baixar muito o nível, usando a velocidade do impacto para derrubar o adversário antes que ele reaja."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi"], name:{es:"Cortador de papel (paper cutter choke)",en:"Paper cutter choke",val:"Tallador de paper (paper cutter choke)",pt:"Cortador de papel (paper cutter choke)"}, desc:{es:"Estrangulación que combina la propia solapa del rival con la presión del antebrazo desde encima, similar al cortador de pan pero aplicada desde una guardia en vez de contra un single-leg.",en:"A choke that combines the opponent's own lapel with forearm pressure from on top, similar to the bread cutter but applied from a guard instead of against a single-leg.",val:"Estrangulació que combina la propia solapa de l'adversari amb la pressió de l'avantbraç des de damunt, semblant al tallador de pa però aplicada des d'una guàrdia en lloc de contra un single-leg.",pt:"Estrangulamento que combina a própria lapela do adversário com a pressão do antebraço por cima, semelhante ao cortador de pão mas aplicado a partir de uma guarda em vez de contra um single-leg."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"De la Riva reverso (reverse De la Riva)",en:"Reverse De la Riva",val:"De la Riva revers (reverse De la Riva)",pt:"De la Riva reverso (reverse De la Riva)"}, desc:{es:"Variante de la guardia De la Riva en la que el gancho de pierna se coloca por el lado contrario, abriendo ángulos de ataque a la espalda poco habituales para el rival.",en:"A variant of the De la Riva guard where the leg hook is placed on the opposite side, opening up back-attack angles that are unusual for the opponent.",val:"Variant de la guàrdia De la Riva en què el ganxo de cama es col·loca pel costat contrari, obrint angles d'atac a l'esquena poc habituals per a l'adversari.",pt:"Variante da guarda De la Riva em que o gancho de perna é colocado do lado contrário, abrindo ângulos de ataque às costas incomuns para o adversário."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Tani otoshi",en:"Tani otoshi",val:"Tani otoshi",pt:"Tani otoshi"}, desc:{es:"Derribo de sacrificio en el que se bloquea una pierna del rival por detrás mientras se cae de lado, arrastrándolo al suelo con el propio peso corporal.",en:"A sacrifice throw where one of the opponent's legs is blocked from behind while falling to the side, dragging them down with your own body weight.",val:"Derrocament de sacrifici en què es bloqueja una cama de l'adversari per darrere mentre es cau de costat, arrossegant-lo al terra en el propi pes corporal.",pt:"Queda de sacrifício em que uma perna do adversário é bloqueada por trás enquanto se cai de lado, arrastando-o para o chão com o próprio peso corporal."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Kata guruma (fireman's carry)",en:"Kata guruma (fireman's carry)",val:"Kata guruma (fireman's carry)",pt:"Kata guruma (fireman's carry)"}, desc:{es:"Derribo en el que se carga al rival sobre los hombros como si fuera un bombero rescatando a alguien, agarrando una pierna y un brazo, para dejarlo caer al suelo con control total.",en:"A takedown where the opponent is lifted onto your shoulders like a firefighter's carry, gripping one leg and one arm, to bring them down to the ground with full control.",val:"Derrocament en què es carrega l'adversari sobre les espatles com si fóra un bomber rescatant algú, agarrant una cama i un braç, per a deixar-lo caure al terra en control total.",pt:"Queda em que o adversário é carregado nos ombros como um bombeiro fazendo um resgate, agarrando uma perna e um braço, para derrubá-lo no chão com controle total."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Banana split",en:"Banana split",val:"Banana split",pt:"Banana split"}, desc:{es:"Ataque a la cadera y la ingle del rival separando sus piernas al máximo desde una posición de control por detrás, muy usado en el no-gi moderno contra guardias invertidas.",en:"An attack on the opponent's hip and groin by spreading their legs to the limit from a control position behind them, widely used in modern no-gi against inverted guards.",val:"Atac al maluc i l'engonal de l'adversari separant les seues cames al màxim des d'una posició de control per darrere, molt usat en el no-gi modern contra guàrdies invertides.",pt:"Ataque ao quadril e à virilha do adversário separando suas pernas ao máximo a partir de uma posição de controle por trás, muito usado no no-gi moderno contra guardas invertidas."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Baratoplata",en:"Baratoplata",val:"Baratoplata",pt:"Baratoplata"}, desc:{es:"Estrangulación moderna que combina el control de una pierna del rival con la solapa o la mano libre alrededor de su cuello, típica de las guardias de piernas actuales.",en:"A modern choke that combines control of one of the opponent's legs with the lapel or free hand wrapped around their neck, typical of today's leg-entanglement guards.",val:"Estrangulació moderna que combina el control d'una cama de l'adversari en la solapa o la mà lliure al voltant del seu coll, típica de les guàrdies de cames actuals.",pt:"Estrangulamento moderno que combina o controle de uma perna do adversário com a lapela ou a mão livre ao redor do seu pescoço, típico das guardas de pernas atuais."}},
  {cat:"control", level:"avanzado", tags:["gi","no-gi"], name:{es:"Control de camión (truck)",en:"Truck position",val:"Control de camió (truck)",pt:"Controle de caminhão (truck)"}, desc:{es:"Control moderno de piernas en el que se inmoviliza una pierna del rival cruzándola por detrás de la otra, abriendo el camino a distintos ataques de pierna sin depender del agarre de manos.",en:"A modern leg control where one of the opponent's legs is immobilized by crossing it behind the other, opening the door to different leg attacks without relying on hand grips.",val:"Control modern de cames en què s'immobilisa una cama de l'adversari creuant-la per darrere de l'altra, obrint el camí a distints atacs de cama sense dependre de l'agafada de mans.",pt:"Controle moderno de pernas em que uma perna do adversário é imobilizada cruzando-a por trás da outra, abrindo caminho para diferentes ataques de perna sem depender das pegadas das mãos."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de crucifijo",en:"Crucifix escape",val:"Escapada de crucifix",pt:"Fuga de crucifixo"}, desc:{es:"Se gira el hombro libre hacia el suelo mientras se recupera uno de los brazos atrapados, creando el espacio suficiente para desenganchar la pierna del rival y recomponer la guardia.",en:"The free shoulder rotates toward the ground while one of the trapped arms is freed, creating enough space to unhook the opponent's leg and recompose guard.",val:"Es gira l'espatla lliure cap al terra mentre es recupera un dels braços atrapats, creant l'espai suficient per a desenganxar la cama de l'adversari i recompondre la guàrdia.",pt:"O ombro livre gira em direção ao chão enquanto um dos braços presos é liberado, criando espaço suficiente para desenganchar a perna do adversário e recompor a guarda."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de omoplata",en:"Omoplata escape",val:"Escapada d'omoplata",pt:"Fuga de omoplata"}, desc:{es:"Contra la omoplata, se rueda hacia delante siguiendo la dirección de la pierna atacante, o se levanta la cadera para apilar al rival, y se saca el hombro antes de que quede aislado.",en:"Against the omoplata, you roll forward following the direction of the attacking leg, or lift the hips to stack the opponent, and pull the shoulder out before it becomes isolated.",val:"Contra l'omoplata, es rodola cap avant seguint la direcció de la cama atacant, o s'alça el maluc per a apilar l'adversari, i es trau l'espatla abans que quede aïllada.",pt:"Contra a omoplata, rola-se para frente seguindo a direção da perna atacante, ou levanta-se o quadril para empilhar o adversário, e tira-se o ombro antes que ele fique isolado."}},
  {cat:"guardias", level:"intermedio", tags:["gi","no-gi"], name:{es:"Guardia de gancho (hook guard)",en:"Hook guard",val:"Guàrdia de ganxo (hook guard)",pt:"Guarda de gancho (hook guard)"}, desc:{es:"Variante de guardia abierta en la que se enganchan los pies detrás de las rodillas del rival para controlar su avance y generar ángulos de raspado.",en:"An open guard variant where the feet hook behind the opponent's knees to control their advance and create sweeping angles.",val:"Variant de guàrdia oberta en què s'enganxen els peus darrere dels genolls de l'adversari per a controlar el seu avanç i generar angles de raspat.",pt:"Variante de guarda aberta em que os pés se engancham atrás dos joelhos do adversário para controlar seu avanço e gerar ângulos de raspagem."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"High crotch",en:"High crotch",val:"High crotch",pt:"High crotch"}, desc:{es:"Entrada de lucha a la pierna: el hombro se mete bajo el torso del rival y se agarra a fondo la parte interior de su muslo para elevarlo y proyectarlo hacia un lado; alternativa al doble ataque a piernas cuando el rival deja una pierna adelantada.",en:"A wrestling leg entry: the shoulder goes under the opponent's torso and the inner thigh is grabbed deep, lifting and driving them to one side; an alternative to the double leg when the opponent leaves one leg forward.",val:"Entrada de lluita a la cama: l'espatla es fica baix del tors de l'adversari i s'agafa a fons la part interior de la seua cuixa per a elevar-lo i projectar-lo cap a un costat; alternativa al doble atac a cames quan l'adversari deixa una cama avançada.",pt:"Entrada de luta na perna: o ombro entra sob o tronco do adversário e a parte interna da coxa é agarrada fundo, para elevá-lo e projetá-lo para um lado; alternativa ao ataque às duas pernas quando o adversário deixa uma perna à frente."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Ashi guruma",en:"Ashi guruma",val:"Ashi guruma",pt:"Ashi guruma"}, desc:{es:"Derribo de judo en el que se extiende por completo una pierna como si fuera la barra de una rueda, bloqueando la pierna de apoyo del rival mientras se gira su torso con los brazos para hacerlo pasar por encima de ese eje.",en:"A judo throw where one leg is fully extended like the bar of a wheel, blocking the opponent's supporting leg while their torso is rotated with the arms to send them over that axis.",val:"Derrocament de judo en què s'estén per complet una cama com si fóra la barra d'una roda, bloquejant la cama de suport de l'adversari mentre es gira el seu tors amb els braços per a fer-lo passar per damunt d'eixe eix.",pt:"Queda de judô em que uma perna é totalmente estendida como se fosse a barra de uma roda, bloqueando a perna de apoio do adversário enquanto seu tronco é girado com os braços para fazê-lo passar por cima desse eixo."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Tomoe nage (derribo de sacrificio)",en:"Tomoe nage (sacrifice throw)",val:"Tomoe nage (derrocament de sacrifici)",pt:"Tomoe nage (queda de sacrifício)"}, desc:{es:"Derribo en el que te dejas caer de espaldas colocando un pie en el abdomen del rival para impulsarlo por encima de tu cabeza, terminando arriba pese a caer primero.",en:"A throw where you drop onto your back while placing a foot on the opponent's abdomen to launch them over your head, ending up on top despite falling first.",val:"Derrocament en què et deixes caure d'esquena col·locant un peu a l'abdomen de l'adversari per a impulsar-lo per damunt del teu cap, acabant a dalt malgrat caure primer.",pt:"Queda em que você se deixa cair de costas colocando um pé no abdômen do adversário para impulsioná-lo por cima da sua cabeça, terminando por cima apesar de cair primeiro."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Tortuga",en:"Turtle",val:"Tortuga",pt:"Tartaruga"}, desc:{es:"Posición defensiva boca abajo con las rodillas recogidas bajo el cuerpo y los codos pegados, protegiendo el cuello y la espalda mientras se busca una oportunidad para recuperar la guardia.",en:"A defensive position face-down with the knees tucked under the body and elbows in tight, protecting the neck and back while looking for a chance to recover guard.",val:"Posició defensiva boca avall en els genolls arreplegats baix el cos i els colzes pegats, protegint el coll i l'esquena mentre es busca una oportunitat per a recuperar la guàrdia.",pt:"Posição defensiva de bruços com os joelhos recolhidos sob o corpo e os cotovelos junto ao tronco, protegendo o pescoço e as costas enquanto se busca uma oportunidade para recuperar a guarda."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de paso largo (long step)",en:"Long step pass",val:"Passada de pas llarg (long step)",pt:"Passagem de passo longo (long step)"}, desc:{es:"Pase moderno en el que se da un paso amplio y rápido hacia el lateral del rival, superando sus piernas de golpe antes de que pueda reaccionar y recomponer la guardia.",en:"A modern pass where a wide, quick step is taken to the opponent's side, clearing their legs in one motion before they can react and recompose guard.",val:"Passada moderna en què es dóna un pas ample i ràpid cap al lateral de l'adversari, superant les seues cames de colp abans que puga reaccionar i recompondre la guàrdia.",pt:"Passagem moderna em que se dá um passo amplo e rápido para o lateral do adversário, superando suas pernas de uma vez antes que ele possa reagir e recompor a guarda."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de apilado (stack pass)",en:"Stack pass",val:"Passada d'apilat (stack pass)",pt:"Passagem empilhada (stack pass)"}, desc:{es:"Pase clásico en el que se doblan LAS DOS piernas del rival juntas hacia su propia cara, apilando todo su cuerpo sobre sí mismo para anular su movilidad por completo y avanzar hasta el control lateral.",en:"A classic pass where BOTH of the opponent's legs are folded together toward their own face, stacking their entire body onto itself to completely remove their mobility and advance to side control.",val:"Passada clàssica en què es doblen LES DOS cames de l'adversari juntes cap a la seua propia cara, apilant tot el seu cos sobre si mateix per a anul·lar la seua mobilitat per complet i avançar fins al control lateral.",pt:"Passagem clássica em que AS DUAS pernas do adversário são dobradas juntas em direção ao seu próprio rosto, empilhando todo o seu corpo sobre si mesmo para anular completamente sua mobilidade e avançar até o controle lateral."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pase en X (X-pass)",en:"X-pass",val:"Passada en X (X-pass)",pt:"Passagem em X (X-pass)"}, desc:{es:"Pase moderno que combina un control cruzado de las piernas del rival en forma de X mientras se gira la cadera, creando el ángulo necesario para llegar al costado sin resistencia directa.",en:"A modern pass that combines a crossed control of the opponent's legs in an X shape while rotating the hips, creating the angle needed to reach the side without direct resistance.",val:"Passada moderna que combina un control creuat de les cames de l'adversari en forma de X mentre es gira el maluc, creant l'angle necessari per a arribar al costat sense resistència directa.",pt:"Passagem moderna que combina um controle cruzado das pernas do adversário em forma de X enquanto se gira o quadril, criando o ângulo necessário para chegar ao lateral sem resistência direta."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Triángulo corporal (body triangle)",en:"Body triangle",val:"Triangle corporal (body triangle)",pt:"Triângulo corporal (body triangle)"}, desc:{es:"Control desde la espalda en el que las piernas rodean el cuerpo del rival en forma de triángulo en vez de usar ganchos, aportando más estabilidad y dificultando que se libere.",en:"A back control variant where the legs wrap around the opponent's body in a triangle shape instead of using hooks, providing more stability and making it harder for them to escape.",val:"Control des de l'esquena en què les cames rodegen el cos de l'adversari en forma de triangle en lloc d'usar ganxos, aportant més estabilitat i dificultant que s'alliberi.",pt:"Controle das costas em que as pernas envolvem o corpo do adversário em forma de triângulo em vez de usar ganchos, trazendo mais estabilidade e dificultando que ele se liberte."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Omoplata invertida (reverse omoplata)",en:"Reverse omoplata",val:"Omoplata invertida (reverse omoplata)",pt:"Omoplata invertida (reverse omoplata)"}, desc:{es:"Variante de la omoplata en la que se ataca el hombro contrario al habitual, girando el cuerpo hacia el otro lado del rival para sorprenderlo con un ángulo poco común.",en:"An omoplata variant that attacks the opposite shoulder from the usual one, turning the body toward the other side of the opponent to catch them off guard with an unusual angle.",val:"Variant de l'omoplata en què s'ataca l'espatla contrària a l'habitual, girant el cos cap a l'altre costat de l'adversari per a sorprendre'l amb un angle poc comú.",pt:"Variante da omoplata que ataca o ombro oposto ao habitual, girando o corpo para o outro lado do adversário para surpreendê-lo com um ângulo pouco comum."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guillotina de codo alto (high elbow guillotine)",en:"High elbow guillotine",val:"Guillotina de colze alt (high elbow guillotine)",pt:"Guilhotina de cotovelo alto (high elbow guillotine)"}, desc:{es:"Variante de la guillotina en la que el codo se mantiene elevado y el antebrazo presiona la arteria en vez del centro del cuello, cerrando el ahogo con mucha más eficacia que la versión clásica.",en:"A guillotine variant where the elbow stays elevated and the forearm presses on the artery instead of the center of the neck, closing the choke far more efficiently than the classic version.",val:"Variant de la guillotina en què el colze es manté elevat i l'avantbraç pressiona l'artèria en compte del centre del coll, tancant l'ofegament amb molta més eficàcia que la versió clàssica.",pt:"Variante da guilhotina em que o cotovelo se mantém elevado e o antebraço pressiona a artéria em vez do centro do pescoço, fechando o estrangulamento com muito mais eficácia que a versão clássica."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Suloev stretch",en:"Suloev stretch",val:"Suloev stretch",pt:"Suloev stretch"}, desc:{es:"Sumisión moderna que no busca ahogar: estira la cadera y la rodilla del rival en direcciones opuestas mientras una de sus piernas queda atrapada, generando dolor articular puro desde una guardia invertida.",en:"A modern submission that doesn't aim to choke: it stretches the opponent's hip and knee in opposite directions while one of their legs is trapped, generating pure joint pain from an inverted guard.",val:"Submissió moderna que no busca ofegar: estira el maluc i el genoll de l'adversari en direccions oposades mentre una de les seues cames queda atrapada, generant dolor articular pur des d'una guàrdia invertida.",pt:"Finalização moderna que não busca estrangular: estica o quadril e o joelho do adversário em direções opostas enquanto uma de suas pernas fica presa, gerando dor articular pura a partir de uma guarda invertida."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Derribo de agarre de cuerpo (body lock takedown)",en:"Body lock takedown",val:"Derrocament d'agafada de cos (body lock takedown)",pt:"Queda de agarre de corpo (body lock takedown)"}, desc:{es:"Derribo de lucha en el que se rodea el torso del rival con ambos brazos por debajo de los suyos, caminando hacia un lado para desequilibrarlo y llevarlo al suelo con control total.",en:"A wrestling takedown where both arms wrap around the opponent's torso underneath theirs, walking to one side to off-balance them and bring them to the ground with full control.",val:"Derrocament de lluita en què es rodeja el tors de l'adversari amb ambdós braços per baix dels seus, caminant cap a un costat per a desequilibrar-lo i portar-lo al terra amb control total.",pt:"Queda de luta em que se envolve o tronco do adversário com os dois braços por baixo dos dele, caminhando para um lado para desequilibrá-lo e levá-lo ao chão com controle total."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Montada en S (S-mount)",en:"S-mount",val:"Muntada en S (S-mount)",pt:"Montada em S (S-mount)"}, desc:{es:"Variante de la montada en la que una pierna cruza alta sobre el torso del rival mientras la otra se dobla junto a su cadera, formando una S que facilita mucho el armbar y ciertos estrangulamientos.",en:"A mount variant where one leg crosses high over the opponent's torso while the other bends beside their hip, forming an S shape that makes the armbar and certain chokes much easier.",val:"Variant de la muntada en què una cama creua alta sobre el tors de l'adversari mentre l'altra es doblega junt a la seua maluc, formant una S que facilita molt l'armbar i certs estrangulaments.",pt:"Variante da montada em que uma perna cruza alta sobre o tronco do adversário enquanto a outra se dobra junto ao seu quadril, formando um S que facilita muito o armlock e certos estrangulamentos."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi"], name:{es:"Estrangulación en S-mount (palm-up palm-down)",en:"S-mount choke (palm-up palm-down)",val:"Estrangulació en S-mount (palm-up palm-down)",pt:"Estrangulamento em S-mount (palm-up palm-down)"}, desc:{es:"Ahogo aplicado desde la montada en S agarrando el cuello con una mano hacia arriba y la otra hacia abajo, cerrando la presión al girar ambas muñecas en direcciones opuestas.",en:"A choke applied from S-mount gripping the collar with one hand palm-up and the other palm-down, closing the pressure by rotating both wrists in opposite directions.",val:"Ofegament aplicat des de la muntada en S agarrant el coll amb una mà cap amunt i l'altra cap avall, tancant la pressió en girar ambdós canells en direccions oposades.",pt:"Estrangulamento aplicado a partir da montada em S agarrando o colarinho com uma mão para cima e a outra para baixo, fechando a pressão ao girar os dois pulsos em direções opostas."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Triángulo desde montada (mounted triangle)",en:"Mounted triangle",val:"Triangle des de muntada (mounted triangle)",pt:"Triângulo montado (mounted triangle)"}, desc:{es:"Entrada al triángulo aprovechando que el rival intenta empujarte desde debajo de la montada, atrapando su brazo y cabeza con las piernas antes de que pueda recomponer la postura.",en:"An entry into the triangle that capitalizes on the opponent pushing up from underneath mount, trapping their arm and head with the legs before they can recompose posture.",val:"Entrada al triangle aprofitant que l'adversari intenta empényer-te des de baix de la muntada, atrapant el seu braç i cap amb les cames abans que puga recompondre la postura.",pt:"Entrada no triângulo aproveitando que o adversário tenta empurrar de baixo da montada, prendendo seu braço e cabeça com as pernas antes que ele possa recompor a postura."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Harai goshi",en:"Harai goshi",val:"Harai goshi",pt:"Harai goshi"}, desc:{es:"Derribo de judo de cadera con barrido: el muslo del rival es barrido hacia arriba y atrás con tu propia pierna mientras la cadera gira contra su cuerpo, sumando la fuerza del barrido y la de la cadera.",en:"A hip judo throw with a sweep: the opponent's thigh is swept up and back with your own leg while your hip turns against their body, adding the force of the sweep to that of the hip.",val:"Derrocament de judo de maluc amb escombrada: la cuixa de l'adversari és escombrada cap amunt i cap arrere amb la teua pròpia cama mentre el maluc gira contra el seu cos, sumant la força de l'escombrada i la del maluc.",pt:"Queda de judô de quadril com varredura: a coxa do adversário é varrida para cima e para trás com a sua própria perna enquanto o quadril gira contra o corpo dele, somando a força da varredura à do quadril."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guardia coyote (coyote guard)",en:"Coyote guard",val:"Guàrdia coiot (coyote guard)",pt:"Guarda coiote (coyote guard)"}, desc:{es:"Guardia moderna sentada en la que se controla una manga y el mismo lado de la cadera del rival, usando el propio pie para bloquear su cadera contraria y crear ángulos de raspado poco convencionales.",en:"A modern seated guard where a sleeve and the same-side hip of the opponent are controlled, using your own foot to block their opposite hip and create unconventional sweeping angles.",val:"Guàrdia moderna asseguda en què es controla una mànega i el mateix costat del maluc de l'adversari, usant el propi peu per a bloquejar el seu maluc contrari i crear angles de raspat poc convencionals.",pt:"Guarda moderna sentada em que se controla uma manga e o mesmo lado do quadril do adversário, usando o próprio pé para bloquear seu quadril contrário e criar ângulos de raspagem pouco convencionais."}},
  {cat:"control", level:"avanzado", tags:["gi","no-gi"], name:{es:"Control lateral invertido (twister side control)",en:"Twister side control",val:"Control lateral invertit (twister side control)",pt:"Controle lateral invertido (twister side control)"}, desc:{es:"Desde el control lateral clásico, el pecho sigue pegado al del rival pero el cuerpo se orienta hacia sus piernas; con la cabeza a la altura de su cadera, sus brazos pierden ángulo para crear espacio y se abre el camino hacia la montada.",en:"From classic side control, your chest stays glued to the opponent's but your body faces their legs; with your head near their hip, their arms lose the angle to create space and the path to mount opens.",val:"Des del control lateral clàssic, el pit continua apegat al de l'adversari però el cos s'orienta cap a les seues cames; amb el cap a l'altura del seu maluc, els seus braços perden angle per a crear espai i s'obri el camí cap a la muntada.",pt:"A partir do controle lateral clássico, o peito continua colado ao do adversário, mas o corpo se orienta para as pernas dele; com a cabeça na altura do quadril dele, seus braços perdem o ângulo para criar espaço e abre-se o caminho para a montada."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de doble gancho inferior (double under pass)",en:"Double under pass",val:"Passada de doble ganxo inferior (double under pass)",pt:"Passagem de duplo gancho inferior (double under pass)"}, desc:{es:"Pase en el que se meten ambos brazos por debajo de las piernas del rival levantándolas juntas, para luego avanzar el peso corporal y aplastar la guardia hasta llegar al lateral.",en:"A pass where both arms are threaded underneath the opponent's legs, lifting them together, then driving the body weight forward to smash the guard and reach the side.",val:"Passada en què es fiquen ambdós braços per baix de les cames de l'adversari alçant-les juntes, per a després avançar el pes corporal i aplastar la guàrdia fins a arribar al lateral.",pt:"Passagem em que os dois braços são enfiados por baixo das pernas do adversário, levantando-as juntas, para então avançar o peso corporal e esmagar a guarda até chegar ao lateral."}},
  {cat:"control", level:"avanzado", tags:["gi","no-gi"], name:{es:"Toma de espalda desde tortuga (spin to back)",en:"Spin to back from turtle",val:"Presa d'esquena des de tortuga (spin to back)",pt:"Pegada das costas a partir da tartaruga (spin to back)"}, desc:{es:"Desde encima de un rival en tortuga, se gira rápidamente hacia un lado insertando ambos ganchos antes de que pueda reaccionar, asegurando el control de espalda completo.",en:"From on top of an opponent in turtle, you quickly spin to one side inserting both hooks before they can react, securing full back control.",val:"Des de damunt d'un adversari en tortuga, es gira ràpidament cap a un costat inserint ambdós ganxos abans que puga reaccionar, assegurant el control d'esquena complet.",pt:"De cima de um adversário na tartaruga, gira-se rapidamente para um lado inserindo os dois ganchos antes que ele possa reagir, garantindo o controle total das costas."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Crab ride",en:"Crab ride",val:"Crab ride",pt:"Crab ride"}, desc:{es:"Posición de transición sobre las piernas del rival cuando este está en tortuga, controlando un tobillo mientras se monta sobre su espalda baja, usada como paso intermedio hacia un ataque de pierna o la toma de espalda.",en:"A transitional position over the opponent's legs while they're in turtle, controlling one ankle while riding their lower back, used as a stepping stone toward a leg attack or taking the back.",val:"Posició de transició sobre les cames de l'adversari quan este està en tortuga, controlant un turmell mentre es munta sobre la seua esquena baixa, usada com a pas intermedi cap a un atac de cama o la presa d'esquena.",pt:"Posição de transição sobre as pernas do adversário quando ele está na tartaruga, controlando um tornozelo enquanto se monta sobre sua lombar, usada como passo intermediário para um ataque de perna ou a pegada das costas."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pillbug choke",en:"Pillbug choke",val:"Pillbug choke",pt:"Pillbug choke"}, desc:{es:"Estrangulación que aprovecha el propio brazo del rival cruzado sobre su cuello desde una posición de control lateral o norte-sur, cerrando el ahogo al doblarlo contra sí mismo.",en:"A choke that uses the opponent's own arm crossed over their neck from a side control or north-south position, closing it by folding the arm back onto themselves.",val:"Estrangulació que aprofita el propi braç de l'adversari creuat sobre el seu coll des d'una posició de control lateral o nord-sud, tancant l'ofegament en doblegar-lo contra si mateix.",pt:"Estrangulamento que aproveita o próprio braço do adversário cruzado sobre seu pescoço a partir de uma posição de controle lateral ou norte-sul, fechando ao dobrá-lo contra ele mesmo."}},
  {cat:"control", level:"avanzado", tags:["gi","no-gi"], name:{es:"Sankaku interior (inside sankaku)",en:"Inside sankaku",val:"Sankaku interior (inside sankaku)",pt:"Sankaku interno (inside sankaku)"}, desc:{es:"Control de pierna por dentro: tus piernas cierran un triángulo alrededor de la pierna del rival, con su rodilla atrapada dentro del triángulo y su talón expuesto, lo que abre el camino a los ataques de tobillo y rodilla más rotacionales.",en:"An inside leg control: your legs close a triangle around the opponent's leg, with their knee trapped inside the triangle and their heel exposed, opening the way to the more rotational ankle and knee attacks.",val:"Control de cama per dins: les teues cames tanquen un triangle al voltant de la cama de l'adversari, amb el seu genoll atrapat dins del triangle i el seu taló exposat, la qual cosa obri el camí als atacs de turmell i genoll més rotacionals.",pt:"Controle de perna por dentro: suas pernas fecham um triângulo ao redor da perna do adversário, com o joelho dele preso dentro do triângulo e o calcanhar exposto, abrindo caminho para os ataques de tornozelo e joelho mais rotacionais."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Aoki lock",en:"Aoki lock",val:"Aoki lock",pt:"Aoki lock"}, desc:{es:"Sumisión de pierna que combina una torsión con una extensión aplicada sobre una pierna ya controlada en 50/50 o ashi garami, atacando la rodilla desde un ángulo que la clave de tobillo clásica no alcanza.",en:"A leg submission that combines a twist with an extension applied to a leg already controlled in 50/50 or ashi garami, attacking the knee from an angle the classic ankle lock doesn't reach.",val:"Submissió de cama que combina una torsió amb una extensió aplicada sobre una cama ja controlada en 50/50 o ashi garami, atacant el genoll des d'un angle que la clau de turmell clàssica no aconseguix.",pt:"Finalização de perna que combina uma torção com uma extensão aplicada sobre uma perna já controlada em 50/50 ou ashi garami, atacando o joelho a partir de um ângulo que a chave de tornozelo clássica não alcança."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Snap down",en:"Snap down",val:"Snap down",pt:"Snap down"}, desc:{es:"Técnica de lucha en la que se tira de la cabeza del rival hacia abajo y hacia delante mientras se empuja su torso, rompiendo su postura y llevándolo a la tortuga o al suelo.",en:"A wrestling technique where the opponent's head is pulled down and forward while their torso is pushed, breaking their posture and taking them to turtle or the ground.",val:"Tècnica de lluita en què es tira del cap de l'adversari cap avall i cap avant mentre s'empeny el seu tors, trencant la seua postura i portant-lo a la tortuga o al terra.",pt:"Técnica de luta em que a cabeça do adversário é puxada para baixo e para frente enquanto seu tronco é empurrado, quebrando sua postura e levando-o à tartaruga ou ao chão."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], name:{es:"Arrastre de brazo (arm drag)",en:"Arm drag",val:"Arrossegament de braç (arm drag)",pt:"Arrastão de braço (arm drag)"}, desc:{es:"Desde una guardia sentada o abierta, se tira del brazo del rival hacia un lado para romper su postura y pasar a su espalda; de pie se usa también como entrada a un derribo.",en:"From a seated or open guard, you pull the opponent's arm across to one side to break their posture and get behind them; standing, it is also used as an entry to a takedown.",val:"Des d'una guàrdia asseguda o oberta, s'estira del braç de l'adversari cap a un costat per a trencar la seua postura i passar a la seua esquena; dret també s'usa com a entrada a un derrocament.",pt:"A partir de uma guarda sentada ou aberta, puxa-se o braço do adversário para um lado para quebrar sua postura e passar para as costas dele; em pé, também é usado como entrada para uma queda."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Cabezal de lucha (front headlock)",en:"Front headlock",val:"Capçal de lluita (front headlock)",pt:"Cabeçal de luta (front headlock)"}, desc:{es:"Control de pie o de rodillas en el que se envuelve la cabeza del rival con un brazo tras un snap down, usado como base para guillotinas, D'Arces o para llevarlo a la tortuga.",en:"A standing or kneeling control where the opponent's head is wrapped with one arm after a snap down, used as a base for guillotines, D'Arces, or taking them to turtle.",val:"Control dret o de genolls en què s'envolta el cap de l'adversari amb un braç després d'un snap down, usat com a base per a guillotines, D'Arces o per a portar-lo a la tortuga.",pt:"Controle em pé ou de joelhos em que a cabeça do adversário é envolvida com um braço após um snap down, usado como base para guilhotinas, D'Arces ou para levá-lo à tartaruga."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de plegado (folding pass)",en:"Folding pass",val:"Passada de plegat (folding pass)",pt:"Passagem dobrada (folding pass)"}, desc:{es:"Pase en el que solo UNA pierna del rival se dobla contra su pecho mientras la otra se controla por separado con la mano libre, plegando ese lado de su cuerpo para anular su opción de recuperar la guardia.",en:"A pass where only ONE of the opponent's legs is folded against their chest while the other is controlled separately with the free hand, folding that side of their body to remove their option of recovering guard.",val:"Passada en què només UNA cama de l'adversari es doblega contra el seu pit mentre l'altra es controla per separat amb la mà lliure, plegant eixe costat del seu cos per a anul·lar la seua opció de recuperar la guàrdia.",pt:"Passagem em que apenas UMA perna do adversário é dobrada contra o peito enquanto a outra é controlada separadamente com a mão livre, dobrando esse lado do corpo dele para anular sua opção de recuperar a guarda."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Marceloplata",en:"Marceloplata",val:"Marceloplata",pt:"Marceloplata"}, desc:{es:"Transición desde la guardia de araña en la que se combina el control de una manga con la entrada a un triángulo o guillotina, aprovechando que el rival intenta liberar el brazo atrapado.",en:"A transition from spider guard that combines sleeve control with the entry to a triangle or guillotine, capitalizing on the opponent trying to free their trapped arm.",val:"Transició des de la guàrdia aranya en què es combina el control d'una mànega amb l'entrada a un triangle o guillotina, aprofitant que l'adversari intenta alliberar el braç atrapat.",pt:"Transição a partir da guarda aranha que combina o controle de uma manga com a entrada em um triângulo ou guilhotina, aproveitando que o adversário tenta liberar o braço preso."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Sit-out",en:"Sit-out",val:"Sit-out",pt:"Sit-out"}, desc:{es:"Movimiento de lucha en el que se gira la cadera hacia atrás pasando por debajo del propio cuerpo para escapar de un control desde arriba y quedar mirando hacia el rival.",en:"A wrestling movement where the hip rotates backward, passing underneath your own body to escape a top control and end up facing the opponent.",val:"Moviment de lluita en què es gira el maluc cap arrere passant per baix del propi cos per a escapar d'un control des de dalt i quedar mirant cap a l'adversari.",pt:"Movimento de luta em que o quadril gira para trás passando por baixo do próprio corpo para escapar de um controle por cima e ficar de frente para o adversário."}},
  {cat:"escapes", level:"avanzado", tags:["gi","no-gi"], name:{es:"Granby roll",en:"Granby roll",val:"Granby roll",pt:"Granby roll"}, desc:{es:"Voltereta hacia atrás sobre un hombro que permite escapar de un control desde arriba o invertir la posición, muy usada para recuperar la guardia desde situaciones comprometidas.",en:"A backward roll over one shoulder that allows escaping a top control or reversing the position, widely used to recover guard from compromised situations.",val:"Voltereta cap arrere sobre una espatla que permet escapar d'un control des de dalt o invertir la posició, molt usada per a recuperar la guàrdia des de situacions compromeses.",pt:"Cambalhota para trás sobre um ombro que permite escapar de um controle por cima ou inverter a posição, muito usada para recuperar a guarda a partir de situações comprometidas."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Finalización de single leg (running the pipe)",en:"Single leg finish (running the pipe)",val:"Finalisació de single leg (running the pipe)",pt:"Finalização de single leg (running the pipe)"}, desc:{es:"Remate de la entrada a una pierna en el que se rodea la pierna del rival con ambos brazos y se camina alrededor de ella hasta derribarlo, sin soltar el control en ningún momento.",en:"A finish to a single-leg entry where both arms wrap around the opponent's leg and you walk around it until they fall, never releasing control.",val:"Rematada de l'entrada a una cama en què es rodeja la cama de l'adversari amb ambdós braços i es camina al voltant d'ella fins a derrocar-lo, sense soltar el control en cap moment.",pt:"Remate da entrada em uma perna em que os dois braços envolvem a perna do adversário e você caminha ao redor dela até derrubá-lo, sem soltar o controle em nenhum momento."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Guillotina de brazo dentro (arm-in guillotine)",en:"Arm-in guillotine",val:"Guillotina de braç dins (arm-in guillotine)",pt:"Guilhotina com braço dentro (arm-in guillotine)"}, desc:{es:"Variante de la guillotina en la que se atrapa también uno de los brazos del rival dentro del agarre, quitándole una defensa clave y facilitando mucho el cierre del ahogo.",en:"A guillotine variant where one of the opponent's arms is also trapped inside the grip, removing a key defense and making it much easier to close the choke.",val:"Variant de la guillotina en què s'atrapa també un dels braços de l'adversari dins de l'agafada, llevant-li una defensa clau i facilitant molt el tancament de l'ofegament.",pt:"Variante da guilhotina em que um dos braços do adversário também é preso dentro da pegada, retirando uma defesa importante e facilitando muito o fechamento do estrangulamento."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de agarre de cuerpo (body lock pass)",en:"Body lock pass",val:"Passada d'agafada de cos (body lock pass)",pt:"Passagem de agarre de corpo (body lock pass)"}, desc:{es:"Pase por encima de la guardia con agarre de cuerpo: ya de rodillas o de pie sobre el rival, se rodea su torso bajo las axilas, se pega el pecho al suyo y se camina hacia el lateral para superar sus piernas sin que recomponga la guardia.",en:"A pass over the guard using a body lock: already on your knees or feet over the opponent, you wrap their torso under the armpits, press your chest to theirs and walk to the side to clear their legs before they recompose guard.",val:"Passada per damunt de la guàrdia amb agafada de cos: ja de genolls o dret damunt l'adversari, es rodeja el seu tors per baix de les aixelles, s'apega el pit al seu i es camina cap al lateral per a superar-li les cames sense que recomponga la guàrdia.",pt:"Passagem por cima da guarda com pegada de corpo: já de joelhos ou em pé sobre o adversário, envolve-se o tronco dele sob as axilas, cola-se o peito ao dele e caminha-se para o lateral para superar suas pernas sem que ele recomponha a guarda."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Retención de guardia (guard retention)",en:"Guard retention",val:"Retenció de guàrdia (guard retention)",pt:"Retenção de guarda (guard retention)"}, desc:{es:"Conjunto de movimientos de cadera y piernas usados para reconstruir la guardia justo cuando el rival intenta pasarla, recolocando rodillas y pies antes de perder la posición por completo.",en:"A set of hip and leg movements used to rebuild guard right as the opponent tries to pass it, resetting knees and feet before the position is lost completely.",val:"Conjunt de moviments de maluc i cames usats per a reconstruir la guàrdia justet quan l'adversari intenta passar-la, recol·locant genolls i peus abans de perdre la posició per complet.",pt:"Conjunto de movimentos de quadril e pernas usados para reconstruir a guarda bem quando o adversário tenta passá-la, reposicionando joelhos e pés antes de perder a posição por completo."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Encadenado de derribos (chain wrestling)",en:"Chain wrestling",val:"Encadenat de derrocaments (chain wrestling)",pt:"Encadeamento de quedas (chain wrestling)"}, desc:{es:"Enlazar varios intentos de derribo sin detenerse, pasando de uno a otro apenas el rival defiende el primero, hasta conseguir llevarlo al suelo.",en:"Linking several takedown attempts without stopping, moving from one to the next as soon as the opponent defends the first, until finally bringing them to the ground.",val:"Enllaçar diversos intents de derrocament sense parar, passant d'un a un altre tan prompte com l'adversari defén el primer, fins a aconseguir portar-lo al terra.",pt:"Encadear várias tentativas de queda sem parar, passando de uma para outra assim que o adversário defende a primeira, até conseguir levá-lo ao chão."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Kata gatame (control de cabeza y brazo)",en:"Kata gatame (head-and-arm hold)",val:"Kata gatame (control de cap i braç)",pt:"Kata gatame (controle de cabeça e braço)"}, desc:{es:"Inmovilización de judo: la cabeza y un brazo del rival quedan atrapados contra tu hombro y las manos se juntan, anulando su movimiento desde el lateral. Es el control previo desde el que se cierra el arm-triangle.",en:"A judo pin: the opponent's head and one arm are trapped against your shoulder and the hands clasp, shutting down their movement from the side. It is the control from which the arm-triangle is finished.",val:"Immobilització de judo: el cap i un braç de l'adversari queden atrapats contra la teua espatla i les mans s'ajunten, anul·lant el seu moviment des del lateral. És el control previ des del qual es tanca l'arm-triangle.",pt:"Imobilização do judô: a cabeça e um braço do adversário ficam presos contra o seu ombro e as mãos se juntam, anulando o movimento dele a partir do lateral. É o controle prévio a partir do qual o arm-triangle é finalizado."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], name:{es:"Guardia sentada (sit-up guard)",en:"Sit-up guard",val:"Guàrdia asseguda (sit-up guard)",pt:"Guarda sentada (sit-up guard)"}, desc:{es:"Variante básica de la guardia abierta en la que te incorporas hacia el rival controlando sus mangas o muñecas, usando el propio tronco para bloquear su avance mientras buscas un raspado.",en:"A basic open guard variant where you sit up toward the opponent controlling their sleeves or wrists, using your own torso to block their advance while looking for a sweep.",val:"Variant bàsica de la guàrdia oberta en què t'incorpores cap a l'adversari controlant les seues mànegues o canells, usant el propi tronc per a bloquejar el seu avanç mentre busques un raspat.",pt:"Variante básica da guarda aberta em que você se senta em direção ao adversário controlando suas mangas ou pulsos, usando o próprio tronco para bloquear seu avanço enquanto busca uma raspagem."}},
  {cat:"guardias", level:"intermedio", tags:["gi","no-gi"], name:{es:"Williams guard",en:"Williams guard",val:"Williams guard",pt:"Williams guard"}, desc:{es:"Variante de la media guardia en la que la pierna de abajo bloquea profundamente la cadera del rival mientras el propio brazo controla su cintura, dificultando mucho que consiga aplastarte.",en:"A half guard variant where the bottom leg deeply blocks the opponent's hip while your arm controls their waist, making it much harder for them to flatten you out.",val:"Variant de la mitja guàrdia en què la cama de baix bloqueja profundament el maluc de l'adversari mentre el propi braç controla la seua cintura, dificultant molt que aconseguisca aplastar-te.",pt:"Variante da meia guarda em que a perna de baixo bloqueia profundamente o quadril do adversário enquanto seu braço controla sua cintura, dificultando muito que ele consiga te achatar."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Sukui nage (derribo de cuchara)",en:"Sukui nage (scoop throw)",val:"Sukui nage (derrocament de cullera)",pt:"Sukui nage (queda de colher)"}, desc:{es:"Derribo en el que se agacha por debajo del rival rodeando su cadera o pierna con ambos brazos, levantándolo del suelo como si se le recogiera con una cuchara antes de dejarlo caer.",en:"A takedown where you duck beneath the opponent wrapping their hip or leg with both arms, scooping them off the ground before letting them fall.",val:"Derrocament en què s'agaixa per baix de l'adversari rodejant el seu maluc o cama amb ambdós braços, alçant-lo del terra com si es recollira amb una cullera abans de deixar-lo caure.",pt:"Queda em que você se agacha por baixo do adversário envolvendo seu quadril ou perna com os dois braços, erguendo-o do chão como se fosse recolhido com uma colher antes de deixá-lo cair."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de rodilla cruzada (cross-knee pass)",en:"Cross-knee pass",val:"Passada de genoll creuat (cross-knee pass)",pt:"Passagem de joelho cruzado (cross-knee pass)"}, desc:{es:"La rodilla atraviesa el centro de las piernas del rival y cruza por encima de su cadera mientras se controla su cabeza o su brazo contrario; a diferencia del knee slide, que se asienta en control, este pase sigue directo hasta montada.",en:"The knee cuts through the middle of the opponent's legs and crosses over their hip while their head or opposite arm is controlled; unlike the knee slide, which settles into control, this pass continues straight to mount.",val:"El genoll travessa el centre de les cames de l'adversari i creua per damunt del seu maluc mentre es controla el seu cap o el braç contrari; a diferència del knee slide, que s'assenta en control, esta passada continua directament fins a muntada.",pt:"O joelho atravessa o centro das pernas do adversário e cruza por cima do quadril dele enquanto sua cabeça ou o braço oposto é controlado; ao contrário do knee slide, que se assenta em controle, esta passagem segue direto até a montada."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Kimura desde la espalda (back kimura)",en:"Back kimura",val:"Kimura des de l'esquena (back kimura)",pt:"Kimura das costas (back kimura)"}, desc:{es:"Aplicación de la kimura desde el control de espalda, atrapando el brazo del rival antes de que pueda defenderse mientras se mantienen los ganchos asegurados.",en:"An application of the kimura from back control, trapping the opponent's arm before they can defend while keeping the hooks secured.",val:"Aplicació de la kimura des del control d'esquena, atrapant el braç de l'adversari abans que puga defendre's mentre es mantenen els ganxos assegurats.",pt:"Aplicação da kimura a partir do controle das costas, prendendo o braço do adversário antes que ele possa se defender enquanto os ganchos são mantidos seguros."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Levantada técnica (technical stand-up)",en:"Technical stand-up",val:"Alçada tècnica (technical stand-up)",pt:"Levantada técnica (technical stand-up)"}, desc:{es:"Forma de ponerse de pie desde el suelo manteniendo siempre una mano y una pierna como base, sin dar nunca la espalda al rival durante la subida.",en:"A way of standing up from the ground while always keeping one hand and one leg as a base, never turning your back to the opponent during the rise.",val:"Forma de posar-se dret des del terra mantenint sempre una mà i una cama com a base, sense donar mai l'esquena a l'adversari durant la pujada.",pt:"Forma de ficar de pé a partir do chão mantendo sempre uma mão e uma perna como base, nunca dando as costas ao adversário durante a subida."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de estrangulación norte-sur (north-south choke escape)",en:"North-south choke escape",val:"Escapada d'estrangulació nord-sud (north-south choke escape)",pt:"Fuga da estrangulação norte-sul (north-south choke escape)"}, desc:{es:"Con la estrangulación norte-sur ya colocada, se mete una mano bajo la barbilla para abrir espacio en el cuello y se gira de lado empujando la cadera del rival, sacando la cabeza de la presión para volver a la guardia.",en:"With the north-south choke already set, one hand is slipped under the chin to open space at the neck and you turn onto your side, pushing the opponent's hip to pull the head out of the pressure and get back to guard.",val:"Amb l'estrangulació nord-sud ja col·locada, es fica una mà baix de la barbeta per a obrir espai al coll i es gira de costat empenyent el maluc de l'adversari, traient el cap de la pressió per a tornar a la guàrdia.",pt:"Com a estrangulação norte-sul já encaixada, coloca-se uma mão sob o queixo para abrir espaço no pescoço e gira-se de lado empurrando o quadril do adversário, tirando a cabeça da pressão para voltar à guarda."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Bulldog choke",en:"Bulldog choke",val:"Bulldog choke",pt:"Bulldog choke"}, desc:{es:"Estrangulación lateral contra un rival en cuatro apoyos: un brazo se cuela bajo su barbilla desde el costado y el pecho y el hombro aplastan su cabeza hacia el suelo, sin necesidad de atrapar su brazo.",en:"A side choke against an opponent on all fours: one arm slips under the chin from the side while your chest and shoulder press their head to the mat, without needing to trap their arm.",val:"Estrangulació lateral contra un adversari a quatre grapes: un braç es cola baix de la barbeta des del costat i el pit i l'espatla aixafen el seu cap contra el terra, sense necessitat d'atrapar el seu braç.",pt:"Estrangulamento lateral contra um adversário de quatro apoios: um braço se encaixa sob o queixo pelo lado enquanto o peito e o ombro pressionam a cabeça dele contra o chão, sem precisar prender o braço dele."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Cattle catch (captura de ganado)",en:"Cattle catch",val:"Cattle catch (captura de bestiar)",pt:"Cattle catch (captura de gado)"}, desc:{es:"A diferencia del ashi garami de una sola pierna, aquí se atrapan LAS DOS piernas del rival cruzadas entre sí, un control moderno que sienta las bases para varios ataques de tobillo y rodilla simultáneos.",en:"Unlike single-leg ashi garami, here BOTH of the opponent's legs are trapped crossed over each other — a modern control that sets up several simultaneous ankle and knee attacks.",val:"A diferència de l'ashi garami d'una sola cama, ací s'atrapen LES DOS cames de l'adversari creuades entre si, un control modern que assenta les bases per a diversos atacs de turmell i genoll simultanis.",pt:"Diferente do ashi garami de uma só perna, aqui AS DUAS pernas do adversário são presas cruzadas entre si, um controle moderno que prepara vários ataques simultâneos de tornozelo e joelho."}},
  {cat:"derribos", level:"avanzado", tags:["gi","no-gi"], name:{es:"Tai otoshi (derribo de cuerpo)",en:"Tai otoshi (body drop)",val:"Tai otoshi (derrocament de cos)",pt:"Tai otoshi (queda de corpo)"}, desc:{es:"Derribo de judo en el que la pierna se dobla y se planta como un simple obstáculo frente al rival: es el tirón de su manga y solapa, no la pierna, lo que lo hace caer por encima de ese bloqueo.",en:"A judo throw where the leg bends and plants as a simple obstacle in front of the opponent: it's the pull on their sleeve and lapel, not the leg, that makes them fall over that block.",val:"Derrocament de judo en què la cama es doblega i es planta com un simple obstacle davant l'adversari: és l'estirada de la seua mànega i solapa, no la cama, el que el fa caure per damunt d'eixe bloqueig.",pt:"Queda de judô em que a perna se dobra e se planta como um simples obstáculo diante do adversário: é o puxão de sua manga e lapela, não a perna, que o faz cair por cima desse bloqueio."}},
  {cat:"pases", level:"avanzado", tags:["gi"], name:{es:"Pase de agarre de solapa (lapel drag pass)",en:"Lapel drag pass",val:"Passada d'agafada de solapa (lapel drag pass)",pt:"Passagem de puxão de lapela (lapel drag pass)"}, desc:{es:"Pase con kimono en el que se tira de la propia solapa cruzándola por detrás de una pierna del rival, usándola como palanca para arrastrarlo y anular su guardia.",en:"A gi pass where your own lapel is pulled across behind one of the opponent's legs, using it as leverage to drag them and neutralize their guard.",val:"Passada en quimono en què es tira de la propia solapa creuant-la per darrere d'una cama de l'adversari, usant-la com a palanca per a arrossegar-lo i anul·lar la seua guàrdia.",pt:"Passagem com quimono em que a própria lapela é puxada cruzando-a por trás de uma perna do adversário, usando-a como alavanca para arrastá-lo e anular sua guarda."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Ashi garami básico",en:"Basic ashi garami",val:"Ashi garami bàsic",pt:"Ashi garami básico"}, desc:{es:"El agarre de pierna más elemental de todos: una sola pierna del rival queda envuelta de forma simple con tus piernas y cadera, sin ninguna configuración especial, formando el punto de partida del que derivan variantes más específicas como el sankaku o la guardia 50/50.",en:"The most basic leg grip of all: a single one of the opponent's legs is simply wrapped with your own legs and hip, with no special configuration, forming the starting point from which more specific variants like the sankaku or 50/50 guard derive.",val:"L'agafada de cama més elemental de tots: una sola cama de l'adversari queda envolta de forma simple amb les teues cames i maluc, sense cap configuració especial, formant el punt de partida del qual deriven variants més específiques com el sankaku o la guàrdia 50/50.",pt:"A pegada de perna mais elementar de todas: apenas uma perna do adversário é envolvida de forma simples com suas pernas e quadril, sem nenhuma configuração especial, formando o ponto de partida do qual derivam variantes mais específicas como o sankaku ou a guarda 50/50."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Koshiguruma (rueda de cadera)",en:"Koshiguruma (hip wheel)",val:"Koshiguruma (roda de maluc)",pt:"Koshiguruma (roda de quadril)"}, desc:{es:"Derribo de judo de cadera con el brazo al cuello: un brazo rodea la nuca del rival en vez de la cintura y la cadera actúa como eje de rueda sobre el que su cuerpo gira, con la cabeza y los hombros controlados durante toda la caída.",en:"A hip judo throw with an arm around the neck: one arm wraps the opponent's neck rather than the waist and the hip acts as a wheel axis their body rotates around, keeping their head and shoulders controlled throughout the fall.",val:"Derrocament de judo de maluc amb el braç al coll: un braç rodeja la nuca de l'adversari en lloc de la cintura i el maluc fa d'eix de roda sobre el qual gira el seu cos, amb el cap i les espatlles controlats durant tota la caiguda.",pt:"Queda de judô de quadril com o braço no pescoço: um braço envolve a nuca do adversário em vez da cintura e o quadril funciona como eixo de roda em torno do qual o corpo dele gira, com cabeça e ombros controlados durante toda a queda."}},
  {cat:"guardias", level:"intermedio", tags:["gi","no-gi"], name:{es:"Guardia de cuarto (quarter guard)",en:"Quarter guard",val:"Guàrdia de quart (quarter guard)",pt:"Guarda de quarto (quarter guard)"}, desc:{es:"Variante muy reducida de la media guardia en la que solo se controla el pie o el tobillo del rival con las piernas, sin llegar a atrapar la rodilla por completo; sirve como último recurso antes de perder la guardia del todo.",en:"A very reduced half guard variant where only the opponent's foot or ankle is controlled with the legs, without fully trapping the knee — a last resort before losing guard entirely.",val:"Variant molt reduïda de la mitja guàrdia en què només es controla el peu o el turmell de l'adversari amb les cames, sense arribar a atrapar el genoll per complet; servix com a últim recurs abans de perdre la guàrdia del tot.",pt:"Variante muito reduzida da meia guarda em que apenas o pé ou tornozelo do adversário é controlado com as pernas, sem chegar a prender o joelho por completo; serve como último recurso antes de perder a guarda por completo."}},
