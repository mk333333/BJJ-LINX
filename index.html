<script>
/* ===== Fondo personalizable con contraste automático (WCAG) ===== */
(function(){
  var KEY = 'bjjlinx_bgcolor', META_DEFAULT = '#00B5E6';
  var root = document.documentElement;
  var DARK = [13,33,38], LIGHT = [255,255,255];
  function h2r(h){ h = String(h).replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
  function r2h(c){ return '#' + c.map(function(v){ v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
  function lin(v){ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
  function lum(c){ return 0.2126*lin(c[0]) + 0.7152*lin(c[1]) + 0.0722*lin(c[2]); }
  function cr(a,b){ var x = lum(a), y = lum(b); return (Math.max(x,y)+0.05) / (Math.min(x,y)+0.05); }
  function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  /* Contraste mínimo frente a uno o varios fondos (el degradado de la cabecera tiene dos extremos). */
  function crm(fg,bgs){ if(bgs[0] && bgs[0].length === 3 && typeof bgs[0][0] === 'number') { var m = 99; for(var i=0;i<bgs.length;i++){ m = Math.min(m, cr(fg,bgs[i])); } return m; } return cr(fg,bgs); }
  function best(bgs){
    if(!(bgs[0] instanceof Array)) bgs = [bgs];
    var d = crm(DARK,bgs), l = crm(LIGHT,bgs), pick = d >= l ? DARK : LIGHT;
    if(Math.max(d,l) < 4.5){ var k = crm([0,0,0],bgs), w = crm([255,255,255],bgs); pick = k >= w ? [0,0,0] : [255,255,255]; }
    return pick;
  }
  /* Extremo superior del degradado de la cabecera: se aleja del color del texto para no restarle contraste. */
  function altFor(bg){ var t = best([bg]); return lum(t) > 0.4 ? mix(bg, [0,0,0], 0.10) : mix(bg, [255,255,255], 0.10); }
  function ensure(fg,bgs,min,target){
    if(!(bgs[0] instanceof Array)) bgs = [bgs];
    if(crm(fg,bgs) >= min) return fg;
    for(var t=0.05;t<=1.0001;t+=0.05){ var c = mix(fg,target,t); c = [Math.round(c[0]),Math.round(c[1]),Math.round(c[2])]; if(crm(c,bgs) >= min) return c; }
    return target;
  }
  function valid(h){ return typeof h === 'string' && /^#[0-9a-fA-F]{6}$/.test(h); }
  function theme(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  var current = null;
  var VARS = ['--page-bg','--page-bg-alt','--obg-text','--obg-dim','--obg-soft','--obg-accent','--obg-line','--obg-chip-bg','--obg-chip-fg','--obg-arrow-op'];
  function setMeta(c){ try{ var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', c); }catch(e){} }
  function paint(){
    var s = root.style;
    if(!current){ VARS.forEach(function(v){ s.removeProperty(v); }); setMeta(META_DEFAULT); return; }
    var bg = h2r(current);
    var alt = altFor(bg), bgs = [bg, alt], text = best(bgs);
    var accents = theme() === 'light' ? [[0,61,56],[27,197,189]] : [[27,197,189],[0,61,56]];
    var accent = null, i;
    for(i=0;i<accents.length;i++){ if(crm(accents[i],bgs) >= 4.5){ accent = accents[i]; break; } }
    if(!accent) accent = ensure(accents[0], bgs, 4.5, text);
    var chipBg = null, cands = [[27,197,189],[0,61,56],text];
    for(i=0;i<cands.length;i++){ if(crm(cands[i],bgs) >= 2.2){ chipBg = cands[i]; break; } }
    if(!chipBg) chipBg = text;
    s.setProperty('--page-bg', current);
    s.setProperty('--page-bg-alt', r2h(alt));
    s.setProperty('--obg-text', r2h(text));
    s.setProperty('--obg-dim', r2h(ensure(mix(text,bg,0.28), bgs, 4.5, text)));
    s.setProperty('--obg-soft', r2h(ensure(mix(text,bg,0.15), bgs, 4.5, text)));
    s.setProperty('--obg-arrow-op', '1');
    s.setProperty('--obg-accent', r2h(accent));
    s.setProperty('--obg-line', 'rgba(' + Math.round(text[0]) + ',' + Math.round(text[1]) + ',' + Math.round(text[2]) + ',0.22)');
    s.setProperty('--obg-chip-bg', r2h(chipBg));
    s.setProperty('--obg-chip-fg', r2h(best(chipBg)));
    setMeta(current);
  }
  window.__bgc = {
    get: function(){ return current; },
    set: function(hex){ if(!valid(hex)) return false; current = hex.toLowerCase(); paint(); try{ localStorage.setItem(KEY, current); }catch(e){} return true; },
    reset: function(){ current = null; paint(); try{ localStorage.removeItem(KEY); }catch(e){} },
    refresh: function(){ paint(); },
    /* Si el color del cinturón del título se parece al fondo, devuelve una variante legible; si no, null. */
    titleFix: function(beltHex){
      if(!current || !valid(beltHex)) return null;
      var bg = h2r(current), alt = altFor(bg), bgs = [bg, alt], b = h2r(beltHex);
      if(crm(b,bgs) >= 3.5) return null;
      return r2h(ensure(b, bgs, 4.5, best(bgs)));
    },
    contrast: function(a,b){ return cr(h2r(a),h2r(b)); }
  };
  try{ var saved = localStorage.getItem(KEY); if(valid(saved)){ current = saved.toLowerCase(); paint(); } }catch(e){}
})();

.belt-body,
.belt-card,
.card,
.coach-box,
.device-card,
.entity-item,
.flow-tech-header,
.glossary-item,
.gsearch-item,
.hero-card,
.history-item,
.learn-item,
.panel-head,
.prog-header,
.rule-card,
.stat-box,
.tech-counter,
.tech-item,
.tip-item{--obg-text:var(--canvas);--obg-dim:var(--canvas-dim);--obg-soft:var(--ink-soft);--obg-accent:var(--aqua);--obg-line:var(--line);--obg-chip-bg:var(--aqua-solid);--obg-chip-fg:var(--ink);--obg-arrow-op:0.7;}

.tree-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:8px;padding:0;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:15px;line-height:1;cursor:pointer;vertical-align:middle;flex-shrink:0;}
.tree-btn:hover,.tree-btn:focus-visible{border-color:var(--aqua-solid);outline:none;box-shadow:0 0 0 2px rgba(27,197,189,0.35);}
.tech-item .name-wrap{display:flex;align-items:center;min-width:0;flex:1;}
.tech-item .name-wrap h4{min-width:0;overflow-wrap:anywhere;}
.gs-title .tree-btn{float:right;margin-top:-3px;}
.ov-full{display:none;position:fixed;inset:0;background:var(--canvas);flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 0;}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px;flex-shrink:0;}
.ov-title{font-family:'Oswald',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:0.03em;color:var(--bg-card);margin:0;min-width:0;overflow-wrap:anywhere;}
.ov-x{width:36px;height:36px;border-radius:50%;border:none;background:#e5484d;color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ov-back{border:1px solid rgba(255,255,255,0.4);background:transparent;color:var(--bg-card);border-radius:18px;padding:6px 12px;font-family:'Karla',sans-serif;font-size:13px;cursor:pointer;flex-shrink:0;}
.ov-back[hidden]{display:none;}
.ov-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.ov-scroll>.card{width:100%;max-width:760px;margin-left:auto;margin-right:auto;box-sizing:border-box;}
.ov-head{width:100%;box-sizing:border-box;}
.tree-head{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.tree-root-meta{font-size:11.5px;color:var(--ink-soft);}
.tree-reach{font-family:'Oswald',sans-serif;font-size:13px;margin-top:4px;color:var(--aqua-solid);}
.tree-hint{font-size:12px;color:var(--canvas-dim);margin:8px 0 0;line-height:1.45;}
.tree-hint[hidden]{display:none;}
.tree-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tree-ctl{padding:7px 13px;border-radius:18px;border:1px solid var(--aqua-solid);background:transparent;color:var(--canvas);font-family:'Karla',sans-serif;font-size:12.5px;cursor:pointer;}
.tree-ul{list-style:none;margin:0;padding:0;}
.tree-children{margin:2px 0 6px 12px;padding-left:10px;border-left:2px solid var(--line);}
.tree-children[hidden]{display:none;}
.tree-glabel{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;margin:8px 0 2px;color:var(--aqua-solid);}
.tree-glabel.def{color:var(--red-bar);}
.tree-row{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:6px;padding:3px 0;min-width:0;}
.tree-main{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;}
.tree-row .lvl-dot{margin-top:9px;}
.tree-row .tree-loop{margin-top:4px;flex-shrink:0;}
.tree-tog{width:26px;height:26px;flex-shrink:0;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--canvas);font-size:11px;cursor:pointer;padding:0;}
.tree-tog.empty{visibility:hidden;}
.tree-name{background:none;border:none;padding:3px 5px;margin:0;font:600 13.5px 'Karla',sans-serif;color:var(--canvas);text-align:left;cursor:pointer;overflow-wrap:anywhere;min-width:0;max-width:100%;border-radius:6px;}
.tree-name:hover,.tree-name:focus-visible{background:rgba(27,197,189,0.18);outline:none;}
.tree-cat{font-size:10.5px;color:var(--ink-soft);}
.tree-loop{font-size:13px;color:var(--ink-soft);}
.ficha-name{font-family:'Oswald',sans-serif;font-size:20px;text-transform:uppercase;margin:0 0 4px;overflow-wrap:anywhere;}
.ficha-desc{font-size:14px;line-height:1.55;margin:10px 0 4px;overflow-wrap:anywhere;}
.ficha-actions{margin-top:16px;}
nav.bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
</style>

    titleBelts:"Sistema de faixas (adulto)", beltViewAdult:"Adultos", beltViewKids:"Infantil / Juvenil",
    beltsNote:"Cada faixa se divide em 4 graus, atribuídos pelo professor conforme progresso técnico, tempo e atitude. Os tempos são orientativos: variam conforme federação, academia e frequência de treino. Nas faixas preta e vermelha são desenhados 10 graus (os Dan, do 1º ao 10º).",

    titleKids:"Faixas infantis/juvenis",
    kidsBeltsText:"Menores de 16 anos começam na faixa branca e seguem um sistema de faixas diferente do adulto (cinza, amarela, laranja e verde, cada uma com seus próprios graus), antes de entrar no sistema adulto a partir dos 16 anos, conforme a federação.",
    titleGiReq:"Requisitos do gi na competição",
    giReqText:"O gi deve estar em bom estado, ser de uma cor permitida (normalmente branco, azul ou preto na IBJJF) e usar a faixa correspondente bem amarrada. O árbitro pode medir manga, calça e ajuste antes da luta.",
    hierarchyIntro:"No BJJ nem todas as posições valem o mesmo: existe uma hierarquia geral de dominância que ajuda a decidir se vale a pena melhorar sua posição ou buscar diretamente a finalização. Da melhor para a pior para você:",
    hierarchyNote:"A única posição neutra por baixo é a guarda: se você está por baixo em qualquer outra posição, está perdendo posicionalmente. É um guia geral — faixas avançadas às vezes \"quebram\" essa hierarquia com jogos pouco convencionais (meia guarda moderna, tartaruga ativa...), mas como referência é a melhor bússola para decidir se uma transição vale a pena.",

    rules:{scoringTitle:"Pontuação (formato IBJJF)", takedown:"Queda (takedown)", kneeBelly:"Joelho na barriga", sweep:"Raspagem (sweep)", pass:"Passagem de guarda", mount:"Montada", back:"Controle das costas (com ganchos)",
      chipScoring:"Pontuação", chipAdv:"Vantagens", chipDur:"Duração", chipGiReq:"Requisitos Gi", chipFormat:"Formato", chipRestr:"Restrições", chipGiNogi:"Gi vs No-Gi", chipWeight:"Pesos", chipFed:"Federações", chipLinks:"Links",
      advTitle:"Vantagens e penalidades",
      advText:"Uma vantagem é anotada quando quase se consegue uma posição ou finalização, mas não chega a se completar ou ser mantida pelo tempo mínimo. Serve de desempate quando o placar de pontos fica igual.",
      penText:"As penalidades ocorrem por passividade, sair da área de combate para evitar uma posição, agarrar os dedos do adversário ou falar/receber instruções de forma antidesportiva. Aplicar uma técnica ilegal para o nível ou a idade costuma resultar em penalidade ou até desclassificação, dependendo da gravidade.",
      formatTitle:"Formato de competição",
      formatText:"As categorias combinam idade, peso e faixa (por exemplo: Adulto, Pena, Azul). As lutas costumam ser organizadas em chaves de eliminação direta: perder uma luta elimina dessa categoria, embora alguns eventos ofereçam repescagem ou disputa de terceiro lugar.",
      durTitle:"Duração da luta",
      durText:"Varia conforme a categoria de idade e faixa: de 4-5 minutos nas categorias infantis até 10 minutos na faixa-preta adulto. Em competições submission-only não há pontos: só vence quem finaliza ou, se o tempo acabar, decide um painel de juízes.",
      restrictedTitle:"Técnicas restritas por nível (IBJJF)",
      restrictedIntro:"Guia geral baseado no regulamento IBJJF, a federação de referência mais usada em competição. As regras mudam de vez em quando e outras organizações têm as suas próprias — consulte sempre o regulamento oficial antes de competir.",
      restrictedAlways:"Proibido em todos os níveis e na grande maioria das federações: neck cranks e chaves de coluna sem estrangulamento, slams (levantar e jogar o adversário no chão), a tesoura de pernas estilo judô (kani basami), manipulação de dedos, golpes, mordidas e puxões de cabelo.",
      otherFedTitle:"Outras federações",
      otherFedText:"O ADCC não organiza por faixas: permite heel hooks e outros ataques às pernas desde o início na maioria das categorias, pois divide por peso e nível, não por graduação. A SJJIF segue um critério parecido ao da IBJJF. Os circuitos submission-only costumam ser os mais permissivos. Verifique sempre o regulamento específico de cada evento.",
      giNogiTitle:"Gi vs No-Gi",
      giNogiText:"No Gi são permitidas pegadas na jaqueta e na calça para controlar e estrangular (como a cruzada de lapelas ou o Ezequiel). No No-Gi essas pegadas não existem, então o jogo se apoia mais no controle corporal, nos ganchos e nos ataques às pernas. Muitos competidores treinam e competem nos dois formatos separadamente.",
      weightTitle:"Categorias de peso",
      weightText:"As competições dividem por categoria de peso e de idade para igualar o confronto. Você pode calcular automaticamente as suas na aba Progresso → Perfil, com base no seu peso e data de nascimento.",
      weightTableIbjjf:"IBJJF (kg)", weightTableAdcc:"ADCC (kg)",

    titleBelts:"Belt system (adult)", beltViewAdult:"Adults", beltViewKids:"Kids / Juvenile",
    beltsNote:"Each belt is divided into 4 stripes (degrees) awarded by the instructor based on technical progress, time and attitude. The times shown are indicative: they vary by federation, academy and training frequency. The black and red belts are drawn with 10 degrees (the Dan, 1st to 10th).",
    titleHierarchy:"Positional hierarchy",
    titleKids:"Kids / youth belts",
    kidsBeltsText:"Practitioners under 16 start at white and follow a belt system separate from adults (grey, yellow, orange and green, each with their own stripes) before entering the adult system from age 16, depending on the federation.",
    titleGiReq:"Gi requirements in competition",
    giReqText:"The gi must be in good condition, an approved color (usually white, blue or black in IBJJF) and worn with the correct belt properly tied. The referee may check sleeve, pants and overall fit before the match.",
    hierarchyIntro:"In BJJ not all positions are equal: there's a general dominance hierarchy that helps you decide whether to improve your position or go straight for the submission. From best to worst for you:",
    hierarchyNote:"The only neutral bottom position is guard: if you're underneath in anything else, you're losing positionally. It's a general guide — advanced belts sometimes \"break\" this hierarchy with unconventional games (modern half guard, active turtle...), but as a reference it's the best compass for deciding whether a transition is worth it.",

    rules:{scoringTitle:"Scoring (IBJJF format)", takedown:"Takedown", kneeBelly:"Knee on belly", sweep:"Sweep", pass:"Guard pass", mount:"Mount", back:"Back control (with hooks)",
      chipScoring:"Scoring", chipAdv:"Advantages", chipDur:"Duration", chipGiReq:"Gi rules", chipFormat:"Format", chipRestr:"Restrictions", chipGiNogi:"Gi vs No-Gi", chipWeight:"Weights", chipFed:"Federations", chipLinks:"Links",
      advTitle:"Advantages and penalties",
      advText:"An advantage is awarded when a position or submission is nearly achieved but not fully completed or held for the minimum time. It breaks ties when the point score is even.",
      penText:"Penalties are given for passivity, leaving the combat area to avoid a position, grabbing the opponent's fingers, or unsportsmanlike talking or coaching. Using a technique that's illegal for your level or age usually results in a penalty or even disqualification, depending on severity.",
      formatTitle:"Competition format",
      formatText:"Categories combine age, weight and belt (e.g. Adult, Feather, Blue). Matches are usually organized in single-elimination brackets: losing a match eliminates you from that category, though some events offer a repechage or third-place match.",
      durTitle:"Match duration",
      durText:"It varies by age category and belt: from 4-5 minutes in youth categories up to 10 minutes for adult black belts. In submission-only competitions there are no points: only the fighter who finishes wins, or a panel of judges decides if time runs out.",
      restrictedTitle:"Techniques restricted by level (IBJJF)",
      restrictedIntro:"A general guide based on IBJJF rules, the most widely used reference federation. Rules change from time to time and other organizations have their own — always check the official rulebook before competing.",
      restrictedAlways:"Banned at every level and in almost every federation: neck cranks and spinal locks without a choke, slams (lifting and spiking an opponent), the judo-style scissor takedown (kani basami), finger manipulation, strikes, biting and hair pulling.",
      otherFedTitle:"Other federations",
      otherFedText:"ADCC doesn't organize by belt: it allows heel hooks and other leg locks from the start in most divisions, since it splits by weight and skill level instead of rank. SJJIF follows a similar approach to IBJJF. Submission-only circuits tend to be the most permissive. Always check the specific rulebook for each event.",
      giNogiTitle:"Gi vs No-Gi",
      giNogiText:"In Gi, grips on the jacket and pants are allowed for control and chokes (like the cross collar or Ezekiel). In No-Gi those grips don't exist, so the game leans more on body control, hooks and leg locks. Many competitors train and compete in both formats separately.",
      weightTitle:"Weight categories",
      weightText:"Competitions split fighters by weight and age category to keep matches fair. You can calculate yours automatically in the Progress → Profile tab, based on your weight and date of birth.",
      weightTableIbjjf:"IBJJF (kg)", weightTableAdcc:"ADCC (kg)",
      fedCompareTitle:"Federation comparison", fedCompareIntro:"Key differences between the major federations. Always check the current official rulebook before competing.", fedSummaryTitle:"Federation summaries", fedSummaryIntroTxt:"The essentials of each one, in a few lines.", fedRefTag:"Your reference",

function deepFreeze(obj){
  // Congela recursivamente un objeto o array para que un script inyectado no pueda
  // alterar en tiempo de ejecución los datos base de la app (técnicas, glosario, etc.).
  if(obj && typeof obj === 'object' && !Object.isFrozen(obj)){
    Object.values(obj).forEach(deepFreeze);
    Object.freeze(obj);
  }
  return obj;
}

  {cat:"barridas", level:"intermedio", tags:["gi"], name:{es:"Raspado de la flor (flower/pendulum)",en:"Flower / pendulum sweep",val:"Raspat de la flor (pendulum)",pt:"Raspagem da flor (flower/pendulum)"}, desc:{es:"Se usa el brazo del rival como palanca mientras la pierna barre por debajo, típica desde guardia cerrada.",en:"The opponent's arm is used as leverage while the leg sweeps underneath, typical from closed guard.",val:"S'usa el braç de l'adversari com a palanca mentre la cama escombra per baix, típica des de guàrdia tancada.",pt:"Usa-se o braço do adversário como alavanca enquanto a perna varre por baixo, típica da guarda fechada."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado elevador (butterfly sweep)",en:"Butterfly sweep",val:"Raspat elevador (butterfly sweep)",pt:"Raspagem elevadora (butterfly sweep)"}, desc:{es:"Desde guardia mariposa, se eleva al rival con el gancho de la pierna mientras se tira del torso.",en:"From butterfly guard, you lift the opponent with your leg hook while pulling on their torso.",val:"Des de guàrdia papallona, s'eleva l'adversari en el ganxo de la cama mentre s'estira del tors.",pt:"Da guarda borboleta, eleva-se o adversário com o gancho da perna enquanto se puxa o tronco."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Raspado X-guard",en:"X-guard sweep",val:"Raspat X-guard",pt:"Raspagem X-guard"}, desc:{es:"Acción de barrido propia de la guardia X: se eleva al rival por el aire empujando con el talón bajo su muslo, y se completa el derribo girando hacia el lado contrario mientras cae.",en:"The sweeping action characteristic of X-guard: the opponent is elevated off the ground by driving the heel under their thigh, and the takedown is completed by turning to the opposite side as they fall.",val:"Acció de raspat pròpia de la guàrdia X: s'eleva l'adversari per l'aire empenyent amb el taló baix la seua cuixa, i es completa el derrocament girant cap al costat contrari mentre cau.",pt:"Ação de raspagem própria da guarda X: o adversário é elevado no ar empurrando com o calcanhar sob sua coxa, e a queda é completada girando para o lado contrário enquanto ele cai."}},
  {cat:"sumisiones", level:"principiante", tags:["gi"], basic:true, name:{es:"Estrangulación cruzada (cross collar)",en:"Cross collar choke",val:"Estrangulació creuada (cross collar)",pt:"Estrangulamento cruzado (cross collar)"}, desc:{es:"Desde montada o guardia, agarre cruzado de solapas que cierra la estrangulación al juntar los codos.",en:"From mount or guard, a crossed lapel grip that closes the choke as the elbows come together.",val:"Des de muntada o guàrdia, agafada creuada de solapes que tanca l'estrangulació en ajuntar els colzes.",pt:"Da montada ou guarda, pegada cruzada de lapelas que fecha o estrangulamento ao juntar os cotovelos."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Triángulo",en:"Triangle choke",val:"Triangle",pt:"Triângulo"}, desc:{es:"Estrangulación con las piernas formando un triángulo alrededor del cuello y un brazo del rival.",en:"A choke formed with the legs around the opponent's neck and one arm.",val:"Estrangulació en les cames formant un triangle al voltant del coll i un braç de l'adversari.",pt:"Estrangulamento com as pernas formando um triângulo ao redor do pescoço e um braço do adversário."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Estrangulación de Ezequiel",en:"Ezekiel choke",val:"Estrangulació d'Ezequiel",pt:"Estrangulamento de Ezequiel"}, desc:{es:"Se usa la manga del propio gi (o el puño en no-gi) para estrangular por dentro del cuello del rival.",en:"Uses your own gi sleeve (or fist in no-gi) to choke from inside the opponent's collar.",val:"S'usa la mànega del propi gi (o el puny en no-gi) per a estrangular per dins del coll de l'adversari.",pt:"Usa-se a manga do próprio gi (ou o punho no no-gi) para estrangular por dentro do pescoço do adversário."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Mata león (RNC)",en:"Rear naked choke",val:"Mata lleó (RNC)",pt:"Mata leão (RNC)"}, desc:{es:"Estrangulación desde la espalda con los dos brazos: uno rodea el cuello y su mano se apoya en el bíceps contrario mientras la otra mano empuja la cabeza hacia delante; la sumisión más icónica del grappling.",en:"A back choke with both arms: one arm wraps the neck with its hand resting on the opposite biceps while the other hand pushes the head forward; the most iconic submission in grappling.",val:"Estrangulació des de l'esquena amb els dos braços: un rodeja el coll i la seua mà s'arrima al bíceps contrari mentre l'altra mà empeny el cap cap avant; la submissió més icònica del grappling.",pt:"Estrangulamento pelas costas com os dois braços: um envolve o pescoço e sua mão descansa no bíceps oposto enquanto a outra mão empurra a cabeça para frente; a finalização mais icônica do grappling."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Guillotina",en:"Guillotine",val:"Guillotina",pt:"Guilhotina"}, desc:{es:"Estrangulación frontal: un brazo rodea el cuello por delante, con el antebrazo bajo la barbilla, y se cierra tirando hacia arriba mientras se cierra guardia o se arquean las caderas; el rival tiene la cabeza agachada y de frente a ti.",en:"A front choke: one arm wraps the neck from the front with the forearm under the chin and closes by pulling upward while closing guard or arching the hips; the opponent's head is down and facing you.",val:"Estrangulació frontal: un braç rodeja el coll per davant, amb l'avantbraç baix de la barbeta, i es tanca estirant cap amunt mentre es tanca guàrdia o s'arqueja el maluc; l'adversari té el cap cap avall i de cara a tu.",pt:"Estrangulamento frontal: um braço envolve o pescoço pela frente, com o antebraço sob o queixo, e fecha puxando para cima enquanto se fecha a guarda ou se arqueia o quadril; o adversário está com a cabeça baixa e de frente para você."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Darce (D'Arce / Brabo choke)",en:"D'Arce choke (Brabo)",val:"Darce (D'Arce / Brabo choke)",pt:"Darce (D'Arce / Brabo choke)"}, desc:{es:"Estrangulación con el brazo del rival dentro: tu brazo pasa por debajo de su axila cercana, rodea el cuello y se entrelaza con el otro, y el hombro empuja su cabeza contra su propio brazo. En Brasil se conoce también como Brabo choke.",en:"A choke with the opponent's arm trapped inside: your arm passes under their near armpit, wraps the neck and locks with your other arm, while your shoulder drives their head against their own arm. Also known as the Brabo choke in Brazil.",val:"Estrangulació amb el braç de l'adversari dins: el teu braç passa per baix de la seua aixella propera, rodeja el coll i s'entrellaça amb l'altre, i l'espatla empeny el seu cap contra el seu propi braç. Al Brasil també es coneix com a Brabo choke.",pt:"Estrangulamento com o braço do adversário preso por dentro: seu braço passa sob a axila próxima dele, envolve o pescoço e se entrelaça com o outro, e o ombro empurra a cabeça dele contra o próprio braço. No Brasil também é conhecido como Brabo choke."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Armbar (juji gatame)",en:"Armbar (juji gatame)",val:"Armbar (juji gatame)",pt:"Armlock (juji gatame)"}, desc:{es:"Palanca de codo controlando el brazo entre tus piernas y extendiendo la cadera hacia arriba.",en:"An elbow lock controlling the arm between your legs and extending the hip upward.",val:"Palanca de colze controlant el braç entre les teues cames i estenent el maluc cap amunt.",pt:"Alavanca de cotovelo controlando o braço entre as suas pernas e estendendo o quadril para cima."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Kimura",en:"Kimura",val:"Kimura",pt:"Kimura"}, desc:{es:"Llave de hombro doblando el brazo del rival detrás de la espalda con un agarre en forma de figura-4.",en:"A shoulder lock bending the opponent's arm behind their back with a figure-four grip.",val:"Clau d'espatlla doblegant el braç de l'adversari darrere l'esquena en una agafada en forma de figura-4.",pt:"Chave de ombro dobrando o braço do adversário atrás das costas com uma pegada em forma de 4."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Americana",en:"Americana",val:"Americana",pt:"Americana"}, desc:{es:"Llave de hombro similar a la kimura pero rotando el brazo en dirección contraria, muy común desde montada.",en:"A shoulder lock similar to the kimura but rotating the arm the opposite way, very common from mount.",val:"Clau d'espatlla semblant a la kimura però rotant el braç en direcció contrària, molt comuna des de muntada.",pt:"Chave de ombro parecida com a kimura, mas girando o braço em direção contrária, muito comum a partir da montada."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Omoplata",en:"Omoplata",val:"Omoplata",pt:"Omoplata"}, desc:{es:"Palanca de hombro realizada con las piernas en lugar de los brazos, desde guardia.",en:"A shoulder lock performed with the legs instead of the arms, from guard.",val:"Palanca d'espatlla realisada en les cames en lloc dels braços, des de guàrdia.",pt:"Alavanca de ombro realizada com as pernas em vez dos braços, a partir da guarda."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], name:{es:"Clave de tobillo (straight ankle lock)",en:"Straight ankle lock",val:"Clau de turmell (straight ankle lock)",pt:"Chave de tornozelo (straight ankle lock)"}, desc:{es:"Palanca sobre el tobillo: el filo del antebrazo presiona el tendón de aquiles mientras se arquea el cuerpo hacia atrás, forzando el pie hacia la espinilla; es el ataque de pierna básico que se permite desde cinturón blanco.",en:"A lever on the ankle: the edge of the forearm presses the Achilles tendon while the body arches back, forcing the foot toward the shin; it is the basic leg attack allowed from white belt.",val:"Palanca sobre el turmell: el cantell de l'avantbraç pressiona el tendó d'aquil·les mentre s'arqueja el cos cap arrere, forçant el peu cap a la canyella; és l'atac de cama bàsic que es permet des del cinturó blanc.",pt:"Alavanca no tornozelo: a borda do antebraço pressiona o tendão de Aquiles enquanto o corpo se arqueia para trás, forçando o pé em direção à canela; é o ataque de perna básico permitido desde a faixa branca."}, restriction:{es:"✅ Permitida desde blanco, girando siempre hacia fuera de la rodilla.",en:"✅ Allowed from white belt, always turning away from the knee.",val:"✅ Permesa des de blanc, girant sempre cap a fora del genoll.",pt:"✅ Permitida desde a faixa branca, girando sempre para fora do joelho."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Kneebar",en:"Kneebar",val:"Kneebar (clau de genoll)",pt:"Kneebar"}, desc:{es:"Hiperextensión de rodilla similar mecánicamente a un armbar pero aplicado sobre la pierna.",en:"A knee hyperextension mechanically similar to an armbar but applied to the leg.",val:"Hiperextensió de genoll mecànicament semblant a un armbar però aplicada sobre la cama.",pt:"Hiperextensão de joelho mecanicamente parecida com um armlock, mas aplicada sobre a perna."}, restriction:{es:"⚠️ Restringida por cinturón — revisa el reglamento de tu categoría antes de competir.",en:"⚠️ Restricted by belt — check your division's rulebook before competing.",val:"⚠️ Restringida per cinturó — revisa el reglament de la teua categoria abans de competir.",pt:"⚠️ Restrita por faixa — verifique o regulamento da sua categoria antes de competir."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Heel hook",en:"Heel hook",val:"Heel hook",pt:"Heel hook"}, desc:{es:"Torsión de rodilla y tobillo muy peligrosa; restringida en cinturones bajos y en muchas competiciones por su riesgo de lesión.",en:"A very dangerous knee and ankle twist, restricted for lower belts and in many competitions due to its injury risk.",val:"Torsió de genoll i turmell molt perillosa; restringida en cinturons baixos i en moltes competicions pel seu risc de lesió.",pt:"Torção de joelho e tornozelo muito perigosa; restrita em faixas baixas e em muitas competições pelo risco de lesão."}, restriction:{es:"🚫 Prohibida en Gi en todos los niveles. En No-Gi, legal solo desde marrón/negro.",en:"🚫 Banned in Gi at every belt. In No-Gi, legal only from brown/black.",val:"🚫 Prohibida en Gi en tots els nivells. En No-Gi, legal només des de marró/negre.",pt:"🚫 Proibida no Gi em todos os níveis. No No-Gi, legal apenas a partir de marrom/preta."}},
  {cat:"derribos", level:"avanzado", tags:["no-gi"], name:{es:"Imanari roll",en:"Imanari roll",val:"Imanari roll",pt:"Imanari roll"}, desc:{es:"Entrada a un ataque de pierna (normalmente kneebar o clave de tobillo) en la que, desde una posición de pie o de guardia abierta, se rueda hacia el suelo enganchando una pierna del rival y derribándolo con ella atrapada; popularizada por el luchador japonés Masakazu Imanari.",en:"An entry to a leg attack (usually a kneebar or ankle lock) where, from standing or open guard, you roll to the mat hooking one of the opponent's legs and taking them down with it trapped; popularized by Japanese fighter Masakazu Imanari.",val:"Entrada a un atac de cama (normalment kneebar o clau de turmell) en què, des d'una posició dreta o de guàrdia oberta, es rodola cap al terra enganxant una cama de l'adversari i derrocant-lo amb ella atrapada; popularitzada pel lluitador japonés Masakazu Imanari.",pt:"Entrada em um ataque de perna (normalmente kneebar ou chave de tornozelo) em que, a partir da posição em pé ou da guarda aberta, rola-se para o chão enganchando uma perna do adversário e derrubando-o com ela presa; popularizada pelo lutador japonês Masakazu Imanari."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Estrangulación de arco y flecha (bow and arrow)",en:"Bow and arrow choke",val:"Estrangulació d'arc i fletxa (bow and arrow)",pt:"Estrangulamento de arco e flecha (bow and arrow)"}, desc:{es:"Desde el control de espalda, se agarra la solapa profunda mientras se tira de la pierna del rival como si se tensara un arco.",en:"From back control, a deep collar grip is combined with pulling the opponent's leg like drawing a bow to close the choke.",val:"Des del control d'esquena, s'agafa la solapa profunda mentre s'estira de la cama de l'adversari com si es tensara un arc.",pt:"A partir do controle das costas, agarra-se a lapela profunda enquanto se puxa a perna do adversário como se estivesse retesando um arco."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Clave de muñeca (wristlock)",en:"Wristlock",val:"Clau de canell (wristlock)",pt:"Chave de pulso (wristlock)"}, desc:{es:"Palanca que dobla la muñeca del rival más allá de su rango natural; suele aparecer como sumisión de oportunidad en transiciones.",en:"A lock that bends the opponent's wrist beyond its natural range; usually taken as an opportunistic submission during transitions.",val:"Palanca que doblega el canell de l'adversari més enllà del seu rang natural; sol aparéixer com a submissió d'oportunitat en transicions.",pt:"Alavanca que dobra o pulso do adversário além do seu alcance natural; costuma surgir como finalização de oportunidade em transições."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de montada (upa/elbow-knee)",en:"Mount escape (upa / elbow-knee)",val:"Escapada de muntada (upa/elbow-knee)",pt:"Fuga de montada (upa/elbow-knee)"}, desc:{es:"Combinación de puente de cadera y recuperación de guardia para salir de debajo de la montada.",en:"A combination of hip bridge and guard recovery to get out from under the mount.",val:"Combinació de pont de maluc i recuperació de guàrdia per a eixir de baix la muntada.",pt:"Combinação de ponte de quadril e recuperação de guarda para sair de baixo da montada."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de espalda",en:"Back escape",val:"Escapada d'esquena",pt:"Fuga das costas"}, desc:{es:"Secuencia para quitar los ganchos del rival y girar hacia él, neutralizando el control de espalda.",en:"A sequence to remove the opponent's hooks and turn into them, neutralizing back control.",val:"Seqüència per a llevar els ganxos de l'adversari i girar-se cap a ell, neutralisant el control d'esquena.",pt:"Sequência para retirar os ganchos do adversário e girar em direção a ele, neutralizando o controle das costas."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Fuga de cadera (hip escape / shrimping)",en:"Hip escape (shrimping)",val:"Fugida de maluc (hip escape / shrimping)",pt:"Hip escape (shrimping)"}, desc:{es:"Movimiento fundamental de cadera para crear espacio y recuperar guardia desde casi cualquier posición inferior.",en:"A fundamental hip movement to create space and recover guard from almost any bottom position.",val:"Moviment fonamental de maluc per a crear espai i recuperar guàrdia des de quasi qualsevol posició inferior.",pt:"Movimento fundamental de quadril para criar espaço e recuperar a guarda a partir de quase qualquer posição inferior."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Montada",en:"Mount",val:"Muntada",pt:"Montada"}, desc:{es:"Sentado sobre el torso del rival con las rodillas apoyadas a ambos lados y su espalda contra el suelo; desde aquí se abren ataques al cuello y a los brazos, y es una de las posiciones más dominantes.",en:"Seated on the opponent's torso with your knees planted on both sides and their back on the mat; from here attacks on the neck and arms open up, and it is one of the most dominant positions.",val:"Assegut sobre el tors de l'adversari amb els genolls recolzats a ambdós costats i la seua esquena contra el terra; des d'ací s'obrin atacs al coll i als braços, i és una de les posicions més dominants.",pt:"Sentado sobre o tronco do adversário com os joelhos apoiados dos dois lados e as costas dele no chão; a partir daqui abrem-se ataques ao pescoço e aos braços, e é uma das posições mais dominantes."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Control lateral (side control)",en:"Side control",val:"Control lateral (side control)",pt:"Controle lateral (side control)"}, desc:{es:"Control lateral clásico: tumbado de costado sobre el rival, con el pecho pegado a su torso, la cabeza junto a la suya y la cadera pesando sobre él; desde aquí se cierran los espacios para pasar a montada, rodilla en el estómago o una sumisión.",en:"Classic side control: lying across the opponent with your chest pressed to their torso, your head beside theirs and your hips weighing on them; from here the space is shut down to move to mount, knee on belly or a submission.",val:"Control lateral clàssic: estirat de costat sobre l'adversari, amb el pit apegat al seu tors, el cap junt al seu i el maluc pesant damunt; des d'ací es tanquen els espais per a passar a muntada, genoll a l'estómac o una submissió.",pt:"Controle lateral clássico: deitado de lado sobre o adversário, com o peito colado ao tronco dele, a cabeça ao lado da dele e o quadril pesando sobre ele; a partir daqui fecham-se os espaços para passar à montada, joelho na barriga ou uma finalização."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Rodilla en el estómago",en:"Knee on belly",val:"Genoll a l'estómac",pt:"Joelho na barriga"}, desc:{es:"Posición de control móvil con una rodilla apoyada en el abdomen del rival, útil de transición hacia sumisiones.",en:"A mobile control position with one knee resting on the opponent's abdomen, useful for transitioning into submissions.",val:"Posició de control mòbil en un genoll recolzat sobre l'abdomen de l'adversari, útil de transició cap a submissions.",pt:"Posição de controle móvel com um joelho apoiado no abdômen do adversário, útil como transição para finalizações."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Control de espalda",en:"Back control",val:"Control d'esquena",pt:"Controle das costas"}, desc:{es:"Por detrás del rival, con los ganchos de las piernas en sus caderas y un brazo por encima de un hombro y el otro por debajo de la axila contraria; se considera la posición más dominante del BJJ.",en:"Behind the opponent with your leg hooks on their hips and one arm over a shoulder and the other under the opposite armpit; it is considered the most dominant position in BJJ.",val:"Per darrere de l'adversari, amb els ganxos de les cames en els seus malucs i un braç per damunt d'una espatla i l'altre per baix de l'aixella contrària; es considera la posició més dominant del BJJ.",pt:"Por trás do adversário, com os ganchos das pernas nos quadris dele e um braço por cima de um ombro e o outro por baixo da axila oposta; é considerada a posição mais dominante do BJJ."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase por encima-por debajo (over-under)",en:"Over-under pass",val:"Passada per damunt-per baix (over-under)",pt:"Passagem por cima-por baixo (over-under)"}, desc:{es:"Un brazo pasa por encima de una pierna del rival y el otro por debajo de la otra, presionando hacia delante para aplastar la guardia y llegar a lateral.",en:"One arm goes over one of the opponent's legs and the other goes under the other leg, driving forward to flatten the guard and reach side control.",val:"Un braç passa per damunt d'una cama de l'adversari i l'altre per baix de l'altra, pressionant cap avant per a aplanar la guàrdia i arribar a lateral.",pt:"Um braço passa por cima de uma perna do adversário e o outro por baixo da outra, pressionando para frente para esmagar a guarda e chegar ao lateral."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de control lateral",en:"Side control escape",val:"Escapada de control lateral",pt:"Fuga do controle lateral"}, desc:{es:"Se crea un marco con el brazo y la rodilla para recuperar espacio y volver a meter una pierna entre tú y el rival, recuperando la guardia.",en:"You frame with the arm and knee to create space and reinsert a leg between you and the opponent, recovering guard.",val:"Es crea un marc en el braç i el genoll per a recuperar espai i tornar a ficar una cama entre tu i l'adversari, recuperant la guàrdia.",pt:"Cria-se uma moldura (frame) com o braço e o joelho para recuperar espaço e voltar a colocar uma perna entre você e o adversário, recuperando a guarda."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de guillotina",en:"Guillotine escape",val:"Escapada de guillotina",pt:"Fuga da guilhotina"}, desc:{es:"Girar la cabeza hacia el brazo que estrangula y pasar una pierna por encima para avanzar de posición mientras se libera el cuello.",en:"Turning the head toward the choking arm and stepping a leg over to advance position while freeing the neck.",val:"Girar el cap cap al braç que estrangula i passar una cama per damunt per a avançar de posició mentre s'allibera el coll.",pt:"Girar a cabeça em direção ao braço que estrangula e passar uma perna por cima para avançar de posição enquanto se libera o pescoço."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de triángulo",en:"Triangle escape",val:"Escapada de triangle",pt:"Fuga do triângulo"}, desc:{es:"Apilar al rival hacia delante y girar la cadera para liberar la cabeza antes de que se cierre del todo el triángulo.",en:"Stacking the opponent forward and rotating the hips to free the head before the triangle fully locks.",val:"Apilar l'adversari cap avant i girar el maluc per a alliberar el cap abans que es tanque del tot el triangle.",pt:"Empilhar o adversário para frente e girar o quadril para liberar a cabeça antes que o triângulo se feche por completo."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Norte-sur (north-south)",en:"North-south",val:"Nord-sud (north-south)",pt:"Norte-sul (north-south)"}, desc:{es:"Control desde la cabeza del rival: el cuerpo gira 90° desde el control lateral hasta quedar de frente a sus pies, con el pecho sobre su cara y su torso aplastado; muy útil para transitar y para asfixiar su espacio.",en:"Control from above the opponent's head: the body turns 90° from side control until you face their feet, chest over their face and their torso flattened; very useful for transitioning and smothering their space.",val:"Control des del cap de l'adversari: el cos gira 90° des del control lateral fins a quedar de cara als seus peus, amb el pit sobre la seua cara i el seu tors aixafat; molt útil per a transitar i per a asfixiar el seu espai.",pt:"Controle a partir da cabeça do adversário: o corpo gira 90° a partir do controle lateral até ficar de frente para os pés dele, com o peito sobre o rosto dele e o tronco achatado; muito útil para transitar e para sufocar o espaço dele."}},
  {cat:"control", level:"principiante", tags:["gi","no-gi"], name:{es:"Kesa gatame (control de bufanda)",en:"Kesa gatame (scarf hold)",val:"Kesa gatame (control de bufanda)",pt:"Kesa gatame (controle de cachecol)"}, desc:{es:"Control lateral clásico de judo abrazando la cabeza y el brazo del rival como si fuera una bufanda, con mucha presión y pocas fugas.",en:"A classic judo side control hugging the opponent's head and arm like a scarf, with heavy pressure and few escape routes.",val:"Control lateral clàssic de judo abraçant el cap i el braç de l'adversari com si fóra una bufanda, en molta pressió i poques fugues.",pt:"Controle lateral clássico do judô abraçando a cabeça e o braço do adversário como se fosse um cachecol, com muita pressão e poucas fugas."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado de gancho desde media guardia",en:"Half guard hook sweep",val:"Raspat de ganxo des de mitja guàrdia",pt:"Raspagem de gancho a partir da meia guarda"}, desc:{es:"Desde media guardia, se engancha la pierna del rival con el pie y se le desequilibra hacia el lado del gancho para quedar arriba.",en:"From half guard, you hook the opponent's leg with your foot and off-balance them toward the hook side to end up on top.",val:"Des de mitja guàrdia, s'engancha la cama de l'adversari en el peu i se'l desequilibra cap al costat del ganxo per a quedar a dalt.",pt:"Da meia guarda, prende-se a perna do adversário com o pé e o desequilibra para o lado do gancho para ficar por cima."}},
  {cat:"guardias", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escudo de rodilla (knee shield / z-guard)",en:"Knee shield (Z-guard)",val:"Escut de genoll (knee shield / z-guard)",pt:"Escudo de joelho (knee shield / z-guard)"}, desc:{es:"Variante de media guardia donde la espinilla se coloca como barrera contra el pecho del rival, controlando la distancia y facilitando barridas y regresos a guardia completa.",en:"A half guard variant where the shin is placed as a barrier against the opponent's chest, controlling distance and setting up sweeps and returns to full guard.",val:"Variant de mitja guàrdia on la canyella es col·loca com a barrera contra el pit de l'adversari, controlant la distància i facilitant raspats i tornades a guàrdia completa.",pt:"Variante da meia guarda em que a canela é colocada como barreira contra o peito do adversário, controlando a distância e facilitando raspagens e retornos à guarda completa."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Guardia X (X-guard)",en:"X-guard",val:"Guàrdia X (X-guard)",pt:"Guarda X (X-guard)"}, desc:{es:"Control de una pierna del rival con ambas piernas entrelazadas en forma de X desde abajo, ideal para elevarlo y raspar con gran ventaja de palanca.",en:"Controlling one of the opponent's legs with both legs crossed in an X shape from below, ideal for lifting and sweeping with great leverage.",val:"Control d'una cama de l'adversari en ambdues cames entrellaçades en forma de X des de baix, ideal per a elevar-lo i raspar en gran avantatge de palanca.",pt:"Controle de uma perna do adversário com as duas pernas entrelaçadas em forma de X por baixo, ideal para elevá-lo e raspar com grande vantagem de alavanca."}},
  {cat:"guardias", level:"avanzado", tags:["gi","no-gi"], name:{es:"Media guardia profunda (deep half)",en:"Deep half guard",val:"Mitja guàrdia profunda (deep half)",pt:"Meia guarda profunda (deep half)"}, desc:{es:"Variante de la media guardia en la que te sitúas por completo debajo de la cadera del rival, perfecta para elevarlo y quedar arriba.",en:"A half guard variant where you position yourself entirely underneath the opponent's hip, perfect for lifting them and coming out on top.",val:"Variant de la mitja guàrdia en què et sitúes completament baix el maluc de l'adversari, perfecta per a elevar-lo i quedar a dalt.",pt:"Variante da meia guarda em que você se posiciona totalmente sob o quadril do adversário, perfeita para elevá-lo e ficar por cima."}},
  {cat:"derribos", level:"principiante", tags:["gi","no-gi"], name:{es:"Recogida de tobillo (ankle pick)",en:"Ankle pick",val:"Arreplegada de turmell (ankle pick)",pt:"Pegada de tornozelo (ankle pick)"}, desc:{es:"Derribo rápido agarrando el tobillo del rival mientras se controla la parte superior del cuerpo, aprovechando un desequilibrio momentáneo.",en:"A fast takedown grabbing the opponent's ankle while controlling their upper body, exploiting a momentary loss of balance.",val:"Derrocament ràpid agafant el turmell de l'adversari mentre es controla la part superior del cos, aprofitant un desequilibri momentani.",pt:"Queda rápida agarrando o tornozelo do adversário enquanto se controla a parte superior do corpo, aproveitando um desequilíbrio momentâneo."}},
  {cat:"derribos", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Sprawl (defensa de derribo)",en:"Sprawl (takedown defense)",val:"Sprawl (defensa de derrocament)",pt:"Sprawl (defesa de queda)"}, desc:{es:"Extender las piernas hacia atrás y bajar la cadera para anular la entrada a las piernas del rival, la base de toda defensa de derribos.",en:"Kicking the legs back and dropping the hips to shut down the opponent's shot to your legs — the foundation of all takedown defense.",val:"Estendre les cames cap arrere i baixar el maluc per a anul·lar l'entrada a les cames de l'adversari, la base de tota defensa de derrocaments.",pt:"Estender as pernas para trás e baixar o quadril para anular a entrada nas pernas do adversário, a base de toda defesa de quedas."}},
  {cat:"guardias", level:"avanzado", tags:["no-gi"], name:{es:"Guardia invertida (inverted guard)",en:"Inverted guard",val:"Guàrdia invertida (inverted guard)",pt:"Guarda invertida (inverted guard)"}, desc:{es:"El practicante se apoya en la cabeza y hombros con la cadera elevada, abriendo ángulos poco convencionales para barridas y ataques a la espalda.",en:"The practitioner rests on their head and shoulders with hips lifted, opening unconventional angles for sweeps and back attacks.",val:"El practicant es recolza en el cap i les espatles en el maluc alçat, obrint angles poc convencionals per a raspats i atacs a l'esquena.",pt:"O praticante se apoia na cabeça e ombros com o quadril elevado, abrindo ângulos pouco convencionais para raspagens e ataques às costas."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Estrangulación norte-sur",en:"North-South choke",val:"Estrangulació nord-sud",pt:"Estrangulamento norte-sul"}, desc:{es:"Estrangulación aplicada desde la posición norte-sur, metiendo el brazo bajo el cuello del rival mientras se presiona con el pecho.",en:"A choke applied from the north-south position, slipping the arm under the opponent's neck while pressing down with the chest.",val:"Estrangulació aplicada des de la posició nord-sud, ficant el braç baix el coll de l'adversari mentre es pressiona en el pit.",pt:"Estrangulamento aplicado a partir da posição norte-sul, colocando o braço sob o pescoço do adversário enquanto se pressiona com o peito."}},
  
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Corbata peruana (Peruvian necktie)",en:"Peruvian necktie",val:"Corbata peruana (Peruvian necktie)",pt:"Gravata peruana (Peruvian necktie)"}, desc:{es:"Estrangulación con la pierna contra un rival en tortuga: una pierna rodea su cuello, se cruza sobre tu propia pantorrilla y el cuerpo gira para apretar el cuello entre la pierna y su hombro.",en:"A leg choke on an opponent in turtle: one leg wraps around their neck, crosses over your own calf and the body turns to squeeze the neck between the leg and their own shoulder.",val:"Estrangulació amb la cama contra un adversari en tortuga: una cama rodeja el seu coll, es creua sobre la teua pròpia panxeta i el cos gira per a estrényer el coll entre la cama i la seua espatla.",pt:"Estrangulamento com a perna contra um adversário na tartaruga: uma perna envolve o pescoço dele, cruza sobre a sua própria panturrilha e o corpo gira para apertar o pescoço entre a perna e o ombro dele."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Twister",en:"Twister",val:"Twister",pt:"Twister"}, desc:{es:"Combinación de control de espalda invertido y torsión de columna, popularizada por la escuela de lucha americana.",en:"A combined inverted back control and spinal torque submission, popularized by American wrestling-influenced grappling.",val:"Combinació de control d'esquena invertit i torsió de columna, popularisada per l'escola de lluita americana.",pt:"Combinação de controle das costas invertido e torção de coluna, popularizada pela escola de luta americana."}, restriction:{es:"⚠️ Prohibida o muy restringida en la mayoría de federaciones por el riesgo para la columna.",en:"⚠️ Banned or heavily restricted in most federations due to spinal risk.",val:"⚠️ Prohibida o molt restringida en la majoria de federacions pel risc per a la columna.",pt:"⚠️ Proibida ou muito restrita na maioria das federações pelo risco para a coluna."}},
  
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Corte de gemelo (calf slicer)",en:"Calf slicer",val:"Tall de bessó (calf slicer)",pt:"Corte de panturrilha (calf slicer)"}, desc:{es:"Compresión muscular en la pierna doblada: el antebrazo o la espinilla se colocan en la pantorrilla del rival, detrás de la rodilla, y la pierna se cierra sobre ella para aplastar el músculo; duele por compresión, no por hiperextensión de la articulación.",en:"A muscle compression on the bent leg: your forearm or shin is placed on the opponent's calf, behind the knee, and the leg is folded over it to crush the muscle; it hurts by compression, not by hyperextending the joint.",val:"Compressió muscular en la cama doblegada: l'avantbraç o la canyella es col·loca en la panxeta de l'adversari, darrere del genoll, i la cama es tanca damunt per a aixafar el múscul; fa mal per compressió, no per hiperextensió de l'articulació.",pt:"Compressão muscular na perna dobrada: o antebraço ou a canela é colocado na panturrilha do adversário, atrás do joelho, e a perna é fechada sobre ele para esmagar o músculo; dói por compressão, não por hiperextensão da articulação."}, restriction:{es:"⚠️ Restringida por cinturón, igual que el resto de compresiones musculares.",en:"⚠️ Restricted by belt, like other muscle compressions.",val:"⚠️ Restringida per cinturó, igual que la resta de compressions musculars.",pt:"⚠️ Restrita por faixa, assim como o restante das compressões musculares."}},
  {cat:"escapes", level:"intermedio", tags:["gi","no-gi"], name:{es:"Escape de kimura",en:"Kimura escape",val:"Escapada de kimura",pt:"Fuga da kimura"}, desc:{es:"Girar la muñeca y el cuerpo hacia el brazo atrapado para liberar la presión de la llave antes de que se complete.",en:"Rotating the wrist and body toward the trapped arm to relieve the lock's pressure before it's finished.",val:"Girar el canell i el cos cap al braç atrapat per a alliberar la pressió de la clau abans que es complete.",pt:"Girar o pulso e o corpo em direção ao braço preso para liberar a pressão da chave antes que se complete."}},
  
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Crucifijo (crucifix)",en:"Crucifix",val:"Crucifix",pt:"Crucifixo (crucifix)"}, desc:{es:"Control que inmoviliza ambos brazos del rival desde su espalda, dejando el cuello completamente expuesto.",en:"A control that immobilizes both of the opponent's arms from their back, leaving the neck fully exposed.",val:"Control que immobilisa ambdós braços de l'adversari des de la seua esquena, deixant el coll completament exposat.",pt:"Controle que imobiliza os dois braços do adversário a partir das suas costas, deixando o pescoço totalmente exposto."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Anaconda choke",en:"Anaconda choke",val:"Anaconda choke",pt:"Anaconda choke"}, desc:{es:"Estrangulación de brazo dentro por el lado lejano: el brazo pasa bajo el cuello y bajo el brazo lejano del rival, se cierra el agarre y se rueda hacia un lado para apretar; muy usada desde tortuga y cabezal de lucha.",en:"A choke with the far arm trapped inside: your arm goes under the opponent's neck and far arm, the grip is locked and you roll to one side to tighten it; widely used from turtle and front headlock.",val:"Estrangulació amb el braç llunyà dins: el braç passa per baix del coll i del braç llunyà de l'adversari, es tanca l'agafada i es rodola cap a un costat per a estrényer; molt usada des de tortuga i capçal de lluita.",pt:"Estrangulamento com o braço distante preso por dentro: o braço passa sob o pescoço e o braço distante do adversário, a pegada é travada e rola-se para um lado para apertar; muito usado a partir da tartaruga e do cabeçal de luta."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Gogoplata",en:"Gogoplata",val:"Gogoplata",pt:"Gogoplata"}, desc:{es:"Estrangulación apoyando la espinilla contra la tráquea del rival desde una guardia tipo triángulo; requiere mucha flexibilidad.",en:"A choke pressing the shin against the opponent's throat from a triangle-type guard, requiring significant flexibility.",val:"Estrangulació recolzant la canyella contra la tràquea de l'adversari des d'una guàrdia tipus triangle; requerix molta flexibilitat.",pt:"Estrangulamento apoiando a canela contra a traqueia do adversário a partir de uma guarda tipo triângulo; exige muita flexibilidade."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi"], name:{es:"Estrangulación de béisbol (baseball choke)",en:"Baseball choke",val:"Estrangulació de beisbol (baseball choke)",pt:"Estrangulamento de beisebol (baseball choke)"}, desc:{es:"Estrangulación desde montada o rodilla en el estómago agarrando ambos lados del cuello de la camiseta con un agarre cruzado en forma de bate de béisbol, que cierra muy rápido gracias al ángulo de la muñeca.",en:"A choke from mount or knee-on-belly gripping both sides of the opponent's collar in a crossed, baseball-bat-style grip that closes very quickly thanks to the wrist angle.",val:"Estrangulació des de muntada o genoll a l'estómac agarrant ambdós costats del coll de la camisola en una agafada creuada en forma de bat de beisbol, que tanca molt ràpid gràcies a l'angle del canell.",pt:"Estrangulamento da montada ou joelho na barriga agarrando os dois lados do colarinho com uma pegada cruzada em forma de taco de beisebol, que fecha muito rápido graças ao ângulo do pulso."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi"], name:{es:"Estrangulación de solapa deslizante (okuri eri jime)",en:"Sliding collar choke (okuri eri jime)",val:"Estrangulació de solapa lliscant (okuri eri jime)",pt:"Estrangulamento de lapela deslizante (okuri eri jime)"}, desc:{es:"Estrangulación con kimono: una mano desliza la solapa profunda alrededor del cuello del rival, casi hasta la nuca, y la otra tira de la solapa contraria para cerrar el cuello entre ambas telas; se usa sobre todo desde la espalda o contra un rival en tortuga.",en:"A gi choke: one hand slides the lapel deep around the opponent's neck, almost to the nape, and the other pulls the opposite lapel to close the neck between both fabrics; used mostly from the back or against an opponent in turtle.",val:"Estrangulació amb quimono: una mà llisca la solapa a fons al voltant del coll de l'adversari, quasi fins a la nuca, i l'altra estira de la solapa contrària per a tancar el coll entre ambdós teixits; s'usa sobretot des de l'esquena o contra un adversari en tortuga.",pt:"Estrangulamento com kimono: uma mão desliza a lapela fundo ao redor do pescoço do adversário, quase até a nuca, e a outra puxa a lapela oposta para fechar o pescoço entre os dois tecidos; usado sobretudo pelas costas ou contra um adversário na tartaruga."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi"], name:{es:"Reloj (clock choke)",en:"Clock choke",val:"Rellotge (clock choke)",pt:"Estrangulamento de relógio (clock choke)"}, desc:{es:"Estrangulación clásica contra un rival en posición de tortuga: se rodea su cuello con la solapa mientras se camina alrededor de él en forma de reloj para tensar el ahogo.",en:"A classic choke against an opponent in turtle position: their collar is wrapped around the neck while stepping around them in a clock-like motion to tighten the choke.",val:"Estrangulació clàssica contra un adversari en posició de tortuga: es rodeja el seu coll en la solapa mentre es camina al voltant d'ell en forma de rellotge per a tensar l'ofegament.",pt:"Estrangulamento clássico contra um adversário na posição de tartaruga: envolve-se seu pescoço com a lapela enquanto se caminha ao redor dele em forma de relógio para apertar o estrangulamento."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Cortador de pan (bread cutter / Von Flue choke)",en:"Bread cutter (Von Flue) choke",val:"Tallador de pa (bread cutter / Von Flue choke)",pt:"Cortador de pão (bread cutter / Von Flue choke)"}, desc:{es:"Estrangulación de presión que aprovecha el intento del rival de hacer un single-leg o abrazar la cadera desde el suelo: se cierra la guillotina y se gira el cuerpo hacia el hombro contrario para aplastar su cuello contra el propio brazo.",en:"A pressure-based choke that punishes an opponent shooting for a single-leg or clinging to the hip from the ground: the guillotine grip is locked and the body rotates toward the far shoulder, crushing their neck against one's own arm.",val:"Estrangulació de pressió que aprofita l'intent de l'adversari de fer un single-leg o abraçar el maluc des del terra: es tanca la guillotina i es gira el cos cap a l'espatla contrària per a aplastar el seu coll contra el propi braç.",pt:"Estrangulamento de pressão que aproveita a tentativa do adversário de fazer um single-leg ou abraçar o quadril a partir do chão: fecha-se a guilhotina e gira-se o corpo em direção ao ombro contrário para esmagar seu pescoço contra o próprio braço."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Kesa gatame invertida (reverse kesa gatame)",en:"Reverse kesa gatame",val:"Kesa gatame invertida (reverse kesa gatame)",pt:"Kesa gatame invertida (reverse kesa gatame)"}, desc:{es:"Estás sentado junto al rival, mirando hacia sus pies, con su cabeza y su brazo cercano sujetos bajo tu axila y las piernas abiertas de base; es el kesa gatame girado, y le impide usar las piernas para hacer palanca y recuperar la guardia.",en:"You sit beside the opponent facing their feet, with their head and near arm held under your armpit and your legs spread as a base; it is the scarf hold turned around, keeping their legs from leveraging you off to recover guard.",val:"Estàs assegut al seu costat, mirant cap als seus peus, amb el seu cap i el braç proper subjectes baix de la teua aixella i les cames obertes de base; és el kesa gatame girat, i li impedix usar les cames per a fer palanca i recuperar la guàrdia.",pt:"Você está sentado ao lado do adversário, de frente para os pés dele, com a cabeça e o braço próximo dele presos sob a sua axila e as pernas abertas como base; é o kesa gatame girado, que o impede de usar as pernas para fazer alavanca e recuperar a guarda."}},
  {cat:"barridas", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Raspado de cadera (hip bump sweep)",en:"Hip bump sweep",val:"Raspat de maluc (hip bump sweep)",pt:"Raspagem de quadril (hip bump sweep)"}, desc:{es:"Raspado clásico desde guardia cerrada: te incorporas apoyándote en una cadera y empujas con fuerza contra el rival mientras tiras de su brazo, volcándolo hacia el lado contrario para terminar arriba.",en:"A classic sweep from closed guard: you post up onto one hip and drive forcefully into the opponent while pulling their arm, rolling them to the opposite side to land on top.",val:"Raspat clàssic des de guàrdia tancada: t'incorpores recolzant-te en un maluc i empenyes en força contra l'adversari mentre tires del seu braç, bolcant-lo cap al costat contrari per a acabar a dalt.",pt:"Raspagem clássica a partir da guarda fechada: você se apoia em um quadril e empurra com força contra o adversário enquanto puxa seu braço, virando-o para o lado contrário para terminar por cima."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado de omoplata (omoplata sweep)",en:"Omoplata sweep",val:"Raspat d'omoplata (omoplata sweep)",pt:"Raspagem de omoplata (omoplata sweep)"}, desc:{es:"Raspado que aprovecha la entrada a la omoplata: en vez de buscar la sumisión, se usa la palanca de la pierna sobre el hombro del rival para volcarlo y terminar arriba.",en:"A sweep that uses the omoplata entry: instead of going for the submission, leverage from the leg over the opponent's shoulder is used to roll them over and land on top.",val:"Raspat que aprofita l'entrada a l'omoplata: en lloc de buscar la submissió, s'usa la palanca de la cama sobre l'espatla de l'adversari per a bolcar-lo i acabar a dalt.",pt:"Raspagem que aproveita a entrada da omoplata: em vez de buscar a finalização, usa-se a alavanca da perna sobre o ombro do adversário para virá-lo e terminar por cima."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado trípode (tripod sweep)",en:"Tripod sweep",val:"Raspat trípode (tripod sweep)",pt:"Raspagem tripé (tripod sweep)"}, desc:{es:"Raspado clásico de guardia abierta: se empuja una rodilla del rival mientras se agarra su tobillo contrario, formando un trípode con tus manos y pie de apoyo para derribarlo hacia atrás.",en:"A classic open guard sweep: one of the opponent's knees is pushed while their opposite ankle is grabbed, forming a tripod with your hands and supporting foot to take them down backward.",val:"Raspat clàssic de guàrdia oberta: s'empeny un genoll de l'adversari mentre s'agarra el seu turmell contrari, formant un trípode en les teues mans i peu de suport per a derrocar-lo cap arrere.",pt:"Raspagem clássica de guarda aberta: empurra-se um joelho do adversário enquanto se agarra seu tornozelo contrário, formando um tripé com suas mãos e pé de apoio para derrubá-lo para trás."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado globo (balloon sweep)",en:"Balloon sweep",val:"Raspat globus (balloon sweep)",pt:"Raspagem balão (balloon sweep)"}, desc:{es:"Los dos pies, en la cadera o los muslos del rival, lo elevan como si inflaran un globo; con el rival en el aire, se gira hacia un lado para dejarlo caer y quedar arriba.",en:"Both feet on the opponent's hips or thighs lift them as if inflating a balloon; with them in the air, you turn to one side to drop them and end up on top.",val:"Els dos peus, en el maluc o les cuixes de l'adversari, l'eleven com si s'inflara un globus; amb l'adversari en l'aire, es gira cap a un costat per a deixar-lo caure i quedar a dalt.",pt:"Os dois pés, no quadril ou nas coxas do adversário, o elevam como se inflassem um balão; com ele no ar, gira-se para um lado para deixá-lo cair e ficar por cima."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Gift wrap",en:"Gift wrap",val:"Gift wrap",pt:"Gift wrap"}, desc:{es:"Control que cruza el brazo del rival por delante de su propio cuerpo, sujetándolo como si fuera un paquete envuelto, muy usado como paso previo para tomar la espalda o rematar con un estrangulamiento.",en:"A control that crosses the opponent's arm in front of their own body, pinning it as if wrapping a gift, commonly used as a setup for taking the back or finishing with a choke.",val:"Control que creua el braç de l'adversari per davant del seu propi cos, subjectant-lo com si fóra un paquet embolicat, molt usat com a pas previ per a prendre l'esquena o rematar en un estrangulament.",pt:"Controle que cruza o braço do adversário na frente do próprio corpo, prendendo-o como se fosse um presente embrulhado, muito usado como preparação para pegar as costas ou finalizar com um estrangulamento."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Cadera de lucha (hip toss)",en:"Hip toss",val:"Maluc de lluita (hip toss)",pt:"Quadril de luta (hip toss)"}, desc:{es:"Versión de lucha del derribo de cadera, pensada para no-gi: sin depender del kimono, la cadera se mete con un underhook o un agarre de brazo y cuello, y el rival se proyecta por encima con un giro corto y explosivo.",en:"The wrestling version of the hip throw, made for no-gi: without relying on the gi, the hip is fitted in with an underhook or an arm-and-neck grip, and the opponent is thrown over it with a short, explosive turn.",val:"Versió de lluita del derrocament de maluc, pensada per al no-gi: sense dependre del quimono, el maluc es fica amb un underhook o una agafada de braç i coll, i l'adversari es projecta per damunt amb un gir curt i explosiu.",pt:"Versão de luta da queda de quadril, pensada para o no-gi: sem depender do kimono, o quadril entra com um underhook ou uma pegada de braço e pescoço, e o adversário é projetado por cima com um giro curto e explosivo."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi"], name:{es:"Amassa Pão (estrangulación de empuje)",en:"Amassa Pão (thrusting choke)",val:"Amassa Pão (estrangulació d'empenta)",pt:"Amassa Pão"}, desc:{es:"Estrangulación de pie que aprovecha un empujón frontal del rival contra tu pecho: se atrapa su brazo y se presiona con el propio antebrazo contra su cuello mientras se avanza hacia él.",en:"A standing choke that capitalizes on the opponent pushing frontally into your chest: their arm is trapped while your forearm presses against their neck as you step into them.",val:"Estrangulació dreta que aprofita una empenta frontal de l'adversari contra el teu pit: s'atrapa el seu braç i es pressiona amb el propi avantbraç contra el seu coll mentre s'avança cap a ell.",pt:"Estrangulamento em pé que aproveita um empurrão frontal do adversário contra seu peito: o braço dele é preso enquanto seu antebraço pressiona o pescoço dele enquanto você avança."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado de doble tobillo (double ankle grab sweep)",en:"Double ankle grab sweep",val:"Raspat de doble turmell (double ankle grab sweep)",pt:"Raspagem de duplo tornozelo (double ankle grab sweep)"}, desc:{es:"Raspado de guardia abierta en el que se agarran ambos tobillos del rival y se empuja con los pies sus caderas hacia atrás, haciéndolo caer de espaldas para pasar arriba.",en:"An open guard sweep where both of the opponent's ankles are grabbed while the feet push their hips backward, taking them down onto their back to move on top.",val:"Raspat de guàrdia oberta en què s'agarren ambdós turmells de l'adversari i s'empenyen amb els peus els seus malucs cap arrere, fent-lo caure d'esquena per a passar a dalt.",pt:"Raspagem de guarda aberta em que se agarram os dois tornozelos do adversário enquanto os pés empurram seu quadril para trás, derrubando-o de costas para passar por cima."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Raspado de parada de manos (handstand sweep)",en:"Handstand sweep",val:"Raspat de parada de mans (handstand sweep)",pt:"Raspagem de parada de mãos (handstand sweep)"}, desc:{es:"Raspado avanzado en el que te impulsas casi hasta el apoyo invertido sobre las manos para generar el momento necesario y volcar al rival desde una posición de guardia poco convencional.",en:"An advanced sweep where you drive almost into an inverted handstand-like position to generate the momentum needed to roll the opponent from an unconventional guard position.",val:"Raspat avançat en què t'impulses quasi fins al suport invertit sobre les mans per a generar el moment necessari i bolcar l'adversari des d'una posició de guàrdia poc convencional.",pt:"Raspagem avançada em que você se impulsiona quase até um apoio invertido sobre as mãos para gerar o momento necessário e virar o adversário a partir de uma posição de guarda pouco convencional."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Toehold (llave de empeine)",en:"Toehold",val:"Toehold (clau d'empenya)",pt:"Toehold (chave de peito do pé)"}, desc:{es:"Torsión del pie del rival sujetando su empeine y girando, distinta de la clave de tobillo clásica porque ataca la rotación del pie en vez de comprimir el tendón de Aquiles.",en:"A twist applied to the opponent's foot by gripping the instep and rotating it, different from the classic ankle lock since it attacks the foot's rotation instead of compressing the Achilles tendon.",val:"Torsió del peu de l'adversari subjectant la seua empenya i girant, distinta de la clau de turmell clàssica perquè ataca la rotació del peu en compte de comprimir el tendó d'Aquil·les.",pt:"Torção do pé do adversário segurando seu peito do pé e girando, diferente da chave de tornozelo clássica pois ataca a rotação do pé em vez de comprimir o tendão de Aquiles."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Armbar helicóptero (helicopter armbar)",en:"Helicopter armbar",val:"Armbar helicòpter (helicopter armbar)",pt:"Armlock helicóptero (helicopter armbar)"}, desc:{es:"Armbar giratorio: el cuerpo rueda alrededor del brazo del rival y las piernas pasan por encima de su cabeza como las palas de un helicóptero, de modo que la palanca queda aplicada justo al terminar el giro.",en:"A spinning armbar: the body rolls around the opponent's arm and your legs sweep over their head like helicopter blades, so the lock is set right as the rotation ends.",val:"Armbar giratori: el cos rodola al voltant del braç de l'adversari i les cames passen per damunt del seu cap com les pales d'un helicòpter, de manera que la palanca queda aplicada just en acabar el gir.",pt:"Armlock giratório: o corpo rola em torno do braço do adversário e as pernas passam por cima da cabeça dele como as hélices de um helicóptero, de modo que a chave fica aplicada logo ao terminar o giro."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado hoz (sickle sweep)",en:"Sickle sweep",val:"Raspat falç (sickle sweep)",pt:"Raspagem foice (sickle sweep)"}, desc:{es:"Raspado que engancha una pierna del rival por detrás en forma de hoz mientras se empuja su torso, cortando su base de apoyo para volcarlo hacia ese lado.",en:"A sweep that hooks one of the opponent's legs from behind in a sickle-like motion while pushing their torso, cutting their base to roll them to that side.",val:"Raspat que enganxa una cama de l'adversari per darrere en forma de falç mentre s'empeny el seu tors, tallant la seua base de suport per a bolcar-lo cap a eixe costat.",pt:"Raspagem que engancha uma perna do adversário por trás em forma de foice enquanto se empurra seu tronco, cortando sua base de apoio para virá-lo para esse lado."}},
  {cat:"barridas", level:"avanzado", tags:["gi","no-gi"], name:{es:"Raspado estrella (star sweep)",en:"Star sweep",val:"Raspat estrela (star sweep)",pt:"Raspagem estrela (star sweep)"}, desc:{es:"Raspado avanzado en el que el cuerpo se abre en forma de estrella mientras se gira sobre el rival, combinando el impulso de piernas y brazos para invertir la posición.",en:"An advanced sweep where the body opens into a star shape while rotating over the opponent, combining leg and arm drive to invert the position.",val:"Raspat avançat en què el cos s'obri en forma d'estrela mentre es gira sobre l'adversari, combinant l'impuls de cames i braços per a invertir la posició.",pt:"Raspagem avançada em que o corpo se abre em forma de estrela enquanto gira sobre o adversário, combinando o impulso de pernas e braços para inverter a posição."}},
  {cat:"sumisiones", level:"principiante", tags:["gi","no-gi"], name:{es:"Armbar en 5 pasos (5 step armbar)",en:"5 step armbar",val:"Armbar en 5 passos (5 step armbar)",pt:"Armlock em 5 passos (5 step armbar)"}, desc:{es:"Secuencia didáctica clásica para entrar al armbar desde la guardia cerrada, dividida en 5 pasos concretos (control del brazo, giro de cadera, elevación de la pierna, cierre de rodillas y extensión final) muy usada para enseñar la técnica a principiantes.",en:"A classic teaching sequence for entering the armbar from closed guard, broken into 5 concrete steps (arm control, hip rotation, leg swing-over, knee squeeze and final extension), widely used to teach the technique to beginners.",val:"Seqüència didàctica clàssica per a entrar a l'armbar des de la guàrdia tancada, dividida en 5 passos concrets (control del braç, gir de maluc, elevació de la cama, tancament de genolls i extensió final), molt usada per a ensenyar la tècnica a principiants.",pt:"Sequência didática clássica para entrar no armlock a partir da guarda fechada, dividida em 5 passos concretos (controle do braço, giro de quadril, elevação da perna, fechamento dos joelhos e extensão final), muito usada para ensinar a técnica a iniciantes."}},
  {cat:"barridas", level:"intermedio", tags:["gi","no-gi"], name:{es:"Raspado tomahawk (tomahawk sweep)",en:"Tomahawk sweep",val:"Raspat tomahawk (tomahawk sweep)",pt:"Raspagem tomahawk (tomahawk sweep)"}, desc:{es:"Un agarre profundo de manga mantiene el brazo estirado mientras el pie contrario engancha la cadera del rival; el tirón de la manga y el empuje del pie crean un giro que lo vuelca hacia ese lado.",en:"A deep sleeve grip keeps the arm extended while the opposite foot hooks the opponent's hip; the sleeve pull and the foot push create a turn that tips them to that side.",val:"Una agafada profunda de mànega manté el braç estirat mentre el peu contrari enganxa el maluc de l'adversari; l'estirada de la mànega i l'empenta del peu creen un gir que el bolca cap a eixe costat.",pt:"Uma pegada profunda de manga mantém o braço esticado enquanto o pé oposto engancha o quadril do adversário; o puxão da manga e o empurrão do pé criam um giro que o tomba para esse lado."}},
  {cat:"escapes", level:"principiante", tags:["gi","no-gi"], basic:true, name:{es:"Escape de armbar",en:"Armbar escape",val:"Escapada d'armbar",pt:"Fuga de armlock"}, desc:{es:"Antes de que la palanca se complete, se gira la muñeca libre hacia el pulgar del rival y se junta el codo al cuerpo mientras se sienta hacia el hombro atacado, liberando el brazo capturado.",en:"Before the lock fully sets in, the free hand rotates toward the opponent's thumb and the elbow tucks to the body while sitting up toward the attacked shoulder, freeing the trapped arm.",val:"Abans que la palanca es complete, es gira el canell lliure cap al polze de l'adversari i s'ajunta el colze al cos mentre es senta cap a l'espatla atacada, alliberant el braç capturat.",pt:"Antes que a chave se complete, gira-se o pulso livre em direção ao polegar do adversário e o cotovelo se junta ao corpo enquanto se senta em direção ao ombro atacado, liberando o braço preso."}},
