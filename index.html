const HISTORY = [
  {era:{es:"Orígenes en Japón",en:"Origins in Japan",val:"Orígens al Japó",pt:"Origens no Japão"}, text:{es:"El jiu-jitsu tradicional japonés se desarrolló durante siglos como sistema de combate de los samuráis para desarmar y controlar a un rival sin depender de un arma. El judo nació a finales del siglo XIX como una evolución deportiva de esas técnicas, con más énfasis en los derribos y el control desde el suelo.",en:"Traditional Japanese jiu-jitsu developed over centuries as a samurai combat system for disarming and controlling an opponent without relying on a weapon. Judo emerged in the late 19th century as a sportive evolution of those techniques, with more emphasis on throws and ground control.",val:"El jiu-jitsu tradicional japonés es va desenvolupar durant sigles com a sistema de combat dels samurais per a desarmar i controlar un adversari sense dependre d'una arma. El judo va nàixer a finals del sigle XIX com una evolució esportiva d'eixes tècniques, en més èmfasi en els derrocaments i el control des del terra.",pt:"O jiu-jitsu tradicional japonês se desenvolveu ao longo de séculos como sistema de combate dos samurais para desarmar e controlar um adversário sem depender de uma arma. O judô nasceu no final do século XIX como uma evolução esportiva dessas técnicas, com mais ênfase nas quedas e no controle a partir do chão."}},
  {era:{es:"Jigoro Kano y el Kodokan (1882)",en:"Jigoro Kano and the Kodokan (1882)",val:"Jigoro Kano i el Kodokan (1882)",pt:"Jigoro Kano e o Kodokan (1882)"}, text:{es:"En 1882 Jigoro Kano fundó el Kodokan en Tokio. Reunió lo mejor de varias escuelas de jiu-jitsu clásico y eliminó las técnicas más peligrosas para poder practicarlo con seguridad en combate libre (randori). Kano creó también el sistema de grados kyu y dan con el cinturón negro, origen de los cinturones que hoy usa el BJJ.",en:"In 1882 Jigoro Kano founded the Kodokan in Tokyo. He gathered the best of several classical jiu-jitsu schools and removed the most dangerous techniques so it could be practiced safely in free sparring (randori). Kano also created the kyu and dan grading system with the black belt, the origin of the belts BJJ uses today.",val:"El 1882 Jigoro Kano va fundar el Kodokan a Tòquio. Va reunir el millor de diverses escoles de jiu-jitsu clàssic i va eliminar les tècniques més perilloses per a poder practicar-lo amb seguretat en combat lliure (randori). Kano va crear també el sistema de graus kyu i dan amb el cinturó negre, origen dels cinturons que hui utilitza el BJJ.",pt:"Em 1882, Jigoro Kano fundou o Kodokan em Tóquio. Reuniu o melhor de várias escolas de jiu-jitsu clássico e eliminou as técnicas mais perigosas para poder praticá-lo com segurança em luta livre (randori). Kano também criou o sistema de graus kyu e dan com a faixa-preta, origem das faixas que o BJJ usa hoje."}},
  {era:{es:"Mitsuyo Maeda sale de Japón (1904)",en:"Mitsuyo Maeda leaves Japan (1904)",val:"Mitsuyo Maeda ix del Japó (1904)",pt:"Mitsuyo Maeda deixa o Japão (1904)"}, text:{es:"Mitsuyo Maeda, alumno de Kano en el Kodokan, salió de Japón en 1904 rumbo a Estados Unidos. Durante años recorrió Europa y América haciendo exhibiciones y combates de desafío contra luchadores y boxeadores de otros estilos, antes de instalarse en Brasil.",en:"Mitsuyo Maeda, a student of Kano at the Kodokan, left Japan in 1904 for the United States. For years he traveled through Europe and the Americas giving exhibitions and challenge matches against wrestlers and boxers of other styles, before settling in Brazil.",val:"Mitsuyo Maeda, alumne de Kano al Kodokan, va eixir del Japó el 1904 cap als Estats Units. Durant anys va recórrer Europa i Amèrica fent exhibicions i combats de desafiament contra lluitadors i boxejadors d'altres estils, abans d'instal·lar-se al Brasil.",pt:"Mitsuyo Maeda, aluno de Kano no Kodokan, deixou o Japão em 1904 rumo aos Estados Unidos. Durante anos percorreu a Europa e as Américas fazendo exibições e lutas de desafio contra lutadores e boxeadores de outros estilos, antes de se estabelecer no Brasil."}},
  {era:{es:"Paso por España (1907-1908)",en:"A stop in Spain (1907-1908)",val:"Pas per Espanya (1907-1908)",pt:"Passagem pela Espanha (1907-1908)"}, text:{es:"Antes de llegar a Brasil, el jiu-jitsu japonés ya había pisado suelo español: el maestro Sadakazu Uyenishi, conocido como «Raku», lo introdujo en Barcelona en 1907. Poco después, en 1908, el propio Mitsuyo Maeda —quien años más tarde enseñaría a los Gracie— pasó también por España durante su gira mundial, donde se le apodó «Conde Koma», antes de continuar viaje hacia Sudamérica.",en:"Before reaching Brazil, Japanese jiu-jitsu had already set foot in Spain: master Sadakazu Uyenishi, known as \"Raku\", introduced it in Barcelona in 1907. Shortly after, in 1908, Mitsuyo Maeda himself — who would go on to teach the Gracies years later — also passed through Spain during his world tour, where he was nicknamed \"Count Koma\", before continuing on to South America.",val:"Abans d'arribar al Brasil, el jiu-jitsu japonés ja havia trepitjat sòl espanyol: el mestre Sadakazu Uyenishi, conegut com «Raku», el va introduir a Barcelona en 1907. Poc després, en 1908, el propi Mitsuyo Maeda —qui anys més tard ensenyaria als Gracie— també va passar per Espanya durant la seua gira mundial, on el van sobrenomenar «Comte Koma», abans de continuar viatge cap a Sud-amèrica.",pt:"Antes de chegar ao Brasil, o jiu-jitsu japonês já havia pisado em solo espanhol: o mestre Sadakazu Uyenishi, conhecido como \"Raku\", o introduziu em Barcelona em 1907. Pouco depois, em 1908, o próprio Mitsuyo Maeda — que anos mais tarde ensinaria os Gracie — também passou pela Espanha durante sua turnê mundial, onde foi apelidado de \"Conde Koma\", antes de seguir viagem rumo à América do Sul."}},
  {era:{es:"Llegada a Brasil (años 1910-20)",en:"Arrival in Brazil (1910s-20s)",val:"Arribada al Brasil (anys 1910-20)",pt:"Chegada ao Brasil (anos 1910-20)"}, text:{es:"El maestro japonés Mitsuyo Maeda, uno de los mejores judocas de su generación, emigró a Brasil y se estableció en Belém do Pará. Allí conoció a Carlos Gracie, hijo de un empresario local, y le enseñó los fundamentos del judo y el jiu-jitsu tradicional.",en:"Japanese master Mitsuyo Maeda, one of the finest judoka of his generation, emigrated to Brazil and settled in Belém do Pará. There he met Carlos Gracie, son of a local businessman, and taught him the fundamentals of judo and traditional jiu-jitsu.",val:"El mestre japonés Mitsuyo Maeda, un dels millors judokes de la seua generació, va emigrar al Brasil i es va establir a Belém do Pará. Allí va conéixer a Carlos Gracie, fill d'un empresari local, i li va ensenyar els fonaments del judo i el jiu-jitsu tradicional.",pt:"O mestre japonês Mitsuyo Maeda, um dos melhores judocas de sua geração, emigrou para o Brasil e se estabeleceu em Belém do Pará. Lá conheceu Carlos Gracie, filho de um empresário local, e lhe ensinou os fundamentos do judô e do jiu-jitsu tradicional."}},
  {era:{es:"La primera academia Gracie (1925)",en:"The first Gracie academy (1925)",val:"La primera acadèmia Gracie (1925)",pt:"A primeira academia Gracie (1925)"}, text:{es:"Carlos Gracie abrió en 1925 su primera academia en Río de Janeiro. Las clases informales de sus primeros años se convirtieron en una escuela con método propio, en la que sus hermanos, Hélio entre ellos, fueron adaptando las técnicas.",en:"Carlos Gracie opened his first academy in Rio de Janeiro in 1925. The informal lessons of his early years grew into a school with its own method, where his brothers, Hélio among them, kept adapting the techniques.",val:"Carlos Gracie va obrir el 1925 la seua primera acadèmia a Rio de Janeiro. Les classes informals dels primers anys es van convertir en una escola amb mètode propi, on els seus germans, Hélio entre ells, van anar adaptant les tècniques.",pt:"Carlos Gracie abriu em 1925 sua primeira academia no Rio de Janeiro. As aulas informais dos primeiros anos se transformaram em uma escola com método próprio, em que seus irmãos, Hélio entre eles, foram adaptando as técnicas."}},
  {era:{es:"La familia Gracie adapta el arte",en:"The Gracie family adapts the art",val:"La família Gracie adapta l'art",pt:"A família Gracie adapta a arte"}, text:{es:"Carlos Gracie transmitió lo aprendido a sus hermanos. Hélio Gracie, de complexión pequeña y salud delicada, no podía ejecutar muchas técnicas tal como se enseñaban y empezó a modificarlas para depender de la palanca y la posición en vez de la fuerza física, sentando las bases de lo que hoy se conoce como Brazilian Jiu-Jitsu.",en:"Carlos Gracie passed on what he had learned to his brothers. Hélio Gracie, small in frame and in delicate health, couldn't perform many techniques as they were traditionally taught, and began modifying them to rely on leverage and positioning rather than physical strength, laying the foundations of what's known today as Brazilian Jiu-Jitsu.",val:"Carlos Gracie va transmetre el que havia aprés als seus germans. Hélio Gracie, de complexió menuda i salut delicada, no podia executar moltes tècniques tal com s'ensenyaven i va começar a modificar-les per a dependre de la palanca i la posició en lloc de la força física, assentant les bases del que hui es coneix com Brazilian Jiu-Jitsu.",pt:"Carlos Gracie transmitiu o que havia aprendido aos seus irmãos. Hélio Gracie, de compleição pequena e saúde delicada, não conseguia executar muitas técnicas como eram ensinadas e começou a modificá-las para depender da alavanca e da posição em vez da força física, lançando as bases do que hoje se conhece como Brazilian Jiu-Jitsu."}},
  {era:{es:"Los desafíos Gracie (siglo XX)",en:"The Gracie Challenge era (20th century)",val:"Els desafiaments Gracie (sigle XX)",pt:"Os desafios Gracie (século XX)"}, text:{es:"Durante décadas, la familia Gracie retó públicamente a luchadores de otras disciplinas en combates conocidos como «vale tudo» (casi todo vale) para demostrar la eficacia de su sistema. Estos desafíos, muy populares en Brasil, ayudaron a difundir el arte y a pulir sus técnicas contra estilos muy distintos.",en:"For decades, the Gracie family publicly challenged fighters from other disciplines in bouts known as \"vale tudo\" (anything goes) to prove the effectiveness of their system. These challenges, hugely popular in Brazil, helped spread the art and refine its techniques against very different styles.",val:"Durant dècades, la família Gracie va reptar públicament a lluitadors d'altres disciplines en combats coneguts com «vale tudo» (quasi tot val) per a demostrar l'eficàcia del seu sistema. Estos desafiaments, molt populars al Brasil, van ajudar a difondre l'art i a polir les seues tècniques contra estils molt distints.",pt:"Durante décadas, a família Gracie desafiou publicamente lutadores de outras disciplinas em combates conhecidos como \"vale tudo\" para demonstrar a eficácia de seu sistema. Esses desafios, muito populares no Brasil, ajudaram a difundir a arte e a aprimorar suas técnicas contra estilos muito diferentes."}},
  {era:{es:"La escisión de las academias Gracie",en:"The split of the Gracie academies",val:"L'escisió de les acadèmies Gracie",pt:"A cisão das academias Gracie"}, text:{es:"No todos los hermanos Gracie enseñaron de la misma forma. Carlson Gracie, sobrino de Hélio, desarrolló su propio estilo más orientado a la competición y formó una generación de campeones independiente de la línea directa de Hélio, sentando las bases de la diversidad de escuelas que existe hoy.",en:"Not all the Gracie brothers taught the same way. Carlson Gracie, Hélio's nephew, developed his own more competition-oriented style and trained a generation of champions independent from Hélio's direct lineage, laying the groundwork for the diversity of schools that exists today.",val:"No tots els germans Gracie ensenyaven de la mateixa forma. Carlson Gracie, nebot d'Hélio, va desenvolupar el seu propi estil més orientat a la competició i va formar una generació de campions independent de la línia directa d'Hélio, assentant les bases de la diversitat d'escoles que existix hui.",pt:"Nem todos os irmãos Gracie ensinavam da mesma forma. Carlson Gracie, sobrinho de Hélio, desenvolveu seu próprio estilo mais voltado para a competição e formou uma geração de campeões independente da linhagem direta de Hélio, lançando as bases da diversidade de escolas que existe hoje."}},
  {era:{es:"Hélio Gracie contra Kimura (1951)",en:"Hélio Gracie vs. Kimura (1951)",val:"Hélio Gracie contra Kimura (1951)",pt:"Hélio Gracie contra Kimura (1951)"}, text:{es:"El 23 de octubre de 1951, en el estadio de Maracanã, el judoka japonés Masahiko Kimura se enfrentó a Hélio Gracie. Kimura ganó tras unos 13 minutos con una llave de brazo; Hélio no se rindió y su esquina detuvo el combate. Desde entonces esa llave se conoce en el mundo del BJJ como «kimura».",en:"On October 23, 1951, at the Maracanã stadium, Japanese judoka Masahiko Kimura faced Hélio Gracie. After about 13 minutes Kimura won with an arm lock; Hélio never tapped and his corner stopped the fight. Since then the lock has been known in the BJJ world as the \"kimura\".",val:"El 23 d'octubre de 1951, a l'estadi del Maracanã, el judoka japonés Masahiko Kimura es va enfrontar a Hélio Gracie. Després d'uns 13 minuts, Kimura va guanyar amb una clau de braç; Hélio no es va rendir i el seu racó va aturar el combat. Des d'aleshores eixa clau es coneix al món del BJJ com a «kimura».",pt:"Em 23 de outubro de 1951, no estádio do Maracanã, o judoca japonês Masahiko Kimura enfrentou Hélio Gracie. Após cerca de 13 minutos, Kimura venceu com uma chave de braço; Hélio não desistiu e seu córner interrompeu a luta. Desde então essa chave é conhecida no mundo do BJJ como «kimura»."}},
  {era:{es:"El judo, deporte olímpico (1964)",en:"Judo becomes an Olympic sport (1964)",val:"El judo, esport olímpic (1964)",pt:"O judô, esporte olímpico (1964)"}, text:{es:"El judo debutó en los Juegos Olímpicos de Tokio 1964 en categoría masculina, y el judo femenino entró en el programa oficial en Barcelona 1992. El BJJ, en cambio, no es deporte olímpico.",en:"Judo debuted at the Tokyo 1964 Olympic Games in the men's division, and women's judo joined the official program at Barcelona 1992. BJJ, on the other hand, is not an Olympic sport.",val:"El judo va debutar en els Jocs Olímpics de Tòquio 1964 en categoria masculina, i el judo femení va entrar en el programa oficial a Barcelona 1992. El BJJ, en canvi, no és esport olímpic.",pt:"O judô estreou nos Jogos Olímpicos de Tóquio 1964 na categoria masculina, e o judô feminino entrou no programa oficial em Barcelona 1992. O BJJ, por outro lado, não é esporte olímpico."}},
  {era:{es:"Rorion Gracie llega a California (1978)",en:"Rorion Gracie arrives in California (1978)",val:"Rorion Gracie arriba a Califòrnia (1978)",pt:"Rorion Gracie chega à Califórnia (1978)"}, text:{es:"Rorion Gracie se instaló en California en 1978 y empezó a enseñar desde el garaje de su casa, desafiando a quien quisiera comprobar la eficacia del sistema. Años más tarde abriría la Gracie Academy en Torrance, punto de partida del UFC.",en:"Rorion Gracie settled in California in 1978 and began teaching from his home garage, challenging anyone who wanted to test the system. Years later he would open the Gracie Academy in Torrance, the starting point of the UFC.",val:"Rorion Gracie es va instal·lar a Califòrnia el 1978 i va començar a ensenyar des del garatge de casa seua, desafiant qui volguera comprovar l'eficàcia del sistema. Anys més tard obriria la Gracie Academy a Torrance, el punt de partida de l'UFC.",pt:"Rorion Gracie se estabeleceu na Califórnia em 1978 e começou a ensinar na garagem de casa, desafiando quem quisesse testar a eficácia do sistema. Anos depois abriria a Gracie Academy em Torrance, ponto de partida do UFC."}},
  {era:{es:"Nace Gracie Barra (1986)",en:"Gracie Barra is founded (1986)",val:"Naix Gracie Barra (1986)",pt:"Nasce a Gracie Barra (1986)"}, text:{es:"Carlos Gracie Jr. fundó Gracie Barra en 1986 en el barrio de Barra da Tijuca, en Río de Janeiro. Con el tiempo se convertiría en una de las mayores redes de academias del mundo.",en:"Carlos Gracie Jr. founded Gracie Barra in 1986 in the Barra da Tijuca neighborhood of Rio de Janeiro. Over time it would become one of the largest academy networks in the world.",val:"Carlos Gracie Jr. va fundar Gracie Barra el 1986 al barri de Barra da Tijuca, a Rio de Janeiro. Amb el temps es convertiria en una de les majors xarxes d'acadèmies del món.",pt:"Carlos Gracie Jr. fundou a Gracie Barra em 1986, no bairro da Barra da Tijuca, no Rio de Janeiro. Com o tempo, ela se tornaria uma das maiores redes de academias do mundo."}},
  {era:{es:"El UFC y la explosión mundial (1993)",en:"UFC and the global explosion (1993)",val:"L'UFC i l'explosió mundial (1993)",pt:"O UFC e a explosão mundial (1993)"}, text:{es:"La familia Gracie llevó su desafío a Estados Unidos fundando el UFC en 1993 como escaparate. Royce Gracie, de complexión pequeña frente a rivales mucho más grandes, ganó varios de los primeros torneos usando casi exclusivamente BJJ, lo que disparó el interés mundial por el arte de la noche a la mañana.",en:"The Gracie family brought their challenge to the United States by founding the UFC in 1993 as a showcase. Royce Gracie, small-framed against much larger opponents, won several of the early tournaments using almost exclusively BJJ, which sent worldwide interest in the art skyrocketing almost overnight.",val:"La família Gracie va portar el seu desafiament als Estats Units fundant l'UFC en 1993 com a aparador. Royce Gracie, de complexió menuda enfront de rivals molt més grans, va guanyar diversos dels primers torneigs usant quasi exclusivament BJJ, la qual cosa va disparar l'interés mundial per l'art de la nit al dia.",pt:"A família Gracie levou seu desafio aos Estados Unidos fundando o UFC em 1993 como vitrine. Royce Gracie, de compleição pequena diante de adversários muito maiores, venceu vários dos primeiros torneios usando quase exclusivamente BJJ, o que disparou o interesse mundial pela arte da noite para o dia."}},
  {era:{es:"Nace la CBJJ, germen de la IBJJF (1994)",en:"The CBJJ is born, seed of the IBJJF (1994)",val:"Naix la CBJJ, germen de la IBJJF (1994)",pt:"Nasce a CBJJ, germe da IBJJF (1994)"}, text:{es:"En 1994 Carlos Gracie Jr. fundó la Confederación Brasileña de Jiu-Jitsu (CBJJ), el germen de la actual IBJJF. Su objetivo era unificar reglas y organizar campeonatos oficiales con el mismo reglamento para todos.",en:"In 1994 Carlos Gracie Jr. founded the Brazilian Jiu-Jitsu Confederation (CBJJ), the seed of today's IBJJF. Its goal was to unify rules and organize official championships under one rulebook for everyone.",val:"El 1994 Carlos Gracie Jr. va fundar la Confederació Brasilera de Jiu-Jitsu (CBJJ), el germen de l'actual IBJJF. El seu objectiu era unificar regles i organitzar campionats oficials amb el mateix reglament per a tots.",pt:"Em 1994, Carlos Gracie Jr. fundou a Confederação Brasileira de Jiu-Jitsu (CBJJ), o germe da atual IBJJF. Seu objetivo era unificar as regras e organizar campeonatos oficiais com o mesmo regulamento para todos."}},
  {era:{es:"Rickson Gracie y el vale tudo japonés",en:"Rickson Gracie and Japanese vale tudo",val:"Rickson Gracie i el vale tudo japonés",pt:"Rickson Gracie e o vale-tudo japonês"}, text:{es:"En los años 90, Rickson Gracie llevó el BJJ a los grandes escenarios del vale tudo en Japón, venciendo a luchadores de distintas disciplinas y consolidando fuera de Brasil la reputación del arte como un sistema extremadamente efectivo en combates reales.",en:"In the 1990s, Rickson Gracie brought BJJ to the big vale tudo stages in Japan, defeating fighters from different disciplines and cementing the art's reputation outside Brazil as an extremely effective system in real combat.",val:"Als anys 90, Rickson Gracie va portar el BJJ als grans escenaris del vale tudo al Japó, vencent a lluitadors de distintes disciplines i consolidant fora del Brasil la reputació de l'art com un sistema extremadament efectiu en combats reals.",pt:"Nos anos 90, Rickson Gracie levou o BJJ aos grandes palcos do vale-tudo no Japão, vencendo lutadores de diferentes disciplinas e consolidando fora do Brasil a reputação da arte como um sistema extremamente eficaz em combates reais."}},
  {era:{es:"Los primeros mundiales y Rickson Gracie",en:"The first Worlds and Rickson Gracie",val:"Els primers mundials i Rickson Gracie",pt:"Os primeiros mundiais e Rickson Gracie"}, text:{es:"El primer Campeonato Mundial de la IBJJF se celebró en 1996, consolidando el sistema de competición que conocemos hoy. Durante estos años, Rickson Gracie se convirtió en una figura legendaria por su récord invicto en combates de sumisión y sus enseñanzas sobre la conexión entre cuerpo y mente en el arte.",en:"The first IBJJF World Championship was held in 1996, cementing the competition system we know today. During these years, Rickson Gracie became a legendary figure for his undefeated record in submission matches and his teachings on the connection between body and mind in the art.",val:"El primer Campionat Mundial de la IBJJF es va celebrar en 1996, consolidant el sistema de competició que coneixem hui. Durant estos anys, Rickson Gracie es va convertir en una figura llegendària pel seu rècord invicte en combats de submissió i els seus ensenyaments sobre la connexió entre cos i ment en l'art.",pt:"O primeiro Campeonato Mundial da IBJJF foi realizado em 1996, consolidando o sistema de competição que conhecemos hoje. Durante esses anos, Rickson Gracie se tornou uma figura lendária por seu recorde invicto em combates de finalização e seus ensinamentos sobre a conexão entre corpo e mente na arte."}},
  {era:{es:"El BJJ se convierte en base de la MMA",en:"BJJ becomes a foundation of MMA",val:"El BJJ es converteix en base de la MMA",pt:"O BJJ se torna base do MMA"}, text:{es:"Tras el éxito del UFC, los luchadores entendieron que sin defensa ni ataque en el suelo no podían competir en las artes marciales mixtas. Desde entonces el BJJ es una base habitual de la MMA, y hoy prácticamente todo peleador profesional entrena guardias, escapes y sumisiones.",en:"After the UFC's success, fighters realized they could not compete in mixed martial arts without defending and attacking on the ground. Since then BJJ has been a standard base of MMA, and today practically every professional fighter trains guards, escapes and submissions.",val:"Després de l'èxit de l'UFC, els lluitadors van entendre que sense defensa ni atac al terra no podien competir en les arts marcials mixtes. Des d'aleshores el BJJ és una base habitual de la MMA, i hui pràcticament tot lluitador professional entrena guàrdies, escapades i submissions.",pt:"Depois do sucesso do UFC, os lutadores entenderam que, sem defesa nem ataque no chão, não conseguiam competir nas artes marciais mistas. Desde então o BJJ é uma base habitual do MMA, e hoje praticamente todo lutador profissional treina guardas, fugas e finalizações."}},
  {era:{es:"La fundación del ADCC",en:"The founding of ADCC",val:"La fundació de l'ADCC",pt:"A fundação do ADCC"}, text:{es:"En 1998, el jeque Tahnoon Bin Zayed Al Nahyan, practicante de la disciplina, fundó el Abu Dhabi Combat Club para crear un campeonato de referencia en grappling sin distinción de estilos, que con el tiempo se convertiría en el torneo más prestigioso del no-gi.",en:"In 1998, Sheikh Tahnoon Bin Zayed Al Nahyan, himself a practitioner, founded the Abu Dhabi Combat Club to create a reference championship for grappling without distinction of styles, which over time became the most prestigious tournament in no-gi.",val:"En 1998, el xeic Tahnoon Bin Zayed Al Nahyan, practicant de la disciplina, va fundar l'Abu Dhabi Combat Club per a crear un campionat de referència en grappling sense distinció d'estils, que en el temps es convertiria en el torneig més prestigiós del no-gi.",pt:"Em 1998, o xeique Tahnoon Bin Zayed Al Nahyan, ele próprio praticante, fundou o Abu Dhabi Combat Club para criar um campeonato de referência em grappling sem distinção de estilos, que com o tempo se tornaria o torneio mais prestigiado do no-gi."}},
  {era:{es:"Estandarización y federaciones (2000s)",en:"Standardization and federations (2000s)",val:"Estandardisació i federacions (2000s)",pt:"Padronização e federações (anos 2000)"}, text:{es:"Con el crecimiento del deporte llegó la necesidad de reglas unificadas. La IBJJF se consolidó como la federación de referencia, estableciendo el sistema de puntuación, categorías de peso y edad, y requisitos de graduación que hoy son estándar en la mayoría de competiciones.",en:"As the sport grew, the need for unified rules followed. The IBJJF established itself as the leading federation, setting the scoring system, weight and age categories, and graduation requirements that are now standard across most competitions.",val:"Amb el creiximent de l'esport va arribar la necessitat de regles unificades. La IBJJF es va consolidar com la federació de referència, establint el sistema de puntuació, categories de pes i edat, i requisits de graduació que hui són estàndard en la majoria de competicions.",pt:"Com o crescimento do esporte veio a necessidade de regras unificadas. A IBJJF se consolidou como a federação de referência, estabelecendo o sistema de pontuação, categorias de peso e idade, e requisitos de graduação que hoje são padrão na maioria das competições."}},
  {era:{es:"La era moderna del no-gi",en:"The modern no-gi era",val:"L'era moderna del no-gi",pt:"A era moderna do no-gi"}, text:{es:"A partir de los 2000, el grappling sin kimono ganó fuerza como disciplina propia, con el ADCC como su gran referencia. Formatos como el submission-only y el ranking por puntos EBI aportaron nuevas formas de competir centradas en buscar la finalización.",en:"From the 2000s onward, no-gi grappling gained strength as its own discipline, with ADCC as its flagship event. Formats such as submission-only matches and EBI overtime scoring introduced new ways to compete centered on chasing the finish.",val:"A partir dels 2000, el grappling sense quimono va guanyar força com a disciplina pròpia, en l'ADCC com la seua gran referència. Formats com el submission-only i el ranking per punts EBI van aportar noves formes de competir centrades en buscar la finalisació.",pt:"A partir dos anos 2000, o grappling sem quimono ganhou força como disciplina própria, com o ADCC como sua grande referência. Formatos como o submission-only e o ranking por pontos EBI trouxeram novas formas de competir focadas em buscar a finalização."}},
  {era:{es:"Expansión global de las academias",en:"Global expansion of academies",val:"Expansió global de les acadèmies",pt:"Expansão global das academias"}, text:{es:"A partir de los años 2000, academias como Gracie Barra, Alliance, Checkmat o Atos comenzaron a abrir sedes por todo el mundo, transformando el BJJ de un arte casi exclusivamente brasileño a un deporte practicado en prácticamente todos los países.",en:"Starting in the 2000s, academies like Gracie Barra, Alliance, Checkmat, and Atos began opening branches around the world, transforming BJJ from an almost exclusively Brazilian art into a sport practiced in practically every country.",val:"A partir dels anys 2000, acadèmies com Gracie Barra, Alliance, Checkmat o Atos van començar a obrir seus per tot el món, transformant el BJJ d'un art quasi exclusivament brasiler a un esport practicat en pràcticament tots els països.",pt:"A partir dos anos 2000, academias como Gracie Barra, Alliance, Checkmat e Atos começaram a abrir sedes pelo mundo todo, transformando o BJJ de uma arte quase exclusivamente brasileira em um esporte praticado em praticamente todos os países."}},
  {era:{es:"El crecimiento del BJJ femenino",en:"The growth of women's BJJ",val:"El creiximent del BJJ femení",pt:"O crescimento do BJJ feminino"}, text:{es:"Pioneras como Yvonne Duarte, Hannette Staack o Kyra Gracie ayudaron a abrir camino para las mujeres en un deporte inicialmente dominado por hombres, y hoy en día las categorías femeninas cuentan con su propia legión de campeonas reconocidas a nivel mundial.",en:"Pioneers like Yvonne Duarte, Hannette Staack, and Kyra Gracie helped pave the way for women in a sport initially dominated by men, and today the women's divisions have their own roster of world-recognized champions.",val:"Pioneres com Yvonne Duarte, Hannette Staack o Kyra Gracie van ajudar a obrir camí per a les dones en un esport inicialment dominat per hòmens, i hui en dia les categories femenines compten amb la seua propia llegió de campiones reconegudes a nivell mundial.",pt:"Pioneiras como Yvonne Duarte, Hannette Staack e Kyra Gracie ajudaram a abrir caminho para as mulheres em um esporte inicialmente dominado por homens, e hoje as categorias femininas contam com sua própria legião de campeãs reconhecidas mundialmente."}},
  {era:{es:"La revolución de las llaves de pierna (años 2010)",en:"The leg lock revolution (2010s)",val:"La revolució de les claus de cama (anys 2010)",pt:"A revolução das chaves de perna (anos 2010)"}, text:{es:"Durante décadas las llaves de pierna fueron un recurso marginal, y en muchas competiciones estaban restringidas por seguridad. En los años 2010, equipos como el de John Danaher las convirtieron en un sistema de ataque completo, sobre todo en no-gi. Hoy lo que está permitido depende de la federación y del cinturón.",en:"For decades leg locks were a marginal resource and were restricted in many competitions for safety. In the 2010s, teams like John Danaher's turned them into a complete attacking system, especially in no-gi. Today what is allowed depends on the federation and the belt.",val:"Durant dècades les claus de cama van ser un recurs marginal, i en moltes competicions estaven restringides per seguretat. En els anys 2010, equips com el de John Danaher les van convertir en un sistema d'atac complet, sobretot en no-gi. Hui el que està permés depén de la federació i del cinturó.",pt:"Durante décadas as chaves de perna foram um recurso marginal e, em muitas competições, eram restritas por segurança. Nos anos 2010, equipes como a de John Danaher as transformaram em um sistema de ataque completo, sobretudo no no-gi. Hoje o que é permitido depende da federação e da faixa."}},
  {era:{es:"La era del berimbolo",en:"The berimbolo era",val:"L'era del berimbolo",pt:"A era do berimbolo"}, text:{es:"A partir de la década de 2010, una nueva generación de competidores desarrolló sistemas de guardia basados en la inversión y el control de piernas, como el berimbolo, cambiando radicalmente el juego competitivo de guardia frente a las décadas anteriores.",en:"Starting in the 2010s, a new generation of competitors developed guard systems based on inversion and leg control, such as the berimbolo, radically changing the competitive guard game compared to previous decades.",val:"A partir de la dècada de 2010, una nova generació de competidors va desenvolupar sistemes de guàrdia basats en la inversió i el control de cames, com el berimbolo, canviant radicalment el joc competitiu de guàrdia enfront de les dècades anteriors.",pt:"A partir da década de 2010, uma nova geração de competidores desenvolveu sistemas de guarda baseados na inversão e no controle de pernas, como o berimbolo, mudando radicalmente o jogo competitivo de guarda em relação às décadas anteriores."}},
  {era:{es:"La era de los instructionals",en:"The instructional-video era",val:"L'era dels instructionals",pt:"A era dos instructionals"}, text:{es:"Con la llegada de plataformas de vídeo bajo demanda, instructores como John Danaher revolucionaron la forma de enseñar sistemas completos de ataque a las piernas y otros detalles técnicos, permitiendo que practicantes de cualquier parte del mundo accedieran a un nivel de detalle antes reservado a unos pocos.",en:"With the arrival of on-demand video platforms, instructors like John Danaher revolutionized the way complete leg-attack systems and other technical details were taught, letting practitioners anywhere in the world access a level of detail once reserved for a select few.",val:"Amb l'arribada de plataformes de vídeo a demanda, instructors com John Danaher van revolucionar la forma d'ensenyar sistemes complets d'atac a les cames i altres detalls tècnics, permetent que practicants de qualsevol part del món accediren a un nivell de detall abans reservat a uns pocs.",pt:"Com a chegada de plataformas de vídeo sob demanda, instrutores como John Danaher revolucionaram a forma de ensinar sistemas completos de ataque às pernas e outros detalhes técnicos, permitindo que praticantes de qualquer parte do mundo acessassem um nível de detalhe antes reservado a poucos."}},
  {era:{es:"La profesionalización del deporte",en:"The professionalization of the sport",val:"La professionalisació de l'esport",pt:"A profissionalização do esporte"}, text:{es:"Circuitos como ONE Championship, el ADCC o las ligas por equipos han convertido el BJJ en un deporte cada vez más profesional, con retransmisiones en directo, patrocinios y competidores que viven exclusivamente de entrenar y competir.",en:"Circuits like ONE Championship, ADCC, and team leagues have turned BJJ into an increasingly professional sport, with live broadcasts, sponsorships, and competitors who make a living solely from training and competing.",val:"Circuits com ONE Championship, l'ADCC o les lligues per equips han convertit el BJJ en un esport cada volta més professional, amb retransmissions en directe, patrocinis i competidors que viuen exclusivament d'entrenar i competir.",pt:"Circuitos como ONE Championship, ADCC ou ligas por equipes transformaram o BJJ em um esporte cada vez mais profissional, com transmissões ao vivo, patrocínios e competidores que vivem exclusivamente de treinar e competir."}},
  {era:{es:"El BJJ hoy",en:"BJJ today",val:"El BJJ hui",pt:"O BJJ hoje"}, text:{es:"Hoy el BJJ se practica en prácticamente todos los países del mundo, con circuitos profesionales, ligas de equipos y millones de practicantes recreativos. Sigue evolucionando constantemente: nuevas posiciones y sistemas de guardia surgen cada pocos años desde el propio tatami.",en:"Today BJJ is practiced in virtually every country in the world, with professional circuits, team leagues and millions of recreational practitioners. It keeps evolving constantly: new positions and guard systems emerge every few years straight from the mats.",val:"Hui el BJJ es practica en pràcticament tots els països del món, en circuits professionals, lligues d'equips i milions de practicants recreatius. Seguix evolucionant constantment: noves posicions i sistemes de guàrdia sorgixen cada pocs anys des del propi tatami.",pt:"Hoje o BJJ é praticado em praticamente todos os países do mundo, com circuitos profissionais, ligas de equipes e milhões de praticantes recreativos. Continua evoluindo constantemente: novas posições e sistemas de guarda surgem a cada poucos anos direto do tatame."}},
];

}

/* ---------- Strava CSV import ---------- */
function parseCSVText(text){
  // Lightweight CSV parser handling quoted fields with commas/newlines
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function findCol(headers, candidates){
  const lower = headers.map(h=>h.trim().toLowerCase());
  for(const cand of candidates){
    const idx = lower.findIndex(h=>h===cand);
    if(idx>=0) return idx;
  }
  for(const cand of candidates){
    const idx = lower.findIndex(h=>h.includes(cand));
    if(idx>=0) return idx;
  }
  return -1;
}
function parseDurationToMinutes(raw){
  if(!raw) return '';
  const s = raw.trim();
  if(/^\d+:\d{2}(:\d{2})?$/.test(s)){
    const parts = s.split(':').map(Number);
    if(parts.length===3) return Math.round((parts[0]*3600+parts[1]*60+parts[2])/60);
    return Math.round((parts[0]*60+parts[1])/60);
  }
  const n = Number(s);
  if(!isNaN(n)) return Math.round(n/60); // assume seconds
  return '';
}
function parseDateToISO(raw){
  if(!raw) return '';
  const d = new Date(raw);
  if(isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}
function handleStravaFile(file){
  const p = UI[LANG].prog.devices;
  const MAX_BYTES = 5 * 1024 * 1024; // 5MB safety cap
  if(file.size > MAX_BYTES){
    document.getElementById('stravaPreview').textContent = p.stravaTooLarge;
    stravaParsedRows = [];
    document.getElementById('stravaImportBtn').style.display = 'none';
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    const rows = parseCSVText(String(reader.result || ''));
    if(rows.length < 2){ document.getElementById('stravaPreview').textContent = p.stravaNoneFound; stravaParsedRows=[]; document.getElementById('stravaImportBtn').style.display='none'; return; }
    const headers = rows[0];
    const dateIdx = findCol(headers, ['activity date','date']);
    const typeIdx = findCol(headers, ['activity type','type']);
    const nameIdx = findCol(headers, ['activity name','name']);
    const durIdx = findCol(headers, ['elapsed time','moving time','duration']);
    const bjjRe = /jiu|jitsu|bjj|grappl|wrestl|martial|workout|combat/i;
    const parsed = [];
    const MAX_ROWS = 500; // cap rendered/imported rows to keep the UI responsive
    for(let i=1;i<rows.length && parsed.length<MAX_ROWS;i++){
      const r = rows[i];
      if(!r || r.length<2) continue;
      const date = dateIdx>=0 ? parseDateToISO(r[dateIdx]) : '';
      const type = typeIdx>=0 ? (r[typeIdx]||'').trim() : '';
      const name = nameIdx>=0 ? (r[nameIdx]||'').trim() : '';
      const minutes = durIdx>=0 ? parseDurationToMinutes(r[durIdx]) : '';
      if(!date || !minutes) continue;
      const likely = bjjRe.test(type) || bjjRe.test(name);
      parsed.push({date, type, name, minutes, checked: likely});
    }
    stravaParsedRows = parsed;
    renderStravaPreview();
  };
  reader.readAsText(file);
}

}

        if(window.storage){ const r = await window.storage.get('bjjlinx_ck', false); keyB64 = r && r.value; }

      if(!keyB64){ try{ if(typeof localStorage !== 'undefined'){ keyB64 = localStorage.getItem('bjjlinx_ck'); } }catch(e){} }
      if(keyB64){
        const raw = Uint8Array.from(atob(keyB64), c=>c.charCodeAt(0));
        return await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
      }
      const key = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
      const rawExported = await crypto.subtle.exportKey('raw', key);
      const b64 = btoa(String.fromCharCode(...new Uint8Array(rawExported)));
      try{ if(window.storage){ await window.storage.set('bjjlinx_ck', b64, false); } }catch(e){}
      try{ if(typeof localStorage !== 'undefined' && localStorage){ localStorage.setItem('bjjlinx_ck', b64); } }catch(e){}
      return key;
    }catch(e){ return null; }
  })();
  return cryptoKeyPromise;
}
async function encryptStr(str){
  const key = await getCryptoKey();
  if(!key) return str;
  try{
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder().encode(str);
    const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc);
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv, 0); combined.set(new Uint8Array(cipher), iv.length);
    return 'ENC1:' + btoa(String.fromCharCode(...combined));
  }catch(e){ return str; }
}
async function decryptStr(str){
  if(typeof str !== 'string' || !str.startsWith('ENC1:')) return str;
  const key = await getCryptoKey();
  if(!key) throw new Error('no-key');
  const combined = Uint8Array.from(atob(str.slice(5)), c=>c.charCodeAt(0));
  const iv = combined.slice(0,12);
  const cipher = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return new TextDecoder().decode(plainBuf);
}
async function stSet(key, val){
  const encrypted = await encryptStr(JSON.stringify(val));
  try{
    if(window.storage){ await window.storage.set("bjjlinx_"+key, encrypted, false); return; }
  }catch(e){}
  try{
    if(typeof localStorage !== 'undefined'){ localStorage.setItem("bjjlinx_"+key, encrypted); }
  }catch(e){}
}

let DATE_FMT = 'DMY';
function fmtDate(d){
  if(!d) return '';
  try{
    const date = new Date(d+'T00:00:00');
    const dd = String(date.getDate()).padStart(2,'0');
    const mm = String(date.getMonth()+1).padStart(2,'0');
    const yyyy = date.getFullYear();
    return DATE_FMT === 'MDY' ? `${mm}/${dd}/${yyyy}` : `${dd}/${mm}/${yyyy}`;
  }catch(e){ return d; }
}

let heightUnit = 'cm', weightUnit = 'kg';
function cmToFtIn(cm){ const totalIn = cm/2.54; let ft = Math.floor(totalIn/12); let inch = Math.round(totalIn - ft*12); if(inch === 12){ inch = 0; ft += 1; } return {ft, in:inch}; }
function ftInToCm(ft, inch){ return Math.round(((Number(ft)||0)*12 + (Number(inch)||0)) * 2.54); }
function kgToLb(kg){ return kg*2.20462; }
function lbToKg(lb){ return lb/2.20462; }
function setUnitUI(group, unit){
  document.querySelectorAll(`.unit-btn[data-group="${group}"]`).forEach(b=> b.classList.toggle('on', b.dataset.unit===unit));
  if(group==='height'){
    document.getElementById('pfHeightCm').style.display = unit==='cm' ? 'block' : 'none';
    document.getElementById('pfHeightFt').style.display = unit==='ftin' ? 'block' : 'none';
    document.getElementById('pfHeightIn').style.display = unit==='ftin' ? 'block' : 'none';
  }
}
function getHeightCmFromForm(){
  if(heightUnit==='cm') return Number(document.getElementById('pfHeightCm').value)||0;
  return ftInToCm(document.getElementById('pfHeightFt').value, document.getElementById('pfHeightIn').value);
}
function countryDisplayName(esName){
  const found = COUNTRIES.find(c=>c.es===esName);
  return found ? (found[LANG]||found.es) : esName;
}
function countryFlag(code){
  if(!code || code.length!==2) return '';
  const base = 127397;
  return String.fromCodePoint(base + code.charCodeAt(0), base + code.charCodeAt(1));
}
function renderCountrySelect(selId, emptyLabel){
  const sel = document.getElementById(selId);
  if(!sel) return;
  const prev = sel.value;
  const pinOrder = (LANG==='es' || LANG==='val') ? ['España']
    : LANG==='pt' ? ['Brasil','España','Portugal']
    : LANG==='en' ? ['Reino Unido','España','Estados Unidos']
    : [];
  let list = COUNTRIES;
  let optsHtml = '';
  if(pinOrder.length){
    const pinnedEntries = pinOrder.map(esName => COUNTRIES.find(c=>c.es===esName)).filter(Boolean);
    const pinnedEs = new Set(pinnedEntries.map(c=>c.es));
    optsHtml += pinnedEntries.map(c=>`<option value="${esc(c.es)}">${esc((c[LANG]||c.es).toUpperCase())} ${countryFlag(c.code)}</option>`).join('');
    list = COUNTRIES.filter(c=>!pinnedEs.has(c.es));
  }
  optsHtml += list.map(c=>`<option value="${esc(c.es)}">${esc(c[LANG]||c.es)} ${countryFlag(c.code)}</option>`).join('');
  sel.innerHTML = `<option value="">${emptyLabel}</option>` + optsHtml;
  sel.value = prev;
}

function renderBeltOptions(){
  const sel = document.getElementById('pfBelt');
  const prevValue = sel.value;
  const birthdate = document.getElementById('pfBirthdate').value;
  const age = computeAge(birthdate);
  let opts = [];
  if(age !== null && age < 16){
    const whiteBelt = BELTS.find(b=>b.cls==='blanco');
    if(whiteBelt) opts.push({value:'blanco', label:t(whiteBelt.name)});
    const stages = [
      {key:'_blanco', suffix:{es:' y Blanco',en:'-White',val:' i Blanc'}},
      {key:'', suffix:{es:'',en:'',val:''}},
      {key:'_negro', suffix:{es:' y Negro',en:'-Black',val:' i Negre'}},
    ];
    KIDS_BELTS.filter(b=>b.cls!=='juvenil').forEach(b=>{
      stages.forEach(s=> opts.push({value:b.cls+s.key, label: t(b.name)+t(s.suffix)}));
    });
  } else if(age !== null && age < 18){
    opts = BELTS.filter(b=>['blanco','azul','morado'].includes(b.cls)).map(b=>({value:b.cls, label:t(b.name)}));
  } else if(age !== null && age < 19){
    opts = BELTS.filter(b=>!['negro','rojo'].includes(b.cls)).map(b=>({value:b.cls, label:t(b.name)}));
  } else {
    opts = BELTS.map(b=>({value:b.cls, label:t(b.name)}));
  }
  sel.innerHTML = opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
  if(opts.some(o=>o.value===prevValue)) sel.value = prevValue;
}
function beltDisplayLabel(cls){
  const adult = BELTS.find(b=>b.cls===cls);
  if(adult) return t(adult.name);
  const kidsMatch = cls.match(/^([a-z]+)(_blanco|_negro)?$/);
  if(kidsMatch){
    const base = KIDS_BELTS.find(b=>b.cls===kidsMatch[1]);
    if(base){
      const suffixes = {'_blanco':{es:' y Blanco',en:'-White',val:' i Blanc'}, '_negro':{es:' y Negro',en:'-Black',val:' i Negre'}};
      return t(base.name) + (kidsMatch[2] ? t(suffixes[kidsMatch[2]]) : '');
    }
  }
  return cls;
}

function fmtDuration(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return UI[LANG].prog.profile.summary.notAvailable;
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  if(days<0) return UI[LANG].prog.profile.summary.notAvailable;
  const years = Math.floor(days/365);
  const months = Math.floor((days%365)/30);
  const yr = LANG==='en'?'y':LANG==='val'?'a':'a';
  const mo = LANG==='en'?'m':'m';
  if(years>0) return `${years}${yr} ${months}${mo}`;
  return `${months}${mo}`;
}
/* ---------- Age / weight competition categories ---------- */
function parseDecimal(str){
  if(typeof str !== 'string') return Number(str)||0;
  const normalized = str.trim().replace(',', '.');
  const n = parseFloat(normalized);
  return isNaN(n) ? 0 : n;
}
function computeAge(birthdateStr){
  if(!birthdateStr) return null;
  const b = new Date(birthdateStr+'T00:00:00');
  if(isNaN(b.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && today.getDate() < b.getDate())) age--;
  return age>=0 ? age : null;
}
function getAgeCategory(age){
  if(age==null) return null;
  return AGE_CATS.find(c=> age>=c.min && age<=c.max) || null;
}
function getWeightCategory(weightKg, sex){
  if(!weightKg || weightKg<=0 || !sex || !WEIGHT_CATS[sex]) return null;
  return WEIGHT_CATS[sex].find(c=> weightKg <= c.max) || null;
}

  const parts = [];

}

function computeStats(){
  const totalMin = PSTATE.log.reduce((s,l)=>s+(Number(l.duration)||0),0);
  const totalRounds = PSTATE.log.reduce((s,l)=>s+(Number(l.rounds)||0),0);
  const now = Date.now();
  const s30 = PSTATE.log.filter(l=> l.date && (now - new Date(l.date).getTime()) <= 30*86400000).length;
  const catCounts = {};
  PSTATE.log.forEach(l=> (l.techniques||[]).forEach(id=>{ const tech=TECHNIQUES[id]; if(tech) catCounts[tech.cat]=(catCounts[tech.cat]||0)+1; }));
  const weeks = [];
  for(let i=7;i>=0;i--){
    const start = now - i*7*86400000;
    const end = start + 7*86400000;
    const min = PSTATE.log.filter(l=>{ if(!l.date) return false; const d=new Date(l.date).getTime(); return d>=start && d<end; }).reduce((s,l)=>s+(Number(l.duration)||0),0);
    weeks.push(min/60);
  }
  return {totalMin, totalRounds, s30, catCounts, weeks, sessions: PSTATE.log.length};
}

function formatPreciseCountdown(target, now){
  const c = UI[LANG].prog.comps;
  const unit = (n, one, many)=> `${n} ${n===1?one:many}`;
  now = now || new Date();
  const diffMs = target - now;
  if(diffMs <= 0) return {cls:'past', text: c.finished};

  const totalMinutes = Math.floor(diffMs/60000);
  const totalHours = Math.floor(diffMs/3600000);
  const totalDays = Math.floor(diffMs/86400000);

  if(totalHours < 24){
    const h = Math.floor(totalMinutes/60), m = totalMinutes%60;
    return {cls:'today', text: `${unit(h,c.unitHour,c.unitHours)} ${unit(m,c.unitMin,c.unitMins)}`};
  }

  const days = Math.floor(totalHours/24), hours = totalHours%24;
  const primary = `${unit(days,c.unitDay,c.unitDays)} ${LANG==='en'?'and':LANG==='val'?'i':'y'} ${unit(hours,c.unitHour,c.unitHours)}`;
  if(totalDays < 30) return {cls:'upcoming', text: primary};

  let y = target.getFullYear() - now.getFullYear();
  let mo = target.getMonth() - now.getMonth();
  let d = target.getDate() - now.getDate();
  let h = target.getHours() - now.getHours();
  if(h<0){ h+=24; d-=1; }
  if(d<0){ mo-=1; const prevMonthLastDay = new Date(target.getFullYear(), target.getMonth(), 0).getDate(); d+=prevMonthLastDay; }
  if(mo<0){ y-=1; mo+=12; }

  const detail = totalDays < 365
    ? `${unit(mo,c.unitMonth,c.unitMonths)} ${unit(d,c.unitDay,c.unitDays)} ${unit(h,c.unitHour,c.unitHours)}`
    : `${unit(y,c.unitYear,c.unitYears)} ${unit(mo,c.unitMonth,c.unitMonths)} ${unit(d,c.unitDay,c.unitDays)} ${unit(h,c.unitHour,c.unitHours)}`;
  return {cls:'upcoming', text: `${primary} (${detail})`};
}

function renderPlan(){
  const belt = PSTATE.profile.belt || 'blanco';
  const p = UI[LANG].prog;
  const plan = BELT_PLANS[belt];
  if(!plan){
    document.getElementById('planList').innerHTML = `<p style="font-size:13px; color:var(--canvas-dim); margin:0;">${p.plan.maxReached}</p>`;
    document.getElementById('planFill').style.width = '100%';
    document.getElementById('planPct').textContent = '';
    return;
  }
  const key = 'plan_'+belt;
  const checked = PSTATE.learned[key] || {};
  const total = plan.items.length;
  const done = Object.values(checked).filter(Boolean).length;
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('planFill').style.width = pct+'%';
  document.getElementById('planPct').textContent = `${pct}% ${p.plan.progress}`;
  document.getElementById('planList').innerHTML = plan.items.map((it,i)=>`
    <label class="check-item ${checked[i]?'done':''}"><input type="checkbox" data-plancheck="${i}" ${checked[i]?'checked':''}><span>${t(it)}</span></label>
  `).join('');
  document.querySelectorAll('[data-plancheck]').forEach(cb=>{
    cb.onchange = async ()=>{
      const k='plan_'+belt; if(!PSTATE.learned[k]) PSTATE.learned[k]={};
      PSTATE.learned[k][cb.dataset.plancheck] = cb.checked;
      await stSet('learned', PSTATE.learned);
      renderPlan();
    };
  });
}
function localCoachAnalysis(){
  const st = computeStats();
  const p = UI[LANG].prog;
  if(!st.sessions || Object.keys(st.catCounts).length===0) return [p.coach.noData];
  const cats = Object.keys(CAT_LABELS).filter(c=>c!=='autodefensa');
  const withCounts = cats.map(c=>({c, n: st.catCounts[c]||0}));
  withCounts.sort((a,b)=>a.n-b.n);
  const low = withCounts.slice(0,2).filter(x=>x.n < (st.sessions/2));
  const high = withCounts[withCounts.length-1];
  const lines = [];
  const totalHours = (st.totalMin/60).toFixed(1);
  if(LANG==='en'){
    lines.push(`You've logged ${st.sessions} sessions and ${totalHours} hours on the mats.`);
    if(low.length) lines.push(`You've barely worked on ${low.map(x=>CAT_LABELS[x.c].en.toLowerCase()).join(' and ')} — consider dedicating your next sessions to that area.`);
    if(high && high.n>0) lines.push(`${CAT_LABELS[high.c].en} is your most trained category so far (${high.n} logged mentions).`);
    if(st.s30 < 8) lines.push(`Only ${st.s30} sessions in the last 30 days — more mat time will speed up your progress.`);
  } else if(LANG==='val'){
    lines.push(`Has registrat ${st.sessions} sessions i ${totalHours} hores sobre el tatami.`);
    if(low.length) lines.push(`Amb prou faenes has treballat ${low.map(x=>CAT_LABELS[x.c].val.toLowerCase()).join(' i ')} — considera dedicar les teues pròximes sessions a eixa àrea.`);
    if(high && high.n>0) lines.push(`${CAT_LABELS[high.c].val} és la teua categoria més entrenada fins ara (${high.n} mencions registrades).`);
    if(st.s30 < 8) lines.push(`Només ${st.s30} sessions en els últims 30 dies — més temps de tatami accelerarà el teu progrés.`);
  } else {
    lines.push(`Llevas ${st.sessions} sesiones y ${totalHours} horas sobre el tatami registradas.`);
    if(low.length) lines.push(`Apenas has trabajado ${low.map(x=>CAT_LABELS[x.c].es.toLowerCase()).join(' y ')} — podrías dedicar tus próximas sesiones a esa área.`);
    if(high && high.n>0) lines.push(`${CAT_LABELS[high.c].es} es tu categoría más entrenada hasta ahora (${high.n} menciones registradas).`);
    if(st.s30 < 8) lines.push(`Solo ${st.s30} sesiones en los últimos 30 días — más tiempo en el tatami acelerará tu progreso.`);
  }
  return lines;
}
async function runCoach(){
  const p = UI[LANG].prog;
  const btn = document.getElementById('coachBtn');
  const out = document.getElementById('coachOutput');
  const st = computeStats();
  if(!st.sessions){ out.innerHTML = `<div class="insight">${p.coach.noData}</div>`; return; }
  btn.textContent = p.coach.loading;
  btn.disabled = true;
  let lines = null;
  try{
    const prompt = `Eres un coach de Brazilian Jiu-Jitsu. Datos del alumno (JSON): ${JSON.stringify({sessions:st.sessions, totalHours:(st.totalMin/60).toFixed(1), roundsTotal:st.totalRounds, sessionsLast30d:st.s30, categoryCounts:st.catCounts})}. Escribe entre 3 y 5 frases breves de feedback (en ${LANG==='en'?'inglés':LANG==='val'?'valenciano':'español'}), directas y motivadoras, señalando qué categorías de técnica están poco entrenadas y qué debería priorizar en sus próximas sesiones. No uses markdown, solo texto plano en frases separadas por saltos de línea.`;
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:400, messages:[{role:"user", content:prompt}]})
    });
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||'').join(' ').trim();
    if(text) lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  }catch(e){ lines = null; }
  btn.textContent = p.coach.button;
  btn.disabled = false;
  if(!lines || !lines.length){
    out.innerHTML = `<div class="insight" style="opacity:0.75;">${p.coach.fallback}</div>` + localCoachAnalysis().map(l=>`<div class="insight">${esc(l)}</div>`).join('');
  } else {
    out.innerHTML = lines.map(l=>`<div class="insight">${esc(l)}</div>`).join('');
  }
}

function wireDeletes(){
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [key,id] = btn.dataset.del.split(':');
      const idx = PSTATE[key].findIndex(x=>x.id===id);
      if(idx===-1) return;
      const [removed] = PSTATE[key].splice(idx,1);
      await stSet(key, PSTATE[key]);
      renderProgAll();
      showUndoToast(key, removed, idx);
    };
  });
}
function showUndoToast(key, item, idx){
  if(undoTimer) clearTimeout(undoTimer);
  const toast = document.getElementById('undoToast');
  document.getElementById('undoToastText').textContent = UI[LANG].undoDeleted;
  const btn = document.getElementById('undoToastBtn');
  btn.textContent = UI[LANG].undoBtn;
  toast.style.display = 'flex';
  btn.onclick = async ()=>{
    PSTATE[key].splice(idx, 0, item);
    await stSet(key, PSTATE[key]);
    renderProgAll();
    hideUndoToast();
  };
  undoTimer = setTimeout(hideUndoToast, 5000);
}
function hideUndoToast(){
  document.getElementById('undoToast').style.display = 'none';
  if(undoTimer){ clearTimeout(undoTimer); undoTimer = null; }
}
function applyBeltTitleColor(){
  const belt = (PSTATE.profile.belt || '').replace(/_blanco$|_negro$/, '');
  const colorMap = {
    blanco:'var(--white-belt)', azul:'var(--blue-belt)', morado:'var(--purple-belt)',
    marron:'var(--brown-belt)', negro:'var(--black-belt)', rojo:'var(--red-belt)',
    gris:'var(--grey-belt)', amarillo:'var(--yellow-belt)', naranja:'var(--orange-belt)', verde:'var(--green-belt)',
  };
  const titleEl = document.getElementById('brandTitle');
  if(titleEl){
    // Si el título tiene un fondo propio (efecto oculto de colores al pulsarlo), no se toca.
    if(titleEl.style.backgroundColor && titleEl.style.backgroundColor !== 'transparent') return;
    titleEl.style.color = colorMap[belt] || '';
    // El blanco es casi invisible sobre el fondo turquesa: se añade un contorno sutil solo en ese caso para que siga siendo legible.
    titleEl.style.webkitTextStroke = belt === 'blanco' ? '0.6px var(--ink)' : '';
    // Con un fondo personalizado: si el color del cinturón se parece al fondo, se usa una variante legible.
    if(colorMap[belt] && window.__bgc){
      const beltHex = getComputedStyle(document.documentElement).getPropertyValue(colorMap[belt].slice(4,-1)).trim();
      const fix = window.__bgc.titleFix(beltHex);
      if(fix){ titleEl.style.color = fix; titleEl.style.webkitTextStroke = ''; }
    }
  }
}

function exportBackup(){
  const backup = {
    version: 1,
    exportDate: new Date().toISOString(),
    profile: PSTATE.profile, log: PSTATE.log, flows: PSTATE.flows,
    competitions: PSTATE.competitions, medals: PSTATE.medals, partners: PSTATE.partners,
    academies: PSTATE.academies, goals: PSTATE.goals, learned: PSTATE.learned, weightLog: PSTATE.weightLog,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bjjlinx-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

async function importBackupFile(file){
  const p = UI[LANG].prog.profile;
  const statusEl = document.getElementById('importStatus');
  try{
    if(file.size > 5*1024*1024) throw new Error('too large');
    const text = await file.text();
    const data = JSON.parse(text);
    if(typeof data !== 'object' || data===null) throw new Error('invalid');
    // Recorta cualquier campo de texto a un tamaño razonable: un backup manipulado podría meter
    // un valor enorme en un solo campo (dentro del límite de 5MB del archivo) y ralentizar la app.
    const capStrings = (obj)=>{
      if(!obj || typeof obj !== 'object') return obj;
      for(const k in obj){
        if(typeof obj[k] === 'string' && obj[k].length > 2000) obj[k] = obj[k].slice(0, 2000);
        else if(obj[k] && typeof obj[k] === 'object') capStrings(obj[k]);
      }
      return obj;
    };
    const cleanArr = (arr)=> Array.isArray(arr) ? arr.filter(x=> x && typeof x === 'object' && !Array.isArray(x)).map(capStrings) : [];
    PSTATE.profile = (typeof data.profile === 'object' && data.profile && !Array.isArray(data.profile)) ? capStrings(data.profile) : PSTATE.profile;
    PSTATE.log = cleanArr(data.log);
    PSTATE.flows = cleanArr(data.flows);
    PSTATE.competitions = cleanArr(data.competitions);
    PSTATE.medals = cleanArr(data.medals);
    PSTATE.partners = cleanArr(data.partners);
    PSTATE.academies = cleanArr(data.academies);
    PSTATE.goals = cleanArr(data.goals);
    PSTATE.weightLog = cleanArr(data.weightLog);
    PSTATE.learned = (typeof data.learned === 'object' && data.learned && !Array.isArray(data.learned)) ? data.learned : {};
    await Promise.all([
      stSet('profile', PSTATE.profile), stSet('log', PSTATE.log), stSet('flows', PSTATE.flows),
      stSet('competitions', PSTATE.competitions), stSet('medals', PSTATE.medals),
      stSet('partners', PSTATE.partners), stSet('academies', PSTATE.academies),
      stSet('goals', PSTATE.goals), stSet('learned', PSTATE.learned), stSet('weightLog', PSTATE.weightLog),
    ]);
    renderProgAll();
    renderHomeSummary();
    statusEl.textContent = p.importSuccess;
    statusEl.style.color = 'var(--aqua)';
  }catch(e){
    statusEl.textContent = p.importError;
    statusEl.style.color = 'var(--red-bar)';
  }
}

function normalizeSearch(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function runGlobalSearch(term){
  const u = UI[LANG];
  const resultsEl = document.getElementById('globalSearchResults');
  const q = normalizeSearch(term.trim());
  if(q.length < 2){ resultsEl.innerHTML = `<div class="empty">${u.globalSearchEmpty}</div>`; return; }

  const techMatches = TECHNIQUES.filter(x=> normalizeSearch(t(x.name)).includes(q) || normalizeSearch(t(x.desc)).includes(q)).slice(0,12);
  const glossMatches = GLOSSARY.filter(g=> normalizeSearch(t(g.t)).includes(q) || normalizeSearch(t(g.d)).includes(q)).slice(0,10);
  const curMatches = CURIOSITIES.map((c,i)=>({c,i})).filter(({c})=> normalizeSearch(t(c)).includes(q)).slice(0,8);
  const histMatches = HISTORY.filter(h=> normalizeSearch(t(h.era)).includes(q) || normalizeSearch(t(h.text)).includes(q)).slice(0,8);

  if(!techMatches.length && !glossMatches.length && !curMatches.length && !histMatches.length){
    resultsEl.innerHTML = `<div class="empty">${u.globalSearchNoResults}</div>`;
    return;
  }

  let html = '';
  if(techMatches.length){
    html += `<div class="gsearch-cat">🥋 ${u.globalSearchCatTech} (${techMatches.length})</div>`;
    html += techMatches.map(x=>`<div class="gsearch-item" data-gtype="tech" data-gid="${x.id}"><div class="gs-title">${esc(t(x.name))}${treeBtnHtml(x.id)}</div><div class="gs-snippet">${esc(t(x.desc)).slice(0,90)}…</div></div>`).join('');
  }
  if(glossMatches.length){
    html += `<div class="gsearch-cat">📖 ${u.globalSearchCatGloss} (${glossMatches.length})</div>`;
    html += glossMatches.map(g=>`<div class="gsearch-item" data-gtype="gloss"><div class="gs-title">${esc(t(g.t))}</div><div class="gs-snippet">${esc(t(g.d)).slice(0,90)}…</div></div>`).join('');
  }
  if(curMatches.length){
    html += `<div class="gsearch-cat">💡 ${u.globalSearchCatCur} (${curMatches.length})</div>`;
    html += curMatches.map(({c})=>`<div class="gsearch-item" data-gtype="cur"><div class="gs-snippet">${esc(t(c)).slice(0,110)}…</div></div>`).join('');
  }
  if(histMatches.length){
    html += `<div class="gsearch-cat">📜 ${u.globalSearchCatHist} (${histMatches.length})</div>`;
    html += histMatches.map(h=>`<div class="gsearch-item" data-gtype="hist"><div class="gs-title">${esc(t(h.era))}</div><div class="gs-snippet">${esc(t(h.text)).slice(0,90)}…</div></div>`).join('');
  }
  resultsEl.innerHTML = html;

  resultsEl.querySelectorAll('[data-gtype="tech"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      closeGlobalSearch();
      goto('tecnicas');
      document.getElementById('searchInput').value = t(TECHNIQUES.find(x=>String(x.id)===el.dataset.gid).name);
      renderTechniques();
    });
  });
  resultsEl.querySelectorAll('[data-gtype="gloss"]').forEach(el=>{

  });
  resultsEl.querySelectorAll('[data-gtype="cur"]').forEach(el=>{

  });
  resultsEl.querySelectorAll('[data-gtype="hist"]').forEach(el=>{

  });
}

function enableDragScroll(el){
  if(!el || el.dataset.dragBound) return;
  el.dataset.dragBound = '1';
  let isDown = false, startX = 0, startScroll = 0, moved = 0;
  el.addEventListener('mousedown', (e)=>{
    isDown = true; moved = 0;
    el.classList.add('dragging');
    startX = e.pageX; startScroll = el.scrollLeft;
  });
  window.addEventListener('mouseup', ()=>{ isDown = false; el.classList.remove('dragging'); });
  el.addEventListener('mouseleave', ()=>{ if(isDown){ isDown = false; el.classList.remove('dragging'); } });
  el.addEventListener('mousemove', (e)=>{
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    moved = Math.max(moved, Math.abs(dx));
    el.scrollLeft = startScroll - dx;
  });
  el.addEventListener('click', (e)=>{
    if(moved > 6){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}

function scrollToEl(el, gap){
  if(!el) return;
  const hdr = document.querySelector('header.top');
  const off = (hdr ? hdr.getBoundingClientRect().height : 0) + (gap == null ? 12 : gap);
  const y = el.getBoundingClientRect().top + window.pageYOffset - off;
  window.scrollTo({top: Math.max(0, y), behavior: 'smooth'});
}

function mkEl(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function techConn(id){ return TECH_CONNECTIONS[id] || {chains:[], defenses:[]}; }
function treeBtnHtml(id){
  const lab = esc(UI[LANG].treeBtnLabel);
  return '<button type="button" class="tree-btn" data-tree="' + id + '" aria-label="' + lab + '" title="' + lab + '">🌳</button>';
}
function reachableFrom(id){
  const seen = new Set([id]); const q = [id];
  while(q.length){
    const c = q.shift(); const e = techConn(c);
    e.chains.concat(e.defenses).forEach(x=>{ if(!seen.has(x)){ seen.add(x); q.push(x); } });
  }
  return seen.size - 1;
}
let treeBudget = 0, treeOpener = null, fichaOpener = null, fichaHistory = [];
function syncOverlayScrollLock(){
  const open = ['treeOverlay','fichaOverlay'].some(id => document.getElementById(id).style.display === 'flex');
  document.body.style.overflow = open ? 'hidden' : '';
}
function treeNode(id, parentPath){
  const tech = TECHNIQUES[id], conn = techConn(id), u = UI[LANG];
  const loop = parentPath.indexOf(id) !== -1;
  const li = mkEl('li', 'tree-node');
  li._id = id; li._path = parentPath.concat(id); li._built = false;
  li._canOpen = !loop && (conn.chains.length + conn.defenses.length) > 0;
  const row = mkEl('div', 'tree-row');
  const tog = mkEl('button', 'tree-tog' + (li._canOpen ? '' : ' empty'), li._canOpen ? '▸' : '');
  tog.type = 'button';
  if(li._canOpen){
    tog.setAttribute('aria-expanded', 'false'); tog.setAttribute('aria-label', t(tech.name));
    tog.onclick = () => toggleNode(li);
  } else { tog.tabIndex = -1; tog.setAttribute('aria-hidden', 'true'); }
  li._tog = tog;
  const dot = mkEl('span', 'lvl-dot lvl-' + tech.level);
  const nameBtn = mkEl('button', 'tree-name', t(tech.name));
  nameBtn.type = 'button'; nameBtn.onclick = () => openFicha(id);
  const cat = mkEl('span', 'tree-cat', CAT_LABELS[tech.cat][LANG]);
  const main = mkEl('div', 'tree-main'); main.append(nameBtn, cat);
  row.append(tog, dot, main);
  if(loop){ const l = mkEl('span', 'tree-loop', '↺'); l.title = u.treeLoop; l.setAttribute('aria-label', u.treeLoop); row.append(l); }
  li.append(row);
  return li;
}
function buildChildren(li){
  const conn = techConn(li._id), u = UI[LANG];
  const wrap = mkEl('div', 'tree-children');
  [['chains', 'tree-glabel', '🔗 ' + u.treeChains], ['defenses', 'tree-glabel def', '🛡️ ' + u.treeDefs]].forEach(pair=>{
    const ids = conn[pair[0]]; if(!ids.length) return;
    wrap.append(mkEl('div', pair[1], pair[2] + ' (' + ids.length + ')'));
    const ul = mkEl('ul', 'tree-ul');
    ids.forEach(cid => ul.append(treeNode(cid, li._path)));
    treeBudget -= ids.length;
    wrap.append(ul);
  });
  li.append(wrap); li._kids = wrap; li._built = true;
}
function toggleNode(li, forceOpen){
  if(!li._canOpen) return;
  const open = forceOpen != null ? forceOpen : !li.classList.contains('open');
  if(open && !li._built) buildChildren(li);
  li.classList.toggle('open', open);
  li._tog.textContent = open ? '▾' : '▸';
  li._tog.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(li._kids) li._kids.hidden = !open;
}
function treeChildNodes(li){ return li._kids ? Array.from(li._kids.querySelectorAll(':scope > .tree-ul > .tree-node')) : []; }
function expandTo(li, depth, maxDepth){
  if(depth >= maxDepth || !li._canOpen) return;
  if(treeBudget <= 0){ const n = document.getElementById('treeLimitNote'); if(n) n.hidden = false; return; }
  toggleNode(li, true);
  treeChildNodes(li).forEach(c => expandTo(c, depth + 1, maxDepth));
}
function collapseBelow(rootLi){
  Array.from(rootLi.querySelectorAll('.tree-node.open')).forEach(n => { if(n !== rootLi) toggleNode(n, false); });
}
function openTree(id){
  const u = UI[LANG], tech = TECHNIQUES[id];
  treeOpener = document.activeElement;
  document.getElementById('treeTitle').textContent = u.treeTitle;
  document.getElementById('treeCloseBtn').setAttribute('aria-label', u.fichaClose);
  const body = document.getElementById('treeBody'); body.textContent = '';
  const head = mkEl('div', 'tree-head');
  head.append(mkEl('div', 'tree-root-meta', CAT_LABELS[tech.cat][LANG] + ' · ' + u.levelLabels[tech.level]));
  head.append(mkEl('div', 'tree-reach', u.treeReach + ' ' + reachableFrom(id)));
  head.append(mkEl('p', 'tree-hint', u.treeHint));
  const bar = mkEl('div', 'tree-bar');
  const bExp = mkEl('button', 'tree-ctl', u.treeExpand); bExp.type = 'button';
  const bCol = mkEl('button', 'tree-ctl', u.treeCollapse); bCol.type = 'button';
  bar.append(bExp, bCol); head.append(bar);
  const note = mkEl('p', 'tree-hint', u.treeLimit); note.id = 'treeLimitNote'; note.hidden = true; head.append(note);
  body.append(head);
  const ul = mkEl('ul', 'tree-ul'); const rootLi = treeNode(id, []); ul.append(rootLi); body.append(ul);
  treeBudget = 1500; toggleNode(rootLi, true);
  bExp.onclick = () => { note.hidden = true; treeBudget = 1500; expandTo(rootLi, 0, 3); };
  bCol.onclick = () => { note.hidden = true; collapseBelow(rootLi); };
  const ov = document.getElementById('treeOverlay');
  ov.style.display = 'flex';
  body.parentElement.scrollTop = 0;
  syncOverlayScrollLock();
  document.getElementById('treeCloseBtn').focus();
}
function closeTree(){
  document.getElementById('treeOverlay').style.display = 'none';
  syncOverlayScrollLock();
  if(treeOpener && document.contains(treeOpener) && typeof treeOpener.focus === 'function') treeOpener.focus();
  treeOpener = null;
}
function renderFicha(id){
  const tech = TECHNIQUES[id], u = UI[LANG], conn = techConn(id);
  document.getElementById('fichaTitle').textContent = u.fichaTitle;
  const back = document.getElementById('fichaBackBtn'); back.textContent = '‹ ' + u.fichaBack; back.hidden = fichaHistory.length < 2;
  document.getElementById('fichaCloseBtn').setAttribute('aria-label', u.fichaClose);
  const body = document.getElementById('fichaBody'); body.textContent = '';
  const h = mkEl('h3', 'ficha-name', t(tech.name)); h.insertAdjacentHTML('beforeend', treeBtnHtml(id)); body.append(h);
  body.append(mkEl('div', 'flow-meta', CAT_LABELS[tech.cat][LANG] + ' · ' + u.levelLabels[tech.level]));
  const tags = mkEl('div', 'tags');
  if(tech.basic) tags.append(mkEl('span', 'tag', '★ ' + u.chipBasics));
  tech.tags.forEach(tg => tags.append(mkEl('span', 'tag', tg)));
  body.append(tags);
  body.append(mkEl('p', 'ficha-desc', t(tech.desc)));
  if(tech.restriction) body.append(mkEl('div', 'tech-restriction', t(tech.restriction)));
  [['chains', 'flow-btn', u.flowChainsLabel], ['defenses', 'flow-btn defense', u.flowDefenseLabel]].forEach(pair=>{
    body.append(mkEl('div', 'flow-section-label', pair[2]));
    const ids = conn[pair[0]];
    if(!ids.length){ body.append(mkEl('p', 'flow-empty', u.flowEmpty)); return; }
    const row = mkEl('div', 'flow-btn-row');
    ids.forEach(cid => { const b = mkEl('button', pair[1], t(TECHNIQUES[cid].name)); b.type = 'button'; b.onclick = () => openFicha(cid); row.append(b); });
    body.append(row);
  });
  const act = mkEl('div', 'ficha-actions'); const bf = mkEl('button', 'tree-ctl', '🔀 ' + u.fichaFlow);
  bf.type = 'button'; bf.onclick = () => openInFlow(id); act.append(bf); body.append(act);
  body.parentElement.scrollTop = 0;
}
function openFicha(id, isBack){
  const ov = document.getElementById('fichaOverlay');
  if(ov.style.display !== 'flex') fichaOpener = document.activeElement;
  if(!isBack) fichaHistory.push(id);
  renderFicha(id);
  ov.style.display = 'flex';
  syncOverlayScrollLock();
  document.getElementById('fichaCloseBtn').focus();
}
function closeFicha(){
  fichaHistory = [];
  document.getElementById('fichaOverlay').style.display = 'none';
  syncOverlayScrollLock();
  if(fichaOpener && document.contains(fichaOpener) && typeof fichaOpener.focus === 'function') fichaOpener.focus();
  fichaOpener = null;
}
function openInFlow(id){
  closeFicha(); closeTree(); closeGlobalSearch();
  flowCurrentId = id;
  document.getElementById('flowTechSelect').value = String(id);
  renderFlowResult();
  goto('flow');
}
document.addEventListener('click', (ev)=>{
  const b = ev.target && ev.target.closest ? ev.target.closest('[data-tree]') : null;
  if(!b) return;
  ev.stopPropagation(); ev.preventDefault();
  const id = Number(b.dataset.tree);
  if(!(id >= 0 && id < TECHNIQUES.length)) return;
  if(b.closest('#fichaOverlay')) closeFicha();
  openTree(id);
}, true);
document.addEventListener('keydown', (ev)=>{
  if(ev.key !== 'Escape') return;
  if(document.getElementById('fichaOverlay').style.display === 'flex'){ closeFicha(); ev.preventDefault(); }
  else if(document.getElementById('treeOverlay').style.display === 'flex'){ closeTree(); ev.preventDefault(); }
});
document.getElementById('treeCloseBtn').addEventListener('click', closeTree);
document.getElementById('fichaCloseBtn').addEventListener('click', closeFicha);
document.getElementById('fichaBackBtn').addEventListener('click', ()=>{
  if(fichaHistory.length < 2) return;
  fichaHistory.pop(); renderFicha(fichaHistory[fichaHistory.length - 1]);
});


/* ===== INSTALAR COMO APP (PWA) ===== */
var deferredInstall = null;
function isStandaloneApp(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function isIosDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function renderInstallCard(){
  const card = document.getElementById('installCard'); if(!card) return;
  const u = UI[LANG], btn = document.getElementById('installBtn'), hint = document.getElementById('installHint');
  document.getElementById('installTitle').textContent = u.installTitle;
  btn.textContent = u.installBtn;
  if(isStandaloneApp()){ card.style.display = 'none'; return; }
  if(deferredInstall){ card.style.display = 'block'; btn.style.display = 'block'; hint.textContent = u.installAndroid; }
  else if(isIosDevice()){ card.style.display = 'block'; btn.style.display = 'none'; hint.textContent = u.installIos; }
  else { card.style.display = 'none'; }
}
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredInstall = e; renderInstallCard(); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; renderInstallCard(); });
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null; renderInstallCard();
});
(async function init(){
  await initTheme();
  await loadProgress();
  wireProgEvents();
  renderAll();
})();

</script>
