  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Switch",en:"Switch",val:"Switch",pt:"Switch"}, desc:{es:"Movimiento de lucha para escapar de una posición inferior: se gira la cadera con fuerza mientras se mete una mano por detrás de la cadera del rival, invirtiendo quién controla a quién sin perder el contacto.",en:"A wrestling move to escape a bottom position: the hips are turned forcefully while one hand reaches behind the opponent's hip, reversing who controls whom without losing contact.",val:"Moviment de lluita per a escapar d'una posició inferior: es gira el maluc amb força mentre es fica una mà per darrere del maluc de l'adversari, invertint qui controla a qui sense perdre el contacte.",pt:"Movimento de luta para escapar de uma posição inferior: gira-se o quadril com força enquanto se coloca uma mão atrás do quadril do adversário, invertendo quem controla quem sem perder o contato."}},
  {cat:"pases", level:"intermedio", tags:["gi","no-gi"], name:{es:"Pase de corte de rodilla (knee cut pass)",en:"Knee cut pass",val:"Passada de tall de genoll (knee cut pass)",pt:"Passagem de corte de joelho (knee cut pass)"}, desc:{es:"A diferencia del knee slide, aquí la rodilla corta directamente a través del muslo del rival mientras se controla su cadera y su hombro contrario, superando la guardia de un solo movimiento sin asentarse antes en control.",en:"Unlike the knee slide, here the knee cuts straight through the opponent's thigh while controlling their hip and opposite shoulder, clearing the guard in one motion without settling into control first.",val:"A diferència del knee slide, ací el genoll talla directament a través de la cuixa de l'adversari mentre es controla el seu maluc i la seua espatla contrària, superant la guàrdia d'un sol moviment sense assentar-se abans en control.",pt:"Diferente do knee slide, aqui o joelho corta direto através da coxa do adversário enquanto se controla o quadril e o ombro oposto dele, superando a guarda em um só movimento sem se firmar antes em controle."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pase de tejido de piernas (leg weave pass)",en:"Leg weave pass",val:"Passada de teixit de cames (leg weave pass)",pt:"Passagem de tecelagem de pernas (leg weave pass)"}, desc:{es:"Pase en el que las propias piernas se entrelazan con las del rival en vez de apartarlas, 'tejiendo' alrededor de ellas para ir ganando terreno lateral hasta superar la guardia sin necesidad de empujar sus piernas directamente.",en:"A pass where your own legs weave with the opponent's instead of pushing them aside, working around them to gain lateral ground until the guard is cleared without directly shoving their legs.",val:"Passada en què les pròpies cames s'entrellacen amb les de l'adversari en lloc d'apartar-les, 'teixint' al voltant d'elles per a anar guanyant terreny lateral fins a superar la guàrdia sense necessitat d'empényer les seues cames directament.",pt:"Passagem em que as próprias pernas se entrelaçam com as do adversário em vez de afastá-las, 'tecendo' ao redor delas para ganhar terreno lateral até superar a guarda sem precisar empurrar as pernas dele diretamente."}},
  {cat:"autodefensa", level:"principiante", tags:["gi","no-gi"], name:{es:"Defensa de agarre de muñeca",en:"Wrist grab release",val:"Defensa d'agafada de canell",pt:"Defesa de agarrão de pulso"}, desc:{es:"De pie, el rival agarra tu muñeca con una mano: se gira la muñeca hacia el lado del pulgar de su mano (el punto más débil del agarre) mientras se da un paso, liberándola sin necesidad de fuerza.",en:"Standing, the opponent grabs your wrist with one hand: the wrist is rotated toward the thumb side of their grip (the weakest point) while stepping, freeing it without needing strength.",val:"Dret, l'adversari agafa el teu canell amb una mà: es gira el canell cap al costat del polze de la seua mà (el punt més feble de l'agafada) mentre es fa un pas, alliberant-lo sense necessitat de força.",pt:"Em pé, o adversário agarra seu pulso com uma mão: gira-se o pulso em direção ao lado do polegar da mão dele (o ponto mais fraco da pegada) enquanto se dá um passo, liberando-o sem precisar de força."}},
  {cat:"autodefensa", level:"principiante", tags:["gi","no-gi"], name:{es:"Defensa de doble agarre de muñecas",en:"Both wrists grabbed release",val:"Defensa de doble agafada de canells",pt:"Defesa de pulsos agarrados com as duas mãos"}, desc:{es:"El rival agarra tus dos muñecas con sus dos manos: se juntan ambas manos y se tira hacia el propio cuerpo en un movimiento circular brusco, concentrando la fuerza contra sus dos pulgares a la vez.",en:"The opponent grabs both your wrists with both hands: both hands are brought together and pulled toward your body in a sharp circular motion, concentrating force against both of their thumbs at once.",val:"L'adversari agafa els teus dos canells amb les seues dues mans: es junten ambdues mans i es tira cap al propi cos en un moviment circular brusc, concentrant la força contra els seus dos polzes alhora.",pt:"O adversário agarra os dois pulsos com as duas mãos dele: as duas mãos são unidas e puxadas em direção ao próprio corpo num movimento circular brusco, concentrando a força contra os dois polegares dele ao mesmo tempo."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa de abrazo de oso por detrás, brazos libres",en:"Rear bear hug defense, arms free",val:"Defensa d'abraçada d'os per darrere, braços lliures",pt:"Defesa de abraço de urso por trás, braços livres"}, desc:{es:"El rival te abraza desde atrás dejando tus brazos libres: se bajan las caderas, se engancha uno de sus pies con el propio y se gira el tronco bruscamente mientras se lanza un codazo, rompiendo el abrazo y el equilibrio.",en:"The opponent hugs you from behind leaving your arms free: the hips drop, one of their feet is hooked with your own and the torso turns sharply while throwing an elbow, breaking the hug and their balance.",val:"L'adversari t'abraça des de darrere deixant els teus braços lliures: es baixen els malucs, s'enganxa un dels seus peus amb el propi i es gira el tronc bruscament mentre es llança un colzada, trencant l'abraçada i l'equilibri.",pt:"O adversário te abraça por trás deixando seus braços livres: os quadris descem, um dos pés dele é enganchado com o seu próprio e o tronco gira bruscamente enquanto se lança uma cotovelada, quebrando o abraço e o equilíbrio dele."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa de abrazo de oso por detrás, brazos atrapados",en:"Rear bear hug defense, arms trapped",val:"Defensa d'abraçada d'os per darrere, braços atrapats",pt:"Defesa de abraço de urso por trás, braços presos"}, desc:{es:"El rival te abraza desde atrás atrapando también tus brazos: se bajan las caderas para que el abrazo quede más alto, y se gira la cadera con fuerza hacia un lado para crear espacio y liberar un brazo con el que seguir defendiéndote.",en:"The opponent hugs you from behind also trapping your arms: the hips drop so the hug slides up, and the hips turn forcefully to one side to create space and free an arm to keep defending yourself.",val:"L'adversari t'abraça des de darrere atrapant també els teus braços: es baixen els malucs perquè l'abraçada quede més amunt, i es gira el maluc amb força cap a un costat per a crear espai i alliberar un braç amb què continuar defenent-te.",pt:"O adversário te abraça por trás prendendo também seus braços: os quadris descem para que o abraço suba, e o quadril gira com força para um lado para criar espaço e liberar um braço com o qual continuar se defendendo."}},
  {cat:"autodefensa", level:"principiante", tags:["gi","no-gi"], name:{es:"Defensa de abrazo de oso por delante, brazos libres",en:"Front bear hug defense, arms free",val:"Defensa d'abraçada d'os per davant, braços lliures",pt:"Defesa de abraço de urso pela frente, braços livres"}, desc:{es:"El rival te abraza de frente dejando tus brazos libres: se empuja su barbilla hacia atrás con una mano mientras la otra golpea o se separa la cadera, rompiendo el abrazo antes de que pueda apretar o derribar.",en:"The opponent hugs you from the front leaving your arms free: their chin is pushed back with one hand while the other strikes or the hips separate, breaking the hug before they can squeeze or take you down.",val:"L'adversari t'abraça de front deixant els teus braços lliures: s'empeny la seua barbeta cap arrere amb una mà mentre l'altra colpeja o se separa el maluc, trencant l'abraçada abans que puga estrényer o derrocar.",pt:"O adversário te abraça de frente deixando seus braços livres: empurra-se o queixo dele para trás com uma mão enquanto a outra golpeia ou o quadril se afasta, quebrando o abraço antes que ele consiga apertar ou derrubar."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa de abrazo de oso por delante, brazos atrapados",en:"Front bear hug defense, arms trapped",val:"Defensa d'abraçada d'os per davant, braços atrapats",pt:"Defesa de abraço de urso pela frente, braços presos"}, desc:{es:"El rival te abraza de frente atrapando tus brazos: se bajan las caderas hacia atrás para quitarle el ángulo de proyección, se busca una de sus piernas con la propia para trabarla y se gira hacia un lado hasta zafarse.",en:"The opponent hugs you from the front trapping your arms: the hips drop back to take away their throwing angle, one of their legs is hooked with your own to block it, and you turn to one side until breaking free.",val:"L'adversari t'abraça de front atrapant els teus braços: es baixen els malucs cap arrere per a llevar-li l'angle de projecció, es busca una de les seues cames amb la pròpia per a travar-la i es gira cap a un costat fins a soltar-se.",pt:"O adversário te abraça de frente prendendo seus braços: os quadris descem para trás para tirar o ângulo de projeção dele, busca-se uma das pernas dele com a própria para travá-la e gira-se para um lado até se soltar."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa de estrangulación frontal de pie",en:"Standing front choke defense",val:"Defensa d'estrangulació frontal dret",pt:"Defesa de estrangulamento frontal em pé"}, desc:{es:"El rival te estrangula de frente con las dos manos, de pie: se bajan la barbilla y los hombros para proteger el cuello, se atrapan sus muñecas con las dos manos y se gira el cuerpo hacia un lado mientras se avanza, rompiendo el agarre.",en:"The opponent chokes you from the front with both hands, standing: the chin and shoulders drop to protect the neck, their wrists are trapped with both hands and the body turns to one side while stepping in, breaking the grip.",val:"L'adversari t'estrangula de front amb les dues mans, dret: es baixen la barbeta i les espatlles per a protegir el coll, s'atrapen els seus canells amb les dues mans i es gira el cos cap a un costat mentre s'avança, trencant l'agafada.",pt:"O adversário te estrangula de frente com as duas mãos, em pé: o queixo e os ombros descem para proteger o pescoço, os pulsos dele são presos com as duas mãos e o corpo gira para um lado enquanto se avança, quebrando a pegada."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa de estrangulación por detrás de pie",en:"Standing rear choke defense",val:"Defensa d'estrangulació per darrere dret",pt:"Defesa de estrangulamento por trás em pé"}, desc:{es:"El rival te rodea el cuello por detrás con un brazo, de pie: se baja la barbilla rápido para proteger la tráquea, se agarra su brazo con las dos manos y se gira el cuerpo hacia el lado del codo del rival, saliendo de la línea de ataque.",en:"The opponent wraps your neck from behind with one arm, standing: the chin drops quickly to protect the trachea, their arm is grabbed with both hands and the body turns toward the opponent's elbow side, exiting the line of attack.",val:"L'adversari et rodeja el coll per darrere amb un braç, dret: es baixa la barbeta ràpid per a protegir la tràquea, s'agafa el seu braç amb les dues mans i es gira el cos cap al costat del colze de l'adversari, eixint de la línia d'atac.",pt:"O adversário envolve seu pescoço por trás com um braço, em pé: o queixo desce rápido para proteger a traqueia, o braço dele é agarrado com as duas mãos e o corpo gira para o lado do cotovelo do adversário, saindo da linha de ataque."}},
  {cat:"autodefensa", level:"principiante", tags:["gi"], name:{es:"Defensa de agarre de solapa o camiseta",en:"Lapel or shirt grab defense",val:"Defensa d'agafada de solapa o samarreta",pt:"Defesa de agarrão de lapela ou camiseta"}, desc:{es:"El rival agarra tu solapa o camiseta con una mano: se cubre esa mano con la propia para que no pueda soltarse ni golpear con ella, y se gira el cuerpo hacia el lado contrario mientras se controla su codo, llevándolo al suelo o rompiendo la distancia.",en:"The opponent grabs your lapel or shirt with one hand: that hand is covered with your own so they can't release it or strike with it, and the body turns the other way while controlling their elbow, taking them down or breaking distance.",val:"L'adversari agafa la teua solapa o samarreta amb una mà: es cobrix eixa mà amb la pròpia perquè no puga soltar-se ni colpejar amb ella, i es gira el cos cap al costat contrari mentre es controla el seu colze, portant-lo al terra o trencant la distància.",pt:"O adversário agarra sua lapela ou camiseta com uma mão: essa mão é coberta com a sua própria para que ele não consiga soltá-la nem golpear com ela, e o corpo gira para o lado contrário enquanto se controla o cotovelo dele, levando-o ao chão ou quebrando a distância."}},
  {cat:"autodefensa", level:"principiante", tags:["gi","no-gi"], name:{es:"Defensa de agarre de pelo",en:"Hair grab defense",val:"Defensa d'agafada de cabell",pt:"Defesa de agarrão de cabelo"}, desc:{es:"El rival agarra tu pelo con una mano: se cubre su mano con las dos propias contra la cabeza para que no pueda tirar con más fuerza, y se gira todo el cuerpo hacia el lado de su agarre, forzando su muñeca antes de que duela más.",en:"The opponent grabs your hair with one hand: their hand is pressed with both of yours against your head so they can't pull harder, and the whole body turns toward their grip side, forcing their wrist before it hurts more.",val:"L'adversari agafa el teu cabell amb una mà: es cobrix la seua mà amb les dues pròpies contra el cap perquè no puga tirar amb més força, i es gira tot el cos cap al costat del seu agafada, forçant el seu canell abans que faça més mal.",pt:"O adversário agarra seu cabelo com uma mão: a mão dele é pressionada com as suas duas contra a cabeça para que ele não consiga puxar mais forte, e o corpo todo gira para o lado da pegada dele, forçando o pulso dele antes que doa mais."}},
  {cat:"autodefensa", level:"principiante", tags:["gi","no-gi"], name:{es:"Defensa de empujón",en:"Push defense",val:"Defensa d'empenta",pt:"Defesa de empurrão"}, desc:{es:"El rival te empuja con las dos manos en el pecho o los hombros: se da un paso atrás con una pierna para no perder el equilibrio y se baja el nivel agarrando sus muñecas o brazos, usando su propio impulso para llevarlo a una posición de control.",en:"The opponent pushes you with both hands on the chest or shoulders: a step back is taken with one leg to avoid losing balance, and the level drops while grabbing their wrists or arms, using their own momentum to bring them into a control position.",val:"L'adversari t'empeny amb les dues mans al pit o les espatlles: es fa un pas arrere amb una cama per a no perdre l'equilibri i es baixa el nivell agafant els seus canells o braços, usant el seu propi impuls per a portar-lo a una posició de control.",pt:"O adversário te empurra com as duas mãos no peito ou nos ombros: dá-se um passo atrás com uma perna para não perder o equilíbrio e abaixa-se o nível agarrando os pulsos ou braços dele, usando o próprio impulso dele para levá-lo a uma posição de controle."}},
  {cat:"autodefensa", level:"intermedio", tags:["no-gi"], name:{es:"Defensa de puñetazo recto",en:"Straight punch defense",val:"Defensa de puny recte",pt:"Defesa de soco reto"}, desc:{es:"El rival lanza un puñetazo recto: se gira el cuerpo hacia un lado para salir de su línea mientras se desvía el golpe con un antebrazo, entrando al mismo tiempo hacia un clinch o un derribo antes de que pueda lanzar un segundo golpe.",en:"The opponent throws a straight punch: the body turns to one side to exit the punch's line while deflecting it with a forearm, closing the distance at the same time into a clinch or takedown before a second punch can land.",val:"L'adversari llança un puny recte: es gira el cos cap a un costat per a eixir de la seua línia mentre es desvia el colp amb un avantbraç, entrant al mateix temps cap a un clinch o un derrocament abans que puga llançar un segon colp.",pt:"O adversário lança um soco reto: o corpo gira para um lado para sair da linha do golpe enquanto se desvia com um antebraço, entrando ao mesmo tempo num clinch ou numa queda antes que ele consiga lançar um segundo golpe."}},
  {cat:"autodefensa", level:"intermedio", tags:["no-gi"], name:{es:"Defensa de golpe circular (haymaker)",en:"Haymaker defense",val:"Defensa de colp circular (haymaker)",pt:"Defesa de golpe circular (haymaker)"}, desc:{es:"El rival lanza un golpe circular amplio: se cubre la cabeza acercándose rápido hacia su cuerpo, dentro del radio del golpe, en vez de alejarse; desde ahí se entra directamente a un clinch o un derribo.",en:"The opponent throws a wide circular punch: the head is covered while closing distance quickly into their body, inside the punch's radius rather than away from it; from there you enter directly into a clinch or takedown.",val:"L'adversari llança un colp circular ample: es cobrix el cap acostant-se ràpid cap al seu cos, dins del radi del colp, en lloc d'allunyar-se; des d'ací s'entra directament a un clinch o un derrocament.",pt:"O adversário lança um golpe circular amplo: cobre-se a cabeça aproximando-se rápido do corpo dele, dentro do raio do golpe, em vez de se afastar; a partir daí entra-se direto num clinch ou numa queda."}},
  {cat:"autodefensa", level:"intermedio", tags:["no-gi"], name:{es:"Defensa de patada frontal",en:"Front kick defense",val:"Defensa de puntada frontal",pt:"Defesa de chute frontal"}, desc:{es:"El rival lanza una patada frontal: se gira la cadera hacia un lado para reducir el blanco mientras se atrapa el tobillo o la pierna con un brazo, desequilibrándolo hacia atrás o llevándolo a un derribo de una sola pierna.",en:"The opponent throws a front kick: the hips turn to one side to reduce the target while the ankle or leg is caught with one arm, off-balancing them backward or taking them into a single-leg takedown.",val:"L'adversari llança una puntada frontal: es gira el maluc cap a un costat per a reduir el blanc mentre s'atrapa el turmell o la cama amb un braç, desequilibrant-lo cap arrere o portant-lo a un derrocament d'una sola cama.",pt:"O adversário lança um chute frontal: o quadril gira para um lado para reduzir o alvo enquanto o tornozelo ou a perna é preso com um braço, desequilibrando-o para trás ou levando-o a uma queda de uma perna só."}},
  {cat:"autodefensa", level:"avanzado", tags:["gi","no-gi"], name:{es:"Defensa contra cuchillo, amenaza frontal",en:"Knife defense, frontal threat",val:"Defensa contra ganivet, amenaça frontal",pt:"Defesa contra faca, ameaça frontal"}, desc:{es:"El rival te amenaza de frente con un cuchillo: se controla la muñeca de su mano armada con las dos manos en cuanto se detecta el arma, alejando la hoja del propio cuerpo mientras se gira para quedar al lado y no de frente a ella.",en:"The opponent threatens you from the front with a knife: the wrist of their armed hand is controlled with both hands as soon as the weapon is spotted, moving the blade away from your body while turning to stand beside it rather than in front.",val:"L'adversari t'amenaça de front amb un ganivet: es controla el canell de la seua mà armada amb les dues mans en quant es detecta l'arma, allunyant la fulla del propi cos mentre es gira per a quedar al costat i no de front a ella.",pt:"O adversário te ameaça de frente com uma faca: o pulso da mão armada dele é controlado com as duas mãos assim que a arma é detectada, afastando a lâmina do próprio corpo enquanto se gira para ficar ao lado e não de frente para ela."}},
  {cat:"autodefensa", level:"avanzado", tags:["gi","no-gi"], name:{es:"Defensa contra cuchillo, amenaza por detrás",en:"Knife defense, rear threat",val:"Defensa contra ganivet, amenaça per darrere",pt:"Defesa contra faca, ameaça por trás"}, desc:{es:"El rival te pone un cuchillo contra la espalda o el cuello por detrás: se gira el cuerpo hacia el lado del arma mientras se controla esa muñeca con ambas manos, saliendo de la línea de corte antes de buscar el control o el derribo.",en:"The opponent holds a knife against your back or neck from behind: the body turns toward the weapon side while controlling that wrist with both hands, exiting the cutting line before seeking control or a takedown.",val:"L'adversari et posa un ganivet contra l'esquena o el coll per darrere: es gira el cos cap al costat de l'arma mentre es controla eixe canell amb ambdues mans, eixint de la línia de tall abans de buscar el control o el derrocament.",pt:"O adversário coloca uma faca contra suas costas ou pescoço por trás: o corpo gira para o lado da arma enquanto se controla esse pulso com as duas mãos, saindo da linha de corte antes de buscar o controle ou a queda."}},
  {cat:"autodefensa", level:"avanzado", tags:["gi","no-gi"], name:{es:"Defensa contra arma de fuego, amenaza frontal",en:"Gun defense, frontal threat",val:"Defensa contra arma de foc, amenaça frontal",pt:"Defesa contra arma de fogo, ameaça frontal"}, desc:{es:"El rival te apunta de frente con un arma: se controla el cañón desviándolo hacia un lado del propio cuerpo con una mano mientras se avanza rápido hacia él, cerrando la distancia antes de intentar arrebatarla con ambas manos.",en:"The opponent points a gun at you from the front: the barrel is redirected away from your body with one hand while quickly closing the distance toward them, cutting the range before attempting to take the weapon with both hands.",val:"L'adversari t'apunta de front amb una arma: es controla el canó desviant-lo cap a un costat del propi cos amb una mà mentre s'avança ràpid cap a ell, tancant la distància abans d'intentar arrabassar-la amb ambdues mans.",pt:"O adversário aponta uma arma para você de frente: o cano é desviado para um lado do próprio corpo com uma mão enquanto se avança rápido em direção a ele, fechando a distância antes de tentar tomar a arma com as duas mãos."}},
  {cat:"autodefensa", level:"avanzado", tags:["gi","no-gi"], name:{es:"Defensa contra arma de fuego, amenaza por detrás",en:"Gun defense, rear threat",val:"Defensa contra arma de foc, amenaça per darrere",pt:"Defesa contra arma de fogo, ameaça por trás"}, desc:{es:"El rival te apunta por detrás con un arma y te manda levantar las manos: se aprovecha esa postura para girar bruscamente hacia el lado del arma, golpeando su brazo hacia fuera con el antebrazo para desviar el cañón antes de agarrar la muñeca.",en:"The opponent points a gun at you from behind and orders your hands up: that posture is used to turn sharply toward the weapon side, striking their arm outward with the forearm to deflect the barrel before grabbing the wrist.",val:"L'adversari t'apunta per darrere amb una arma i et fa alçar les mans: s'aprofita eixa postura per a girar bruscament cap al costat de l'arma, colpejant el seu braç cap a fora amb l'avantbraç per a desviar el canó abans d'agafar el canell.",pt:"O adversário aponta uma arma para você por trás e manda levantar as mãos: aproveita-se essa postura para girar bruscamente para o lado da arma, golpeando o braço dele para fora com o antebraço para desviar o cano antes de agarrar o pulso."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi"], name:{es:"Defensa de doble agarre de solapas",en:"Both lapels grabbed defense",val:"Defensa de doble agafada de solapes",pt:"Defesa de agarrão nas duas lapelas"}, desc:{es:"El rival agarra tus dos solapas con sus dos manos, de pie: se cubren sus manos con las propias para bloquear un posible cabezazo o golpe, y se gira el cuerpo mientras se controla uno de sus codos, rompiendo el agarre o llevándolo a un derribo.",en:"The opponent grabs both your lapels with both hands, standing: their hands are covered with your own to block a potential headbutt or strike, and the body turns while controlling one of their elbows, breaking the grip or taking them down.",val:"L'adversari agafa les teues dues solapes amb les seues dues mans, dret: es cobrixen les seues mans amb les pròpies per a bloquejar un possible cabotada o colp, i es gira el cos mentre es controla un dels seus colzes, trencant l'agafada o portant-lo a un derrocament.",pt:"O adversário agarra suas duas lapelas com as duas mãos dele, em pé: as mãos dele são cobertas com as suas próprias para bloquear uma possível cabeçada ou golpe, e o corpo gira enquanto se controla um dos cotovelos dele, quebrando a pegada ou levando-o a uma queda."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi","no-gi"], name:{es:"Defensa contra un empujón hacia la pared",en:"Wall push defense",val:"Defensa contra una empenta cap a la paret",pt:"Defesa contra um empurrão de encontro à parede"}, desc:{es:"El rival te empuja contra una pared con ambas manos: se gira la cadera hacia un lado para no quedar atrapado de espaldas contra ella, se controla uno de sus brazos y se usa la propia pared como apoyo para girar la posición a tu favor.",en:"The opponent pushes you against a wall with both hands: the hips turn to one side to avoid getting pinned back against it, one of their arms is controlled and the wall itself is used as support to turn the position in your favor.",val:"L'adversari t'empeny contra una paret amb ambdues mans: es gira el maluc cap a un costat per a no quedar atrapat d'esquena contra ella, es controla un dels seus braços i s'usa la pròpia paret com a suport per a girar la posició al teu favor.",pt:"O adversário te empurra contra uma parede com as duas mãos: o quadril gira para um lado para não ficar preso de costas contra ela, controla-se um dos braços dele e usa-se a própria parede como apoio para virar a posição a seu favor."}},
  {cat:"autodefensa", level:"intermedio", tags:["gi"], name:{es:"Defensa de agarre de corbata o cuello de camisa",en:"Tie or shirt collar grab defense",val:"Defensa d'agafada de corbata o coll de camisa",pt:"Defesa de agarrão de gravata ou colarinho"}, desc:{es:"El rival agarra tu corbata o el cuello de tu camisa y tira hacia sí: se cubre su mano con la propia para que no pueda soltarse, y se avanza hacia él en vez de resistir hacia atrás, aliviando la presión antes de controlar su brazo.",en:"The opponent grabs your tie or shirt collar and pulls toward themselves: their hand is covered with your own so they can't let go, and you step toward them instead of resisting backward, relieving the pressure before controlling their arm.",val:"L'adversari agafa la teua corbata o el coll de la teua camisa i tira cap a si: es cobrix la seua mà amb la pròpia perquè no puga soltar-se, i s'avança cap a ell en lloc de resistir cap arrere, alleujant la pressió abans de controlar el seu braç.",pt:"O adversário agarra sua gravata ou o colarinho da sua camisa e puxa para si: a mão dele é coberta com a sua própria para que ele não consiga soltar, e avança-se em direção a ele em vez de resistir para trás, aliviando a pressão antes de controlar o braço dele."}},
  {cat:"autodefensa", level:"intermedio", tags:["no-gi"], name:{es:"Defensa de montada con golpes",en:"Mount defense against strikes",val:"Defensa de muntada amb colps",pt:"Defesa de montada com golpes"}, desc:{es:"El rival te monta y empieza a golpear: se cubren la cara y el cuello con ambos brazos pegados al cuerpo mientras se eleva la cadera para quitarle base, buscando el momento para atrapar un brazo o hacer el puente y voltearlo.",en:"The opponent mounts you and starts striking: the face and neck are covered with both arms tight to the body while the hips rise to take away their base, looking for the moment to trap an arm or bridge and roll them.",val:"L'adversari et munta i comença a colpejar: es cobrixen la cara i el coll amb ambdós braços apegats al cos mentre s'eleva el maluc per a llevar-li base, buscant el moment per a atrapar un braç o fer el pont i voltejar-lo.",pt:"O adversário te monta e começa a golpear: cobre-se o rosto e o pescoço com os dois braços colados ao corpo enquanto o quadril se eleva para tirar a base dele, buscando o momento de prender um braço ou fazer a ponte e virá-lo."}},
  {cat:"autodefensa", level:"principiante", tags:["gi"], name:{es:"Defensa de doble agarre de mangas",en:"Both sleeves grabbed defense",val:"Defensa de doble agafada de mànegues",pt:"Defesa de agarrão nas duas mangas"}, desc:{es:"El rival agarra tus dos mangas con sus dos manos: se gira una muñeca hacia su pulgar mientras se tira del brazo contrario hacia el propio cuerpo, liberando una mano para golpear o controlar antes que la otra.",en:"The opponent grabs both your sleeves with both hands: one wrist is rotated toward their thumb while the other arm is pulled toward your body, freeing one hand to strike or control before the other.",val:"L'adversari agafa les teues dues mànegues amb les seues dues mans: es gira un canell cap al seu polze mentre es tira del braç contrari cap al propi cos, alliberant una mà per a colpejar o controlar abans que l'altra.",pt:"O adversário agarra as duas mangas com as duas mãos dele: um pulso gira em direção ao polegar dele enquanto o braço contrário é puxado em direção ao próprio corpo, liberando uma mão para golpear ou controlar antes da outra."}},
  {cat:"autodefensa", level:"intermedio", tags:["no-gi"], name:{es:"Defensa de agarre de cintura por detrás, sin levantar",en:"Rear waist lock defense, no lift",val:"Defensa d'agafada de cintura per darrere, sense alçar",pt:"Defesa de pegada na cintura por trás, sem levantar"}, desc:{es:"El rival te agarra la cintura por detrás sin llegar a levantarte: se baja el centro de gravedad y se engancha una de sus piernas con el propio pie, cortando su base mientras se gira hacia un lado para zafarse.",en:"The opponent grabs your waist from behind without lifting you: the center of gravity drops and one of their legs is hooked with your own foot, cutting their base while turning to one side to break free.",val:"L'adversari t'agafa la cintura per darrere sense arribar a alçar-te: es baixa el centre de gravetat i s'enganxa una de les seues cames amb el propi peu, tallant la seua base mentre es gira cap a un costat per a soltar-se.",pt:"O adversário agarra sua cintura por trás sem chegar a te levantar: o centro de gravidade desce e uma das pernas dele é enganchada com o próprio pé, cortando a base dele enquanto se gira para um lado para se soltar."}},
  {cat:"autodefensa", level:"avanzado", tags:["no-gi"], name:{es:"Defensa contra un placaje tipo rugby",en:"Rugby-style tackle defense",val:"Defensa contra un placatge tipus rugbi",pt:"Defesa contra um carrinho estilo rugby"}, desc:{es:"El rival se lanza hacia tus piernas de forma brusca y descontrolada, como un placaje: se hace un sprawl rápido echando las caderas hacia atrás y el peso sobre su espalda, controlando su cabeza y un brazo para no acabar debajo.",en:"The opponent lunges at your legs abruptly and out of control, like a tackle: a quick sprawl is done by throwing the hips back and the weight onto their back, controlling their head and one arm to avoid ending up underneath.",val:"L'adversari es llança cap a les teues cames de forma brusca i descontrolada, com un placatge: es fa un sprawl ràpid tirant els malucs cap arrere i el pes sobre la seua esquena, controlant el seu cap i un braç per a no acabar baix.",pt:"O adversário se lança em direção às suas pernas de forma brusca e descontrolada, como um carrinho: faz-se um sprawl rápido jogando os quadris para trás e o peso sobre as costas dele, controlando a cabeça e um braço dele para não acabar embaixo."}},
  {cat:"derribos", level:"intermedio", tags:["gi"], name:{es:"Obi otoshi (derribo de cinturón)",en:"Obi otoshi (belt drop)",val:"Obi otoshi (derrocament de cinturó)",pt:"Obi otoshi (queda de cinturão)"}, desc:{es:"Derribo de judo en el que se agarra el cinturón del rival por la espalda con una mano mientras la otra controla su brazo o solapa, levantándolo ligeramente para dejarlo caer de espaldas sin apenas girar la cadera.",en:"A judo throw where the opponent's belt is gripped from behind with one hand while the other controls their arm or lapel, lifting them slightly to drop them onto their back with barely any hip rotation.",val:"Derrocament de judo en què s'agafa el cinturó de l'adversari per l'esquena amb una mà mentre l'altra controla el seu braç o solapa, alçant-lo lleugerament per a deixar-lo caure d'esquena sense apenes girar el maluc.",pt:"Queda de judô em que se agarra o cinturão do adversário pelas costas com uma mão enquanto a outra controla o braço ou a lapela dele, levantando-o levemente para deixá-lo cair de costas quase sem girar o quadril."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Seoi otoshi (caída de hombro)",en:"Seoi otoshi (shoulder drop)",val:"Seoi otoshi (caiguda d'espatla)",pt:"Seoi otoshi (queda de ombro)"}, desc:{es:"Variante del seoi nage en la que, en vez de girar y levantar al rival sobre la espalda, se deja caer una rodilla al suelo mientras se tira de su brazo y solapa hacia abajo, haciéndolo caer por delante sin llegar a cargarlo.",en:"A variant of seoi nage where, instead of turning and lifting the opponent onto the back, one knee drops to the floor while pulling their arm and lapel downward, dropping them to the front without ever loading them onto the back.",val:"Variant del seoi nage en què, en lloc de girar i alçar l'adversari sobre l'esquena, es deixa caure un genoll al terra mentre es tira del seu braç i solapa cap avall, fent-lo caure per davant sense arribar a carregar-lo.",pt:"Variante do seoi nage em que, em vez de girar e levantar o adversário sobre as costas, deixa-se cair um joelho no chão enquanto se puxa o braço e a lapela dele para baixo, fazendo-o cair para frente sem chegar a carregá-lo."}},
  {cat:"derribos", level:"avanzado", tags:["gi"], name:{es:"Harai tsurikomi ashi (barrido de pie con tirón)",en:"Harai tsurikomi ashi",val:"Harai tsurikomi ashi (escombrat de peu amb estirada)",pt:"Harai tsurikomi ashi (varredura de pé com puxão)"}, desc:{es:"Derribo de judo que combina un tirón hacia arriba de manga y solapa con un barrido amplio del pie contra la pierna de apoyo del rival, justo cuando desplaza el peso hacia ese lado al dar un paso.",en:"A judo throw that combines an upward pull of the sleeve and lapel with a wide foot sweep against the opponent's supporting leg, right as they shift their weight onto that side while stepping.",val:"Derrocament de judo que combina una estirada cap amunt de mànega i solapa amb una escombrada àmplia del peu contra la cama de suport de l'adversari, just quan desplaça el pes cap a eixe costat en fer un pas.",pt:"Queda de judô que combina um puxão para cima de manga e lapela com uma varredura ampla do pé contra a perna de apoio do adversário, bem quando ele desloca o peso para esse lado ao dar um passo."}},
  {cat:"guardias", level:"avanzado", tags:["no-gi"], name:{es:"Guardia calamar (squid guard)",en:"Squid guard",val:"Guàrdia calamar (squid guard)",pt:"Guarda lula (squid guard)"}, desc:{es:"Guardia inversa en la que las piernas envuelven una de las del rival por dentro y por fuera a la vez, como tentáculos, mientras el tronco gira hacia el suelo; se usa para entrar a ataques de tobillo desde un ángulo inesperado.",en:"An inverted guard where the legs wrap one of the opponent's legs from both inside and outside at once, like tentacles, while the torso turns toward the floor; used to enter ankle attacks from an unexpected angle.",val:"Guàrdia inversa en què les cames embolcallen una de les de l'adversari per dins i per fora alhora, com a tentacles, mentre el tronc gira cap al terra; s'usa per a entrar a atacs de turmell des d'un angle inesperat.",pt:"Guarda invertida em que as pernas envolvem uma das pernas do adversário por dentro e por fora ao mesmo tempo, como tentáculos, enquanto o tronco gira em direção ao chão; usada para entrar em ataques de tornozelo por um ângulo inesperado."}},
  {cat:"sumisiones", level:"avanzado", tags:["gi","no-gi"], name:{es:"Kimura norte-sur",en:"North-south kimura",val:"Kimura nord-sud",pt:"Kimura norte-sul"}, desc:{es:"Variante de la kimura aplicada desde la posición norte-sur en vez de desde el lateral: se atrapa el brazo cercano del rival mientras se gira el cuerpo 90 grados hacia sus pies para cerrar la palanca con todo el peso encima.",en:"A kimura variant applied from the north-south position instead of from the side: the opponent's near arm is trapped while the body turns 90 degrees toward their feet to close the lock with full weight on top.",val:"Variant de la kimura aplicada des de la posició nord-sud en lloc de des del lateral: s'atrapa el braç proper de l'adversari mentre es gira el cos 90 graus cap als seus peus per a tancar la palanca amb tot el pes damunt.",pt:"Variante da kimura aplicada a partir da posição norte-sul em vez de pelo lateral: o braço próximo do adversário é preso enquanto o corpo gira 90 graus em direção aos pés dele para fechar a chave com todo o peso por cima."}},
  {cat:"sumisiones", level:"intermedio", tags:["no-gi"], name:{es:"Short choke (estrangulación corta)",en:"Short choke",val:"Short choke (estrangulació curta)",pt:"Short choke (estrangulamento curto)"}, desc:{es:"Variante compacta de la guillotina en la que el brazo se cierra mucho más corto, casi sin espacio entre el bíceps y el antebrazo, aplicando la presión directamente sobre la tráquea en vez de estirar hacia arriba.",en:"A compact guillotine variant where the arm closes much shorter, with almost no space between biceps and forearm, applying pressure directly on the trachea instead of pulling upward.",val:"Variant compacta de la guillotina en què el braç es tanca molt més curt, quasi sense espai entre el bíceps i l'avantbraç, aplicant la pressió directament sobre la tràquea en lloc d'estirar cap amunt.",pt:"Variante compacta da guilhotina em que o braço fecha bem mais curto, quase sem espaço entre o bíceps e o antebraço, aplicando a pressão diretamente sobre a traqueia em vez de puxar para cima."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Japanese quad (clave de rodilla cuádruple)",en:"Japanese quad",val:"Japanese quad (clau de genoll quàdruple)",pt:"Japanese quad (chave de joelho quádrupla)"}, desc:{es:"Variante del ataque de rodilla en la que se envuelve la pierna del rival con las dos propias piernas cruzadas en forma de cuatro, combinando presión de rodilla y de cadera a la vez desde un control muy cerrado.",en:"A kneebar variant where the opponent's leg is wrapped with both of your own legs crossed in a figure-four, combining knee and hip pressure at once from a very tight control.",val:"Variant de l'atac de genoll en què s'embolica la cama de l'adversari amb les dues pròpies cames creuades en forma de quatre, combinant pressió de genoll i de maluc alhora des d'un control molt tancat.",pt:"Variante do ataque de joelho em que a perna do adversário é envolvida com as duas próprias pernas cruzadas em forma de quatro, combinando pressão de joelho e de quadril ao mesmo tempo a partir de um controle muito fechado."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Monoplata",en:"Monoplata",val:"Monoplata",pt:"Monoplata"}, desc:{es:"Sumisión de hombro derivada de la omoplata en la que solo una pierna controla el brazo del rival, sin cruzar la otra por encima de su espalda, aplicando la palanca con un ángulo más vertical y directo.",en:"A shoulder submission derived from the omoplata where only one leg controls the opponent's arm, without crossing the other over their back, applying the lock with a more vertical, direct angle.",val:"Submissió d'espatla derivada de l'omoplata en què només una cama controla el braç de l'adversari, sense creuar l'altra per damunt de la seua esquena, aplicant la palanca amb un angle més vertical i directe.",pt:"Finalização de ombro derivada da omoplata em que só uma perna controla o braço do adversário, sem cruzar a outra por cima das costas dele, aplicando a chave com um ângulo mais vertical e direto."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Kneebar rodante (rolling kneebar)",en:"Rolling kneebar",val:"Kneebar rodant (rolling kneebar)",pt:"Kneebar rolante (rolling kneebar)"}, desc:{es:"Entrada dinámica al ataque de rodilla en la que, en vez de sentarse a aplicarlo, se rueda todo el cuerpo alrededor de la pierna atrapada del rival, usando el impulso del giro para derribarlo y cerrar la palanca a la vez.",en:"A dynamic kneebar entry where, instead of sitting to apply it, the whole body rolls around the opponent's trapped leg, using the momentum of the spin to take them down and close the lock at the same time.",val:"Entrada dinàmica a l'atac de genoll en què, en lloc d'asseure's a aplicar-lo, es rodola tot el cos al voltant de la cama atrapada de l'adversari, usant l'impuls del gir per a derrocar-lo i tancar la palanca alhora.",pt:"Entrada dinâmica no ataque de joelho em que, em vez de sentar para aplicá-lo, o corpo todo rola ao redor da perna presa do adversário, usando o impulso do giro para derrubá-lo e fechar a chave ao mesmo tempo."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Gut wrench (giro de cintura)",en:"Gut wrench",val:"Gut wrench (gir de cintura)",pt:"Gut wrench (giro de cintura)"}, desc:{es:"Desde la espalda del rival en el suelo, se rodea su cintura con ambos brazos entrelazados y se gira todo el cuerpo hacia un lado, haciéndolo rodar y exponiendo su espalda para sumar puntos o buscar una sumisión.",en:"From the opponent's back on the ground, their waist is wrapped with both arms locked together and the whole body rolls to one side, turning them over and exposing their back for points or a submission.",val:"Des de l'esquena de l'adversari al terra, es rodeja la seua cintura amb ambdós braços entrellaçats i es gira tot el cos cap a un costat, fent-lo rodar i exposant la seua esquena per a sumar punts o buscar una submissió.",pt:"A partir das costas do adversário no chão, a cintura dele é envolvida com os dois braços entrelaçados e o corpo todo gira para um lado, fazendo-o rolar e expondo as costas dele para somar pontos ou buscar uma finalização."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Cradle (control de cuna)",en:"Cradle",val:"Cradle (control de bressol)",pt:"Cradle (controle de berço)"}, desc:{es:"Control de lucha en el que se junta la cabeza del rival con una de sus propias rodillas, entrelazando las manos alrededor de ambas; lo pliega sobre sí mismo y anula casi todo su movimiento.",en:"A wrestling control where the opponent's head is brought together with one of their own knees, hands locked around both; it folds them onto themselves and shuts down almost all of their movement.",val:"Control de lluita en què es junta el cap de l'adversari amb un dels seus propis genolls, entrellaçant les mans al voltant d'ambdós; el plega sobre si mateix i anul·la quasi tot el seu moviment.",pt:"Controle de luta em que a cabeça do adversário é unida a um dos seus próprios joelhos, entrelaçando as mãos ao redor de ambos; dobra-o sobre si mesmo e anula quase todo o seu movimento."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Derribo de cabeza (headlock takedown)",en:"Headlock takedown",val:"Derrocament de cap (headlock takedown)",pt:"Queda de cabeça (headlock takedown)"}, desc:{es:"Derribo de lucha en el que se rodea la cabeza del rival con un brazo y se gira la cadera hacia el lado contrario, cayendo de lado y llevándolo al suelo con el propio peso del giro, sin necesidad de atacar las piernas.",en:"A wrestling takedown where the opponent's head is wrapped with one arm and the hips turn the other way, falling sideways and bringing them down with the weight of the turn, without needing to attack the legs.",val:"Derrocament de lluita en què es rodeja el cap de l'adversari amb un braç i es gira el maluc cap al costat contrari, caient de costat i portant-lo al terra amb el propi pes del gir, sense necessitat d'atacar les cames.",pt:"Queda de luta em que a cabeça do adversário é envolvida com um braço e o quadril gira para o lado contrário, caindo de lado e levando-o ao chão com o próprio peso do giro, sem precisar atacar as pernas."}},
  {cat:"derribos", level:"avanzado", tags:["no-gi"], name:{es:"Caída lateral (lateral drop)",en:"Lateral drop",val:"Caiguda lateral (lateral drop)",pt:"Queda lateral (lateral drop)"}, desc:{es:"Derribo de lucha en el que, desde un control de cuerpo a cuerpo, se deja caer todo el peso hacia un lado mientras se gira la cadera, arrastrando al rival al suelo con el propio cuerpo como contrapeso.",en:"A wrestling takedown where, from a body-to-body control, the whole weight drops to one side while the hips turn, dragging the opponent to the floor with your own body as counterweight.",val:"Derrocament de lluita en què, des d'un control de cos a cos, es deixa caure tot el pes cap a un costat mentre es gira el maluc, arrossegant l'adversari al terra amb el propi cos com a contrapés.",pt:"Queda de luta em que, a partir de um controle corpo a corpo, todo o peso cai para um lado enquanto o quadril gira, arrastando o adversário ao chão com o próprio corpo como contrapeso."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Zancadilla interior (inside trip)",en:"Inside trip",val:"Travessa interior (inside trip)",pt:"Rasteira interna (inside trip)"}, desc:{es:"Derribo de lucha en el que el propio pie o pierna se mete por dentro de la pierna de apoyo del rival mientras se empuja su torso hacia atrás, bloqueando esa pierna para que no pueda recuperar el equilibrio al caer.",en:"A wrestling takedown where your own foot or leg is placed inside the opponent's supporting leg while pushing their torso backward, blocking that leg so they can't recover balance as they fall.",val:"Derrocament de lluita en què el propi peu o cama es fica per dins de la cama de suport de l'adversari mentre s'empeny el seu tors cap arrere, bloquejant eixa cama perquè no puga recuperar l'equilibri en caure.",pt:"Queda de luta em que o próprio pé ou perna entra por dentro da perna de apoio do adversário enquanto se empurra o tronco dele para trás, bloqueando essa perna para que ele não consiga recuperar o equilíbrio ao cair."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Zancadilla exterior (outside trip)",en:"Outside trip",val:"Travessa exterior (outside trip)",pt:"Rasteira externa (outside trip)"}, desc:{es:"Derribo de lucha en el que el propio pie o pierna rodea por fuera la pierna de apoyo del rival mientras se empuja su torso hacia ese mismo lado, haciéndolo tropezar hacia atrás sobre su propia pierna bloqueada.",en:"A wrestling takedown where your own foot or leg hooks around the outside of the opponent's supporting leg while pushing their torso toward that same side, tripping them backward over their own blocked leg.",val:"Derrocament de lluita en què el propi peu o cama rodeja per fora la cama de suport de l'adversari mentre s'empeny el seu tors cap a eixe mateix costat, fent-lo entropessar cap arrere sobre la seua pròpia cama bloquejada.",pt:"Queda de luta em que o próprio pé ou perna envolve por fora a perna de apoio do adversário enquanto se empurra o tronco dele para esse mesmo lado, fazendo-o tropeçar para trás sobre a própria perna bloqueada."}},
  {cat:"barridas", level:"avanzado", tags:["no-gi"], name:{es:"Raspado de gancho (hook sweep)",en:"Hook sweep",val:"Raspat de ganxo (hook sweep)",pt:"Raspagem de gancho (hook sweep)"}, desc:{es:"Desde una guardia enganchada, se engancha el pie profundamente detrás de la pierna del rival mientras se tira de su manga o brazo, barriéndolo hacia ese lado sin soltar nunca el gancho de la pierna.",en:"From a hooked guard, the foot hooks deep behind the opponent's leg while pulling their sleeve or arm, sweeping them to that side without ever releasing the leg hook.",val:"Des d'una guàrdia enganxada, s'enganxa el peu profundament darrere de la cama de l'adversari mentre es tira de la seua mànega o braç, raspant-lo cap a eixe costat sense soltar mai el ganxo de la cama.",pt:"A partir de uma guarda enganchada, o pé engancha profundamente atrás da perna do adversário enquanto se puxa a manga ou o braço dele, raspando-o para esse lado sem nunca soltar o gancho da perna."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Esposas de Daguestán (Dagestani handcuff)",en:"Dagestani handcuff",val:"Manilles del Daguestan (Dagestani handcuff)",pt:"Algemas do Daguestão (Dagestani handcuff)"}, desc:{es:"Control de brazo moderno en el que se entrelaza el propio brazo con el del rival por detrás de su espalda, inmovilizándolo como si llevara unas esposas; se usa para evitar que se defienda mientras se ataca la pierna o la espalda.",en:"A modern arm control where your own arm is laced with the opponent's behind their back, immobilizing it as if handcuffed; used to stop them defending while the leg or back is attacked.",val:"Control de braç modern en què s'entrellaça el propi braç amb el de l'adversari per darrere de la seua esquena, immobilitzant-lo com si portara unes manilles; s'usa per a evitar que es defenga mentre s'ataca la cama o l'esquena.",pt:"Controle de braço moderno em que o próprio braço é entrelaçado com o do adversário atrás das costas dele, imobilizando-o como se estivesse algemado; usado para impedir que ele se defenda enquanto se ataca a perna ou as costas."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Montado a horcajadas lateral (chair sit)",en:"Chair sit",val:"Muntat a cavall lateral (chair sit)",pt:"Montado de lado (chair sit)"}, desc:{es:"Control de espalda en el que te sientas sobre la cadera del rival de lado, como en una silla, con un gancho profundo y el otro pie apoyado en el suelo; da mucha estabilidad para controlar sin gastar energía sujetando con las piernas.",en:"A back control where you sit on the opponent's hip sideways, like in a chair, with one deep hook and the other foot planted on the floor; it gives a lot of stability to control without spending energy gripping with the legs.",val:"Control d'esquena en què et sentes sobre el maluc de l'adversari de costat, com en una cadira, amb un ganxo profund i l'altre peu recolzat al terra; dona molta estabilitat per a controlar sense gastar energia subjectant amb les cames.",pt:"Controle de costas em que você se senta sobre o quadril do adversário de lado, como numa cadeira, com um gancho profundo e o outro pé apoiado no chão; dá muita estabilidade para controlar sem gastar energia segurando com as pernas."}},
  {cat:"escapes", level:"intermedio", tags:["no-gi"], name:{es:"Escape de gut wrench",en:"Gut wrench escape",val:"Escapada de gut wrench",pt:"Fuga de gut wrench"}, desc:{es:"Contra el gut wrench, se pega el propio brazo al cuerpo para que el rival no pueda entrelazar las manos del todo, y se gira hacia el lado contrario al giro antes de que complete la vuelta, cayendo boca abajo de nuevo.",en:"Against the gut wrench, the arm is kept tight to the body so the opponent can't fully lock their hands, and you turn the opposite way to the roll before it completes, landing face down again.",val:"Contra el gut wrench, es pega el propi braç al cos perquè l'adversari no puga entrellaçar les mans del tot, i es gira cap al costat contrari al gir abans que complete la volta, caient boca avall de nou.",pt:"Contra o gut wrench, o próprio braço é colado ao corpo para que o adversário não consiga entrelaçar as mãos por completo, e gira-se para o lado contrário ao giro antes que ele complete a volta, caindo de bruços novamente."}},
  {cat:"guardias", level:"intermedio", tags:["no-gi"], name:{es:"Guardia perro (dog guard)",en:"Dog guard",val:"Guàrdia gos (dog guard)",pt:"Guarda cachorro (dog guard)"}, desc:{es:"Guardia de piernas en la que te colocas a cuatro patas con una pierna metida profundamente entre las del rival, enganchando su cadera desde dentro; es una entrada habitual hacia ataques de tobillo y raspados de inversión.",en:"A leg guard where you're on all fours with one leg threaded deep between the opponent's, hooking their hip from inside; a common entry into ankle attacks and inverted sweeps.",val:"Guàrdia de cames en què et col·loques a quatre grapes amb una cama ficada profundament entre les de l'adversari, enganxant el seu maluc des de dins; és una entrada habitual cap a atacs de turmell i raspats d'inversió.",pt:"Guarda de pernas em que você fica de quatro com uma perna enfiada profundamente entre as do adversário, enganchando o quadril dele por dentro; é uma entrada habitual para ataques de tornozelo e raspagens de inversão."}},
  {cat:"pases", level:"avanzado", tags:["gi","no-gi"], name:{es:"Pase de presión de cadera (hip pressure pass)",en:"Hip pressure pass",val:"Passada de pressió de maluc (hip pressure pass)",pt:"Passagem de pressão de quadril (hip pressure pass)"}, desc:{es:"Pase lento en el que la cadera se mantiene pegada y pesando sobre las piernas del rival en todo momento, avanzando centímetro a centímetro hasta aplastar su guardia sin darle espacio para recomponer ni para atacar.",en:"A slow pass where the hips stay glued and weighing on the opponent's legs the whole time, advancing inch by inch until flattening their guard without giving space to recompose or attack.",val:"Passada lenta en què el maluc es manté apegat i pesant sobre les cames de l'adversari en tot moment, avançant centímetre a centímetre fins a aixafar la seua guàrdia sense donar-li espai per a recompondre ni per a atacar.",pt:"Passagem lenta em que o quadril fica colado e pesando sobre as pernas do adversário o tempo todo, avançando centímetro a centímetro até esmagar a guarda dele sem dar espaço para recompor nem para atacar."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Montada coreana (Korean mount)",en:"Korean mount",val:"Muntada coreana (Korean mount)",pt:"Montada coreana (Korean mount)"}, desc:{es:"Variante de la montada en la que los pies se entrelazan por debajo de las piernas del rival en vez de arriba, pegando las rodillas al suelo con una base muy baja que resulta muy difícil de voltear.",en:"A mount variant where the feet lock underneath the opponent's legs instead of above, pinning the knees to the floor with a very low base that is extremely hard to roll over.",val:"Variant de la muntada en què els peus s'entrellacen per baix de les cames de l'adversari en lloc d'a dalt, pegant els genolls al terra amb una base molt baixa que resulta molt difícil de voltejar.",pt:"Variante da montada em que os pés se travam por baixo das pernas do adversário em vez de por cima, colando os joelhos ao chão com uma base muito baixa que é muito difícil de virar."}},
  {cat:"escapes", level:"avanzado", tags:["no-gi"], name:{es:"Escape del Japanese quad",en:"Japanese quad escape",val:"Escapada del Japanese quad",pt:"Fuga do Japanese quad"}, desc:{es:"Contra el ataque cuádruple de rodilla, se gira el cuerpo hacia el lado de la presión en vez de resistir, aliviando la torsión mientras se intenta liberar el pie atrapado entre las piernas del rival antes de que cierre del todo.",en:"Against the quad kneebar, the body turns toward the pressure side instead of resisting, relieving the torque while trying to free the foot trapped between the opponent's legs before it fully closes.",val:"Contra l'atac quàdruple de genoll, es gira el cos cap al costat de la pressió en lloc de resistir, alleujant la torsió mentre s'intenta alliberar el peu atrapat entre les cames de l'adversari abans que tanque del tot.",pt:"Contra o ataque quádruplo de joelho, o corpo gira para o lado da pressão em vez de resistir, aliviando a torção enquanto se tenta liberar o pé preso entre as pernas do adversário antes que feche por completo."}},
  {cat:"escapes", level:"intermedio", tags:["no-gi"], name:{es:"Peterson roll",en:"Peterson roll",val:"Peterson roll",pt:"Peterson roll"}, desc:{es:"Escape de lucha contra el cabezal: desde tortuga se mete el hombro bajo el brazo que controla tu cabeza y se rueda lateralmente sobre él, sacando la cabeza del agarre y volviendo a quedar frente al rival.",en:"A wrestling escape against the front headlock: from turtle, the shoulder drops under the arm controlling your head and you roll sideways over it, pulling the head out of the grip and ending up facing the opponent again.",val:"Escapada de lluita contra el capçal: des de tortuga es fica l'espatla per baix del braç que controla el teu cap i es rodola lateralment sobre ell, traient el cap de l'agafada i tornant a quedar de cara a l'adversari.",pt:"Fuga de luta contra o front headlock: da tartaruga, o ombro entra por baixo do braço que controla sua cabeça e rola-se lateralmente sobre ele, tirando a cabeça da pegada e voltando a ficar de frente para o adversário."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Spladle",en:"Spladle",val:"Spladle",pt:"Spladle"}, desc:{es:"Control de lucha que combina un gancho de pierna sobre una de las piernas del rival con el control de su brazo y su cabeza, abriéndolo en forma de aspa para exponer su espalda y mantenerlo inmovilizado.",en:"A wrestling control combining a leg hook on one of the opponent's legs with control of their arm and head, spreading them out in an X shape to expose the back and keep them pinned.",val:"Control de lluita que combina un ganxo de cama sobre una de les cames de l'adversari amb el control del seu braç i cap, obrint-lo en forma d'aspa per a exposar l'esquena i mantenir-lo immobilitzat.",pt:"Controle de luta que combina um gancho de perna sobre uma das pernas do adversário com o controle do braço e da cabeça, abrindo-o em forma de X para expor as costas e mantê-lo imobilizado."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Cement mixer (giro de hormigonera)",en:"Cement mixer",val:"Cement mixer (gir de formigonera)",pt:"Cement mixer (giro de betoneira)"}, desc:{es:"Giro de lucha contra un rival en tortuga: con un brazo bajo su cabeza y el otro controlando la cadera o el brazo opuesto, se rueda a su alrededor arrastrándolo en un giro continuo hasta dejar su espalda expuesta.",en:"A wrestling turn against an opponent in turtle: with one arm under their head and the other controlling the hip or the far arm, you roll around them, dragging them through a continuous spin until their back is exposed.",val:"Gir de lluita contra un adversari en tortuga: amb un braç per baix del seu cap i l'altre controlant el maluc o el braç contrari, es rodola al seu voltant arrossegant-lo en un gir continu fins a deixar l'esquena exposada.",pt:"Giro de luta contra um adversário na tartaruga: com um braço sob a cabeça dele e o outro controlando o quadril ou o braço oposto, rola-se ao redor arrastando-o num giro contínuo até expor as costas."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Media nelson (half nelson)",en:"Half nelson",val:"Mitja nelson (half nelson)",pt:"Meia nelson (half nelson)"}, desc:{es:"Se pasa un brazo bajo la axila del rival hasta apoyar la mano en su nuca, y se usa la palanca del hombro para girarlo boca arriba o exponerle la espalda; es un clásico de la lucha olímpica.",en:"One arm passes under the opponent's armpit until the hand rests on the back of their neck, and the shoulder leverage is used to turn them onto their back or expose it; a classic of Olympic wrestling.",val:"Es passa un braç per baix de l'aixella de l'adversari fins a recolzar la mà a la seua nuca, i s'usa la palanca de l'espatla per a girar-lo cap per amunt o exposar-li l'esquena; és un clàssic de la lluita olímpica.",pt:"Passa-se um braço por baixo da axila do adversário até apoiar a mão na nuca dele, e usa-se a alavanca do ombro para virá-lo de barriga para cima ou expor as costas; um clássico da luta olímpica."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Cuarto de nelson (quarter nelson)",en:"Quarter nelson",val:"Quart de nelson (quarter nelson)",pt:"Quarto de nelson (quarter nelson)"}, desc:{es:"Con el rival en tortuga o de costado, un brazo pasa bajo su axila mientras la otra mano controla su cabeza, empujándola para obligarlo a girar hacia un lado y abrirle la espalda.",en:"With the opponent in turtle or on their side, one arm passes under their armpit while the other hand controls their head, pushing it to force them to turn to one side and open their back.",val:"Amb l'adversari en tortuga o de costat, un braç passa per baix de la seua aixella mentre l'altra mà controla el seu cap, empenyent-lo per a obligar-lo a girar cap a un costat i obrir-li l'esquena.",pt:"Com o adversário na tartaruga ou de lado, um braço passa por baixo da axila dele enquanto a outra mão controla a cabeça, empurrando-a para obrigá-lo a girar para um lado e abrir as costas."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Tres cuartos nelson (three-quarter nelson)",en:"Three-quarter nelson",val:"Tres quarts de nelson (three-quarter nelson)",pt:"Três quartos nelson (three-quarter nelson)"}, desc:{es:"Variante del half nelson en la que además se controla el brazo contrario del rival con la otra mano, añadiendo una segunda palanca para girarlo y fijarlo con menos esfuerzo.",en:"A half nelson variant where the other hand also controls the opponent's far arm, adding a second lever to turn and pin them with less effort.",val:"Variant del half nelson en què l'altra mà també controla el braç contrari de l'adversari, afegint una segona palanca per a girar-lo i fixar-lo amb menys esforç.",pt:"Variante do half nelson em que a outra mão também controla o braço oposto do adversário, acrescentando uma segunda alavanca para girá-lo e fixá-lo com menos esforço."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Nelson completo (full nelson)",en:"Full nelson",val:"Nelson complet (full nelson)",pt:"Nelson completo (full nelson)"}, desc:{es:"Desde atrás, ambos brazos pasan bajo las axilas del rival y las manos se entrelazan en su nuca; la presión sobre el cuello limita su movimiento y está restringida en muchos reglamentos por el riesgo para las cervicales.",en:"From behind, both arms pass under the opponent's armpits and the hands lock behind their neck; the neck pressure limits their movement and is restricted in many rulesets because of the risk to the cervical spine.",val:"Des de darrere, ambdós braços passen per baix de les aixelles de l'adversari i les mans s'entrellacen a la seua nuca; la pressió sobre el coll limita el seu moviment i està restringida en molts reglaments pel risc per a les cervicals.",pt:"Por trás, os dois braços passam por baixo das axilas do adversário e as mãos se entrelaçam na nuca; a pressão no pescoço limita o movimento dele e é restrita em muitos regulamentos pelo risco para as cervicais."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Tilt (volteo desde la cuna)",en:"Tilt (cradle tilt)",val:"Tilt (volteig des del bressol)",pt:"Tilt (virada a partir do berço)"}, desc:{es:"Desde el cradle, se arrastra al rival hacia un lado levantando su cabeza y su rodilla en direcciones opuestas hasta volcarlo sobre su espalda, dejándolo fijado para puntuar o buscar una sumisión.",en:"From the cradle, the opponent is dragged to one side by lifting their head and knee in opposite directions until they tip onto their back, leaving them pinned for points or a submission.",val:"Des del cradle, s'arrossega l'adversari cap a un costat alçant el seu cap i el seu genoll en direccions oposades fins a bolcar-lo sobre l'esquena, deixant-lo fixat per a puntuar o buscar una submissió.",pt:"A partir do cradle, o adversário é arrastado para um lado levantando a cabeça e o joelho dele em direções opostas até tombá-lo de costas, deixando-o preso para pontuar ou buscar uma finalização."}},
  {cat:"derribos", level:"intermedio", tags:["gi","no-gi"], name:{es:"Zancadilla trasera (back trip)",en:"Back trip",val:"Travessa posterior (back trip)",pt:"Rasteira por trás (back trip)"}, desc:{es:"Con el rival agarrado por el torso, el pie se coloca justo detrás de su talón mientras se empuja su pecho hacia atrás, de modo que tropieza con tu pierna y cae de espaldas.",en:"With the opponent held by the torso, your foot goes right behind their heel while pushing their chest backward, so they trip over your leg and fall onto their back.",val:"Amb l'adversari agafat pel tors, el peu es col·loca just darrere del seu taló mentre s'empeny el seu pit cap arrere, de manera que entropessa amb la teua cama i cau d'esquena.",pt:"Com o adversário seguro pelo tronco, o pé entra logo atrás do calcanhar dele enquanto se empurra o peito dele para trás, de modo que ele tropeça na sua perna e cai de costas."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Slide-by (paso lateral)",en:"Slide-by",val:"Slide-by (pas lateral)",pt:"Slide-by (passo lateral)"}, desc:{es:"Respuesta a un ataque a las piernas: se retira la cadera, se controla la cabeza o el brazo del atacante y se desliza hacia un lado esquivando su entrada, quedando en su espalda.",en:"A response to a leg attack: the hips pull back, the attacker's head or arm is controlled and you slide to one side avoiding their entry, ending up behind them.",val:"Resposta a un atac a les cames: es retira el maluc, es controla el cap o el braç de l'atacant i es llisca cap a un costat esquivant la seua entrada, quedant a la seua esquena.",pt:"Resposta a um ataque às pernas: o quadril recua, a cabeça ou o braço do atacante é controlado e desliza-se para um lado evitando a entrada dele, ficando nas costas dele."}},
  {cat:"derribos", level:"avanzado", tags:["no-gi"], name:{es:"Suplex de vientre a vientre (belly-to-belly suplex)",en:"Belly-to-belly suplex",val:"Suplex de ventre a ventre (belly-to-belly suplex)",pt:"Suplex de barriga com barriga (belly-to-belly suplex)"}, desc:{es:"Se abraza al rival de frente por la cintura, se levanta su cuerpo y se arquea la espalda hacia atrás para lanzarlo por encima, cayendo ambos de lado o de espaldas; exige mucha fuerza y es ilegal en algunos reglamentos.",en:"The opponent is hugged around the waist from the front, lifted, and the back arches to throw them overhead, both landing to the side or on the back; it takes a lot of strength and is illegal in some rulesets.",val:"S'abraça l'adversari de front per la cintura, s'alça el seu cos i s'arqueja l'esquena cap arrere per a llançar-lo per damunt, caient tots dos de costat o d'esquena; exigeix molta força i és il·legal en alguns reglaments.",pt:"Abraça-se o adversário de frente pela cintura, levanta-se o corpo dele e arqueia-se as costas para trás para lançá-lo por cima, caindo os dois de lado ou de costas; exige muita força e é ilegal em alguns regulamentos."}},
  {cat:"derribos", level:"avanzado", tags:["no-gi"], name:{es:"Suplex trasero (German suplex)",en:"German suplex",val:"Suplex posterior (German suplex)",pt:"Suplex alemão (German suplex)"}, desc:{es:"Desde atrás, se rodea la cintura del rival, se levanta su cuerpo y se arquea todo el tronco hacia atrás para lanzarlo por encima de la cabeza; es una de las proyecciones más espectaculares y de las más peligrosas.",en:"From behind, the opponent's waist is wrapped, their body lifted, and the whole trunk arches backward to throw them over your head; it is one of the most spectacular and most dangerous throws.",val:"Des de darrere, es rodeja la cintura de l'adversari, s'alça el seu cos i s'arqueja tot el tronc cap arrere per a llançar-lo per damunt del cap; és una de les projeccions més espectaculars i de les més perilloses.",pt:"Por trás, a cintura do adversário é envolvida, o corpo dele levantado e todo o tronco arqueia para trás para lançá-lo por cima da cabeça; é uma das projeções mais espetaculares e das mais perigosas."}},
  {cat:"derribos", level:"intermedio", tags:["no-gi"], name:{es:"Derribo de abrazo de oso (bear hug takedown)",en:"Bear hug takedown",val:"Derrocament d'abraçada d'os (bear hug takedown)",pt:"Queda de abraço de urso (bear hug takedown)"}, desc:{es:"Se rodea el torso del rival por completo, brazos incluidos, con un abrazo muy apretado y se usa un levantamiento o una zancadilla para derribarlo mientras sus brazos quedan inutilizados.",en:"The opponent's torso is wrapped completely, arms included, in a very tight hug, and a lift or a trip is used to take them down while their arms stay useless.",val:"Es rodeja el tors de l'adversari per complet, braços inclosos, amb una abraçada molt apretada i s'usa un alçament o una travessa per a derrocar-lo mentre els seus braços queden inutilitzats.",pt:"Envolve-se o tronco do adversário por completo, braços incluídos, num abraço muito apertado e usa-se um levantamento ou uma rasteira para derrubá-lo enquanto os braços dele ficam inutilizados."}},
  {cat:"barridas", level:"intermedio", tags:["no-gi"], name:{es:"Wrestle-up (levantarse luchando)",en:"Wrestle-up",val:"Wrestle-up (alçar-se lluitant)",pt:"Wrestle-up (levantar lutando)"}, desc:{es:"Desde guardia o media guardia, se usa un underhook o un agarre de cintura para incorporarse hacia el rival y terminar encima en una posición de lucha, sin pasar por el raspado clásico.",en:"From guard or half guard, an underhook or waist grip is used to come up into the opponent and finish on top in a wrestling position, without going through a classic sweep.",val:"Des de guàrdia o mitja guàrdia, s'usa un underhook o una agafada de cintura per a incorporar-se cap a l'adversari i acabar a dalt en una posició de lluita, sense passar pel raspat clàssic.",pt:"Da guarda ou meia guarda, usa-se um underhook ou uma pegada de cintura para se levantar em direção ao adversário e terminar por cima numa posição de luta, sem passar pela raspagem clássica."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Ashi garami exterior (outside ashi garami)",en:"Outside ashi garami",val:"Ashi garami exterior (outside ashi garami)",pt:"Ashi garami externo (outside ashi garami)"}, desc:{es:"Variante del ashi garami en la que se atrapa la pierna del rival por su lado exterior, con la rodilla de esa pierna apuntando hacia fuera, controlando su cadera para abrir ataques de tobillo y heel hook exterior.",en:"An ashi garami variant where the opponent's leg is trapped from its outer side, with that leg's knee pointing outward, controlling their hip to open ankle attacks and the outside heel hook.",val:"Variant de l'ashi garami en què s'atrapa la cama de l'adversari pel seu costat exterior, amb el genoll d'eixa cama apuntant cap a fora, controlant el seu maluc per a obrir atacs de turmell i heel hook exterior.",pt:"Variante do ashi garami em que a perna do adversário é presa pelo lado externo, com o joelho dessa perna apontando para fora, controlando o quadril dele para abrir ataques de tornozelo e o heel hook externo."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Heel hook interior (inside heel hook)",en:"Inside heel hook",val:"Heel hook interior (inside heel hook)",pt:"Heel hook interno (inside heel hook)"}, desc:{es:"Desde el ashi garami interior, el talón del rival queda atrapado bajo la axila y se rota la cadera para torcer la rodilla; es la versión más habitual del heel hook y exige rendirse a tiempo porque lesiona ligamentos.",en:"From the inside ashi garami, the opponent's heel is trapped under the armpit and the hips rotate to twist the knee; it is the most common version of the heel hook and requires tapping early because it injures ligaments.",val:"Des de l'ashi garami interior, el taló de l'adversari queda atrapat baix l'aixella i es rota el maluc per a torçar el genoll; és la versió més habitual del heel hook i exigeix rendir-se a temps perquè lesiona lligaments.",pt:"A partir do ashi garami interno, o calcanhar do adversário fica preso sob a axila e o quadril rota para torcer o joelho; é a versão mais comum do heel hook e exige bater a tempo porque lesiona ligamentos."}},
  {cat:"sumisiones", level:"avanzado", tags:["no-gi"], name:{es:"Heel hook exterior (outside heel hook)",en:"Outside heel hook",val:"Heel hook exterior (outside heel hook)",pt:"Heel hook externo (outside heel hook)"}, desc:{es:"Desde el ashi garami exterior, el talón se atrapa por el lado externo y la torsión de la rodilla se aplica en el sentido contrario al del heel hook interior, atacando otros ligamentos de la articulación.",en:"From the outside ashi garami, the heel is trapped on the outer side and the knee torque is applied in the opposite direction to the inside heel hook, attacking other ligaments of the joint.",val:"Des de l'ashi garami exterior, el taló s'atrapa pel costat extern i la torsió del genoll s'aplica en el sentit contrari al del heel hook interior, atacant altres lligaments de l'articulació.",pt:"A partir do ashi garami externo, o calcanhar é preso pelo lado externo e a torção do joelho é aplicada no sentido contrário ao do heel hook interno, atacando outros ligamentos da articulação."}},
  {cat:"control", level:"intermedio", tags:["no-gi"], name:{es:"Knee reap (cruce de rodilla)",en:"Knee reap",val:"Knee reap (creuament de genoll)",pt:"Knee reap (cruzamento de joelho)"}, desc:{es:"Maniobra de leg locks en la que la rodilla propia cruza la línea de la cadera del rival mientras su pierna está enredada, torciendo su rodilla; está prohibida en muchos reglamentos por el riesgo de lesión.",en:"A leg-lock maneuver where your own knee crosses the opponent's hip line while their leg is entangled, twisting their knee; it is banned in many rulesets because of the injury risk.",val:"Maniobra de leg locks en què el genoll propi creua la línia del maluc de l'adversari mentre la seua cama està enredada, torçant el seu genoll; està prohibida en molts reglaments pel risc de lesió.",pt:"Manobra de leg locks em que o próprio joelho cruza a linha do quadril do adversário enquanto a perna dele está enredada, torcendo o joelho dele; é proibida em muitos regulamentos pelo risco de lesão."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Back 50/50 (50/50 trasero)",en:"Backside 50/50",val:"Back 50/50 (50/50 posterior)",pt:"Back 50/50 (50/50 traseiro)"}, desc:{es:"Variante del 50/50 en la que el cuerpo gira para quedar de espaldas a las piernas enredadas del rival, controlando su tobillo y su talón desde un ángulo oculto para atacar el heel hook o la rodilla.",en:"A 50/50 variant where the body turns to face away from the opponent's entangled legs, controlling their ankle and heel from a hidden angle to attack the heel hook or the knee.",val:"Variant del 50/50 en què el cos gira per a quedar d'esquena a les cames enredades de l'adversari, controlant el seu turmell i el seu taló des d'un angle ocult per a atacar el heel hook o el genoll.",pt:"Variante do 50/50 em que o corpo gira para ficar de costas para as pernas enredadas do adversário, controlando o tornozelo e o calcanhar dele a partir de um ângulo oculto para atacar o heel hook ou o joelho."}},
  {cat:"control", level:"avanzado", tags:["no-gi"], name:{es:"Sankaku exterior (outside sankaku)",en:"Outside sankaku",val:"Sankaku exterior (outside sankaku)",pt:"Sankaku externo (outside sankaku)"}, desc:{es:"Enredo de piernas en el que la pierna del rival queda atrapada en el triángulo de tus piernas por su lado externo, bloqueando su cadera y su rodilla para atacar el heel hook desde un ángulo distinto al del sankaku interior.",en:"A leg entanglement where the opponent's leg is trapped in the triangle of your legs on its outer side, blocking their hip and knee to attack the heel hook from a different angle than the inside sankaku.",val:"Enredament de cames en què la cama de l'adversari queda atrapada en el triangle de les teues cames pel seu costat extern, bloquejant el seu maluc i el seu genoll per a atacar el heel hook des d'un angle distint al del sankaku interior.",pt:"Enredo de pernas em que a perna do adversário fica presa no triângulo das suas pernas pelo lado externo, bloqueando o quadril e o joelho dele para atacar o heel hook por um ângulo diferente do sankaku interno."}},
  {cat:"sumisiones", level:"intermedio", tags:["gi","no-gi"], name:{es:"Guillotina de diez dedos (ten-finger guillotine)",en:"Ten-finger guillotine",val:"Guillotina de deu dits (ten-finger guillotine)",pt:"Guilhotina de dez dedos (ten-finger guillotine)"}, desc:{es:"Guillotina en la que los diez dedos se entrelazan bajo la barbilla del rival, cerrando un círculo muy ajustado alrededor de su cuello sin necesidad de agarrar la muñeca; es muy útil en no-gi.",en:"A guillotine where all ten fingers interlock under the opponent's chin, closing a very tight circle around their neck without needing to grip the wrist; it is very useful in no-gi.",val:"Guillotina en què els deu dits s'entrellacen baix la barbeta de l'adversari, tancant un cercle molt ajustat al voltant del seu coll sense necessitat d'agafar el canell; és molt útil en no-gi.",pt:"Guilhotina em que os dez dedos se entrelaçam sob o queixo do adversário, fechando um círculo muito justo ao redor do pescoço dele sem precisar agarrar o pulso; é muito útil no no-gi."}},
  {cat:"control", level:"intermedio", tags:["gi","no-gi"], name:{es:"Ala de pollo (chicken wing)",en:"Chicken wing",val:"Ala de pollastre (chicken wing)",pt:"Asa de frango (chicken wing)"}, desc:{es:"Control del brazo del rival doblado por detrás de su espalda, atrapando su codo con el propio brazo para inmovilizarlo y, con más presión, cargar el hombro; muy usado desde la espalda y en lucha.",en:"A control of the opponent's arm bent behind their back, trapping their elbow with your own arm to immobilize it and, with more pressure, loading the shoulder; widely used from the back and in wrestling.",val:"Control del braç de l'adversari doblegat per darrere de la seua esquena, atrapant el seu colze amb el propi braç per a immobilitzar-lo i, amb més pressió, carregar l'espatla; molt usat des de l'esquena i en lluita.",pt:"Controle do braço do adversário dobrado atrás das costas, prendendo o cotovelo dele com o próprio braço para imobilizá-lo e, com mais pressão, carregar o ombro; muito usado a partir das costas e na luta."}},
